<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Valencia VGuides — Intro</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;width:100%;height:100%;background:#fff;font-family:-apple-system,Verdana,sans-serif}

/* ── STAGE — clips all children ── */
#stage{position:absolute;inset:0;overflow:hidden}

/* ── MAP ── */
#map{position:absolute;inset:0;z-index:1;display:none}
#map.on{display:block}

/* ── LAYERS ── */
#scene-layer{position:absolute;inset:0;z-index:2;pointer-events:none}
#overlay-layer{position:absolute;inset:0;z-index:300;pointer-events:none}
#overlay-layer.active{pointer-events:auto}

/* ── KNIGHT ── */
/* ── KNIGHT principal (abajo-izquierda por defecto) ── */
#knight{
  position:absolute;left:2%;bottom:0;
  height:clamp(200px,33vw,320px);width:auto;max-width:60%;
  z-index:400;pointer-events:none;
  transform:translateY(100%);
  transition:transform .75s cubic-bezier(.34,1.56,.64,1);
  filter:drop-shadow(3px 6px 16px rgba(0,0,0,.6));
}
#knight.show{transform:translateY(0%)}   /* cuerpo completo visible */
#knight.bounce{animation:bounceK .45s ease-in-out infinite alternate}
@keyframes bounceK{to{margin-top:-18px}}
#knight.walk{height:clamp(80px,13vw,130px);max-width:22%;bottom:auto;left:auto;
  transition:left .14s linear,top .14s linear;
  animation:knightBob .28s ease-in-out infinite alternate}
@keyframes knightBob{from{margin-left:-2px}to{margin-left:2px}}

/* ── KNIGHT secundario (abajo-derecha) ── */
#knight2{
  position:absolute;right:2%;bottom:0;
  height:clamp(200px,33vw,320px);width:auto;max-width:60%;
  z-index:400;pointer-events:none;
  transform:translateY(100%);
  transition:transform .75s cubic-bezier(.34,1.56,.64,1);
  filter:drop-shadow(-3px 6px 16px rgba(0,0,0,.6));
}
#knight2.show{transform:translateY(0%)}
#knight2.bounce{animation:bounceK .45s ease-in-out infinite alternate}

/* ── helper: knight principal a la DERECHA ── */
.knight-right #knight{left:auto;right:2%;transform:translateY(100%)}
.knight-right #knight.show{transform:translateY(0%)}

/* ── GAUNTLET ── */
#gauntlet{position:absolute;width:clamp(110px,18vw,180px);height:auto;z-index:1000;opacity:0;pointer-events:none;mix-blend-mode:multiply}

/* ── EQUALIZER BARS ── */
.eq-wrap{display:none;align-items:flex-end;gap:2px;height:16px;margin:0 5px;flex-shrink:0}
.eq-wrap.on{display:flex}
.eq-bar{width:3px;border-radius:2px;background:#28a745;transform-origin:bottom;
  animation:eqd var(--s,.4s) ease-in-out infinite alternate}
@keyframes eqd{from{height:3px}to{height:14px}}

/* ── END FADE ── */
#end-fade{position:absolute;inset:0;z-index:9000;opacity:0;pointer-events:none;transition:opacity 1.2s}
#end-fade.w{background:#fff}#end-fade.b{background:#000}#end-fade.on{opacity:1}

/* ── HUD ── */
#counter{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);color:#fff;font-size:11px;padding:4px 13px;border-radius:20px;z-index:5000;pointer-events:none;letter-spacing:.3px}
#restart{position:absolute;bottom:7px;right:9px;background:rgba(0,0,0,.38);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:18px;padding:4px 11px;font-size:11px;cursor:pointer;z-index:5000}

/* ═══════════════════════════════
   SCREENS 1-4
═══════════════════════════════ */
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;gap:0}

/* S1 */
.s1-r{width:min(120px,28vw);animation:spinOnce 1.7s cubic-bezier(.4,0,.2,1) forwards}
@keyframes spinOnce{82%{transform:rotate(360deg)}to{transform:rotate(360deg)}}
.s1-w{width:min(250px,70vw);margin-top:18px;opacity:0;animation:fadeUp .9s ease 1.7s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* S2 — flags más grandes */
.s2-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(410px,97vw)}
.s2-flag{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;border:3px solid #ddd;transition:border-color .25s,box-shadow .2s}
.s2-flag.hl{box-shadow:0 6px 18px rgba(0,0,0,.28);border-color:#28a745!important}
.s2-big{width:min(160px,38vw);aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:none;margin-bottom:16px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.s2-ok{width:min(64px,17vw);height:min(64px,17vw);border-radius:50%;background:#28a745;border:none;display:none;align-items:center;justify-content:center;cursor:pointer;margin-top:14px;box-shadow:0 4px 14px rgba(40,167,69,.4)}

/* S4 — adventure tabs */
.adv-tabs{width:min(380px,94vw);display:flex;flex-direction:column;gap:7px;flex:1;justify-content:center}
.adv-tab{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:12px;border:2px solid #28a745;background:#f8fff8;cursor:pointer;transition:.2s}
.adv-tab.sel{background:#28a745;border-color:#155724}
.adv-tab-name{font-size:clamp(9px,2.4vw,12px);font-weight:600;color:#333;filter:blur(1.5px);flex:1}
.adv-tab.sel .adv-tab-name{color:#fff;filter:none}
.adv-tab-km{font-size:clamp(9px,2.2vw,11px);color:#28a745;font-weight:700;white-space:nowrap;margin-left:8px}
.adv-tab.sel .adv-tab-km{color:#fff}
.adv-tab-veh{font-size:14px;margin-left:6px}

/* S5 — vintage map large */
.s5-map{width:min(340px,86vw);max-height:68vh;object-fit:contain;border-radius:10px;border:6px solid #8b5e1a;box-shadow:0 6px 24px rgba(0,0,0,.4)}

/* S6 — all buttons grid */
.btn-grid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;background:#f8f9fa}
.btn-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.bg-label{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:.5px;width:100%;text-align:center;margin-bottom:2px}
.btn-main-ico{width:min(64px,14.5vw);height:min(64px,14.5vw);border-radius:50%;background:linear-gradient(180deg,#1e7e34,#0d3a16);overflow:hidden;box-shadow:inset 0 0 10px rgba(255,255,255,.15),0 3px 8px rgba(0,0,0,.3)}
.btn-main-ico img{width:103%;height:103%;margin:-1.5%;object-fit:cover;border-radius:50%}
.btn-sub-ico{width:min(48px,10.5vw);height:min(48px,10.5vw);border-radius:50%;background:linear-gradient(180deg,#1e7e34,#0d3a16);overflow:hidden;box-shadow:inset 0 0 6px rgba(255,255,255,.1)}
.btn-sub-ico img{width:103%;height:103%;margin:-1.5%;object-fit:cover;border-radius:50%}
.btn-main-ico.blue{background:linear-gradient(135deg,#007bff,#0056b3)}
.btn-main-ico.blue img{border-radius:50%}

/* S7 — no gps / no internet */
.err-stack{display:flex;flex-direction:column;gap:24px;align-items:center;justify-content:center;flex:1}
.err-img{width:min(290px,74vw);object-fit:contain}

/* button zoom showcase */
.btn-zoom{position:absolute;border-radius:50%;overflow:hidden;border:4px solid #28a745;transition:none;z-index:500;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.35)}

/* S3 */
.adv-item{background:#fff;border:1.5px solid #e0e0e0;border-radius:13px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;transition:.2s;margin-bottom:7px;width:min(340px,86vw)}
.adv-item.tapped{background:#e8f5e9;border-color:#28a745}
.adv-blur{width:50%;height:8px;background:#ccc;border-radius:3px;filter:blur(2px)}
.s3-ov{position:absolute;inset:0;background:#f5e6c8;display:none;flex-direction:column;align-items:center;justify-content:center;border:8px solid #8b5e1a;z-index:100}
.s3-ov.on{display:flex}
.s3-vimg{width:76%;max-height:54%;object-fit:contain}
.s3-ok{width:min(48px,13vw);height:min(48px,13vw);border-radius:50%;background:#28a745;border:none;margin-top:16px;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* S4 */
.s4-bar{width:min(225px,58vw);height:7px;background:#e0e0e0;border-radius:3.5px;overflow:hidden;margin-top:15px}
.s4-fill{height:100%;background:#28a745;border-radius:3.5px;width:0%;transition:width 3.6s linear}
.s4-pct{font-size:11px;color:#aaa;margin-top:7px;font-variant-numeric:tabular-nums}
.spinA{animation:spinA 1.1s linear infinite}
@keyframes spinA{to{transform:rotate(360deg)}}

/* ═══════════════════════════════
   MAIN SCREEN (scenes 5-17)
═══════════════════════════════ */
.main{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;pointer-events:none}
.main *{pointer-events:auto}

/* Top strip */
.top-strip{height:36px;background:rgba(255,255,255,.18);border-bottom:1px solid rgba(0,0,0,.1);display:flex;align-items:center;padding:0 9px;flex-shrink:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top-name{flex:1;font-size:10px;color:#333;filter:blur(1.5px);letter-spacing:.4px;text-shadow:0 1px 3px rgba(255,255,255,.8)}
.chat-btn{width:28px;height:28px;border:none;background:none;cursor:pointer;padding:0;flex-shrink:0}
.chat-btn img{width:100%;height:100%;object-fit:contain}

/* Map zone */
.map-zone{flex:1;position:relative;background:transparent;overflow:hidden}

/* ── RIGHT COLUMN — real hijo2 buttons ── */
.col-wrap{
  position:absolute;right:0;top:0;bottom:0;
  width:min(52px,12vw);
  display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;
  gap:5px;padding:3px 2px 3px 0;z-index:101;
}
/* ── LEFT COLUMN — real hijo1 buttons ── */
.col-left{
  position:absolute;left:0;top:0;bottom:0;
  width:min(52px,12vw);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;
  gap:5px;padding:3px 0 3px 2px;z-index:101;
}
.boton{
  width:min(48px,11vw);height:min(48px,11vw);flex-shrink:0;
  position:relative;border-radius:50%;border:none;
  background:linear-gradient(180deg,#1e7e34 0%,#155724 50%,#0d3a16 100%);
  cursor:pointer;overflow:hidden;padding:0;
  animation:glowS 3s ease-in-out infinite;
}
.boton img{position:absolute;top:-1.5%;left:-1.5%;width:103%;height:103%;border-radius:50%;object-fit:cover;pointer-events:none}
.boton.disabled{background:linear-gradient(to right,#dc3545,#c82333)!important;animation:glowDis 2.5s ease-in-out infinite!important}
.boton.activo{background:linear-gradient(135deg,#007bff,#0056b3)!important;animation:glowAct 3s ease-in-out infinite!important}
@keyframes glowS{0%,100%{box-shadow:inset 0 0 8px rgba(255,255,255,.15)}50%{box-shadow:inset 0 0 18px rgba(255,255,255,.38)}}
@keyframes glowAct{0%,100%{box-shadow:inset 0 0 10px rgba(255,255,255,.2)}50%{box-shadow:inset 0 0 26px rgba(255,255,255,.55)}}
@keyframes glowDis{0%,100%{box-shadow:0 0 6px rgba(220,53,69,.3)}50%{box-shadow:0 0 14px rgba(220,53,69,.7)}}
@keyframes spin-btn{0%{transform:rotate(0deg)}60%{transform:rotate(1080deg)}85%{transform:rotate(1350deg)}100%{transform:rotate(1440deg)}}
.spinning{animation:spin-btn .9s cubic-bezier(.2,.8,.4,1) forwards!important}

/* ── AUDIO MAIN — botón central entre hijo3 y hijo2, a la derecha ── */
.audio-toggle-wrap{position:absolute;right:min(52px,12vw);bottom:0;width:min(52px,12vw);height:78px;display:flex;align-items:center;justify-content:center;z-index:102}
.audio-main-btn{width:min(46px,10.5vw);height:min(46px,10.5vw);border-radius:50%;border:none;background:none;cursor:pointer;padding:0;animation:glowAct 2.5s ease-in-out infinite}
.audio-main-btn img{width:100%;height:100%;object-fit:contain}
.audio-main-btn.spinning{animation:spin-btn .9s cubic-bezier(.2,.8,.4,1) forwards!important}

/* Audio action strip — columna vertical sobre el botón central (igual que en la PWA real) */
.audio-strip{
  position:absolute;
  right:min(52px,12vw);
  width:min(52px,12vw);
  bottom:calc(78px + min(46px,10.5vw) + 10px);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:none;border:none;padding:0;
  z-index:200;
  transform:translateY(18px);opacity:0;
  transition:transform .32s ease,opacity .32s ease;
  pointer-events:none;
}
.audio-strip.open{transform:translateY(0);opacity:1;pointer-events:auto}
.aa-btn{width:min(44px,10vw);height:min(44px,10vw);border-radius:50%;border:none;background:rgba(255,255,255,.92);cursor:pointer;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.28)}
.aa-btn img{width:100%;height:100%;object-fit:contain}

/* Red badge */
.red-badge{position:absolute;top:5px;left:5px;width:min(46px,10.5vw);height:min(15px,3.4vw);background:#dc3545;border-radius:2px;z-index:110;pointer-events:none}

/* ── AUDIO BAR — hijo3: centro entre col-left y audio-toggle ── */
.audio-bar{height:78px;background:rgba(255,255,255,.18);border-top:1px solid rgba(0,0,0,.1);
  padding:7px 9px 5px;display:flex;flex-direction:column;gap:5px;flex-shrink:0;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  /* deja espacio para col-left y audio-toggle+col-wrap */
  margin-left:min(52px,12vw);margin-right:calc(min(52px,12vw)*2)}
.audio-row{display:flex;align-items:center;gap:6px}
.audio-track{flex:1;height:5px;background:#e0e0e0;border-radius:2.5px;position:relative}
.audio-fill{height:100%;background:#28a745;border-radius:2.5px;width:0%;transition:width .1s linear}
.audio-dot{position:absolute;top:50%;transform:translateY(-50%);width:12px;height:12px;background:#007bff;border-radius:50%;left:0%;margin-left:-6px;transition:left .1s linear;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.audio-time{font-size:9px;color:#222;min-width:25px;font-variant-numeric:tabular-nums;font-family:monospace;text-shadow:0 1px 3px rgba(255,255,255,.9)}
.audio-reto{width:min(30px,7.5vw);height:min(30px,7.5vw);border-radius:50%;border:none;cursor:pointer;padding:0;flex-shrink:0;transition:filter .3s,opacity .3s}
.audio-reto img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.audio-reto.grey{opacity:.4;filter:grayscale(1)}
.audio-reto.green{opacity:1;filter:none;animation:glowAct 1.8s ease-in-out infinite}
.audio-marquee{font-size:9px;color:#222;white-space:nowrap;overflow:hidden;text-shadow:0 1px 3px rgba(255,255,255,.9)}
.audio-marquee span{display:inline-block;animation:marq 14s linear infinite}
@keyframes marq{0%{transform:translateX(100%)}100%{transform:translateX(-200%)}}

/* ═══════════════════════════════
   OVERLAYS / PANELS / MODALS
═══════════════════════════════ */
.ov-dark{position:absolute;inset:0;background:rgba(0,0,0,.8);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ov-close{
  position:absolute;top:10px;right:10px;
  width:3rem;height:3rem;border-radius:50%;
  background:#ff8c00;border:.2rem solid #00ff00;
  color:#000;font-size:2.2rem;font-weight:bold;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;line-height:1;z-index:50;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.ov-img{width:min(340px,82vw);border-radius:10px;object-fit:cover;max-height:64vh}
.drone-frame{width:min(340px,82vw);background:#000;border-radius:10px;overflow:hidden}
.drone-frame img{width:100%;max-height:40vh;object-fit:cover}
.drone-bar{height:5px;background:#333}
.drone-prog{height:100%;width:0%;background:#28a745;animation:dP 9s linear forwards}
@keyframes dP{to{width:68%}}

/* Modal */
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.76);display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:16px;padding:18px;width:min(280px,74vw);display:flex;flex-direction:column;gap:10px}
.m-btn{width:100%;height:44px;border:none;border-radius:9px;cursor:pointer;font-size:14px;font-weight:600}
.m-green{background:#27ae60;color:#fff}.m-red{background:#e74c3c;color:#fff}.m-out{background:#fff;border:2px solid #555;color:#333}

/* ── CHALLENGE PANEL + PUZZLE ── */
.ch-panel{position:absolute;inset:0;background:#fff;border-radius:0;padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px;z-index:200;overflow:hidden}
.ch-icon-row{display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.ch-reto-icon{width:min(68px,17vw);height:min(68px,17vw);object-fit:contain}

/* PUZZLE BOARD */
.puzzle-board{
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  gap:4px;width:min(260px,62vw);height:min(196px,46.5vw);
  align-self:center;border:2px solid #8b5e1a;border-radius:6px;overflow:hidden;
  flex-shrink:0;
}
.pz-cell{position:relative;background:#d0d0d0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pz-cell.filled{background:none}
.pz-cell.filled img{width:100%;height:100%;object-fit:cover;display:block}
.pz-cell:not(.filled)::after{content:'?';font-size:min(20px,4.5vw);color:#aaa;font-weight:bold}
@keyframes snapIn{0%{transform:scale(1.12);opacity:.7}60%{transform:scale(.96)}100%{transform:scale(1);opacity:1}}
.pz-cell.snap{animation:snapIn .35s ease forwards}

/* Scattered puzzle pieces (absolute in overlay-layer) */
.pz-piece{
  position:absolute;
  background:#e0c89a;
  border:2px solid #8b5e1a;
  border-radius:5px;
  overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,.35);
  pointer-events:none;
  z-index:350;
}
.pz-piece img{width:100%;height:100%;object-fit:cover;display:block}

/* Challenge question & options */
.ch-q{height:11px;background:#444;border-radius:3px;filter:blur(2px);width:72%;align-self:center;flex-shrink:0}
.ch-opt{display:flex;align-items:center;gap:10px;flex-shrink:0}
.ch-radio{width:26px;height:26px;border-radius:50%;border:2px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .2s}
.ch-radio.on{border-color:#28a745}
.ch-radio.on::after,.ch-radio.wrong::after{content:'';width:13px;height:13px;border-radius:50%}
.ch-radio.on::after{background:#28a745}.ch-radio.wrong::after{background:#dc3545}
.ch-radio.wrong{border-color:#dc3545}
.ch-text{flex:1;height:9px;background:#ccc;border-radius:3px;filter:blur(2px)}
.ch-btns{display:flex;gap:7px;margin-top:auto}
.ch-send{width:min(50px,12.5vw);height:min(50px,12.5vw);border-radius:50%;border:none;background:#007bff;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.5;transition:opacity .2s}
.ch-send.on{opacity:1}
.ch-hint{width:min(36px,9vw);height:min(36px,9vw);border-radius:50%;border:none;background:#28a745;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ch-next{display:none;height:38px;background:#28a745;border:none;border-radius:8px;color:#fff;font-size:18px;cursor:pointer;align-items:center;justify-content:center;flex:1}
.ch-next.show{display:flex}

/* Extra sub-buttons */
.extra-wrap{position:absolute;left:0;bottom:calc(50% - min(24px,5.5vw));width:min(52px,12vw);display:flex;flex-direction:column-reverse;gap:4px;z-index:150}
.x-btn{width:min(38px,9vw);height:min(38px,9vw);border-radius:50%;border:none;cursor:pointer;background:linear-gradient(180deg,#1e7e34 0%,#155724 50%,#0d3a16 100%);box-shadow:inset 0 0 5px rgba(255,255,255,.1);opacity:0;transform:translateY(10px);transition:opacity .22s,transform .22s;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0}
.x-btn img{width:100%;height:100%;object-fit:contain}
.x-btn.show{opacity:1;transform:translateY(0)}

/* Timer */
.timer-bg{position:absolute;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center}
.timer-card{background:#111;border-radius:10px;padding:14px 24px}
.timer-digits{font-family:monospace;font-size:clamp(20px,5.5vw,30px);color:#00ff44;letter-spacing:4px}

/* Chat */
.chat-panel{position:absolute;top:0;right:-100%;bottom:0;width:min(310px,86vw);background:#fff;z-index:500;box-shadow:-5px 0 20px rgba(0,0,0,.27);transition:right .4s ease;display:flex;flex-direction:column}
.chat-panel.open{right:0}
.chat-hdr{background:#1a6ea8;height:48px;display:flex;align-items:center;justify-content:flex-end;padding:0 11px;flex-shrink:0}

/* ── UTILS ───────────────────────────────────── */
const wait = ms => new Promise(r => setTimeout(r, ms));
const $    = id => document.getElementById(id);
const stageR = () => $('stage').getBoundingClientRect();
const setScene = h => {
  const sl=$('scene-layer');
  sl.innerHTML=h; sl.style.pointerEvents='auto';
  sl.style.transition='none'; sl.style.opacity='0';
  requestAnimationFrame(()=>{ sl.style.transition='opacity .22s ease-in'; sl.style.opacity='1' });
};
const setOv     = h => { $('overlay-layer').innerHTML=h; $('overlay-layer').classList.add('active') };
const clearOv   = () => { $('overlay-layer').innerHTML=''; $('overlay-layer').classList.remove('active') };
const setCounter = (n,t=22) => $('counter').textContent=`${n} / ${t}`;

function interp(pts,steps){
  const out=[]; const per=Math.ceil(steps/(pts.length-1));
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1];
    for(let s=0;s<per;s++){const t=s/per;out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}
  }
  return out;
}

/* ── KNIGHT ──────────────────────────────────── */
const Knight = {
  show(src,bounce=false){
    const k=$('knight');
    k.src=src; k.classList.remove('walk');
    k.style.cssText='';
    requestAnimationFrame(()=>{
      k.classList.add('show');
      bounce ? k.classList.add('bounce') : k.classList.remove('bounce');
    });
  },
  hide(){ const k=$('knight'); k.classList.remove('show','bounce') },
  async walk(route,ms){
    const k=$('knight');
    k.src=K.caminando; k.classList.remove('show','bounce'); k.classList.add('walk');
    const sr=stageR(), pts=interp(route.path,55), step=ms/pts.length;
    const kH=Math.min(sr.height*.18,130);
    const p0=MC.map.latLngToContainerPoint(L.latLng(pts[0]));
    k.style.cssText=`position:absolute;height:${kH}px;width:auto;max-width:18%;
      left:${p0.x-kH*.28}px;top:${p0.y-kH}px;z-index:400;pointer-events:none;
      filter:drop-shadow(2px 3px 8px rgba(0,0,0,.55));transition:none`;
    await wait(80);
    for(let i=1;i<pts.length;i++){
      const p=MC.map.latLngToContainerPoint(L.latLng(pts[i]));
      k.style.transition=`left ${step*.9}ms linear,top ${step*.9}ms linear`;
      k.style.left=(p.x-kH*.28)+'px'; k.style.top=(p.y-kH)+'px';
      await wait(step);
    }
    k.style.cssText=''; k.classList.remove('walk');
  }
};

/* ── ZOOM-SHOWCASE de botón ─────────────────── */
async function zoomBtn(btnEl, imgSrc){
  const sr=stageR(), br=btnEl.getBoundingClientRect();
  const ol=$('overlay-layer');
  const d=document.createElement('div');
  const w=br.width, h=br.height;
  d.className='btn-zoom';
  d.style.cssText=`left:${br.left-sr.left}px;top:${br.top-sr.top}px;width:${w}px;height:${h}px`;
  const img=document.createElement('img');
  img.src=imgSrc; img.style.cssText='width:100%;height:100%;object-fit:cover;';
  d.appendChild(img); ol.appendChild(d); ol.classList.add('active');
  await wait(60);
  const tw=Math.min(sr.width*.72, 280);
  d.style.transition='all .55s cubic-bezier(.34,1.4,.64,1)';
  d.style.left=(sr.width/2-tw/2)+'px';
  d.style.top=(sr.height/2-tw/2)+'px';
  d.style.width=tw+'px'; d.style.height=tw+'px';
  d.style.boxShadow='0 10px 36px rgba(0,0,0,.55)';
  await wait(2000);
  d.style.transition='all .38s cubic-bezier(.4,0,.2,1)';
  d.style.left=(br.left-sr.left)+'px'; d.style.top=(br.top-sr.top)+'px';
  d.style.width=w+'px'; d.style.height=h+'px';
  d.style.opacity='0';
  await wait(420);
  d.remove(); ol.classList.remove('active');
}

/* ── MAP CONTROLLER ──────────────────────────── */
const MC = {
  map:null,poly:null,poly2:null,uM:null,dM:null,sM:null,detC:null,
  init(){
    this.map=L.map('map',{attributionControl:false,zoomControl:false,dragging:false,
      touchZoom:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(this.map);
  },
  show(r=RA){
    $('map').classList.add('on');
    setTimeout(()=>{
      this.map.invalidateSize();
      // fitBounds with padding so markers clear the transparent strips
      this.map.fitBounds(L.latLngBounds(r.path),{
        paddingTopLeft:[58,52],    // left, top  (top strip = 36px)
        paddingBottomRight:[58,96] // right, bottom (audio bar = 78px)
      });
    },80);
    this._mkM(r);
  },
  showInset(r=RA){ this.show(r) },
  hide(){ $('map').classList.remove('on'); this._clr() },
  _mkM(r){
    this._clr();
    // Pin GPS del usuario
    const uh='<div style="font-size:26px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))">📍</div>';
    this.uM=L.marker(r.user,{icon:L.divIcon({className:'',html:uh,iconSize:[28,32],iconAnchor:[12,32]})}).addTo(this.map);
    // 📌 inicio del tramo
    const sh='<div style="font-size:22px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))">📌</div>';
    this.sM=L.marker(r.path[0],{icon:L.divIcon({className:'',html:sh,iconSize:[26,26],iconAnchor:[8,26]})}).addTo(this.map);
    // 🎯 destino
    const dh='<div style="font-size:24px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))">🎯</div>';
    this.dM=L.marker(r.dest,{icon:L.divIcon({className:'',html:dh,iconSize:[28,28],iconAnchor:[14,14]})}).addTo(this.map);
  },
  _clr(){ ['poly','poly2','polyB','uM','dM','sM','detC'].forEach(k=>{ if(this[k]){this.map.removeLayer(this[k]);this[k]=null} }) },
  async drawPoly(r,ms){
    if(this.poly) this.map.removeLayer(this.poly);
    const pts=interp(r.path,70),step=ms/pts.length;
    this.poly=L.polyline([],{color:'#3388ff',weight:6,opacity:.92}).addTo(this.map);
    for(let i=1;i<=pts.length;i++){this.poly.setLatLngs(pts.slice(0,i));await wait(step)}
  },
  showFull(r){ if(this.poly)this.map.removeLayer(this.poly); this.poly=L.polyline(r.path,{color:'#3388ff',weight:6,opacity:.92}).addTo(this.map) },
  // btn-mapa-completo: muestra TODA la aventura (ambas rutas juntas)
  showAll(){
    if(this.poly2)this.map.removeLayer(this.poly2);
    if(this.polyB)this.map.removeLayer(this.polyB);
    this.polyB=L.polyline(RB.path,{color:'#3388ff',weight:5,opacity:.75,dashArray:'6 4'}).addTo(this.map);
    const all=[...RA.path,...RB.path];
    this.map.fitBounds(L.latLngBounds(all),{paddingTopLeft:[62,52],paddingBottomRight:[62,96]});
  },
  hideAll(){ if(this.polyB){this.map.removeLayer(this.polyB);this.polyB=null} },
  showSec(a,b){ if(this.poly2)this.map.removeLayer(this.poly2); this.poly2=L.polyline([a,b],{color:'#9b59b6',weight:5,dashArray:'9 7',opacity:.88}).addTo(this.map) },
  hideSec(){ if(this.poly2){this.map.removeLayer(this.poly2);this.poly2=null} },
  moveUser(ll){ if(this.uM) this.uM.setLatLng(ll) },
  dotOff(){ const el=this.uM?.getElement(); if(el) el.style.opacity='.2' },
  dotOn(){  const el=this.uM?.getElement(); if(el) el.style.opacity='1' },
  switchRoute(r){
    this._mkM(r); this.showFull(r);
    this.map.flyToBounds(L.latLngBounds(r.path),{
      paddingTopLeft:[58,52],paddingBottomRight:[58,96],duration:1.4
    });
  },
};

/* ── GAUNTLET ────────────────────────────────── */
const Gauntlet = {
  el: $('gauntlet'),
  // offsets scaled to 180px gauntlet width (×1.636 from original 110px)
  O:{
    L: {tx:15, ty:41, sdx:213, sdy:0},
    R: {tx:165,ty:41, sdx:-213,sdy:0},
    DL:{tx:36, ty:105,sdx:147, sdy:-147},
    DR:{tx:144,ty:105,sdx:-147,sdy:-147},
    UR:{tx:144,ty:14, sdx:-147,sdy:147},
    UL:{tx:36, ty:14, sdx:147, sdy:147},
  },
  _src(t){ return {L:G.L,R:G.R,DL:G.DL,DR:G.DR,UR:G.UR,UL:G.UL}[t] },
  _o(type){ const s=(this.el.getBoundingClientRect().width||180)/180, b=this.O[type]; return {tx:b.tx*s,ty:b.ty*s,sdx:b.sdx*s,sdy:b.sdy*s}; },
  async tapAt(px,py,type='DL',cb=null){
    const o=this._o(type), e=this.el;
    const iL=px-o.tx, iT=py-o.ty;
    e.src=this._src(type);
    e.style.transition='none';
    e.style.left=(iL+o.sdx)+'px'; e.style.top=(iT+o.sdy)+'px'; e.style.opacity='1';
    await wait(60);
    e.style.transition='left .62s ease-out,top .62s ease-out';   // viaje más lento
    e.style.left=iL+'px'; e.style.top=iT+'px';
    await wait(680);                                               // espera viaje + pausa antes de tap
    e.style.transition='transform .14s';
    e.style.transform=type==='L'?'translateX(8px)':type==='R'?'translateX(-8px)':'scale(.90)';
    if(cb) cb();
    await wait(180); e.style.transform=''; await wait(120);       // press + release más visibles
    e.style.transition='left .48s ease-in,top .48s ease-in,opacity .28s';
    e.style.left=(iL+o.sdx)+'px'; e.style.top=(iT+o.sdy)+'px'; e.style.opacity='0';
    await wait(520);
  },
  async tapEl(el,type='DL',cb=null){
    const r=el.getBoundingClientRect(), sr=stageR();
    await this.tapAt(r.left-sr.left+r.width/2, r.top-sr.top+r.height/2, type, cb);
  },
  // drag: approach pieceEl, grab, move both to targetEl, snap piece in
  async drag(pieceEl,targetEl,type='DR'){
    const sr=stageR();
    const pr=pieceEl.getBoundingClientRect();
    const tr=targetEl.getBoundingClientRect();
    const px=pr.left-sr.left+pr.width/2, py=pr.top-sr.top+pr.height/2;
    const tx=tr.left-sr.left+tr.width/2, ty=tr.top-sr.top+tr.height/2;
    const o=this._o(type), e=this.el;

    // Approach piece
    e.src=this._src(type);
    e.style.transition='none';
    e.style.left=(px-o.tx+o.sdx)+'px'; e.style.top=(py-o.ty+o.sdy)+'px'; e.style.opacity='1';
    await wait(60);
    e.style.transition='left .62s ease-out,top .62s ease-out';
    e.style.left=(px-o.tx)+'px'; e.style.top=(py-o.ty)+'px';
    await wait(680);

    // Grab — both pressed
    e.style.transition='transform .1s';
    e.style.transform='scale(.93)';
    pieceEl.style.transition='transform .12s,box-shadow .12s';
    pieceEl.style.transform='scale(1.08)';
    pieceEl.style.boxShadow='0 6px 20px rgba(0,0,0,.45)';
    await wait(160); e.style.transform='';

    // Move together to target (1s)
    const dur=950;
    const dx=tx-px, dy=ty-py;
    const curL=parseFloat(pieceEl.style.left||0), curT=parseFloat(pieceEl.style.top||0);
    pieceEl.style.transition=`left ${dur}ms cubic-bezier(.4,0,.2,1),top ${dur}ms cubic-bezier(.4,0,.2,1)`;
    pieceEl.style.left=(curL+dx)+'px'; pieceEl.style.top=(curT+dy)+'px';
    e.style.transition=`left ${dur}ms cubic-bezier(.4,0,.2,1),top ${dur}ms cubic-bezier(.4,0,.2,1)`;
    e.style.left=(tx-o.tx)+'px'; e.style.top=(ty-o.ty)+'px';
    await wait(dur+60);

    // Drop
    pieceEl.style.transform='scale(1)'; pieceEl.style.boxShadow='none';
    await wait(80);
    pieceEl.style.opacity='0';
    targetEl.classList.add('filled','snap');
    // Fill target with the piece's image source
    const img=pieceEl.querySelector('img');
    if(img){
      const fi=document.createElement('img');
      fi.src=img.src; fi.style.cssText=`width:100%;height:100%;object-fit:cover;object-position:${img.style.objectPosition}`;
      targetEl.appendChild(fi);
    }
    await wait(100);

    // Gauntlet retract
    e.style.transition='left .28s ease-in,top .28s ease-in,opacity .2s';
    e.style.left=(tx-o.tx+o.sdx)+'px'; e.style.top=(ty-o.ty+o.sdy)+'px'; e.style.opacity='0';
    await wait(330);
  },
  // hover: sdx<0 → entra desde la izquierda; sdx>0 → entra desde la derecha
  async hover(el, type='R', ms=600){
    const r=el.getBoundingClientRect(), sr=stageR();
    const bx=r.left-sr.left+r.width/2, by=r.top-sr.top+r.height/2;
    const o=this._o(type), e=this.el;
    const nx=bx-o.tx, ny=by-o.ty;
    const rad=Math.min(sr.width*.13, 70);
    const startX = o.sdx < 0 ? -190 : sr.width+190; // lado de entrada por tipo
    const sideX  = o.sdx < 0 ? nx+rad*.75 : nx-rad*.75; // lado opuesto para el círculo
    e.src=this._src(type);
    e.style.transition='none';
    e.style.left=startX+'px'; e.style.top=ny+'px'; e.style.opacity='1';
    await wait(60);
    e.style.transition='left .60s cubic-bezier(.4,0,.2,1),top .60s cubic-bezier(.4,0,.2,1)';
    e.style.left=nx+'px'; e.style.top=(ny-rad)+'px';
    await wait(640);
    e.style.transition='left .40s ease-in-out,top .40s ease-in-out';
    e.style.left=sideX+'px'; e.style.top=ny+'px';
    await wait(440);
    e.style.transition='left .40s ease-in-out,top .40s ease-in-out';
    e.style.left=nx+'px'; e.style.top=(ny+rad*.5)+'px';
    await wait(440);
    e.style.transition='left .48s ease-out,top .48s ease-out';
    e.style.left=nx+'px'; e.style.top=ny+'px';
    await wait(ms);
    e.style.transition='left .44s ease-in,top .44s ease-in,opacity .30s';
    e.style.left=startX+'px'; e.style.top=ny+'px'; e.style.opacity='0';
    await wait(480);
  }
};

function setAP(p){ const f=$('af'),d=$('ad'); if(f)f.style.width=p+'%'; if(d)d.style.left=p+'%' }
async function animAP(from,to,ms){
  $('eqw')?.classList.add('on');
  const steps=50,sm=ms/steps,delta=(to-from)/steps; let p=from;
  for(let i=0;i<steps;i++){p+=delta;setAP(Math.round(p*10)/10);await wait(sm)}
  $('eqw')?.classList.remove('on');
}

}

  (function launchFW(){

    cv.width=sr.width; cv.height=sr.height;
    cv.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:9999';
    $('stage').appendChild(cv);
    const ctx=cv.getContext('2d');
    const colors=['#ff2e2e','#ff7f50','#ffcc00','#3cff5f','#1e90ff','#9b30ff','#ff69b4','#00ffff'];

    }

      const elapsed=ts-startTime;
      ctx.clearRect(0,0,cv.width,cv.height);
      if(elapsed<duration){
        if(particles.length<200){
          const x=Math.random()*cv.width;
          const y=Math.random()*cv.height*.6;
          for(let i=0;i<10;i++) particles.push(createParticle(x,y));
        }
        for(let i=particles.length-1;i>=0;i--){
          const p=particles[i];
          p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life--;
          if(p.life<=0){ particles.splice(i,1); continue; }
          ctx.beginPath();
          ctx.fillStyle=p.color;
          ctx.shadowColor=p.color; ctx.shadowBlur=12;
          ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
          ctx.fill(); ctx.closePath();
        }
        requestAnimationFrame(loop);
      } else {
        ctx.clearRect(0,0,cv.width,cv.height);
        cv.remove();
      }
    }
    requestAnimationFrame(loop);
  })();
  setOv(`<div class="modal-bg">
    <div class="modal">
      <div style="height:8px;background:#555;border-radius:3px;width:80%;margin:0 auto 8px"></div>
      <div style="height:7px;background:#aaa;border-radius:3px;width:60%;margin:0 auto 12px"></div>
      <button class="m-btn m-green">🔄</button>
      <button class="m-btn m-red">⏹</button>
    </div>
  </div>`);
  await wait(2000); Knight.hide(); await wait(400);
  const ef=$('end-fade'); ef.classList.add('w'); await wait(80); ef.classList.add('on');
  await wait(1800); ef.classList.remove('w'); ef.classList.add('b');
  await wait(2500);
}

/* ── RUN ─────────────────────────────────────── */
globalThis._continuarVideo = function() {
  try {
    const _o = globalThis.location.origin === 'null' ? '*' : globalThis.location.origin;
    globalThis.parent?.postMessage({ tipo: 'SELECCION.VIDEO_INTRO_TERMINADO', origen: 'video-intro', timestamp: Date.now() }, _o);
  } catch(_e) { /* modo standalone */ }
};
globalThis._replayVideoIntro = function() {
  globalThis.location.reload();
};
let _skipRequested = false;
globalThis._skipVideoIntro = function() {
  _skipRequested = true;
  $('btn-skip').classList.remove('on');
  globalThis._continuarVideo();
};

async function run(){
  MC.init(); await wait(350);
  // Mostrar botón saltar tras 3 s
  wait(3000).then(() => { if (!_skipRequested) $('btn-skip').classList.add('on'); });
  const scenes=[scene1,scene2,scene3,scene4,scene5,scene6,scene7,scene8,scene9,
    scene10,sceneImg,sceneVid,
    scene11,scene12,sceneRetoMCQ,
    scene13,scene14,scene15,scene16,scene17,scene18,scene19];
  for(const fn of scenes){
    if (_skipRequested) break;
    clearOv(); await fn(); await wait(650);
  }
  if (_skipRequested) return;
  $('btn-skip').classList.remove('on');
  clearOv(); Knight.show(K.completo);
  $('end-btns').classList.add('on');
}
run();
</script>
