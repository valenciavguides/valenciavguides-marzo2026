    <script type="module">
    import { retryUntilAvailable, resolverIdsParada, getPadreId } from './js/utils.js';
    import { TIPOS_MENSAJE } from './js/constants.js';
    import logger from './js/logger.js';

    // Validar que estamos dentro de un iframe con padre accesible
    if (!globalThis.parent || globalThis.parent === globalThis) {
        console.error('[hijo5] Este componente debe ejecutarse dentro de un iframe');
        document.body.innerHTML = '<div style="padding: 20px; color: red;">Error: Este componente debe cargarse desde la pÃ¡gina principal.</div>';
        throw new Error('Componente debe ejecutarse dentro de un iframe');
    }

    // Fallbacks que esperan a que globalThis.mensajeria estÃ© disponible
    const enviarMensaje = async (...args) => {
        // En hijos, usar postMessage directamente al padre
        if (globalThis.parent && globalThis.parent !== globalThis) {
            const mensaje = args[0];
            try {
                globalThis.parent.postMessage({
                    tipo: mensaje.tipo,
                    origen: mensaje.origen || 'hijo5',
                    destino: mensaje.destino,
                    datos: mensaje.datos,
                    timestamp: Date.now()
                }, globalThis.location.origin);
                return;
            } catch (e) {
                console.error('[hijo5] Error enviando mensaje via postMessage:', e);
                throw e;
            }
        } else {
            // Fallback al mÃ©todo anterior si no estamos en iframe
            return await retryUntilAvailable(
                () => globalThis.mensajeria.enviarMensaje(...args),
                () => globalThis.mensajeria && globalThis.mensajeria.enviarMensaje,
                10, 500, (...a) => logger.error(...a)
            );
        }
    };

    const registrarControlador = async (tipo, callback) => {
        // En hijos, los controladores se registran localmente para mensajes del padre
        if (globalThis.parent && globalThis.parent !== globalThis) {
            // Registrar listener para mensajes del padre
            const listener = (event) => {
                if (event.source === globalThis.parent && event.data && event.data.tipo === tipo) {
                    callback(event.data);
                }
            };
            globalThis.addEventListener('message', listener);
            return () => globalThis.removeEventListener('message', listener);
        } else {
            // Fallback al mÃ©todo anterior
            return await retryUntilAvailable(
                () => globalThis.mensajeria.registrarControlador(tipo, callback),
                () => globalThis.mensajeria && globalThis.mensajeria.registrarControlador,
                10, 500, (...a) => logger.error(...a)
            );
        }
    };


    // ==================== MESSAGING ADAPTER PARA COMUNICACIÃ“N CON PADRE ====================
    // Este adapter permite a los hijos registrar controladores centralmente en el state-manager del padre
    if (globalThis.messagingAdapter === undefined) {
        globalThis.messagingAdapter = {
            _listenerRegistry: new Map(),

            registrarControladorCentral: async function(controladorId, handler, opciones = {}) {
                const iframeId = globalThis.name || CONFIG_HIJO?.IFRAME_ID || 'hijo';
                const tipo = opciones.tipoMensaje || controladorId;

                if (this._listenerRegistry.has(tipo)) {
                    logger.warn(`[messagingAdapter] Listener ya registrado para ${tipo}, omitiendo`);
                    return false;
                }

                const adapterListener = async function(event) {
                    if (event.source === globalThis.parent && event.data && event.data.tipo === tipo) {
                        try {
                            const resultado = await handler(event.data);

                            if (event.data.requiereConfirmacion && event.data.id && resultado !== undefined) {
                                try {
                                    const confirmacion = {
                                        tipo: TIPOS_MENSAJE?.SISTEMA?.CONFIRMACION || 'SISTEMA.CONFIRMACION',
                                        idOriginal: event.data.id,
                                        origen: iframeId,
                                        destino: event.data.origen || 'padre',
                                        timestamp: Date.now(),
                                        datos: resultado
                                    };
                                    if (globalThis.parent && globalThis.parent !== globalThis) {
                                        globalThis.parent.postMessage(confirmacion, globalThis.location.origin);
                                        logger.info(`[messagingAdapter] Auto-confirmaciÃ³n enviada para ${event.data.id}`);
                                    }
                                } catch (confError) {
                                    logger.error(`[messagingAdapter] Error enviando confirmaciÃ³n:`, confError);
                                }
                            }
                        } catch (e) {
                            logger.error(`[messagingAdapter] Error en handler ${tipo}:`, e?.message);
                        }
                    }
                };
                globalThis.addEventListener('message', adapterListener);
                this._listenerRegistry.set(tipo, adapterListener);

                logger.info(`[messagingAdapter] Handler registrado para ${tipo} en ${iframeId}`);
                return true;
            },

            enviarMensajeCentral: async function(mensaje) {
                if (globalThis.parent && globalThis.parent !== globalThis) {
                    globalThis.parent.postMessage(mensaje, globalThis.location.origin);
                    return { exito: true, metodo: 'postMessage' };
                }
                return { exito: false, error: 'No hay padre disponible' };
            }
        };
        logger.info('[HIJO] messagingAdapter creado para comunicaciÃ³n con padre');

        globalThis.addEventListener('pagehide', function() {
            if (globalThis.messagingAdapter && globalThis.messagingAdapter._listenerRegistry) {
                for (const listener of globalThis.messagingAdapter._listenerRegistry.values()) {
                    globalThis.removeEventListener('message', listener);
                }
                globalThis.messagingAdapter._listenerRegistry.clear();
            }
        }, { once: true });
    }

    // Helper: intenta el registro central (messagingAdapter o mensajeria fallback)
    async function _tryRegistrarCentral(tipo, handler, opciones) {
        const iframeId = globalThis.name || CONFIG_HIJO?.IFRAME_ID || 'hijo';
        const controladorId = `${iframeId}:${tipo}`;
        if (globalThis.messagingAdapter?.registrarControladorCentral) {
            try {
                const res = await globalThis.messagingAdapter.registrarControladorCentral(controladorId, handler, { tipoMensaje: tipo });
                if (res === true) {
                    logger.info(`[HIJO] registrarControlador registered centrally: ${controladorId} -> ${tipo}`);
                    return true;
                }
            } catch (e) {
                logger.warn(`[HIJO] Central registrar failed for ${tipo}: ${e?.message}`);
            }
        }
        if (typeof registrarControlador === 'function') {
            try {
                const res = await safeRegistrar(tipo, handler, opciones);
                logger.info(`[HIJO] registrarControlador delegated to mensajeria for ${tipo}`);
                return res;
            } catch (err) {
                logger.warn(`[HIJO] registrarControlador failed for ${tipo}: ${err?.message}`);
            }
        }
        return null;
    }

    // Wrapper seguro para evitar doble registro de controladores en hijos
    if (globalThis.registrarControladorSeguro === undefined) {
        globalThis.__CONTROLADOR_REGISTRADOS = globalThis.__CONTROLADOR_REGISTRADOS || new Set();
        globalThis.registrarControladorSeguro = async function(tipo, handler, opciones) {
            try {
                logger.info(`[HIJO] registrarControladorSeguro called: ${tipo}`);
                if (!tipo || typeof handler !== 'function') {
                    logger.warn(`[HIJO] registrarControladorSeguro parÃ¡metros invÃ¡lidos: tipo=${tipo}`);
                    return;
                }
                if (globalThis.__CONTROLADOR_REGISTRADOS.has(tipo)) {
                    logger.warn(`[HIJO] Controlador ya registrado, omitiendo: ${tipo}`);
                    return;
                }
                globalThis.__CONTROLADOR_REGISTRADOS.add(tipo);
                try {
                    const res = await _tryRegistrarCentral(tipo, handler, opciones);
                    if (res !== null) return res;
                } catch (e) {
                    logger.warn(`[HIJO] registrarControladorSeguro central attempt error for ${tipo}: ${e?.message}`);
                }
                logger.info(`[HIJO] Handler queued for migration: ${tipo} (local queue)`);
            } catch (e) {
                logger.error(`[HIJO] Error registrando controlador seguro ${tipo}:`, e?.message);
            }
        };

        // Helper: safeRegistrar delegates to registrarControladorSeguro when available
        if (globalThis.safeRegistrar === undefined) {
            globalThis.safeRegistrar = async function(tipo, handler, opciones) {
                try {
                    if (!tipo || typeof handler !== 'function') return;
                    if (globalThis.__CONTROLADOR_REGISTRADOS && globalThis.__CONTROLADOR_REGISTRADOS.has(tipo)) return;
                    if (typeof globalThis.registrarControladorSeguro === 'function') return globalThis.registrarControladorSeguro(tipo, handler, opciones);
                    if (typeof registrarControlador === 'function') return registrarControlador(tipo, handler);
                } catch (e) { logger.warn('[HIJO] safeRegistrar error', e?.message); }
            };
        }
    }
    // NOTA: Bloque IIFE "RESPALDO" para PADRE_PIDE_MANEJADORES eliminado (obsoleto).
    // El sistema actual usa state-manager centralizado sin necesidad de migraciÃ³n manual.

    // â”€â”€ Helpers para generarBotonesParadas â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    const _TIPO_BTN = {
        parada: { clase: 'parada-btn', emoji: '🎯', tituloFn: n => `P${n ?? '?'}` },
        tramo:  { clase: 'tramo-btn',  emoji: '🛣️', tituloFn: n => `T${n ?? '?'}` },
        inicio: { clase: 'inicio-btn', emoji: '📌', tituloFn: () => 'Inicio'       },
    };

    function _extraerNumeroPunto(punto) {
        let num = punto.parada || punto.tramo || null;
        if (num === null && punto.parada_id) {
            const m = punto.parada_id.match(/(?:^|-)P-(\d+)$/);
            if (m) num = Number.parseInt(m[1], 10);
        }
        if (num === null) {
            const id = punto.tramo_id || punto.parada_id || '';
            const m = id.match(/(?:^|-)TR-(\d+)$/);
            if (m) num = Number.parseInt(m[1], 10);
        }
        return num;
    }

    function _activarMarquee(btn, nombre) {
        requestAnimationFrame(() => {
            const wrap = btn.querySelector('.btn-nombre-wrap');
            const span = btn.querySelector('.btn-nombre');
            if (wrap && span && span.scrollWidth > wrap.clientWidth) {
                span.textContent = nombre + '     ' + nombre;
                wrap.classList.add('marquee');
            }
        });
    }

    function _crearOnclickHandler(punto, btn, titulo, index, logPrefix) {
        return async () => {
            const clickPrefix = `${logPrefix}[click-${titulo}]`;
            const idPadre = punto.padreid || `padre-${punto.parada_id || punto.id}`;
            try {
                logger.info(`${clickPrefix} Click en botÃ³n de parada/tramo`);
                document.querySelectorAll('.parada-tramo-btn').forEach(b => b.classList.remove('actual'));
                btn.classList.add('actual');
                estado.paradaActualIndex = index;
                logger.info(`${clickPrefix} BotÃ³n marcado como activo visualmente`);
                const idSinPrefijo = typeof idPadre === 'string' && idPadre.startsWith('padre-')
                    ? idPadre.substring(6)
                    : (punto.parada_id || punto.id || null);
                console.log(`[hijo5] Click en ${titulo}: idPadre=${idPadre}`);
                logger.debug(`${clickPrefix} Enviando cambio de parada al padre: ${idPadre}`);
                await enviarMensaje({
                    destino: getPadreId(),
                    tipo: TIPOS_MENSAJE.NAVEGACION.CAMBIO_PARADA,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    datos: { paradaId: idPadre, parada_id: idSinPrefijo, padreId: idPadre, padreid: idPadre, timestamp: Date.now(), origen: 'hijo5' }
                });
                logger.info(`${clickPrefix} Solicitud de cambio de parada enviada exitosamente`);
            } catch (clickError) {
                logger.error(`${clickPrefix} Error al manejar click:`, clickError);
                try {
                    await enviarMensaje({
                        destino: getPadreId(),
                        tipo: TIPOS_MENSAJE.SISTEMA.ERROR,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        datos: { error: clickError.message, contexto: 'click-boton-parada', paradaId: idPadre, timestamp: Date.now() }
                    });
                } catch (notifError) {
                    logger.error(`${clickPrefix} Error al notificar error:`, notifError);
                }
            }
        };
    }

    function _crearBotonParada(punto, index, lista, logPrefix) {
        try {
            if (!punto || typeof punto !== 'object') {
                logger.warn(`${logPrefix} Punto ${index} invÃ¡lido, omitiendo`);
                return false;
            }
            if (!punto.tipo) {
                logger.warn(`${logPrefix} Punto ${index} sin tipo, omitiendo`);
                return false;
            }
            if (!['inicio', 'parada', 'tramo'].includes(punto.tipo)) {
                logger.debug(`${logPrefix} Punto ${index} tipo "${punto.tipo}" sin ubicaciÃ³n en mapa, omitiendo`);
                return false;
            }
            const cfg = _TIPO_BTN[punto.tipo] || { clase: 'default-btn', emoji: '?', tituloFn: () => 'N/A' };
            const num = _extraerNumeroPunto(punto);
            const titulo = cfg.tituloFn(num);
            const nombre = punto.nombre || '';
            const btn = document.createElement('button');
            btn.className = `parada-tramo-btn ${cfg.clase}`;
            btn.innerHTML = `
                        <div class="btn-row">
                            <span class="btn-icon">${cfg.emoji}</span>
                            <span class="btn-title">${titulo}</span>
                        </div>
                        <div class="btn-nombre-wrap" data-nombre="${nombre.replaceAll('"', '&quot;')}">)
                            <span class="btn-nombre">${nombre}</span>
                        </div>
                    `;
            if (nombre) _activarMarquee(btn, nombre);
            btn.dataset.puntoIndex = index;
            btn.dataset.puntoTipo = punto.tipo;
            btn.dataset.puntoId = num || 0;
            btn.onclick = _crearOnclickHandler(punto, btn, titulo, index, logPrefix);
            lista.appendChild(btn);
            return true;
        } catch (e) {

    async function _validarCambioModo(mensaje, logPrefix) {

            estado.pendingCambioModo = mensaje.datos || { modo: null };

                datos: { error: 'Secuencia no completa', esperarPermiso: true, tipoOriginal: mensaje.tipo, modoSolicitado: mensaje.datos?.modo }
            });
            return 'nack';
        }
        if (!mensaje?.origen) {
            logger.warn(`${logPrefix} Mensaje sin origen, ignorando`);
            return 'ignore';
        }
        if (!mensaje.datos || typeof mensaje.datos !== 'object') {
            logger.error(`${logPrefix} Datos invÃ¡lidos`, mensaje);
            await enviarMensaje({ destino: mensaje.origen, tipo: TIPOS_MENSAJE.SISTEMA.ERROR, origen: CONFIG_HIJO.IFRAME_ID, datos: { error: 'Datos de mensaje invÃ¡lidos' } });

    }

                    await enviarMensaje({ destino: mensaje.origen || 'padre', tipo: TIPOS_MENSAJE.SISTEMA.ERROR, origen: CONFIG_HIJO.IFRAME_ID, datos: { error: error.message, tipo: 'CAMBIO_MODO_FALLIDO' } });
                } catch (e) {
                    logger.error(`${logPrefix} Error notificando fallo:`, e);
                }
            }
        });

        // Controlador: SISTEMA.CAMBIO_MODO_APLICADO
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_APLICADO, async (mensaje) => {
            const logPrefix = `[hijo5][CAMBIO_MODO_APLICADO]`;
            try {
                const { modo } = mensaje.datos || {};
                logger.success(`${logPrefix} âœ… Cambio de modo a "${modo}" aplicado globalmente`);
            } catch (error) {
                logger.error(`${logPrefix} Error:`, error);
            }
        });

        // ============================================
        // CONTROLADOR: SISTEMA.HEARTBEAT
        // ============================================
        // PropÃ³sito: Responder a heartbeats de conectividad del padre
        // Origen esperado: padre, mensajeria
        // Datos requeridos: Ninguno (opcional timestamp)
        // Respuesta: SISTEMA.HEARTBEAT_RESPONSE con timestamp
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT, async (mensaje) => {
            const logPrefix = `[hijo5][SISTEMA.HEARTBEAT][${mensaje?.origen || 'desconocido'}]`;

            try {
                // ValidaciÃ³n de origen
                if (!mensaje?.origen) {
                    logger.warn(`${logPrefix} Mensaje HEARTBEAT sin origen, ignorando`);
                    return;
                }

                logger.debug(`${logPrefix} HEARTBEAT recibido, enviando respuesta`);

                // Enviar respuesta con timestamp actual
                await enviarMensaje({
                    destino: mensaje.origen,
                    tipo: TIPOS_MENSAJE.SISTEMA.HEARTBEAT_RESPONSE,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    datos: {
                        timestamp: Date.now(),
                        componenteId: CONFIG_HIJO.COMPONENTE_ID,
                        estado: {
                            inicializado: estado.inicializado,
                            modo: estado.modo,
                            paradasCargadas: estado.aventuraParadas?.length || 0
                        }
                    }
                });

                logger.debug(`${logPrefix} HEARTBEAT_RESPONSE enviado exitosamente`);

            } catch (error) {
                logger.error(`${logPrefix} Error al procesar HEARTBEAT:`, error);

                // Intentar enviar respuesta de error
                try {
                    await enviarMensaje({
                        destino: mensaje.origen,
                        tipo: TIPOS_MENSAJE.SISTEMA.ERROR,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        datos: {
                            error: error.message,
                            contexto: 'SISTEMA.HEARTBEAT',
                            mensajeOriginal: mensaje.tipo
                        }
                    });
                } catch (notifError) {
                    logger.error(`${logPrefix} Error al notificar error de HEARTBEAT:`, notifError);
                }
            }
        });

        // Controlador: SISTEMA.HEARTBEAT.START
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT_START, async (mensaje) => {
            const logPrefix = `[hijo5][HEARTBEAT_START][${mensaje?.origen || 'desconocido'}]`;
            try {
                estado.heartbeatActivo = true;
                logger.info(`${logPrefix} Activado heartbeat local`);
                return { started: true };
            } catch (error) {
                logger.error(`${logPrefix} Error procesando HEARTBEAT_START:`, error);
                return { started: false, error: error?.message };
            }
        });

        // Controlador: SISTEMA.HEARTBEAT.PAUSE
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT_PAUSE, async (mensaje) => {
            const logPrefix = `[hijo5][HEARTBEAT_PAUSE][${mensaje?.origen || 'desconocido'}]`;
            try {
                estado.heartbeatActivo = false;
                logger.info(`${logPrefix} Pausado heartbeat local`);
                return { paused: true };
            } catch (error) {
                logger.error(`${logPrefix} Error procesando HEARTBEAT_PAUSE:`, error);
                return { paused: false, error: error?.message };
            }
        });

        // ============================================
        // CONTROLADOR: DATOS.RESPUESTA_PARADAS
        // ============================================
        // PropÃ³sito: Recibir respuesta con datos de paradas del padre
        // Origen esperado: padre, funciones-mapa
        // Datos requeridos: { paradas: Array, total: number }
        // Respuesta: Ninguna (procesamiento de datos)
        registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.RESPUESTA_DATOS_PARADAS, async (mensaje) => {
            const logPrefix = `[hijo5][NAVEGACION.RESPUESTA_DATOS_PARADAS][${mensaje?.origen || 'desconocido'}]`;
            try {
                const validErr = _validarMensajeParadas(mensaje, logPrefix);
                if (validErr) return;

                const { paradas, estadisticas } = mensaje.datos;
                logger.info(`${logPrefix} Procesando ${paradas.length} paradas del padre`);

                const transformadas = paradas.map(p => _transformarParadaPadre(p, logPrefix)).filter(Boolean);
                const validas = transformadas.filter(p => _esParadaValida(p, logPrefix));

                if (transformadas.length !== validas.length) {
                    logger.warn(`${logPrefix} ${transformadas.length - validas.length} paradas invÃ¡lidas despuÃ©s de transformaciÃ³n`);
                }

                estado.aventuraParadas = validas;
                logger.info(`${logPrefix} ${validas.length} paradas vÃ¡lidas almacenadas`);
                console.log('[hijo5] Paradas del padre almacenadas:', validas.slice(0, 3), '...');

                estado.modo = 'casa';
                await activarModoInicial('casa');

                if (estadisticas) {
                    logger.debug(`${logPrefix} EstadÃ­sticas: paradas=${estadisticas.paradas || 0}, tramos=${estadisticas.tramos || 0}`);
                }

                logger.info(`${logPrefix} Paradas procesadas y UI actualizada exitosamente`);
                estado.datosRecibidos = true;

                await enviarMensaje({
                    destino: getPadreId(),
                    tipo: TIPOS_MENSAJE.SISTEMA.CONFIRMACION,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    idOriginal: mensaje.id,
                    datos: { tipoConfirmacion: 'DATOS_RECIBIDOS', totalParadas: validas.length }
                });

            } catch (error) {
                logger.error(`${logPrefix} Error al procesar respuesta de paradas:`, error);
                try {
                    await enviarMensaje({ destino: mensaje.origen, tipo: TIPOS_MENSAJE.SISTEMA.ERROR, origen: CONFIG_HIJO.IFRAME_ID, datos: { error: error.message, stack: error.stack, contexto: 'DATOS.RESPUESTA_PARADAS', mensajeOriginal: mensaje.tipo } });
                } catch (notifError) {
                    logger.error(`${logPrefix} Error al notificar error al origen:`, notifError);
                }
            }
        });

        // ============================================
        // CONTROLADOR: NAVEGACION.CAMBIO_PARADA (Respuesta)
        // ============================================
        // PropÃ³sito: Recibir confirmaciÃ³n de cambio de parada desde el padre
        // Origen esperado: padre, funciones-mapa
        // Datos requeridos: { paradaId: string, exito: boolean }
        // Respuesta: Ninguna (actualizaciÃ³n de UI)
        registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.CAMBIO_PARADA, async (mensaje) => {
            const logPrefix = `[hijo5][NAVEGACION.CAMBIO_PARADA][${mensaje?.origen || 'desconocido'}]`;
            try {
                if (!mensaje?.origen) { logger.warn(`${logPrefix} Mensaje sin origen, ignorando`); return; }
                if (mensaje.origen === CONFIG_HIJO.IFRAME_ID) { logger.debug(`${logPrefix} Mensaje propio detectado, ignorando`); return; }
                if (!mensaje.datos || typeof mensaje.datos !== 'object') { logger.warn(`${logPrefix} Mensaje sin datos`); return; }

                const resolved = resolverIdsParada(mensaje.datos || {});
                const paradaId = resolved.paradaId || mensaje.datos?.paradaId || mensaje.datos?.parada_id || null;
                const padreId = resolved.padreId || mensaje.datos?.padreId || mensaje.datos?.padreid || null;
                const { exito } = mensaje.datos;

                if (paradaId) {
                    logger.info(`${logPrefix} Cambio a parada: ${paradaId}${exito === false ? ' (FALLIDO)' : ''}`);
                }
                if (paradaId && exito !== false) _resaltarBotonParada(paradaId, padreId, logPrefix);
                logger.debug(`${logPrefix} Cambio de parada procesado`);
            } catch (error) {
                logger.error(`${logPrefix} Error al procesar cambio de parada:`, error);
            }
        });

        // ============================================
        // CONTROLADOR: SISTEMA.ERROR
        // ============================================
        // PropÃ³sito: Recibir notificaciones de errores de otros componentes
        // Origen esperado: padre, cualquier hijo
        // Datos requeridos: { error: string, contexto: string }
        // Respuesta: Ninguna (log del error)
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.ERROR, async (mensaje) => {
            const logPrefix = `[hijo5][SISTEMA.ERROR][${mensaje?.origen || 'desconocido'}]`;

            try {
                // ValidaciÃ³n de origen
                if (!mensaje?.origen) {
                    logger.warn(`${logPrefix} NotificaciÃ³n de error sin origen`);
                    return;
                }

                // ValidaciÃ³n de datos
                if (!mensaje.datos || typeof mensaje.datos !== 'object') {
                    logger.warn(`${logPrefix} NotificaciÃ³n de error sin datos`);
                    return;
                }

                const { error, contexto, mensajeOriginal } = mensaje.datos;

                logger.error(`${logPrefix} Error recibido del origen:`, {
                    error,
                    contexto: contexto || 'desconocido',
                    mensajeOriginal: mensajeOriginal || 'N/A'
                });

                // Si el error es relacionado con solicitudes de hijo5, intentar reintentar
                if (mensajeOriginal === TIPOS_MENSAJE.DATOS.SOLICITAR_PARADAS) {
                    logger.warn(`${logPrefix} Error en solicitud de paradas, intentando recargar despuÃ©s de 5s`);
                    setTimeout(() => {
                        solicitarParadasDelPadre();
                    }, 5000);
                }

            } catch (error) {
                logger.error(`${logPrefix} Error al procesar notificaciÃ³n de error:`, error);
            }
        });

        // ============================================
        // CONTROLADOR: SISTEMA.CONFIRMACION
        // ============================================
        // PropÃ³sito: Confirmar recepciÃ³n de mensajes enviados
        // Origen esperado: manejador-errores, otros componentes
        // Datos requeridos: { mensajeOriginalId: string }
        // Respuesta: Ninguna (logging)
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.CONFIRMACION, async (mensaje) => {
            const logPrefix = `[hijo5][SISTEMA.CONFIRMACION][${mensaje?.origen || 'desconocido'}]`;

            try {
                logger.debug(`${logPrefix} ConfirmaciÃ³n recibida`, {
                    mensajeOriginalId: mensaje.datos?.mensajeOriginalId,
                    timestamp: mensaje.timestamp
                });

                // AquÃ­ se podrÃ­a implementar lÃ³gica adicional si es necesario
                // Por ahora solo logging

            } catch (error) {
                logger.error(`${logPrefix} Error al procesar confirmaciÃ³n:`, error);
            }
        });

        // Controlador para confirmaciÃ³n de cambio de parada
        registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.CAMBIO_PARADA_CONFIRMADO, async (mensaje) => {
            const logPrefix = `[hijo5][CAMBIO_PARADA_CONFIRMADO][${mensaje?.origen || 'desconocido'}]`;

            try {
                // ValidaciÃ³n de datos
                if (!mensaje.datos || typeof mensaje.datos !== 'object') {
                    logger.warn(`${logPrefix} Mensaje sin datos vÃ¡lidos`);
                    return;
                }

                const resolved = resolverIdsParada(mensaje.datos || {});
                const paradaId = resolved.paradaId || mensaje.datos?.paradaId || mensaje.datos?.parada_id || mensaje.datos?.padreid || null;
                const audio = mensaje.datos?.audio || null;
                const reto = mensaje.datos?.reto || null;

                logger.info(`${logPrefix} Cambio de parada confirmado: ${paradaId}`);

                // AquÃ­ se podrÃ­a actualizar UI: resaltar botÃ³n, mostrar indicadores de audio/reto disponibles
                // Por ejemplo, agregar clase 'activo' al botÃ³n correspondiente
                const botones = document.querySelectorAll('.parada-tramo-btn');
                botones.forEach(btn => {
                    if (btn.dataset.padreid === paradaId) {
                        btn.classList.add('actual');
                    } else {
                        btn.classList.remove('actual');
                    }
                });

                if (audio) {
                    logger.debug(`${logPrefix} Audio disponible para ${paradaId}`);
                }
                if (reto) {
                    logger.debug(`${logPrefix} Reto disponible para ${paradaId}`);
                }

            } catch (error) {
                logger.error(`${logPrefix} Error procesando confirmaciÃ³n:`, error);
            }
        });

        // Controlador para ACK del sistema de monitoreo
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.ACK, async (mensaje) => {
            const logPrefix = `[hijo5][SISTEMA.ACK][${mensaje?.origen || 'desconocido'}]`;
            try {
                // Responder automÃ¡ticamente con ACK para mantener bidireccionalidad
                await enviarMensaje({
                    destino: getPadreId(),
                    tipo: TIPOS_MENSAJE.SISTEMA.ACK,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    datos: { mensajeOriginalId: mensaje.id }
                });
                logger.debug(`${logPrefix} ACK respondido al padre`);
            } catch (error) {
                logger.error(`${logPrefix} Error respondiendo ACK:`, error);
            }
        });

        // InstrumentaciÃ³n: confirmar que los controladores GPS fueron registrados
        logger.debug('[hijo5] Controladores GPS registrados y listos para recibir mensajes');

        // Enviar HIJO_PREPARADO y esperar PADRE_DATOS antes de enviar HIJO_LISTO
        try {
            await enviarMensaje({
                destino: getPadreId(),
                tipo: TIPOS_MENSAJE.SISTEMA.HIJO_PREPARADO,
                origen: CONFIG_HIJO.IFRAME_ID,
                datos: {
                    componenteId: CONFIG_HIJO.COMPONENTE_ID,
                    version: '1.0.0',
                    capacidades: ['modo-selector', 'paradas-list'],
                    timestamp: Date.now()
                }
            });
            logger.debug('[hijo5] HIJO_PREPARADO enviado; esperando PADRE_DATOS');
        } catch (e) {
            logger.warn('[hijo5] Error enviando HIJO_PREPARADO:', e);
        }

        // ============================================
        // INICIALIZACIÃ“N DE EVENTOS Y DATOS
        // ============================================
        logger.info('[hijo5] Inicializando eventos y solicitando datos del padre...');

        // Vincular evento de click al botÃ³n GPS
        const btnGPS = document.getElementById('gps-casa-btn');
        if (btnGPS) {
            btnGPS.onclick = manejarClickGPS;
            logger.debug('[hijo5] Evento click vinculado al botÃ³n GPS');
        } else {
            logger.error('[hijo5] BotÃ³n GPS no encontrado en el DOM');
        }

        // Marcar como inicializado
        estado.inicializado = true;

        logger.info('[hijo5] InicializaciÃ³n completada exitosamente', {
            modo: estado.modo,
            paradasCargadas: estado.aventuraParadas?.length || 0,
            idsMapeados: Object.keys(estado.paradasMapeadas).length
        });

    } catch (error) {
        logger.error('[hijo5] Error crÃ­tico durante la inicializaciÃ³n:', {
            message: error.message,
            stack: error.stack
        });

        // Intentar notificar al padre del error crÃ­tico
            try {
            await enviarMensaje({
                destino: getPadreId(),
                tipo: TIPOS_MENSAJE.SISTEMA.ERROR,
                origen: CONFIG_HIJO.IFRAME_ID,
                datos: {
                    error: error.message,
                    contexto: 'inicializacion-hijo5',
                    critico: true,
                    timestamp: Date.now()
                }
            });
        } catch (notifError) {
            logger.error('[hijo5] Error al notificar error crÃ­tico al padre:', notifError);
        }
    }

    // ============================================
    // HANDLER: visibilitychange â€” reconectar tras cambio de pestaÃ±a
    // ============================================
    // Cuando el usuario abre otra pestaÃ±a y vuelve, la mensajerÃ­a puede
    // haberse interrumpido (timeouts expirados, correlaciones perdidas).
    // Al volver, reenviamos un ping al padre y, si tenÃ­amos botones,
    // nos aseguramos de que sigan funcionales.
    document.addEventListener('visibilitychange', async () => {
        if (document.hidden) return; // Solo actuar al VOLVER a ser visible

        const logPrefix = '[hijo5][visibilitychange]';
        logger.info(`${logPrefix} PestaÃ±a visible de nuevo, verificando conexiÃ³n con padre...`);

        try {
            // 1. Resetear flag de datos para permitir recepciÃ³n fresca si es necesario
            //    (no borramos aventuraParadas para no perder la UI)
            estado.datosRecibidos = false;

            // 2. Enviar ping/heartbeat al padre para verificar conexiÃ³n
            await enviarMensaje({
                destino: getPadreId(),
                tipo: TIPOS_MENSAJE.SISTEMA.HEARTBEAT_RESPONSE,
                origen: CONFIG_HIJO.IFRAME_ID,
                datos: {
                    timestamp: Date.now(),
                    componenteId: CONFIG_HIJO.COMPONENTE_ID,
                    razon: 'visibilitychange',
                    estado: {
                        inicializado: estado.inicializado,
                        modo: estado.modo,
                        paradasCargadas: estado.aventuraParadas?.length || 0
                    }
                }
            });

            // 3. Si los botones ya estaban generados, resolicitar datos por si cambiaron
            if (estado.aventuraParadas && estado.aventuraParadas.length > 0) {
                logger.debug(`${logPrefix} Botones existentes (${estado.aventuraParadas.length}), regenerando UI`);
                generarBotonesParadas();
            } else {
                // Sin datos previos â€” pedir paradas al padre nuevamente
                logger.info(`${logPrefix} Sin datos previos, solicitando paradas al padre`);
                await solicitarParadasDelPadre();
            }

            logger.info(`${logPrefix} ReconexiÃ³n tras cambio de pestaÃ±a completada`);
        } catch (err) {
            logger.warn(`${logPrefix} Error durante reconexiÃ³n:`, err);
        }
    });
    </script>
