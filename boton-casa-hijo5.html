            var w, h;
            w = globalThis.innerWidth; h = globalThis.innerHeight;
            var f = Math.max(16, Math.min(Math.min(w, h) * 0.025, 18));

    <script type="module">
    import { resolverIdsParada } from './js/utils.js';
    import { TIPOS_MENSAJE } from './js/constants.js';
    import logger from './js/logger.js';
    // Publica el logger en el globalThis de ESTE iframe. Cada iframe tiene el suyo, y el
    // `globalThis.logger = ...` de codigo-padre.html solo alcanza al del padre: sin esta
    // linea, los `(globalThis.logger || console).x` de este fichero caian al console crudo
    // y se saltaban el nivel de log (ver GUIA-COMPLETA.md §26.3).
    globalThis.logger = logger;

    // Validar que estamos dentro de un iframe con padre accesible
    if (!globalThis.parent || globalThis.parent === globalThis) {
        logger.error('[hijo5] Este componente debe ejecutarse dentro de un iframe');
        document.body.innerHTML = '<div style="padding: 20px; color: red;">Error: Este componente debe cargarse desde la página principal.</div>';
        throw new Error('Componente debe ejecutarse dentro de un iframe');
    }

    // Ocultar la interfaz AQUI, antes del primer `await` de este modulo, y no mas abajo.
    //
    // Un modulo con await de nivel superior deja saltar el `load` del iframe mientras espera:
    // si el ocultado va despues del await del bus, la interfaz queda visible todo ese tiempo.
    // MEDIDO al migrar hijo5 al bus: el ocultado paso de ocurrir antes de `load` a ocurrir
    // despues (iphone12). Vale para CUALQUIER hijo que se pase al bus: el ocultado va antes.
    //
    // Se guarda aqui tambien el display original, porque mostrarUI() lo restaura.
    const _displayOriginalBody = (document.body && document.body.style && document.body.style.display) || '';
    if (document.body) document.body.style.display = 'none';

    // ==================== MENSAJERÍA ====================
    // Este frame habla por el mismo bus que el padre y que todos los demás: un solo camino, con
    // las mismas garantías en los dos sentidos (orden por tipo, acuse, descarte de fuentes no
    // autorizadas). Mandar con `parent.postMessage` a pelo desde aquí se salta todas ellas.
    //
    // Cargar el bus no es opcional aunque este frame solo enviara: `js/utils.js` instala una
    // captura de `error` y `unhandledrejection` que avisa al padre a través de
    // `globalThis.mensajeria`. Sin bus, esos avisos se encolan, se reintentan 10 s y se tiran
    // (spec 83).
    const bus = await import('./js/mensajeria.js');

    // El MISMO id con el que el padre registra este iframe. Si no coinciden, el padre le escribe
    // a un sitio y este frame se presenta como otro, y ninguno de los dos se entera.
    await bus.inicializarMensajeria({ id: 'hijo5' });

    const { enviarMensaje } = bus;

    // El bus rechaza por sí mismo, y en voz alta, un segundo handler para el mismo tipo, así que
    // sobra la capa de deduplicación que había aquí.
    const registrarControladorSeguro = bus.registrarControlador;
    // NOTA: Bloque IIFE "RESPALDO" para PADRE_PIDE_MANEJADORES eliminado (obsoleto).
    // El sistema actual usa state-manager centralizado sin necesidad de migración manual.

    // ── Helpers para generarBotonesParadas ───────────────────────────────────────

    const _TIPO_BTN = {
        parada: { clase: 'parada-btn', emoji: '🎯', tituloFn: n => `P${n ?? '?'}` },
        tramo:  { clase: 'tramo-btn',  emoji: '🛣️', tituloFn: n => `T${n ?? '?'}` },
        inicio: { clase: 'inicio-btn', emoji: '📌', tituloFn: () => 'Inicio'       },
    };

    function _extraerNumeroPunto(punto) {
        let num = punto.parada || punto.tramo || null;
        if (num === null && punto.parada_id) {
            const m = punto.parada_id.match(/(?:^|-)P-(\d+)$/);
            if (m) num = Number.parseInt(m[1], 10);
        }
        if (num === null) {
            const id = punto.tramo_id || punto.parada_id || '';
            const m = id.match(/(?:^|-)TR-(\d+)$/);
            if (m) num = Number.parseInt(m[1], 10);
        }
        return num;
    }

    function _activarMarquee(btn, nombre) {
        requestAnimationFrame(() => {
            const wrap = btn.querySelector('.btn-nombre-wrap');
            const span = btn.querySelector('.btn-nombre');
            if (wrap && span && span.scrollWidth > wrap.clientWidth) {
                span.textContent = nombre + '     ' + nombre;
                wrap.classList.add('marquee');
            }
        });
    }

    function _crearOnclickHandler(punto, btn, titulo, index, logPrefix) {
        return async () => {
            const clickPrefix = `${logPrefix}[click-${titulo}]`;
            const idPadre = punto.padreid || `padre-${punto.parada_id || punto.id}`;
            try {
                logger.info(`${clickPrefix} Click en botón de parada/tramo`);
                document.querySelectorAll('.parada-tramo-btn').forEach(b => b.classList.remove('actual'));
                btn.classList.add('actual');
                estado.paradaActualIndex = index;
                logger.info(`${clickPrefix} Botón marcado como activo visualmente`);
                const idSinPrefijo = typeof idPadre === 'string' && idPadre.startsWith('padre-')
                    ? idPadre.substring(6)
                    : (punto.parada_id || punto.id || null);
                logger.info(`[hijo5] Click en ${titulo}: idPadre=${idPadre}`);
                logger.debug(`${clickPrefix} Enviando cambio de parada al padre: ${idPadre}`);
                await enviarMensaje({
                    destino: 'padre',
                    tipo: TIPOS_MENSAJE.NAVEGACION.CAMBIO_PARADA,
                    datos: { paradaId: idPadre, parada_id: idSinPrefijo, padreId: idPadre, padreid: idPadre, timestamp: Date.now(), origen: 'hijo5' }
                });
                logger.info(`${clickPrefix} Solicitud de cambio de parada enviada exitosamente`);
            } catch (clickError) {
                logger.error(`${clickPrefix} Error al manejar click:`, clickError);
                try {
                    await enviarMensaje({
                        destino: 'padre',
                        tipo: TIPOS_MENSAJE.SISTEMA.ERROR,
                        datos: { error: clickError.message, contexto: 'click-boton-parada', paradaId: idPadre, timestamp: Date.now() }
                    });
                } catch (notifError) {
                    logger.error(`${clickPrefix} Error al notificar error:`, notifError);
                }
            }
        };
    }

    function _crearBotonParada(punto, index, lista, logPrefix) {
        try {
            if (!punto || typeof punto !== 'object') {
                logger.warn(`${logPrefix} Punto ${index} inválido, omitiendo`);
                return false;
            }
            if (!punto.tipo) {
                logger.warn(`${logPrefix} Punto ${index} sin tipo, omitiendo`);
                return false;
            }
            if (!['inicio', 'parada', 'tramo'].includes(punto.tipo)) {
                logger.debug(`${logPrefix} Punto ${index} tipo "${punto.tipo}" sin ubicación en mapa, omitiendo`);
                return false;
            }
            const cfg = _TIPO_BTN[punto.tipo] || { clase: 'default-btn', emoji: '?', tituloFn: () => 'N/A' };
            const num = _extraerNumeroPunto(punto);
            const titulo = cfg.tituloFn(num);
            const nombre = punto.nombre || '';
            const btn = document.createElement('button');
            btn.className = `parada-tramo-btn ${cfg.clase}`;
            btn.innerHTML = `
                        <div class="btn-row">
                            <span class="btn-icon">${cfg.emoji}</span>
                            <span class="btn-title">${titulo}</span>
                        </div>
                        <div class="btn-nombre-wrap" data-nombre="${nombre.replaceAll('"', '&quot;')}">
                            <span class="btn-nombre">${nombre}</span>
                        </div>
                    `;
            if (nombre) _activarMarquee(btn, nombre);
            btn.dataset.puntoIndex = index;
            btn.dataset.puntoTipo = punto.tipo;
            btn.dataset.puntoId = num || 0;
            btn.onclick = _crearOnclickHandler(punto, btn, titulo, index, logPrefix);
            lista.appendChild(btn);
            return true;
        } catch (e) {
            logger.error(`${logPrefix} Error al generar botón para punto ${index}:`, e);
            return false;
        }
    }

    // ── Helpers para handlers de mensajes ────────────────────────────────────────

    function _sincronizarBotonConModo(modoInicial, logPrefix) {
        if (!modoInicial) return;
        estado.modo = modoInicial;
        const btn = document.getElementById('gps-casa-btn');
        if (!btn) return;
        const isOn = modoInicial === 'aventura';
        btn.classList.toggle('on', isOn);
        btn.classList.toggle('off', !isOn);
        const label = btn.querySelector('.gps-label');
        if (label) label.textContent = isOn ? 'ON' : 'OFF';
        logger.debug(`${logPrefix} Botón sincronizado con modo inicial: ${isOn ? 'ON' : 'OFF'}`);
    }

    function _actualizarUIParaModo(modo, logPrefix) {
        const ventanaEl = document.getElementById('paradas-window');
        if (ventanaEl) {
            ventanaEl.style.display = modo === 'casa' ? 'block' : 'none';
            logger.debug(`${logPrefix} Ventana de paradas ${modo === 'casa' ? 'mostrada' : 'ocultada'}`);
            if (modo === 'casa') generarBotonesParadas();
        }
        const btn = document.getElementById('gps-casa-btn');
        if (btn) {
            const isOn = modo === 'aventura';
            btn.classList.toggle('on', isOn);
            btn.classList.toggle('off', !isOn);
            const label = btn.querySelector('.gps-label');
            if (label) label.textContent = isOn ? 'ON' : 'OFF';
            logger.debug(`${logPrefix} Botón actualizado: ${isOn ? 'ON' : 'OFF'}`);
        }
    }

    function _transformarParadaPadre(paradaPadre, logPrefix) {
        try {
            if (!paradaPadre || typeof paradaPadre !== 'object') {
                logger.warn(`${logPrefix} Parada inválida encontrada, omitiendo`);
                return null;
            }
            return {
                id: paradaPadre.id || paradaPadre.padreid,
                parada_id: paradaPadre.parada_id,
                tramo_id: paradaPadre.tramo_id,
                tipo: paradaPadre.tipo,
                parada: paradaPadre.parada,
                tramo: paradaPadre.tramo,
                nombre: paradaPadre.nombre || `Parada ${paradaPadre.parada_id}`,
                padreid: paradaPadre.padreid || `padre-${paradaPadre.parada_id}`,
                ubicacion: paradaPadre.coordenadas
                    ? { lat: paradaPadre.coordenadas.lat || 0, lng: paradaPadre.coordenadas.lng || 0 }
                    : { lat: 0, lng: 0 }
            };
        } catch (error) {
            logger.warn(`${logPrefix} Error transformando parada:`, error);
            return null;
        }
    }

    function _esParadaValida(p, _logPrefix) {
        // Lo muerto (paso 9 de la lavadora): dos guardas inalcanzables, medidas y retiradas.
        // _transformarParadaPadre() (arriba) construye `p` justo antes de esta llamada y
        // rellena SIEMPRE dos campos con un valor por defecto cuando el original no los trae:
        //   - `ubicacion`: `{lat:0, lng:0}` si no hay `paradaPadre.coordenadas` — el caso de
        //     TODAS (DATOS_PADRE/elementosIDpadre nunca trae coordenadas). `typeof 0 ===
        //     'number'`, así que la comprobación `typeof p.ubicacion.lat !== 'number'` nunca
        //     era cierta.
        //   - `nombre`: `` `Parada ${paradaPadre.parada_id}` `` si no hay `paradaPadre.nombre`
        //     — siempre una cadena no vacía, así que `!p.nombre` tampoco lo era nunca.
        // Solo queda una comprobación real: `id`/`padreid` y `parada_id` no tienen ningún
        // valor por defecto en _transformarParadaPadre, así que una parada sin ninguno de los
        // dos sí puede llegar aquí y sí debe rechazarse.
        if (!p || typeof p !== 'object') return false;
        if (!p.id && !p.parada_id) return false;
        return true;
    }

    async function _validarCambioModo(mensaje, logPrefix) {
        if (!mensaje?.origen) {
            logger.warn(`${logPrefix} Mensaje sin origen, ignorando`);
            return 'ignore';
        }
        if (!mensaje.datos || typeof mensaje.datos !== 'object') {
            logger.error(`${logPrefix} Datos inválidos`, mensaje);
            await enviarMensaje({ destino: 'padre', tipo: TIPOS_MENSAJE.SISTEMA.ERROR, datos: { error: 'Datos de mensaje inválidos' } });
            return 'error';
        }
        const { modo } = mensaje.datos;
        if (!modo || (modo !== 'casa' && modo !== 'aventura')) {
            logger.error(`${logPrefix} Modo inválido: ${modo}`);
            await enviarMensaje({ destino: 'padre', tipo: TIPOS_MENSAJE.SISTEMA.NACK, datos: { error: `Modo inválido: ${modo}`, valoresValidos: ['casa', 'aventura'] } });
            return 'nack';
        }
        return null;
    }

    function _resaltarBotonParada(paradaId, padreId, logPrefix) {
        const botones = document.querySelectorAll('.parada-tramo-btn');
        botones.forEach(btn => btn.classList.remove('activa'));
        const idx = (estado.aventuraParadas || []).findIndex(p =>
            p.padreid === padreId || p.parada_id === paradaId || p.id === padreId
        );
        if (idx >= 0) {
            const botonActual = botones[idx];
            if (botonActual) {
                botonActual.classList.add('activa');
                logger.debug(`${logPrefix} Botón de parada ${paradaId} resaltado (index: ${idx})`);
            }
        }
    }

    function _validarMensajeParadas(mensaje, logPrefix) {
        if (!mensaje?.origen) { logger.warn(`${logPrefix} Mensaje sin origen, ignorando`); return 'ignore'; }
        if (estado.datosRecibidos) { logger.debug(`${logPrefix} Datos ya recibidos anteriormente, ignorando mensaje duplicado`); return 'dup'; }
        if (!mensaje.datos || typeof mensaje.datos !== 'object') { logger.error(`${logPrefix} Mensaje sin datos o datos inválidos`, mensaje); return 'error'; }
        const { paradas } = mensaje.datos;
        if (!paradas || !Array.isArray(paradas)) { logger.error(`${logPrefix} Paradas no es un array válido`, typeof paradas); return 'error'; }
        if (paradas.length === 0) { logger.warn(`${logPrefix} Array de paradas vacío`); return 'empty'; }
        return null;
    }

    const CONFIG_HIJO = {
        IFRAME_ID: 'hijo5',
        COMPONENTE_ID: 'BOTON_CASA',
        DEBUG: true
    };

    // Estado del componente
    const estado = {
        inicializado: false,
        gpsActivo: false,
        gpsPermisos: null, // null = desconocido, true = concedidos, false = denegados
        gpsPrecision: null, // Precisión actual del GPS en metros
        gpsError: null, // Último error GPS
        ultimaUbicacion: null,
        modo: 'casa',
        aventuraParadas: [], // Array de paradas recibidas del padre
        paradasMapeadas: {}, // Mapeo de IDs locales a IDs del padre
        datosRecibidos: false, // Flag para evitar procesamiento duplicado
        hijoListoEnviado: false,  // Flag para evitar envío duplicado de HIJO_LISTO
        paradaActualIndex: null  // Índice del botón activo (para restaurar al regenerar)
    };

    // Controladores se registrarán después de la confirmación del padre
    // para evitar duplicados y asegurar inicialización completa

    // Array de paradas y tramos — ahora se recibe dinámicamente del padre
    // (fuente: coordenadas-aventuras.js centralizado)
    // Ya NO se usa un array local estático

    function generarBotonesParadas() {
        const logPrefix = '[hijo5][generarBotonesParadas]';
        logger.debug(`${logPrefix} Generando botones de paradas...`);

        const lista = document.getElementById('lista-paradas');
        if (!lista) {
            logger.error(`${logPrefix} Contenedor 'lista-paradas' no encontrado en el DOM`);
            return;
        }
        lista.innerHTML = '';

        if (!estado.aventuraParadas || !Array.isArray(estado.aventuraParadas) || estado.aventuraParadas.length === 0) {
            logger.warn(`${logPrefix} ⏳ Esperando datos del padre... (estado.aventuraParadas vacío)`);
            lista.innerHTML = '<div style="padding: 20px; text-align: center; color: #999; font-size: 12px;">Esperando datos de la aventura...</div>';
            return;
        }

        logger.info(`${logPrefix} ✅ Usando ${estado.aventuraParadas.length} paradas dinámicas del padre`);
        let botonesGenerados = 0;

        estado.aventuraParadas.forEach((punto, index) => {
            if (_crearBotonParada(punto, index, lista, logPrefix)) botonesGenerados++;
        });

        logger.info(`${logPrefix} ${botonesGenerados} botones generados exitosamente`);

        if (estado.paradaActualIndex !== null) {
            const btnActual = lista.querySelector(`[data-punto-index="${estado.paradaActualIndex}"]`);
            if (btnActual) btnActual.classList.add('actual');
        }

        // El padre estila la ventana de paradas cuando este aviso llega; por eso se manda
        // al terminar de generarlos, no antes.
        enviarMensaje({
            destino: 'padre',
            tipo: TIPOS_MENSAJE.PARADAS.READY,
            datos: { count: botonesGenerados },
        }).catch((e) => logger.debug('[hijo5] PARADAS.READY no enviado:', e && e.message));
    }

    async function manejarClickGPS() {
        const logPrefix = '[hijo5][manejarClickGPS]';
        try {
            logger.debug(`${logPrefix} Click en botón GPS detectado`);
            const btn = document.getElementById('gps-casa-btn');
            if (!btn) {
                logger.error(`${logPrefix} Botón GPS no encontrado en el DOM`);
                return;
            }
            const modoNuevo = estado.modo === 'casa' ? 'aventura' : 'casa';
            // No actualizar estado.modo/UI aquí de forma optimista: el envío de abajo
            // (enviarMensaje local, línea ~320) es un postMessage crudo sin confirmación
            // -- resuelve en cuanto se despacha, sin relación alguna con si el padre
            // realmente aplica el cambio (p.ej. su guard "ya hay un cambio de modo en
            // curso" puede rechazarlo en silencio). La actualización real y fiable ya
            // ocurre en el controlador SISTEMA.CAMBIO_MODO (más abajo en este archivo),
            // que solo se dispara cuando el padre confirma el cambio de verdad y
            // reenvía el mensaje a todos los hijos -- de ahí sale el estado.modo/
            // _actualizarUIParaModo reales. Actualizar aquí también dejaba el botón
            // mostrando un modo que el padre nunca llegó a aplicar.
            logger.info(`${logPrefix} Solicitando cambio de modo al padre: ${estado.modo} → ${modoNuevo}`);
            await enviarMensaje({
                destino: 'padre',
                tipo: TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO,
                datos: { modo: modoNuevo, timestamp: Date.now(), origen: 'boton-gps' }
            });
            logger.info(`${logPrefix} Solicitud de cambio de modo enviada`);
        } catch (error) {
            logger.error(`${logPrefix} Error al manejar click en GPS:`, { message: error.message, stack: error.stack });
            enviarMensaje({ destino: 'padre', tipo: TIPOS_MENSAJE.SISTEMA.ERROR, datos: { error: error.message, contexto: 'manejarClickGPS', timestamp: Date.now() } })
                .catch(e => logger.debug(`${logPrefix} Error notificando al padre:`, e));
        }
    }

    /**
     * Función para solicitar paradas del padre
     * Envía solicitud REQUEST-RESPONSE al padre para obtener lista completa de paradas
     * Valida exhaustivamente la respuesta y actualiza el estado local
     * @returns {Promise<void>}
     */
    async function solicitarParadasDelPadre(forzar = false) {
        const logPrefix = '[hijo5][solicitarParadasDelPadre]';

        try {
            logger.info(`${logPrefix} Solicitando paradas del padre...`);

            // La ubicación GPS es contexto opcional; sólo omitir si estamos en aventura sin GPS
            // y la solicitud no es forzada (ej. tras CAMBIO_MODO donde los datos son necesarios siempre)
            if (!forzar && estado.modo === 'aventura' && !estado.ubicacionUsuario) {
                logger.warn(`${logPrefix} No hay ubicación de usuario disponible en modo aventura, omitiendo solicitud`);
                return;
            }

            // Enviar solicitud al padre
            await enviarMensaje({
                destino: 'padre',
                tipo: TIPOS_MENSAJE.NAVEGACION.SOLICITAR_DATOS_PARADAS,
                datos: {
                    incluirTramos: true,
                    incluirInicio: true,
                    incluirMetadatos: true,
                    ubicacionUsuario: estado.ubicacionUsuario
                }
            });

            logger.debug(`${logPrefix} Solicitud enviada al padre - esperando respuesta asíncrona`);

            // La respuesta será procesada por el controlador NAVEGACION.RESPUESTA_DATOS_PARADAS
            // No esperamos respuesta aquí porque el procesamiento es asíncrono

        } catch (error) {
            logger.error(`${logPrefix} Error al solicitar paradas del padre:`, {
                message: error.message,
                stack: error.stack
            });

            // Intentar notificar al padre del error
            try {
                await enviarMensaje({
                    destino: 'padre',
                    tipo: TIPOS_MENSAJE.SISTEMA.ERROR,
                    datos: {
                        mensaje: error.message,
                        contexto: 'solicitarParadasDelPadre',
                        timestamp: Date.now()
                    }
                });
            } catch (notifError) {
                logger.error(`${logPrefix} Error al notificar error al padre:`, notifError);
            }
        }
    }

    /**
     * Función auxiliar para activar la UI según el modo inicial
     * Esta función replica la lógica del controlador CAMBIO_MODO pero de manera síncrona
     * @param {string} modo - El modo a activar ('casa' o 'aventura')
     */
    function activarModoInicial(modo) {
        const logPrefix = '[hijo5][activarModoInicial]';
        try {
            logger.info(`${logPrefix} Activando modo inicial: ${modo}`);
            estado.modo = modo;
            estado.gpsActivo = (modo === 'aventura');
            _actualizarUIParaModo(modo, logPrefix);
            logger.info(`${logPrefix} Modo inicial activado exitosamente: ${modo}`);
        } catch (error) {
            logger.error(`${logPrefix} Error al activar modo inicial:`, error);
        }
    }

    try {
        // Ocultar UI hasta PADRE_CONFIRMA
        let _uiConfirmado = false;
        let _uiMostrada = false;
        // Ya oculto al principio del modulo, antes de los awaits: ver alli el porque.
        function mostrarUI() {
            if (!_uiConfirmado) { logger.warn('[hijo5] mostrarUI ignorado: esperando PADRE_CONFIRMA_HIJO_LISTO'); return; }
            if (_uiMostrada) return;
            _uiMostrada = true;
            if (document.body) { document.body.style.display = _displayOriginalBody || 'block'; logger.info('[hijo5] UI visible tras PADRE_CONFIRMA_HIJO_LISTO'); }
        }

        // Sistema de reintentos activos para HIJO_LISTO (solución permanente C2)
        let _reintentosHijoListo = 0;
        const MAX_REINTENTOS_HIJO_LISTO = 30; // 30 segundos máximo
        const INTERVALO_REINTENTO = 1000; // 1 segundo
        let _intervaloReintento = null;

        // NOTA: HIJO_PREPARADO se envía MÁS ABAJO, DESPUÉS de registrar todos los controladores críticos.
        // Esto garantiza que el padre no envíe PADRE_DATOS antes de que los controladores estén listos.
        // Ver: "// Enviar HIJO_PREPARADO y esperar PADRE_DATOS antes de enviar HIJO_LISTO"

        // INICIALIZACIÓN ASÍNCRONA: Esperar datos del padre antes de activar UI
        logger.info(`🏠 [hijo5] REGISTRANDO CONTROLADORES ANTES DE ENVIAR HIJO_PREPARADO`);
        // No activar modo ni generar botones hasta recibir RESPUESTA_DATOS_PARADAS

        // ============================================
        // CONTROLADOR 1: SISTEMA.PADRE_DATOS
        // ============================================
        logger.info(`Hijo hijo5 registrado el controlador PADRE_DATOS`);
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.PADRE_DATOS, async (mensaje) => {
            const logPrefix = `[hijo5][PADRE_DATOS]`;

            logger.info(`🔥 [hijo5] CONTROLADOR PADRE_DATOS EJECUTADO!`, mensaje);

            try {
                if (!mensaje || !mensaje.origen) {
                    logger.error(`${logPrefix} Mensaje sin origen válido`, mensaje);
                    return;
                }

                logger.info(`${logPrefix} Datos del padre recibidos desde ${mensaje.origen}`);
                logger.info(`Hijo hijo5 recibió PADRE_DATOS`);

                // ✅ PROCESAR DATOS INICIALES DEL PADRE
                if (mensaje.datos) {
                    const { modo, paradas, paradaActual } = mensaje.datos;

                    if (modo) {
                        logger.debug(`${logPrefix} Modo inicial: ${modo}`);
                        // Procesar modo si necesario
                    }

                    if (paradas) {
                        logger.debug(`${logPrefix} Paradas recibidas: ${paradas.length}`);
                    }

                    if (paradaActual) {
                        logger.debug(`${logPrefix} Parada actual: ${paradaActual}`);
                    }
                }

            } catch (error) {
                logger.error(`${logPrefix} Error procesando PADRE_DATOS:`, error);
            }

            // Enviar HIJO_LISTO para completar handshake con sistema de reintentos
            if (!estado.hijoListoEnviado) {
                async function enviarHijoListoConReintento() {
                    try {
                        await enviarMensaje({
                            destino: 'padre',
                            tipo: TIPOS_MENSAJE.SISTEMA.HIJO_LISTO,
                            datos: {
                                componenteId: CONFIG_HIJO.COMPONENTE_ID,
                                iframeId: CONFIG_HIJO.IFRAME_ID,
                                timestamp: Date.now()
                            }
                        });
                        logger.info(`[hijo5] HIJO_LISTO enviado al padre (intento ${_reintentosHijoListo + 1}/${MAX_REINTENTOS_HIJO_LISTO})`);
                    } catch (error) {
                        logger.error('[hijo5] Error enviando HIJO_LISTO:', error);
                    } finally {
                        // En finally, no en el try: un fallo puntual de enviarMensaje() no debe
                        // matar el resto de la secuencia de reintentos (bug real encontrado en
                        // auditoría 2026-08-18 — antes, una excepción aquí paraba el bucle para
                        // siempre en silencio, sin programar el siguiente intento).
                        _reintentosHijoListo++;
                        if (_reintentosHijoListo < MAX_REINTENTOS_HIJO_LISTO) {
                            _intervaloReintento = setTimeout(enviarHijoListoConReintento, INTERVALO_REINTENTO);
                        } else {
                            // Fallback: mostrar UI después de 30 segundos sin confirmación
                            logger.warn('[hijo5] Máximo de reintentos alcanzado, mostrando UI como fallback');
                            _uiConfirmado = true;
                            mostrarUI();
                        }
                    }
                }
                estado.hijoListoEnviado = true;
                enviarHijoListoConReintento();
            }
        });

        // ============================================================
        // CONTROLADOR: SISTEMA.PADRE_CONFIRMA_HIJO_LISTO
        // ============================================================
        // Propósito: Recibir confirmación del padre de que los controladores están listos
        // Origen esperado: padre
        // Respuesta: Solicitar datos iniciales
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.PADRE_CONFIRMA_HIJO_LISTO, async (mensaje) => {
            const logPrefix = `[hijo5][PADRE_CONFIRMA_HIJO_LISTO][${mensaje?.origen || 'desconocido'}]`;
            try {
                logger.info('[hijo5] PADRE_CONFIRMA_HIJO_LISTO recibido:', mensaje);
                logger.info(`${logPrefix} Confirmación recibida del padre - controladores listos`);

                // Limpiar intervalo de reintento si existe
                if (_intervaloReintento) {
                    clearTimeout(_intervaloReintento);
                    _intervaloReintento = null;
                    logger.info(`[hijo5] Intervalo de reintento limpiado tras recibir PADRE_CONFIRMA_HIJO_LISTO`);
                }

                const { modoInicial } = mensaje.datos || {};
                _sincronizarBotonConModo(modoInicial, logPrefix);
                _uiConfirmado = true;
                mostrarUI();
                await solicitarParadasDelPadre();
                logger.info(`${logPrefix} Solicitud de datos iniciales enviada tras confirmación`);
            } catch (error) {
                logger.error(`${logPrefix} Error procesando confirmación del padre:`, error);
            }
            // El modo llega por `modoInicial` al conectarse y por CAMBIO_MODO después; aquí no se aparca nada (un solo camino, decisión 11 de docs/mensajeria-duplicada-en-hijos.md).
            try {
                _uiConfirmado = true;
                mostrarUI();
                await enviarMensaje({ destino: 'padre', tipo: TIPOS_MENSAJE.SISTEMA.CONFIRMACION, datos: { tipo: 'UI_VISIBLE', timestamp: Date.now() } });
            } catch (e) { logger.debug('[hijo5] mostrarUI/confirmación UI error:', e); }
        });

        // ============================================
        // CONTROLADOR 2: SISTEMA.CAMBIO_MODO
        // ============================================
        // Propósito: Actualizar el modo de la aplicación (casa/aventura) y adaptar la UI
        // Origen esperado: padre, modo-handler
        // Datos requeridos: { modo: 'casa'|'aventura' }
        // Respuesta: Ninguna (actualización de estado local)
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO, async (mensaje) => {
            const logPrefix = `[hijo5][CAMBIO_MODO]`;
            try {
                const validErr = await _validarCambioModo(mensaje, logPrefix);
                if (validErr) return;

                const { modo } = mensaje.datos;
                const tipoEntendido = TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_ENTENDIDO;
                const origenEntendido = CONFIG_HIJO?.IFRAME_ID;

                // El destino ya no entra en el guard: es el literal 'padre'. Estaba ahí porque
                // salía de `mensaje.origen`, que podía venir vacío.
                if (!tipoEntendido || !origenEntendido) {
                    const debugInfo = { tipo: tipoEntendido, origen: origenEntendido, TIPOS_MENSAJE_exists: TIPOS_MENSAJE !== undefined, CONFIG_HIJO_exists: CONFIG_HIJO !== undefined };
                    logger.error('[hijo5][CAMBIO_MODO] 🔴 DEBUG CAMPOS UNDEFINED:', JSON.stringify(debugInfo, null, 2));
                    logger.error(`${logPrefix} ❌ Campos undefined antes de enviar ENTENDIDO:`, debugInfo);
                    throw new Error('Campos undefined en CAMBIO_MODO_ENTENDIDO');
                }

                await enviarMensaje({ destino: 'padre', tipo: tipoEntendido, datos: { modo, timestamp: Date.now(), mensajeId: mensaje.datos?.mensajeId || mensaje.id } });

                logger.info(`${logPrefix} Cambiando modo a: ${modo}`);
                const modoAnterior = estado.modo;
                estado.modo = modo;
                _actualizarUIParaModo(modo, logPrefix);
                logger.info(`${logPrefix} Modo cambiado exitosamente: ${modoAnterior} → ${modo}`);

                if (modo === 'aventura') {
                    solicitarParadasDelPadre(true).catch(e => logger.warn(`${logPrefix} Error solicitando paradas tras CAMBIO_MODO:`, e));
                }

                await enviarMensaje({ destino: 'padre', tipo: TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_EFECTUADO, datos: { modo, exito: true, timestamp: Date.now(), mensajeId: mensaje.datos?.mensajeId || mensaje.id } });

            } catch (error) {
                logger.error(`${logPrefix} Error:`, error);
                try {
                    await enviarMensaje({ destino: 'padre', tipo: TIPOS_MENSAJE.SISTEMA.ERROR, datos: { error: error.message, tipo: 'CAMBIO_MODO_FALLIDO' } });
                } catch (e) {
                    logger.error(`${logPrefix} Error notificando fallo:`, e);
                }
            }
        });

        // Controlador: SISTEMA.CAMBIO_MODO_APLICADO
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_APLICADO, async (mensaje) => {
            const logPrefix = `[hijo5][CAMBIO_MODO_APLICADO]`;
            try {
                const { modo } = mensaje.datos || {};
                logger.success(`${logPrefix} ✅ Cambio de modo a "${modo}" aplicado globalmente`);
            } catch (error) {
                logger.error(`${logPrefix} Error:`, error);
            }
        });

        // ============================================
        // CONTROLADOR: SISTEMA.HEARTBEAT
        // ============================================
        // Propósito: Responder a heartbeats de conectividad del padre
        // Origen esperado: padre, mensajeria
        // Datos requeridos: Ninguno (opcional timestamp)
        // Respuesta: SISTEMA.HEARTBEAT_RESPONSE con timestamp
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT, async (mensaje) => {
            const logPrefix = `[hijo5][SISTEMA.HEARTBEAT][${mensaje?.origen || 'desconocido'}]`;

            try {
                // Validación de origen
                if (!mensaje?.origen) {
                    logger.warn(`${logPrefix} Mensaje HEARTBEAT sin origen, ignorando`);
                    return;
                }


                // Enviar respuesta con timestamp actual
                await enviarMensaje({
                    destino: 'padre',
                    tipo: TIPOS_MENSAJE.SISTEMA.HEARTBEAT_RESPONSE,
                    datos: {
                        timestamp: Date.now(),
                        componenteId: CONFIG_HIJO.COMPONENTE_ID,
                        estado: {
                            inicializado: estado.inicializado,
                            modo: estado.modo,
                            paradasCargadas: estado.aventuraParadas?.length || 0
                        }
                    }
                });


            } catch (error) {
                logger.error(`${logPrefix} Error al procesar HEARTBEAT:`, error);

                // Intentar enviar respuesta de error
                try {
                    await enviarMensaje({
                        destino: 'padre',
                        tipo: TIPOS_MENSAJE.SISTEMA.ERROR,
                        datos: {
                            error: error.message,
                            contexto: 'SISTEMA.HEARTBEAT',
                            mensajeOriginal: mensaje.tipo
                        }
                    });
                } catch (notifError) {
                    logger.error(`${logPrefix} Error al notificar error de HEARTBEAT:`, notifError);
                }
            }
        });


        // ============================================
        // CONTROLADOR: NAVEGACION.RESPUESTA_DATOS_PARADAS
        // ============================================
        // Propósito: Recibir respuesta con datos de paradas del padre
        // Origen esperado: padre, funciones-mapa
        // Datos requeridos: { paradas: Array, total: number }
        // Respuesta: Ninguna (procesamiento de datos)
        registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.RESPUESTA_DATOS_PARADAS, async (mensaje) => {
            const logPrefix = `[hijo5][NAVEGACION.RESPUESTA_DATOS_PARADAS][${mensaje?.origen || 'desconocido'}]`;
            try {
                const validErr = _validarMensajeParadas(mensaje, logPrefix);
                if (validErr) return;

                const { paradas, estadisticas } = mensaje.datos;
                logger.info(`${logPrefix} Procesando ${paradas.length} paradas del padre`);

                const transformadas = paradas.map(p => _transformarParadaPadre(p, logPrefix)).filter(Boolean);
                const validas = transformadas.filter(p => _esParadaValida(p, logPrefix));

                if (transformadas.length !== validas.length) {
                    logger.warn(`${logPrefix} ${transformadas.length - validas.length} paradas inválidas después de transformación`);
                }

                estado.aventuraParadas = validas;
                logger.info(`${logPrefix} ${validas.length} paradas válidas almacenadas`);
                logger.info('[hijo5] Paradas del padre almacenadas:', validas.slice(0, 3), '...');

                // Solo actualizar la UI si estamos en modo casa (en aventura hijo5 está oculto)
                if (estado.modo !== 'aventura') {
                    activarModoInicial('casa');
                }

                if (estadisticas) {
                    logger.debug(`${logPrefix} Estadísticas: paradas=${estadisticas.paradas || 0}, tramos=${estadisticas.tramos || 0}`);
                }

                logger.info(`${logPrefix} Paradas procesadas y UI actualizada exitosamente`);
                estado.datosRecibidos = true;

                await enviarMensaje({
                    destino: 'padre',
                    tipo: TIPOS_MENSAJE.SISTEMA.CONFIRMACION,
                    idOriginal: mensaje.id,
                    datos: { tipoConfirmacion: 'DATOS_RECIBIDOS', totalParadas: validas.length }
                });

            } catch (error) {
                logger.error(`${logPrefix} Error al procesar respuesta de paradas:`, error);
                try {
                    await enviarMensaje({ destino: 'padre', tipo: TIPOS_MENSAJE.SISTEMA.ERROR, datos: { error: error.message, stack: error.stack, contexto: 'NAVEGACION.RESPUESTA_DATOS_PARADAS', mensajeOriginal: mensaje.tipo } });
                } catch (notifError) {
                    logger.error(`${logPrefix} Error al notificar error al origen:`, notifError);
                }
            }
        });

        // ============================================
        // CONTROLADOR: NAVEGACION.CAMBIO_PARADA (Respuesta)
        // ============================================
        // Propósito: Recibir confirmación de cambio de parada desde el padre
        // Origen esperado: padre, funciones-mapa
        // Datos requeridos: { paradaId: string, exito: boolean }
        // Respuesta: Ninguna (actualización de UI)
        registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.CAMBIO_PARADA, async (mensaje) => {
            const logPrefix = `[hijo5][NAVEGACION.CAMBIO_PARADA][${mensaje?.origen || 'desconocido'}]`;
            try {
                if (!mensaje?.origen) { logger.warn(`${logPrefix} Mensaje sin origen, ignorando`); return; }
                if (mensaje.origen === CONFIG_HIJO.IFRAME_ID) { logger.debug(`${logPrefix} Mensaje propio detectado, ignorando`); return; }
                if (!mensaje.datos || typeof mensaje.datos !== 'object') { logger.warn(`${logPrefix} Mensaje sin datos`); return; }

                const resolved = resolverIdsParada(mensaje.datos || {});
                const paradaId = resolved.paradaId || mensaje.datos?.paradaId || mensaje.datos?.parada_id || null;
                const padreId = resolved.padreId || mensaje.datos?.padreId || mensaje.datos?.padreid || null;
                const { exito } = mensaje.datos;

                if (paradaId) {
                    logger.info(`${logPrefix} Cambio a parada: ${paradaId}${exito === false ? ' (FALLIDO)' : ''}`);
                }
                if (paradaId && exito !== false) _resaltarBotonParada(paradaId, padreId, logPrefix);
                logger.debug(`${logPrefix} Cambio de parada procesado`);
            } catch (error) {
                logger.error(`${logPrefix} Error al procesar cambio de parada:`, error);
            }
        });

        // ============================================
        // CONTROLADOR: SISTEMA.ERROR
        // ============================================
        // Propósito: Recibir notificaciones de errores de otros componentes
        // Origen esperado: padre, cualquier hijo
        // Datos requeridos: { error: string, contexto: string }
        // Respuesta: Ninguna (log del error)
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.ERROR, async (mensaje) => {
            const logPrefix = `[hijo5][SISTEMA.ERROR][${mensaje?.origen || 'desconocido'}]`;

            try {
                // Validación de origen
                if (!mensaje?.origen) {
                    logger.warn(`${logPrefix} Notificación de error sin origen`);
                    return;
                }

                // Validación de datos
                if (!mensaje.datos || typeof mensaje.datos !== 'object') {
                    logger.warn(`${logPrefix} Notificación de error sin datos`);
                    return;
                }

                const { error, contexto, mensajeOriginal } = mensaje.datos;

                logger.error(`${logPrefix} Error recibido del origen:`, {
                    error,
                    contexto: contexto || 'desconocido',
                    mensajeOriginal: mensajeOriginal || 'N/A'
                });


            } catch (error) {
                logger.error(`${logPrefix} Error al procesar notificación de error:`, error);
            }
        });

        // ============================================
        // CONTROLADOR: SISTEMA.CONFIRMACION
        // ============================================
        // Propósito: Confirmar recepción de mensajes enviados
        // Origen esperado: manejador-errores, otros componentes
        // Datos requeridos: { mensajeOriginalId: string }
        // Respuesta: Ninguna (logging)
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.CONFIRMACION, async (mensaje) => {
            const logPrefix = `[hijo5][SISTEMA.CONFIRMACION][${mensaje?.origen || 'desconocido'}]`;

            try {
                logger.debug(`${logPrefix} Confirmación recibida`, {
                    mensajeOriginalId: mensaje.datos?.mensajeOriginalId,
                    timestamp: mensaje.timestamp
                });

                // Aquí se podría implementar lógica adicional si es necesario
                // Por ahora solo logging

            } catch (error) {
                logger.error(`${logPrefix} Error al procesar confirmación:`, error);
            }
        });

        // Controlador para confirmación de cambio de parada
        registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.CAMBIO_PARADA_CONFIRMADO, async (mensaje) => {
            const logPrefix = `[hijo5][CAMBIO_PARADA_CONFIRMADO][${mensaje?.origen || 'desconocido'}]`;

            try {
                // Validación de datos
                if (!mensaje.datos || typeof mensaje.datos !== 'object') {
                    logger.warn(`${logPrefix} Mensaje sin datos válidos`);
                    return;
                }

                const resolved = resolverIdsParada(mensaje.datos || {});
                const paradaId = resolved.paradaId || mensaje.datos?.paradaId || mensaje.datos?.parada_id || mensaje.datos?.padreid || null;
                const audio = mensaje.datos?.audio || null;
                const reto = mensaje.datos?.reto || null;

                logger.info(`${logPrefix} Cambio de parada confirmado: ${paradaId}`);

                // Aquí se podría actualizar UI: resaltar botón, mostrar indicadores de audio/reto disponibles
                // Por ejemplo, agregar clase 'activo' al botón correspondiente
                const botones = document.querySelectorAll('.parada-tramo-btn');
                botones.forEach(btn => {
                    if (btn.dataset.padreid === paradaId) {
                        btn.classList.add('actual');
                    } else {
                        btn.classList.remove('actual');
                    }
                });

                if (audio) {
                    logger.debug(`${logPrefix} Audio disponible para ${paradaId}`);
                }
                if (reto) {
                    logger.debug(`${logPrefix} Reto disponible para ${paradaId}`);
                }

            } catch (error) {
                logger.error(`${logPrefix} Error procesando confirmación:`, error);
            }
        });


        // Instrumentación: confirmar que los controladores GPS fueron registrados
        logger.debug('[hijo5] Controladores GPS registrados y listos para recibir mensajes');

        // Enviar HIJO_PREPARADO y esperar PADRE_DATOS antes de enviar HIJO_LISTO
        try {
            await enviarMensaje({
                destino: 'padre',
                tipo: TIPOS_MENSAJE.SISTEMA.HIJO_PREPARADO,
                datos: {
                    componenteId: CONFIG_HIJO.COMPONENTE_ID,
                    version: '1.0.0',
                    tipo: 'CASA',
                    capacidades: ['modo-selector', 'paradas-list'],
                    timestamp: Date.now()
                }
            });
            logger.debug('[hijo5] HIJO_PREPARADO enviado; esperando PADRE_DATOS');
        } catch (e) {
            logger.warn('[hijo5] Error enviando HIJO_PREPARADO:', e);
        }

        // ============================================
        // INICIALIZACIÓN DE EVENTOS Y DATOS
        // ============================================
        logger.info('[hijo5] Inicializando eventos y solicitando datos del padre...');

        // Vincular evento de click al botón GPS
        const btnGPS = document.getElementById('gps-casa-btn');
        if (btnGPS) {
            btnGPS.onclick = manejarClickGPS;
            logger.debug('[hijo5] Evento click vinculado al botón GPS');
        } else {
            logger.error('[hijo5] Botón GPS no encontrado en el DOM');
        }

        // Marcar como inicializado
        estado.inicializado = true;

        logger.info('[hijo5] Inicialización completada exitosamente', {
            modo: estado.modo,
            paradasCargadas: estado.aventuraParadas?.length || 0,
            idsMapeados: Object.keys(estado.paradasMapeadas).length
        });

    } catch (error) {
        logger.error('[hijo5] Error crítico durante la inicialización:', {
            message: error.message,
            stack: error.stack
        });

        // Intentar notificar al padre del error crítico
            try {
            await enviarMensaje({
                destino: 'padre',
                tipo: TIPOS_MENSAJE.SISTEMA.ERROR,
                datos: {
                    error: error.message,
                    contexto: 'inicializacion-hijo5',
                    critico: true,
                    timestamp: Date.now()
                }
            });
        } catch (notifError) {
            logger.error('[hijo5] Error al notificar error crítico al padre:', notifError);
        }
    }

    // ============================================
    // HANDLER: visibilitychange — reconectar tras cambio de pestaña
    // ============================================
    // Cuando el usuario abre otra pestaña y vuelve, la mensajería puede
    // haberse interrumpido (timeouts expirados, correlaciones perdidas).
    // Al volver, reenviamos un ping al padre y, si teníamos botones,
    // nos aseguramos de que sigan funcionales.
    document.addEventListener('visibilitychange', async () => {
        if (document.hidden) return; // Solo actuar al VOLVER a ser visible

        const logPrefix = '[hijo5][visibilitychange]';
        logger.info(`${logPrefix} Pestaña visible de nuevo, verificando conexión con padre...`);

        try {
            // 1. Resetear flag de datos para permitir recepción fresca si es necesario
            //    (no borramos aventuraParadas para no perder la UI)
            estado.datosRecibidos = false;

            // 2. Enviar ping/heartbeat al padre para verificar conexión
            await enviarMensaje({
                destino: 'padre',
                tipo: TIPOS_MENSAJE.SISTEMA.HEARTBEAT_RESPONSE,
                datos: {
                    timestamp: Date.now(),
                    componenteId: CONFIG_HIJO.COMPONENTE_ID,
                    razon: 'visibilitychange',
                    estado: {
                        inicializado: estado.inicializado,
                        modo: estado.modo,
                        paradasCargadas: estado.aventuraParadas?.length || 0
                    }
                }
            });

            // 3. Si los botones ya estaban generados, resolicitar datos por si cambiaron
            if (estado.aventuraParadas && estado.aventuraParadas.length > 0) {
                logger.debug(`${logPrefix} Botones existentes (${estado.aventuraParadas.length}), regenerando UI`);
                generarBotonesParadas();
            } else {
                // Sin datos previos — pedir paradas al padre nuevamente
                logger.info(`${logPrefix} Sin datos previos, solicitando paradas al padre`);
                await solicitarParadasDelPadre();
            }

            logger.info(`${logPrefix} Reconexión tras cambio de pestaña completada`);
        } catch (err) {
            logger.warn(`${logPrefix} Error durante reconexión:`, err);
        }
    });
    </script>

</head>
<body>
    <div id="zona-boton-casa">
        <button id="gps-casa-btn" class="off">
            <div class="button-content">
                <span class="satellite-emoji">🛰️</span>
                <span class="gps-label">OFF</span>
            </div>
        </button>
        <div id="paradas-window" class="visible">
            <div id="lista-paradas">
                <!-- Los botones de paradas se generan dinámicamente -->
            </div>
        </div>
    </div>
    <div id="estado-carga"></div>
</body>
</html>
