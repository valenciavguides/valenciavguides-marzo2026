    <script type="module">
    // ==================== MENSAJERÍA ====================
    // Este frame habla por el mismo bus que el padre y que todos los demás: un solo camino, con
    // las mismas garantías en los dos sentidos (orden por tipo, acuse, descarte de fuentes no
    // autorizadas). Mandar con `parent.postMessage` a pelo desde aquí se salta todas ellas.
    //
    // Cargar el bus no es opcional aunque este frame solo enviara: `js/utils.js` instala una
    // captura de `error` y `unhandledrejection` que avisa al padre a través de
    // `globalThis.mensajeria`. Sin bus, esos avisos se encolan, se reintentan 10 s y se tiran,
    // y un fallo aquí dentro no se entera nadie (spec 81).
    import * as bus from './js/mensajeria.js';
    // Importado por su efecto: al cargarse instala la captura de `error` y `unhandledrejection`
    // de este frame. El bus ya lo arrastra, pero de ahí no se deduce leyendo este fichero.
    import './js/utils.js';
    import { PLACEHOLDER_RESPUESTA_TEXTO, MSG_RETO_NO_DISPONIBLE } from './js/traducciones-ui.js';

    // Ocultar la interfaz AQUI, antes del primer `await` de este modulo, y no mas abajo.
    //
    // Un modulo con await de nivel superior deja saltar el `load` del iframe mientras espera:
    // si el ocultado va despues del await del bus, la interfaz queda visible todo ese tiempo.
    // MEDIDO al migrar hijo1 al bus: el ocultado paso de ocurrir antes de `load` a ocurrir
    // despues (iphone12). Vale para CUALQUIER hijo que se pase al bus: el ocultado va antes.
    //
    // Se guarda aqui tambien el display original, porque mostrarUI() lo restaura.
    const _displayOriginalBody = (document.body && document.body.style && document.body.style.display) || '';
    if (document.body) document.body.style.display = 'none';

    // El MISMO id con el que el padre registra este iframe (`HIJOS_RECUPERABLES` y los cargadores
    // de codigo-padre.html). Si no coinciden, el padre le escribe a un sitio y este frame se
    // presenta como otro, y ninguno de los dos se entera.
    await bus.inicializarMensajeria({ id: 'hijo4' });

    const { enviarMensaje, enviarMensajeConConfirmacion } = bus;

    // El bus rechaza por sí mismo, y en voz alta, un segundo handler para el mismo tipo, así que
    // sobra la capa de deduplicación que había aquí.
    const registrarControladorSeguro = bus.registrarControlador;

    import { TIPOS_MENSAJE } from './js/constants.js';
    import logger from './js/logger.js';
    // Publica el logger en el globalThis de ESTE iframe. Cada iframe tiene el suyo, y el
    // `globalThis.logger = ...` de codigo-padre.html solo alcanza al del padre: sin esta
    // linea, los `(globalThis.logger || console).x` de este fichero caian al console crudo
    // y se saltaban el nivel de log (ver GUIA-COMPLETA.md §26.3).
    globalThis.logger = logger;

    // NOTA: Bloque IIFE "RESPALDO" para PADRE_PIDE_MANEJADORES eliminado (obsoleto).
    // El sistema actual usa state-manager centralizado sin necesidad de migración manual.

    const CONFIG_HIJO = {
        id: 'hijo4',
        IFRAME_ID: 'hijo4',  // Alias para compatibilidad con enviarMensaje (origen)
        nombre: 'Retos',
        COMPONENTE_ID: 'RETOS',
        DEBUG: true
    };

    // Exportar CONFIG_HIJO para compatibilidad con mensajeria.js
    if (typeof module !== 'undefined' && module.exports) {
        module.exports = CONFIG_HIJO;
    } else {
        globalThis.CONFIG_HIJO = CONFIG_HIJO;
    }

    const estado = {
        retoActualId: null,
        inicializado: false,
        modo: { actual: 'aventura' }
        ,padreIdActual: null
        ,hijoListoEnviado: false  // Flag para evitar envío duplicado de HIJO_LISTO
    };

    // Protección pasiva por parada: no se precarga la aventura completa. El padre
    // envía el reto de cada parada en línea dentro de RETO.MOSTRAR (campo retosArray).
    // Se retienen como máximo los 2 últimos ids distintos recibidos (parada actual + 1
    // anterior); al llegar un tercero se descarta el más antiguo. Ver docs/GUIA-COMPLETA.md §16.
    const RETO_CACHE_MAX = 2;
    globalThis.__vv_retoCache = globalThis.__vv_retoCache || new Map();

    function _guardarRetoEnCache(retoData) {
        if (!retoData || !retoData.id) return;
        const cache = globalThis.__vv_retoCache;
        cache.delete(retoData.id); // reinsertar al final si ya existía (marca como reciente)
        cache.set(retoData.id, retoData);
        while (cache.size > RETO_CACHE_MAX) {
            const masAntiguo = cache.keys().next().value;
            cache.delete(masAntiguo);
        }
    }
    globalThis._guardarRetoEnCache = _guardarRetoEnCache;

    // Función getter: array derivado de la caché acotada (mismo contrato que antes,
    // .find(r => r.id === retoId), para no tocar los call-sites existentes)
    function obtenerRetos() {
        return Array.from(globalThis.__vv_retoCache.values());
    }

    // Exponer función globalmente
    globalThis.obtenerRetos = obtenerRetos;

    /* ═══════════════════════════════════════════════════════════════════════════════
     * ██ BACKUP: Array de retos original - COMENTADO PARA USAR DATOS CENTRALIZADOS
     * ██ Descomentar solo si falla el flujo centralizado y necesitamos fallback
     * ═══════════════════════════════════════════════════════════════════════════════ */

    // Array de retos - NO ELIMINAR NI MODIFICAR SIN REVISIÓN: Este array es esencial para mapear retos/puzzles. Cualquier cambio debe coordinarse con el padre.
    // NOTE: El array backup está deliberadamente comentado para evitar declaraciones duplicadas y errores de parseo si se carga la versión centralizada desde el padre.
    //       Si necesitas reactivar el fallback, descomenta y asegúrate de que su formato coincide con la API esperada y añade pruebas (TODO: añadir test al repositorio). // NOSONAR
    // const retosAventura1Es_BACKUP = [ /* fallback placeholder, commented out */ ]
    /* ═══════════════════════════════════════════════════════════════════════════════ */

    const estadoRetos = {
        retosCompletados: new Set(),
        progreso: { completados: 0, total: obtenerRetos().length },
        estadisticas: {
            tiempoPromedio: 0,
            intentosPromedio: 0,
            aciertosConsecutivos: 0
        }
    };

    // Duración de la animación de fuegos artificiales
    const DURACION_TOTAL_MS = 3000;

    // Variables globales para elementos del DOM
    let retoDiv;
    let btnEnviar;
    let btnMostrarRespuesta;
    let btnSaltarReto;
    let divRespuestaCorrecta;
    let btnNext;
    let fuegosDiv;
    let botonRetos;

    let retoActual = null; // Objeto del reto actual

    // Timer del reset visual de btnEnviar tras una respuesta incorrecta (ver verificar()) —
    // se guarda para poder cancelarlo si llega un reto nuevo o una respuesta nueva antes de
    // que cumpla sus 3s; si no, pisaría en silencio el estado visual del reto siguiente.
    let _timeoutResetBtnEnviar = null;

    // Datos de RETO.COMPLETADO pendientes de enviar al padre — se rellena en cuanto la
    // respuesta es correcta (verificar()) o el puzzle avisa que terminó (listener de
    // 'message' más abajo), pero el envío real se retrasa hasta que el usuario pulsa el
    // botón verde (btnNext/btnPuzzleContinuar). Antes se enviaba en el mismo instante en
    // que la respuesta se verificaba correcta — el padre marcaba pending.reto=true (y podía
    // completar la parada/disparar su cartel de transición) mientras la ventana del reto
    // seguía abierta en pantalla, antes de que el usuario hubiera confirmado nada pulsando
    // el botón. Pulsar el botón verde es la señal real de "he terminado de verdad este
    // reto", así que es ahí donde debe dispararse el mensaje al padre, no antes.
    let _pendienteCompletado = null;


    /**
     * Función: ocultarControles()
     * Oculta todos los controles interactivos del reto (botones y campos de entrada).
     * Se usa al cambiar de modo, finalizar un reto, o reiniciar el estado.
     */
    function ocultarControles() {
        try {
            // Ocultar botón Enviar si existe
            if (btnEnviar) {
                btnEnviar.style.display = 'none';
                btnEnviar.disabled = true;
            }

            // Deshabilitar botón Mostrar Respuesta
            if (btnMostrarRespuesta) {
                btnMostrarRespuesta.disabled = true;
            }

            // Ocultar div de respuesta correcta
            if (divRespuestaCorrecta) {
                divRespuestaCorrecta.style.display = 'none';
            }

            // Limpiar fuegos artificiales si están activos
            if (fuegosDiv) {
                fuegosDiv.innerHTML = '';
                fuegosDiv.style.display = 'none';
            }

            // Ocultar botón continuar puzzle
            const btnPzCont = document.getElementById('btn-puzzle-continuar');
            if (btnPzCont) btnPzCont.style.display = 'none';

            logger.debug('[hijo4][ocultarControles] Controles ocultados correctamente');
        } catch (error) {
            logger.warn('[hijo4][ocultarControles] Error ocultando controles:', error);
        }
    }

    /* Función: fuegosArtificiales()
       Muestra una animación de fuegos artificiales en la pantalla.
    */
    function fuegosArtificiales() {
        if (!fuegosDiv) {
            return;
        }
        fuegosDiv.innerHTML = ""; // Limpiar fuegos anteriores
        fuegosDiv.style.display = "block"; // Mostrar el contenedor de fuegos

        const NUM_CHISPAS_POR_FUEGO = 30;
        const NUM_EXPLOSIONES = 15;

        for (let e = 0; e < NUM_EXPLOSIONES; e++) {
            const delayExplosion = (DURACION_TOTAL_MS / NUM_EXPLOSIONES) * e;

            setTimeout(() => {
                const containerWidth = fuegosDiv.offsetWidth || globalThis.innerWidth;
                const containerHeight = fuegosDiv.offsetHeight || globalThis.innerHeight;

                const startX = Math.random() * containerWidth;
                const startY = Math.random() * containerHeight;

                for (let i = 0; i < NUM_CHISPAS_POR_FUEGO; i++) {
                    let chispa = document.createElement("div");
                    chispa.style.position = "absolute";
                    chispa.style.borderRadius = "50%";
                    chispa.style.width = "12px";
                    chispa.style.height = "12px";
                    chispa.style.background = `hsl(${Math.random() * 360}, 100%, 70%)`;
                    chispa.style.opacity = "1";
                    chispa.style.left = `${startX}px`;
                    chispa.style.top = `${startY}px`;
                    chispa.style.zIndex = "10";

                    fuegosDiv.appendChild(chispa);

                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 80 + 40;
                    const endX = startX + distance * Math.cos(angle);
                    const endY = startY + distance * Math.sin(angle);

                    const chispaDuration = DURACION_TOTAL_MS / NUM_EXPLOSIONES * 1.5;

                    chispa.getBoundingClientRect(); // Forzar reflow para asegurar que la transición se aplique
                    chispa.style.transition = `all ${chispaDuration}ms ease-out`;
                    chispa.style.left = `${endX}px`;
                    chispa.style.top = `${endY}px`;
                    chispa.style.opacity = "0";
                    chispa.style.transform = "scale(0.5)";

                    setTimeout(() => {
                        if (chispa.parentNode) {
                            chispa.remove();
                        }
                    }, chispaDuration + 50);
                }
            }, delayExplosion);
        }
        setTimeout(() => {
            fuegosDiv.style.display = "none";
        }, DURACION_TOTAL_MS + 100);
    }

    /* Función: vibrar()
       Activa una vibración corta en dispositivos compatibles.

        if (navigator.vibrate) navigator.vibrate(300);
    }

    // Asegura que el script se ejecute una vez que el DOM esté completamente cargado.

        if (botonRetos) {

        // Verificar que todos los elementos necesarios se encontraron
        if (!retoDiv || !btnMostrarRespuesta || !btnSaltarReto || !divRespuestaCorrecta || !btnNext || !fuegosDiv) {
            logger.error("ERROR CRÍTICO: No se pudieron encontrar todos los elementos del DOM necesarios. Asegúrate de que los IDs sean correctos en el HTML.");

        }

        /* Función: mostrarReto(retoId)
           Carga y muestra el reto especificado por ID.
        */
        async function mostrarReto(retoId) {
            logger.debug(`[hijo4] mostrarReto llamado con retoId: ${retoId}`);
            // Buscar el reto usando función centralizada
            const retosArray = obtenerRetos();
            logger.info(`[hijo4][DEBUG] mostrarReto("${retoId}") — retosArray.length=${retosArray.length}, IDs disponibles:`, retosArray.map(r => r.id));
            const reto = retosArray.find(r => r.id === retoId);
            if (!reto) {
                logger.warn(`[hijo4] Reto ${retoId} no está en caché local — solicitando al padre`);
                // No dejar en pantalla el contenido del reto anterior como si siguiera
                // activo: se limpia y se avisa, aunque la petición de abajo pueda
                // resolverse enseguida con un RETO.MOSTRAR de reintento (en ese caso, la
                // siguiente llamada a mostrarReto() ya encuentra el reto y lo sustituye).
                retoActual = null;
                // Mismo reseteo que hace el camino normal (línea ~930) al mostrar un reto
                // nuevo — sin esto, un btnNext dejado verde/habilitado por el reto anterior
                // (respuesta correcta dada pero botón verde aún sin pulsar) seguiría
                // pulsable y reenviaría la compleción de ESE reto, no de este roto.
                _pendienteCompletado = null;
                if (btnNext) { btnNext.disabled = true; btnNext.style.backgroundColor = "#ED2100"; }
                ocultarControles();
                retoDiv.innerHTML = "";
                const avisoNoDisponible = document.createElement("p");
                avisoNoDisponible.textContent = MSG_RETO_NO_DISPONIBLE[globalThis.__vv_idiomaActual] || MSG_RETO_NO_DISPONIBLE.es;
                retoDiv.appendChild(avisoNoDisponible);
                // A diferencia del resto de controles, el botón de saltar debe seguir
                // habilitado precisamente aquí: es el único rescate real cuando el reto
                // no carga por un fallo nuestro, no por falta de intento del usuario.
                if (btnSaltarReto) btnSaltarReto.disabled = false;
                try {
                    await enviarMensaje({
                        tipo: TIPOS_MENSAJE.DATOS.SOLICITAR_RETOS,
                        destino: 'padre',
                        datos: { retoId, motivo: 'cache_miss', timestamp: Date.now() }
                    });
                } catch (err) {
                    logger.error('[hijo4] Error solicitando reto faltante al padre:', err);
                }
                return;
            }
            logger.debug(`[hijo4] Reto encontrado:`, reto);

            // ✅ CRÍTICO: Asignar retoActual para que verificar() funcione
            retoActual = reto;
            estado.retoActualId = retoId;

            // Ocultar todos los botones y mensajes al inicio de un nuevo reto
            ocultarControles();
            const _bRWrapper = document.getElementById('botonRetos-wrapper');
            if (_bRWrapper) _bRWrapper.style.display = 'none';

            // Un reto nuevo puede llegar mientras el timer de "respuesta incorrecta" del
            // reto anterior seguía pendiente (p. ej. avance por GPS antes de los 3s) — sin
            // cancelarlo aquí, dispararía más tarde y pisaría en silencio el estado visual
            // de btnEnviar de este reto nuevo.
            if (_timeoutResetBtnEnviar) { clearTimeout(_timeoutResetBtnEnviar); _timeoutResetBtnEnviar = null; }
            // Igual con una compleción pendiente sin confirmar del reto anterior (el
            // usuario nunca pulsó el botón verde y llegó otro reto por otra vía) — no debe
            // colarse como si perteneciera a este reto nuevo.
            _pendienteCompletado = null;

            // Los botones están siempre visibles, pero btnNext está deshabilitado hasta respuesta correcta
            if (btnNext) { btnNext.disabled = true; btnNext.style.backgroundColor = "#ED2100"; }
            if (btnMostrarRespuesta) btnMostrarRespuesta.disabled = false;
            if (btnSaltarReto) btnSaltarReto.disabled = false;
            if (btnEnviar) { btnEnviar.textContent = "🫵"; btnEnviar.style.backgroundColor = "#0077cc"; }

            retoDiv.classList.remove("correct", "incorrect");
            fuegosDiv.innerHTML = "";
            fuegosDiv.style.display = "none";

            retoDiv.innerHTML = ""; // Limpiar contenido anterior del reto
            retoDiv.setAttribute("tabindex", "0");
            retoDiv.classList.remove('puzzle-active'); // Remover la clase puzzle-active
            // El puzzle del reto anterior se fue con el HTML de #reto: darlo de baja aquí evita
            // que el bus guarde un registro apuntando a un elemento que ya no existe. Este es el
            // punto par de donde se crea (la rama `reto.tipo === "puzzle"`, que es la única que
            // añade `puzzle-mode`), no cada sitio que vacía #reto.
            globalThis.mensajeria.desregistrarIframe('puzzle');
            document.body.classList.remove('puzzle-mode');
            if (btnMostrarRespuesta) btnMostrarRespuesta.style.display = '';

            if (reto.tipo !== 'puzzle') {
                let preguntaElem = document.createElement("h3");
                preguntaElem.textContent = `${reto.pregunta}`;
                retoDiv.appendChild(preguntaElem);
            }

            if (reto.tipo === "opcion" || reto.tipo === "opcion-multiple") {
                const inputType = reto.multiple ? "checkbox" : "radio";
                reto.opciones.forEach((opcion, i) => {
                    const divOpcion = document.createElement("div");
                    divOpcion.className = "respuesta";
                    const input = document.createElement("input");
                    input.type = inputType;
                    input.name = "op";
                    input.value = opcion;
                    input.id = "opcion" + i;
                    divOpcion.appendChild(input);

                    const label = document.createElement("label");
                    label.htmlFor = input.id;
                    label.textContent = opcion;
                    divOpcion.appendChild(label);
                    retoDiv.appendChild(divOpcion);
                });
                // Insertar btnEnviar en el button-container para mantener estilos consistentes
                const buttonContainer = document.getElementById('button-container');
                if (buttonContainer && !buttonContainer.contains(btnEnviar)) {
                    buttonContainer.insertBefore(btnEnviar, buttonContainer.firstChild);
                }
                btnEnviar.style.display = "inline-block"; // Mostrar el botón Enviar
                btnEnviar.disabled = false;


            }
            else if (reto.tipo === "texto") {
                const inputTexto = document.createElement("input");
                inputTexto.type = "text";
                inputTexto.id = "respuestaTexto";
                inputTexto.autocomplete = "off";
                inputTexto.spellcheck = false;
                inputTexto.setAttribute("inputmode", "text");
                inputTexto.style.fontSize = "1.2em";
                inputTexto.style.width = "100%";
                inputTexto.placeholder = PLACEHOLDER_RESPUESTA_TEXTO[globalThis.__vv_idiomaActual] || PLACEHOLDER_RESPUESTA_TEXTO.es;
                retoDiv.appendChild(inputTexto);
                // Insertar btnEnviar en el button-container para mantener estilos consistentes
                const buttonContainer = document.getElementById('button-container');
                if (buttonContainer && !buttonContainer.contains(btnEnviar)) {
                    buttonContainer.insertBefore(btnEnviar, buttonContainer.firstChild);
                }
                btnEnviar.style.display = "inline-block"; // Mostrar el botón Enviar
                btnEnviar.disabled = false;
                setTimeout(() => inputTexto.focus(), 200);
            }
            else if (reto.tipo === "puzzle") {
                retoDiv.classList.add('puzzle-active');
                document.body.classList.add('puzzle-mode');
                const puzzleIframe = document.createElement("iframe");
                puzzleIframe.id = "puzzleIframe";
                // La imagen viaja dentro del reto (el padre la anade al resolverlo), asi
                // que puzzle.html ya no necesita importar puzzles-aventuras.js.
                // Registrar ANTES del `src`: el bus solo acepta mensajes de un iframe que este
                // frame haya registrado, y el puzzle avisa en cuanto el usuario termina.
                globalThis.mensajeria.registrarIframe('puzzle', puzzleIframe);
                puzzleIframe.src = reto.imagenPuzzle
                    ? `${reto.src}${reto.src.includes('?') ? '&' : '?'}imagen=${encodeURIComponent(reto.imagenPuzzle)}`
                    : reto.src;
                puzzleIframe.frameBorder = "0";
                puzzleIframe.allowFullscreen = true;
                retoDiv.appendChild(puzzleIframe);

                // Ocultar botones de la página principal para puzzles
                ocultarControles();
                if (btnMostrarRespuesta) btnMostrarRespuesta.style.display = 'none';
            }
        }

        /* Función: _marcarRetoComoCompletado(retoId)
           Deja el reto como aprobado: fuegos artificiales, btnEnviar a 👍, habilita
           btnNext (verde) y guarda _pendienteCompletado para el envío real al pulsar el
           botón verde. Compartida entre una respuesta correcta real (verificar()) y el
           botón de saltar — recibe solo el id, no el objeto reto completo, porque en el
           caso de saltar un reto roto/no encontrado no existe tal objeto (retoActual es
           null; el id fiable en ese caso es estado.retoActualId, ver mostrarReto()).
        */
        function _marcarRetoComoCompletado(retoId) {
            retoDiv.classList.add("correct");
            retoDiv.classList.remove("incorrect");
            fuegosArtificiales(); // Llama a la animación

            // Cambiar btnEnviar a 👍 verde
            ocultarControles();
            if (btnEnviar) {
                btnEnviar.textContent = "👍";
                btnEnviar.style.backgroundColor = "#00FF00";
                btnEnviar.style.display = "inline-block";
                btnEnviar.disabled = true;
            }
            // Ya no hace falta seguir ofreciendo saltar un reto que ya está aprobado.
            if (btnSaltarReto) btnSaltarReto.disabled = true;

            // Habilitar btnNext y ponerlo verde: el padre es quien decide si hay más
            // retos en la parada (estado.retoActual.cola, codigo-padre.html) y empuja
            // el siguiente automáticamente vía RETO.MOSTRAR sin que el usuario tenga
            // que pulsar nada — retosArray que recibe hijo4 siempre trae un único
            // reto (ver _enviarRetoMostrar/_procesarResultadoReto), así que calcular
            // "hayMasRetos" localmente aquí siempre daba false y dejaba btnNext
            // deshabilitado también en el último reto — el único botón que cierra la
            // ventana flotante, dejándola atascada. btnNext siempre significa "cerrar":
            // se habilita en cuanto la respuesta es correcta, sin condición.
            if (btnNext) {
                btnNext.disabled = false;
                btnNext.style.backgroundColor = "#00FF00";
            }

            // Enviar mensaje al padre indicando que el reto se completó
            // Actualizar estado de progreso
            estadoRetos.retosCompletados.add(retoId);
            estadoRetos.progreso.completados = estadoRetos.retosCompletados.size;
            estadoRetos.estadisticas.aciertosConsecutivos++;

            logger.info(`[hijo4] Reto completado: ${retoId}. Progreso: ${estadoRetos.progreso.completados}/${estadoRetos.progreso.total}`);
            logger.info(`[FLUJO-RETO] [HIJO4] Reto completado localmente: ${retoId}. Pendiente de confirmación con el botón verde.`);

            // El envío real a RETO.COMPLETADO ocurre al pulsar btnNext (más abajo) — no
            // aquí. Guardamos los datos para ese momento.
            _pendienteCompletado = {
                retoId,
                correcto: true,
                progreso: estadoRetos.progreso
            };
        }

        /* Función: verificar()
           Comprueba si la respuesta del usuario para el reto actual es correcta.
        */
        async function verificar() {
            const reto = retoActual;
            if (!reto) return;

            btnEnviar.disabled = true; // Desactivar el botón Enviar
            divRespuestaCorrecta.style.display = "none";
            divRespuestaCorrecta.textContent = "";
            retoDiv.classList.remove("correct", "incorrect");
            fuegosDiv.innerHTML = "";
            fuegosDiv.style.display = "none";

            let esCorrecto = false;

            // Ejecutar validación personalizada primero
            let respuestaUsuario = null;
            try {
                // Obtener la respuesta del usuario según el tipo de reto
                if (reto.tipo === "opcion") {
                    const seleccion = document.querySelector('input[name="op"]:checked');
                    respuestaUsuario = seleccion ? seleccion.value : null;
                } else if (reto.tipo === "opcion-multiple") {
                    respuestaUsuario = Array.from(document.querySelectorAll('input[name="op"]:checked')).map(i => i.value);
                } else if (reto.tipo === "texto") {
                    // Para retos de texto, la respuesta se obtiene del input correspondiente
                    const inputTexto = document.querySelector('input[type="text"], textarea');
                    respuestaUsuario = inputTexto ? inputTexto.value : null;
                }

                // Llamar a la validación personalizada (soporta async)
                let validacionPersonalizada = true;
                if (typeof globalThis.ejecutarValidacion === 'function') {
                    validacionPersonalizada = await globalThis.ejecutarValidacion(reto, respuestaUsuario);
                }
                if (validacionPersonalizada === false) {
                    logger.warn(`[hijo4] Validación personalizada falló para reto ${reto?.id || 'desconocido'}`);
                    throw new Error("Validación personalizada falló");
                }
            } catch (error) {
                logger.error(`[hijo4] Error en globalThis.ejecutarValidacion para reto ${reto?.id || 'desconocido'}:`, error.message);
                // Si la validación personalizada falla, mostrar error y permitir reintentar
                alert("Error en la validación: " + error.message);
                btnEnviar.disabled = false;
                return;
            }

            if (reto.tipo === "opcion") {
                const seleccion = document.querySelector('input[name="op"]:checked');
                if (!seleccion) {
                    alert("Por favor, seleccione una opción.");
                    btnEnviar.disabled = false;
                    return;
                }
                esCorrecto = reto.correctas.includes(seleccion.value);
            } else if (reto.tipo === "opcion-multiple") {
                const checks = Array.from(document.querySelectorAll('input[name="op"]:checked')).map(i => i.value);
                if (checks.length === 0) {
                    alert("Por favor, seleccione al menos una opción.");
                    btnEnviar.disabled = false;
                    return;
                }
                esCorrecto = reto.correctas.every(c => checks.includes(c)) && checks.every(s => reto.correctas.includes(s));
            } else if (reto.tipo === "texto") {
                // Se establece como correcto por defecto para retos de texto libre.
                esCorrecto = true;
            }

            if (esCorrecto) {
                _marcarRetoComoCompletado(reto.id);
            } else {
                retoDiv.classList.add("incorrect");
                vibrar();
                btnEnviar.textContent = "👎";
                btnEnviar.style.backgroundColor = "#ED2100";
                btnEnviar.disabled = true;
                if (_timeoutResetBtnEnviar) clearTimeout(_timeoutResetBtnEnviar);
                _timeoutResetBtnEnviar = setTimeout(() => {
                    btnEnviar.textContent = "🫵";
                    btnEnviar.style.backgroundColor = "#0077cc";
                    btnEnviar.disabled = false;
                    _timeoutResetBtnEnviar = null;
                }, 3000);
            }
        }

        /* Event Listener: btnSaltarReto
           Da el reto por aprobado sin responder — rescate visible y decidido por el
           usuario para cuando no ve/no quiere hacer el reto, cumpliendo igualmente la
           regla de coordenadas+audio+reto. Si el reto sigue cargado, pinta la respuesta
           correcta en el propio selector antes de aprobar (bonus); si está roto/no
           encontrado (retoActual es null, ver mostrarReto()), usa estado.retoActualId
           — el único id fiable en ese caso.
        */
        btnSaltarReto.addEventListener("click", () => {
            if (!estado.retoActualId) return; // nada activo que saltar
            const retoParaSaltar = retoActual;
            if (retoParaSaltar) {
                if (retoParaSaltar.tipo === "opcion" || retoParaSaltar.tipo === "opcion-multiple") {
                    document.querySelectorAll('input[name="op"]').forEach(input => {
                        input.checked = (retoParaSaltar.correctas || []).includes(input.value);
                    });
                } else if (retoParaSaltar.tipo === "texto") {
                    const inputTexto = document.getElementById("respuestaTexto");
                    if (inputTexto) inputTexto.value = (retoParaSaltar.correctas || [])[0] || '';
                }
            }
            _marcarRetoComoCompletado(estado.retoActualId);
        });

        /* Event Listener: btnMostrarRespuesta
           Muestra la respuesta correcta del reto actual.
        */
        btnMostrarRespuesta.addEventListener("click", () => {
            if (divRespuestaCorrecta.style.display === 'block') {
                divRespuestaCorrecta.style.display = 'none';
                return;
            }
            const reto = retoActual;
            if (!reto) return;
            if (reto.tipo === "opcion" || reto.tipo === "opcion-multiple" || reto.tipo === "texto") {
                divRespuestaCorrecta.textContent = "Respuesta correcta: " + (reto.correctas || []).join(", ");
            } else {
                divRespuestaCorrecta.textContent = "No hay respuesta correcta disponible para este tipo de reto.";
            }
            divRespuestaCorrecta.style.display = "block";
        });

        /* Event Listener: btnNext
           Envía mensaje al padre para cerrar la ventana del reto.
        */
        if (btnNext) {
            btnNext.addEventListener("click", async () => {
            // Si hay una compleción pendiente (respuesta ya verificada correcta, ver
            // verificar()), es AHORA cuando se confirma al padre — no antes.
            if (_pendienteCompletado) {
                const datosCompletado = _pendienteCompletado;
                _pendienteCompletado = null;
                try {
                    // Sin rama alternativa: `enviarMensajeConConfirmacion` viene del bus y es
                    // siempre una función. El `else` que había aquí mandaba lo mismo sin acuse
                    // "por si no estaba disponible" — un segundo camino que no podía tomarse
                    // nunca, y que en el log se parecía demasiado al bueno.
                    await enviarMensajeConConfirmacion({
                        tipo: TIPOS_MENSAJE.RETO.COMPLETADO,
                        destino: 'padre',
                        datos: datosCompletado
                    });
                    logger.info(`[FLUJO-RETO] [HIJO4] ✅ Confirmación recibida del padre para reto ${datosCompletado.retoId}`);
                } catch (e) {
                    logger.error(`[FLUJO-RETO] [HIJO4] ❌ Error enviando/confirmando reto completado:`, e);
                    // No bloqueamos el cierre de la ventana, el usuario ya ganó visualmente
                }
            }
            // Enviar mensaje al padre para cerrar la ventana
            enviarMensaje({
                tipo: TIPOS_MENSAJE.RETO.OCULTAR,
                destino: 'padre',
                datos: {
                    retoId: retoActual ? retoActual.id : null
                }
            });
            });
        }

        /* Event Listener: btnEnviar
           Activa la verificación de la respuesta del usuario.
        */
        if (btnEnviar) {
            btnEnviar.addEventListener("click", verificar);
        }

        // Botón continuar puzzle (dentro del iframe, solo en puzzle-mode)
        const btnPuzzleContinuar = document.getElementById('btn-puzzle-continuar');
        if (btnPuzzleContinuar) {
            btnPuzzleContinuar.addEventListener("click", async () => {
                // Misma lógica que btnNext: la compleción pendiente (puzzle terminado o
                // expirado, ver el listener de 'message' más abajo) se confirma al padre
                // AHORA, al pulsar el botón verde — no cuando el puzzle avisó que terminó.
                if (_pendienteCompletado) {
                    const datosCompletado = _pendienteCompletado;
                    _pendienteCompletado = null;
                    try {
                        await enviarMensaje({
                            tipo: TIPOS_MENSAJE.RETO.COMPLETADO,
                            destino: 'padre',
                            datos: datosCompletado
                        });
                    } catch (e) {
                        logger.error(`[FLUJO-RETO] [HIJO4] ❌ Error enviando reto completado (puzzle):`, e);
                    }
                }
                enviarMensaje({
                    tipo: TIPOS_MENSAJE.RETO.OCULTAR,
                    destino: 'padre',
                    datos: { retoId: retoActual ? retoActual.id : null }
                });
            });
        }

        /* Event Listener: globalThis.message
           Escucha mensajes provenientes del iframe del puzzle para coordinar el avance.
        */
        /*
         * El puzzle avisa por el bus, como todo lo demás.
         *
         * Aquí había una escucha cruda que filtraba a mano por `event.source`. Eso ya lo hace
         * el bus: solo acepta mensajes de un iframe que este frame haya registrado, y el puzzle
         * se registra al crearlo y se da de baja al salir de `puzzle-mode`.
         *
         * Y aceptaba además un formato antiguo —el mensaje como cadena pelada, sin objeto—.
         * Ese formato no lo enviaba NADIE en ningún fichero del proyecto; lo que sí hacía era
         * dar por completado el puzzle ante una cadena suelta de cualquier frame del dominio.
         *
         * En los dos casos, acertar y agotar el tiempo, el reto queda PENDIENTE: el envío real
         * de RETO.COMPLETADO ocurre al pulsar el botón verde, igual que en verificar(). La
         * ventana del puzzle sigue en pantalla en este instante y el usuario no ha confirmado
         * nada todavía.
         */
        function _cerrarPuzzleConResultado(acertado) {
            retoDiv.classList.toggle("correct", acertado);
            retoDiv.classList.toggle("incorrect", !acertado);
            if (acertado) fuegosArtificiales(); else vibrar();
            // `correcto`, igual que los retos de opcion, de varias respuestas, de texto libre y el
            // boton de saltar: es el campo que lee el padre para dar la parada por completada
            // (`_hdl_RETO_COMPLETADO`). Con otro nombre la parada no se completaba nunca y, como en
            // modo puzzle no se ve "saltar reto", el usuario se quedaba atascado sin salida.
            // El tiempo agotado cuenta como reto cumplido, igual que resolverlo. Lo fija el spec 91.
            _pendienteCompletado = { retoId: retoActual.id, correcto: true };
            const btnPuzzleContinuar = document.getElementById('btn-puzzle-continuar');
            if (btnPuzzleContinuar) btnPuzzleContinuar.style.display = 'flex';
            return { retoId: retoActual.id, acertado };
        }

        registrarControladorSeguro(TIPOS_MENSAJE.PUZZLE.COMPLETADO, async () => _cerrarPuzzleConResultado(true));
        registrarControladorSeguro(TIPOS_MENSAJE.PUZZLE.TIMEOUT, async () => _cerrarPuzzleConResultado(false));

        /* Función: normalizarModo(modo)
           Acepta string u objeto y devuelve una cadena segura para usos en clases/dataset
        */
        function normalizarModo(modo) {
            try {
                if (typeof modo === 'string') {
                    modo = modo.trim();
                } else if (modo && typeof modo === 'object') {
                    modo = modo.actual || modo.modo || modo.nombre || Object.values(modo).find(v => typeof v === 'string') || '';
                } else if (modo === null || modo === undefined) {
                    modo = '';
                } else {
                    modo = String(modo);
                }
                modo = String(modo || '').trim().toLowerCase();
                modo = modo.replace(/[^a-z0-9_-]/g, '-').replace(/^-+|-+$/g, '');
                return modo;
            } catch (_e) { // NOSONAR
                return '';
            }
        }

        /* Función: sincronizarEstadoModo(modo)
           Reacción local a un modo recibido del padre (nunca difunde nada) — sincroniza
           estado.modo.actual (consumido por RETO.LIMPIAR_ESTADO para decidir si reaparece
           botonRetos-wrapper) y la clase CSS del body (sin consumidor real hoy).
        */
        function sincronizarEstadoModo(modo) {
            const modoSeguro = normalizarModo(modo);
            logger.info(`[RETOS] Actualizando interfaz para modo:`, { original: modo, normalizado: modoSeguro });
            const body = document.body;

            // Actualizar estado local
            estado.modo = estado.modo || {};
            estado.modo.actual = modoSeguro || modo;

            // Actualizar clases CSS
            body.classList.remove('modo-casa', 'modo-aventura');
            if (modoSeguro) body.classList.add(`modo-${modoSeguro}`);

            // Si hay un reto abierto, actualizar su visualización
            if (estado.retoActualId) {
                logger.info(`[RETOS] Se está mostrando el reto ${estado.retoActualId} en modo ${modoSeguro || modo}`);
            }
        }

        // Inicializar mensajería y controladores
        try {
            // Ocultar la UI hasta que el padre confirme que los controladores están listos
            let _uiConfirmado = false;
            // Ya oculto al principio del modulo, antes de los awaits: ver alli el porque.
            function mostrarUI() {
                if (!_uiConfirmado) { return; }
                try { if (document.body) { document.body.style.display = _displayOriginalBody || 'flex'; logger.info(`[hijo4] UI visible tras PADRE_CONFIRMA_HIJO_LISTO — body.display=${document.body.style.display}`); } } catch (_e) {} // NOSONAR
            }

            // Sistema de reintentos activos para HIJO_LISTO (solución permanente C2)
            let _reintentosHijoListo = 0;
            const MAX_REINTENTOS_HIJO_LISTO = 30; // 30 segundos máximo
            const INTERVALO_REINTENTO = 1000; // 1 segundo
            let _intervaloReintento = null;

            // No necesitamos inicializarMensajeria aquí, los fallbacks esperan automáticamente

            // NOTA: HIJO_PREPARADO se envía MÁS ABAJO, DESPUÉS de registrar todos los controladores críticos.
            // Esto garantiza que el padre no envíe PADRE_DATOS antes de que los controladores estén listos.
            logger.debug('[hijo4] HIJO_PREPARADO aplazado hasta post-inicialización de controladores');

            logger.info(`Hijo ${CONFIG_HIJO.IFRAME_ID} registrado el controlador PADRE_DATOS`);
            // Controlador para inicialización del padre
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.PADRE_DATOS, async (mensaje) => {
                logger.info(`[hijo4] PADRE_DATOS recibido desde ${mensaje.origen}`);
                logger.info(`Hijo ${CONFIG_HIJO.IFRAME_ID} recibió PADRE_DATOS`);

                // ✅ PROCESAR DATOS INICIALES DEL PADRE
                if (mensaje.datos) {
                    const { modo, paradas, paradaActual } = mensaje.datos;

                    if (modo) {
                        logger.info(`[hijo4] Procesando modo inicial del padre: ${modo}`);
                        sincronizarEstadoModo(modo);
                    }

                    if (paradas) {
                        logger.debug(`[hijo4] Paradas recibidas: ${paradas.length}`);
                    }

                    if (paradaActual) {
                        logger.debug(`[hijo4] Parada actual: ${paradaActual}`);
                    }
                }

                // Enviar HIJO_LISTO para completar handshake con sistema de reintentos
                if (!estado.hijoListoEnviado) {
                    async function enviarHijoListoConReintento() {
                        try {
                            await enviarMensaje({
                                destino: 'padre',
                                tipo: TIPOS_MENSAJE.SISTEMA.HIJO_LISTO,
                                datos: {
                                    componenteId: CONFIG_HIJO.COMPONENTE_ID,
                                    iframeId: CONFIG_HIJO.IFRAME_ID,
                                    timestamp: Date.now()
                                }
                            });
                            logger.info(`[hijo4] HIJO_LISTO enviado al padre (intento ${_reintentosHijoListo + 1}/${MAX_REINTENTOS_HIJO_LISTO})`);
                        } catch (error) {
                            logger.error('[hijo4] Error enviando HIJO_LISTO:', error);
                        } finally {
                            // En finally, no en el try: un fallo puntual de enviarMensaje() no debe
                            // matar el resto de la secuencia de reintentos (bug real encontrado en
                            // auditoría 2026-08-18 — antes, una excepción aquí paraba el bucle para
                            // siempre en silencio, sin programar el siguiente intento).
                            _reintentosHijoListo++;
                            if (_reintentosHijoListo < MAX_REINTENTOS_HIJO_LISTO) {
                                _intervaloReintento = setTimeout(enviarHijoListoConReintento, INTERVALO_REINTENTO);
                            } else {
                                // Fallback: mostrar UI después de 30 segundos sin confirmación
                                logger.warn('[hijo4] Máximo de reintentos alcanzado, mostrando UI como fallback');
                                _uiConfirmado = true;
                                mostrarUI();
                            }
                        }
                    }
                    estado.hijoListoEnviado = true;
                    enviarHijoListoConReintento();
                }
            });

            // Controlador para confirmación del padre
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.PADRE_CONFIRMA_HIJO_LISTO, async (mensaje) => {
                logger.info('[hijo4] PADRE_CONFIRMA_HIJO_LISTO recibido:', mensaje);
                logger.info(`[hijo4] PADRE_CONFIRMA_HIJO_LISTO recibido desde ${mensaje.origen}`);

                // Limpiar intervalo de reintento si existe
                if (_intervaloReintento) {
                    clearTimeout(_intervaloReintento);
                    _intervaloReintento = null;
                    logger.info(`[hijo4] Intervalo de reintento limpiado tras recibir PADRE_CONFIRMA_HIJO_LISTO`);
                }

                // El modo llega por `modoInicial` al conectarse y por CAMBIO_MODO después; aquí no se aparca nada (un solo camino, decisión 11 de docs/mensajeria-duplicada-en-hijos.md).

                // 🔥 NUEVO: Procesar modo inicial si viene en datos
                const { modoInicial } = mensaje.datos || {};
                if (modoInicial) {
                    logger.info(`[hijo4] Modo inicial recibido: ${modoInicial}`);
                    sincronizarEstadoModo(modoInicial);
                    logger.debug(`[hijo4] Interfaz actualizada según modo inicial`);
                }

                // Mostrar UI ahora que el padre confirmó
                try { _uiConfirmado = true; mostrarUI(); } catch (_e) { /* ignore */ } // NOSONAR
                try { await enviarMensaje({ destino: 'padre', tipo: TIPOS_MENSAJE.SISTEMA.CONFIRMACION, datos: { tipo: 'UI_VISIBLE', timestamp: Date.now() } }); } catch (_e) { /* ignore */ } // NOSONAR

            });

            // Controlador para mostrar reto específico
            registrarControladorSeguro(TIPOS_MENSAJE.RETO.MOSTRAR, async (mensaje) => {
                try {
                    if (!mensaje?.datos) {
                        logger.warn('[hijo4] RETO.MOSTRAR recibido sin datos, ignorando');
                        return;
                    }
                    const { retoId, retosArray } = mensaje.datos;
                    logger.info(`[hijo4][DEBUG] RETO.MOSTRAR handler — retoId="${retoId}", retosArray recibido=${retosArray?.length || 0}, caché local=${globalThis.__vv_retoCache?.size || 0}`);
                    logger.info(`[hijo4] RETO.MOSTRAR recibido para reto: ${retoId}`);

                    // FIX: Forzar body visible al recibir RETO.MOSTRAR
                    // Si PADRE_CONFIRMA_HIJO_LISTO no llego, body puede estar display:none
                    try {
                        document.body.style.display = _displayOriginalBody || 'flex';
                        document.body.style.visibility = 'visible';
                        document.body.style.opacity = '1';
                    } catch(_e) { /* ignore */ } // NOSONAR

                    // Protección pasiva por parada: el padre envía el reto en línea; se añade
                    // a la caché acotada (no se sobrescribe todo el histórico como antes).
                    if (retosArray && Array.isArray(retosArray) && retosArray.length > 0) {
                        retosArray.forEach(r => globalThis._guardarRetoEnCache(r));
                        logger.info(`[hijo4] ✅ ${retosArray.length} reto(s) añadidos a la caché`);
                    } else {
                        logger.warn(`[hijo4] RETO.MOSTRAR sin retosArray para ${retoId} — se intentará resolver desde caché local`);
                    }

                    // Se fija ANTES de llamar a mostrarReto(), no después: si el reto no
                    // está en caché, mostrarReto() queda esperando la respuesta del padre
                    // (SOLICITAR_RETOS) antes de devolver el control — con el orden
                    // anterior, estado.retoActualId se quedaba sin actualizar durante toda
                    // esa espera, dejando al botón de saltar sin saber qué reto saltar
                    // justo cuando más falta hace (el reto roto que el usuario ya está
                    // viendo en pantalla).
                    estado.retoActualId = retoId;
                    await mostrarReto(retoId);
                    // Fase 2: confirmar al padre que el reto ha sido mostrado
                    try {
                        await enviarMensaje({ tipo: TIPOS_MENSAJE.RETO.MOSTRADO, destino: 'padre', datos: { retoId } });
                        logger.info(`[hijo4] RETO.MOSTRADO enviado al padre para reto: ${retoId}`);
                    } catch (sendErr) {
                        logger.warn(`[hijo4] Error enviando RETO.MOSTRADO:`, sendErr?.message || sendErr);
                    }
                } catch (e) {
                    logger.error(`[hijo4] Error procesando RETO.MOSTRAR:`, e?.message || e);
                }
            });

            // Controlador para cambio de modo - Protocolo bidireccional
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO, async (mensaje) => {
                const logPrefix = `[hijo4][CAMBIO_MODO]`;

                try {
                    // Extraer y validar datos
                    const { modo } = mensaje.datos || {};
                    if (!modo || !['casa', 'aventura'].includes(modo)) {
                        logger.error(`${logPrefix} Modo inválido: ${modo}`);
                        await enviarMensaje({
                            tipo: TIPOS_MENSAJE.SISTEMA.NACK,
                            destino: 'padre',
                            datos: { error: 'Modo inválido', modoRecibido: modo }
                        });
                        return;
                    }

                    // Enviar ENTENDIDO
                    logger.info(`${logPrefix} Cambio de modo a "${modo}" entendido`);

                    // Validación explícita antes de enviar
                    const destinoEntendido = 'padre';
                    const tipoEntendido = TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_ENTENDIDO;
                    const origenEntendido = CONFIG_HIJO?.IFRAME_ID;

                    // DEBUG: Console.log directo para diagnóstico (bypass suppress-warnings)
                    if (!destinoEntendido || !tipoEntendido || !origenEntendido) {
                        const debugInfo = {
                            destino: destinoEntendido,
                            tipo: tipoEntendido,
                            origen: origenEntendido,
                            TIPOS_MENSAJE_exists: globalThis.TIPOS_MENSAJE !== undefined,
                            TIPOS_MENSAJE_SISTEMA_exists: globalThis.TIPOS_MENSAJE?.SISTEMA !== undefined,
                            CONFIG_HIJO_exists: globalThis.CONFIG_HIJO !== undefined,
                            mensaje_origen: mensaje?.origen
                        };
                        logger.error('[hijo4][CAMBIO_MODO] 🔴 DEBUG CAMPOS UNDEFINED:', JSON.stringify(debugInfo, null, 2));
                        logger.error(`${logPrefix} ❌ Campos undefined antes de enviar ENTENDIDO:`, debugInfo);
                        throw new Error('Campos undefined en CAMBIO_MODO_ENTENDIDO');
                    }

                    await enviarMensaje({
                        destino: destinoEntendido,
                        tipo: tipoEntendido,
                        datos: {
                            modo,
                            timestamp: Date.now(),
                            mensajeId: mensaje.datos?.mensajeId || mensaje.id
                        }
                    });

                    // Procesar cambio
                    logger.info(`${logPrefix} Procesando cambio a modo: ${modo}`);
                    if (retoActual !== null || estado.retoActualId !== null) {
                        logger.warn(`${logPrefix} CAMBIO_MODO recibido con reto activo (${estado.retoActualId}) — omitiendo limpieza`);
                    } else {
                        estado.retoActualId = null;
                        retoActual = null;
                        if (retoDiv) {
                            retoDiv.innerHTML = "";
                            retoDiv.classList.remove("correct", "incorrect");
                        }
                        ocultarControles();
                        logger.debug(`${logPrefix} Estado de retos reseteado`);
                    }
                    sincronizarEstadoModo(modo);

                    // Enviar EFECTUADO
                    logger.info(`${logPrefix} Cambio de modo a "${modo}" efectuado`);
                    await enviarMensaje({
                        destino: 'padre',
                        tipo: TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_EFECTUADO,
                        datos: {
                            modo,
                            exito: true,
                            timestamp: Date.now(),
                            mensajeId: mensaje.datos?.mensajeId || mensaje.id
                        }
                    });
                } catch (error) {
                    logger.error(`${logPrefix} Error:`, error);
                    try {
                        await enviarMensaje({
                            tipo: TIPOS_MENSAJE.SISTEMA.ERROR,
                            destino: 'padre',
                            datos: { error: error.message, tipo: 'CAMBIO_MODO_FALLIDO' }
                        });
                    } catch (e) {
                        logger.error(`${logPrefix} Error notificando fallo:`, e);
                    }
                    await enviarMensaje({
                        tipo: TIPOS_MENSAJE.SISTEMA.NACK,
                        destino: 'padre',
                        datos: { error: error.message }
                    });
                }
            });

            // Controlador: SISTEMA.CAMBIO_MODO_APLICADO
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_APLICADO, async (mensaje) => {
                const logPrefix = `[hijo4][CAMBIO_MODO_APLICADO]`;
                try {
                    const { modo } = mensaje.datos || {};
                    logger.success(`${logPrefix} ✅ Cambio de modo a "${modo}" aplicado globalmente`);
                } catch (error) {
                    logger.error(`${logPrefix} Error:`, error);
                }
            });



            // Controlador para limpiar el estado tras cerrar el reto (el padre lo envía después
            // de recibir RETO.OCULTAR de este mismo hijo4 — direcciones distintas, tipos distintos)
            registrarControladorSeguro(TIPOS_MENSAJE.RETO.LIMPIAR_ESTADO, async (mensaje) => {
                logger.info(`[hijo4] RETO.LIMPIAR_ESTADO recibido - limpiando estado`);

                // Limpiar estado local del reto
                estado.retoActualId = null;
                retoActual = null;

                // Limpiar interfaz de reto
                if (retoDiv) {
                    retoDiv.innerHTML = "";
                    retoDiv.classList.remove("correct", "incorrect");
                }

                // Ocultar todos los botones
                ocultarControles();

                // Limpiar fuegos artificiales
                if (fuegosDiv) {
                    fuegosDiv.innerHTML = "";
                    fuegosDiv.style.display = "none";
                }

                // retoSigueActivo (calculado por el padre, mismo criterio que usa para
                // retosBtn en hijo3) evita que un RETO.LIMPIAR_ESTADO que llega tarde —
                // el usuario cerró el reto de una parada y ya cambió a otra sin reto antes
                // de que este mensaje aterrizara — vuelva a mostrar botonRetos-wrapper como
                // si la parada actual tuviera reto. Por defecto true (!== false) para no
                // romper el caso normal si el campo faltara.
                if (estado.modo?.actual === 'casa' && mensaje?.datos?.retoSigueActivo !== false) {
                    const wrapper = document.getElementById('botonRetos-wrapper');
                    if (wrapper) wrapper.style.display = '';
                }
                logger.info(`[hijo4] Estado y interfaz limpiados tras RETO.LIMPIAR_ESTADO`);
            });

            // Controlador para habilitar retos en modo AVENTURA (después de audio 1 vez)
            registrarControladorSeguro(TIPOS_MENSAJE.RETO.HABILITAR, async (mensaje) => {
                const logPrefix = `[hijo4][RETO.HABILITAR]`;
                logger.info(`${logPrefix} recibido de ${mensaje?.origen}`, mensaje?.datos);

                try {
                    const { paradaId, razon } = mensaje?.datos || {};

                    if (razon === 'audio_escuchado_1vez' || razon === 'sin_audio') {
                        logger.info(`${logPrefix} Habilitando retos (razon: ${razon}) para parada ${paradaId}`);
                        const wrapper = document.getElementById('botonRetos-wrapper');
                        if (wrapper) wrapper.style.display = '';
                        // Habilitar botón de retos
                        if (botonRetos) {
                            botonRetos.disabled = false;
                            botonRetos.classList.remove('deshabilitado');
                            logger.info(`${logPrefix} Botón retos habilitado`);
                        }
                    }
                } catch (error) {
                    logger.error(`${logPrefix} Error procesando RETO.HABILITAR:`, error);
                }
            });

            // Controlador para estado de retos en modo CASA
            registrarControladorSeguro(TIPOS_MENSAJE.RETO.ESTADO_CASA, async (mensaje) => {
                const logPrefix = `[hijo4][RETO.ESTADO_CASA]`;
                logger.info(`${logPrefix} recibido de ${mensaje?.origen}`, mensaje?.datos);

                try {
                    const { habilitado } = mensaje?.datos || {};

                    const wrapperCasa = document.getElementById('botonRetos-wrapper');
                    if (habilitado) {
                        logger.info(`${logPrefix} Habilitando retos (modo CASA)`);
                        if (wrapperCasa) wrapperCasa.style.display = '';
                        if (botonRetos) {
                            botonRetos.disabled = false;
                            botonRetos.classList.remove('deshabilitado');
                        }
                    } else {
                        logger.info(`${logPrefix} Ocultando retos (modo CASA — tramo o parada sin reto)`);
                        if (wrapperCasa) wrapperCasa.style.display = 'none';
                        if (botonRetos) {
                            botonRetos.disabled = true;
                            botonRetos.classList.add('deshabilitado');
                        }
                    }
                } catch (error) {
                    logger.error(`${logPrefix} Error procesando RETO.ESTADO_CASA:`, error);
                }
            });

            // Controlador para habilitar controles
            registrarControladorSeguro(TIPOS_MENSAJE.CONTROL.HABILITAR, async (_mensaje) => {
                logger.debug(`[hijo4] CONTROL.HABILITAR recibido`);
                // Implementar lógica para habilitar controles si es necesario
            });

            // Controlador para deshabilitar controles
            registrarControladorSeguro(TIPOS_MENSAJE.CONTROL.DESHABILITAR, async (_mensaje) => {
                logger.debug(`[hijo4] CONTROL.DESHABILITAR recibido`);
                // Implementar lógica para deshabilitar controles si es necesario
            });

            // Controlador para heartbeat
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT, async (_mensaje) => {
                await enviarMensaje({
                    destino: 'padre',
                    tipo: TIPOS_MENSAJE.SISTEMA.HEARTBEAT_RESPONSE,
                    datos: { timestamp: Date.now() }
                });
            });

            // Controlador: NAVEGACION.CAMBIO_PARADA
            registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.CAMBIO_PARADA, async (mensaje) => {
                try {
                    const datos = mensaje.datos || {};
                    const padreId = datos.padreId || datos.padreid || null;
                    const paradaId = datos.paradaId || datos.parada_id || null;
                    logger.info(`[hijo4][NAVEGACION.CAMBIO_PARADA] recibido: padreId=${padreId}, paradaId=${paradaId}, retoId=${datos.retoId}`);
                    // update local state such as current challenge if necessary
                    if (paradaId) {
                        // No-op: placeholder for actual reto prefetch logic
                        estado.retoActualId = mensaje.datos?.retoId || null;
                        estado.padreIdActual = padreId || null;
                    }
                    // Send confirmation back to parent
                    await enviarMensaje({
                        destino: 'padre',
                        tipo: TIPOS_MENSAJE.NAVEGACION.CAMBIO_PARADA_CONFIRMADO,
                        datos: { paradaId: paradaId || null, parada_id: paradaId || null, padreId: padreId || null, padreid: padreId || null, timestamp: Date.now() }
                    });
                } catch (e) {
                    logger.warn('[hijo4] Error manejando CAMBIO_PARADA', e);
                }
            });


            // CONTROLADOR: SISTEMA.NOTIFICACION - manejar PENDING_INICIADO
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.NOTIFICACION, async (mensaje) => {
                const logPrefix = `[hijo4][NOTIFICACION][${mensaje?.origen || 'desconocido'}]`;
                try {
                    const evento = mensaje.datos?.evento;
                    if (!evento) return;
                    if (evento === 'PENDING_INICIADO') {
                        const padreId = mensaje.datos?.padreId || mensaje.datos?.padreid || null;
                        const motivo = mensaje.datos?.motivo || 'iniciado';
                        logger.info(`${logPrefix} PENDING_INICIADO para ${padreId}: ${motivo}`);
                        if (padreId && padreId === estado.padreIdActual) {
                            // Solo se acusa recibo. NO se toca la UI del reto, y es deliberado:
                            // este aviso significa "el padre ha empezado a seguir la complecion de
                            // esta parada" (§13), no "el usuario ha salido del reto".
                            //
                            // Antes hacia `estado.retoActualId = null` + `ocultarControles()`, y eso
                            // borraba el reto que el usuario tenia abierto:
                            //   · btnEnviar → display:none, desaparecia
                            //   · btnMostrarRespuesta → disabled, visible pero inerte
                            //   · btnSaltarReto → intacto, pero su listener abre con
                            //     `if (!estado.retoActualId) return`, asi que dejaba de hacer nada
                            // Tres botones rotos de golpe, unos segundos despues de abrir el reto.
                            //
                            // Ocurre porque ensurePending() (codigo-padre.html) emite este aviso al
                            // CREAR el pending, y eso puede pasar con el reto ya abierto. En modo
                            // CASA es lo normal: el boton de retos se habilita nada mas cambiar de
                            // parada (§29.8), asi que el reto se abre antes de que exista pending
                            // alguno. En AVENTURA el reto solo se abre tras acabar el audio (§29.7)
                            // y para entonces el pending ya esta creado — protegido por el orden,
                            // no por diseño.
                            //
                            // El antiguo `estado.paradaPendiente` de este fichero se elimino con
                            // esto: no lo leia nadie. hijo2 tiene un campo homonimo, aparte.
                        }
                    }
                } catch (err) {
                    logger.warn(`${logPrefix} Error procesando NOTIFICACION:`, err);
                }
            });

            // Un solo camino (paso 8.10 de la lavadora): el padre manda SISTEMA.NACK/ERROR
            // a este mismo hijo cuando RETO.SOLICITAR_RETO o RETO.COMPLETADO fallan
            // (_hdl_RETO_SOLICITAR, _hdl_RETO_COMPLETADO en codigo-padre.html) — sin handler
            // aquí, el aviso se perdía sin ningún rastro. Mismo patrón mínimo que ya usa
            // boton-casa-hijo5.html: solo registrar el fallo en el log.
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.NACK, async (mensaje) => {
                const logPrefix = `[hijo4][SISTEMA.NACK][${mensaje?.origen || 'desconocido'}]`;
                try {
                    const { error, mensaje: detalle } = mensaje.datos || {};
                    logger.warn(`${logPrefix} Petición rechazada: ${error || 'sin detalle'}${detalle ? ` — ${detalle}` : ''}`);
                } catch (err) {
                    logger.error(`${logPrefix} Error procesando NACK:`, err);
                }
            });

            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.ERROR, async (mensaje) => {
                const logPrefix = `[hijo4][SISTEMA.ERROR][${mensaje?.origen || 'desconocido'}]`;
                try {
                    const { error, mensaje: detalle } = mensaje.datos || {};
                    logger.error(`${logPrefix} Error recibido: ${error || 'sin detalle'}${detalle ? ` — ${detalle}` : ''}`);
                } catch (err) {
                    logger.error(`${logPrefix} Error procesando SISTEMA.ERROR:`, err);
                }
            });

            // Fase 3 del patrón bidireccional: padre confirma recepción de RETO.MOSTRADO
            registrarControladorSeguro(TIPOS_MENSAJE.RETO.CONFIRMADO, async (mensaje) => {
                const { retoId } = mensaje.datos || {};
                logger.info(`[hijo4][RETO.CONFIRMADO] Padre confirmó recepción del reto mostrado: ${retoId}`);
            });

            // ============================================================
            // ENVIAR HIJO_PREPARADO AHORA QUE TODOS LOS CONTROLADORES ESTÁN REGISTRADOS
            // ============================================================
            try {
                logger.debug('[hijo4] Todos los controladores registrados; enviando HIJO_PREPARADO ahora');
                await enviarMensaje({
                    destino: 'padre',
                    tipo: TIPOS_MENSAJE.SISTEMA.HIJO_PREPARADO,
                    datos: {
                        componenteId: CONFIG_HIJO.COMPONENTE_ID,
                        version: '1.0.0',
                        tipo: 'RETO',
                        capacidades: ['retos', 'preguntas', 'validacion'],
                        timestamp: Date.now()
                    }
                });
                logger.debug('[hijo4] HIJO_PREPARADO enviado; esperando PADRE_DATOS');
            } catch (e) {
                logger.warn('[hijo4] Error enviando HIJO_PREPARADO:', e);
            }

            // NOTA: HIJO_LISTO se envía SOLO en el controlador PADRE_DATOS con protección de flag
            // para evitar mensajes duplicados

            estado.inicializado = true;
            logger.info(`[hijo4] Inicialización completada exitosamente`);


        } catch (error) {
            logger.error(`[hijo4] Error en inicialización:`, error);
        }
    }); // Cierre del DOMContentLoaded listener

    </script>

</head>
<body>

</div>

    <div class="elemento-orbita retraso-1"><span class="flecha-v">➣</span></div>
    <div class="elemento-orbita retraso-2"><span class="diana">🎯</span></div>
    <div class="elemento-orbita retraso-3"><span class="flecha-v">➣</span></div>
    <div class="elemento-orbita retraso-4"><span class="diana">🎯</span></div>
</button>

<div id="button-container">
    <div id="respuestaCorrectaTexto"></div>
    <button id="btnMostrarRespuesta">🆘❓</button>
    <button id="btnSaltarReto" class="btn-saltar-reto" aria-label="Saltar reto">⏩</button>
    <button id="btnNextAfterReto" class="btn-mundo-verde">
        <div class="elemento-orbita retraso-1"><span class="flecha-v">➣</span></div>
        <div class="elemento-orbita retraso-2"><span class="diana">🎯</span></div>
        <div class="elemento-orbita retraso-3"><span class="flecha-v">➣</span></div>
        <div class="elemento-orbita retraso-4"><span class="diana">🎯</span></div>
    </button>
</div>

<div id="fuegos"></div>
</body>
