    /* Escalado proporcional PURO: sincronizar con viewport del padre SIN LÍMITES */
    (function(){
        function escalar(){
            var w, h;
            w = globalThis.innerWidth; h = globalThis.innerHeight;
            var f = Math.max(16, Math.min(Math.min(w, h) * 0.025, 18));
            document.documentElement.style.fontSize = f + "px";
        }
        escalar();
        globalThis.addEventListener("resize", escalar);
    })();
    </script>

    <script type="module">
    /* --- Integración con Sistema de Mensajería --- */

    import { retryUntilAvailable, resolverIdPadre } from './js/utils.js';
    import { MSG_RETOS_COMPLETOS, PLACEHOLDER_RESPUESTA_TEXTO } from './js/traducciones-ui.js';

    // Fallbacks que esperan a que globalThis.mensajeria esté disponible
    const enviarMensaje = async (...args) => {
        // En hijos, usar postMessage directamente al padre
        if (globalThis.parent && globalThis.parent !== globalThis.window) {
            const mensaje = args[0];
            try {
                globalThis.parent.postMessage({
                    tipo: mensaje.tipo,
                    origen: mensaje.origen || 'hijo4',
                    destino: mensaje.destino,
                    datos: mensaje.datos,
                    timestamp: Date.now()
                }, globalThis.location.origin);
                return;
            } catch (e) {
                logger.error('[hijo4] Error enviando mensaje via postMessage:', e);
                throw e;
            }
        } else {
            // Fallback al método anterior si no estamos en iframe
            return await retryUntilAvailable(
                () => globalThis.mensajeria.enviarMensaje(...args),
                () => globalThis.mensajeria && globalThis.mensajeria.enviarMensaje,
                10, 500, (...a) => (globalThis.logger || console).error(...a)
            );
        }
    };

    const registrarControlador = async (tipo, callback) => {
        // En hijos, los controladores se registran localmente para mensajes del padre
        if (globalThis.parent && globalThis.parent !== globalThis.window) {
            // Registrar listener para mensajes del padre
            const listener = (event) => {
                if (event.source === globalThis.parent && event.data && event.data.tipo === tipo) {
                    callback(event.data);
                }
            };
            globalThis.addEventListener('message', listener);
            return () => globalThis.removeEventListener('message', listener);
        } else {
            // Fallback al método anterior
            return await retryUntilAvailable(
                () => globalThis.mensajeria.registrarControlador(tipo, callback),
                () => globalThis.mensajeria && globalThis.mensajeria.registrarControlador,
                10, 500, (...a) => (globalThis.logger || console).error(...a)
            );
        }
    };

    const enviarMensajeConConfirmacion = async (...args) => {
        // Similar a enviarMensaje pero esperando confirmación
        if (globalThis.parent && globalThis.parent !== globalThis.window) {
            const mensaje = args[0];
            return new Promise((resolve, reject) => {
                const idMensaje = 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2);
                const timeout = setTimeout(() => reject(new Error('Timeout esperando confirmación')),
                    globalThis.ajustarTimeoutPorConexion ? globalThis.ajustarTimeoutPorConexion(5000) : 5000);

                const confirmListener = (event) => {
                    if (event.source === globalThis.parent && event.data && event.data.tipo === 'SISTEMA.CONFIRMACION' && event.data.idOriginal === idMensaje) {
                        clearTimeout(timeout);
                        globalThis.removeEventListener('message', confirmListener);
                        resolve();
                    }
                };

                globalThis.addEventListener('message', confirmListener);

                try {
                    globalThis.parent.postMessage({
                        tipo: mensaje.tipo,
                        origen: mensaje.origen || 'hijo4',
                        destino: mensaje.destino,
                        datos: mensaje.datos,
                        timestamp: Date.now(),
                        id: idMensaje,
                        requiereConfirmacion: true
                    }, globalThis.location.origin);
                } catch (e) {
                    clearTimeout(timeout);
                    globalThis.removeEventListener('message', confirmListener);
                    reject(e);
                }
            });
        } else {
            return await retryUntilAvailable(
                () => globalThis.mensajeria.enviarMensajeConConfirmacion(...args),
                () => globalThis.mensajeria && globalThis.mensajeria.enviarMensajeConConfirmacion,
                10, 500, (...a) => (globalThis.logger || console).error(...a)
            );
        }
    };

    // ==================== MESSAGING ADAPTER PARA COMUNICACIÓN CON PADRE ====================
    // Este adapter permite a los hijos registrar controladores centralmente en el state-manager del padre
    if (globalThis.window !== undefined && globalThis.messagingAdapter === undefined) {
        globalThis.messagingAdapter = {
            _listenerRegistry: new Map(),

            registrarControladorCentral: async function(controladorId, handler, opciones = {}) {
                const iframeId = globalThis.name || (globalThis.CONFIG_HIJO !== undefined && globalThis.CONFIG_HIJO.IFRAME_ID) || 'hijo';
                const tipo = opciones.tipoMensaje || controladorId;

                if (this._listenerRegistry.has(tipo)) {
                    (globalThis.logger || console).warn && (globalThis.logger || console).warn(`[messagingAdapter] Listener ya registrado para ${tipo}, omitiendo`);
                    return false;
                }

                const adapterListener = async function(event) {
                    if (event.source === globalThis.parent && event.data && event.data.tipo === tipo) {
                        try {
                            const resultado = await handler(event.data);

                            if (event.data.requiereConfirmacion && event.data.id && resultado !== undefined) {
                                try {
                                    const confirmacion = {
                                        tipo: (globalThis.TIPOS_MENSAJE !== undefined && globalThis.TIPOS_MENSAJE.SISTEMA && globalThis.TIPOS_MENSAJE.SISTEMA.CONFIRMACION) || 'SISTEMA.CONFIRMACION',
                                        idOriginal: event.data.id,
                                        origen: iframeId,
                                        destino: event.data.origen || 'padre',
                                        timestamp: Date.now(),
                                        datos: resultado
                                    };
                                    if (globalThis.parent && globalThis.parent !== globalThis.window) {
                                        globalThis.parent.postMessage(confirmacion, globalThis.location.origin);
                                        (globalThis.logger || console).info && (globalThis.logger || console).info(`[messagingAdapter] Auto-confirmación enviada para ${event.data.id}`);
                                    }
                                } catch (confError) {
                                    (globalThis.logger || console).error && (globalThis.logger || console).error(`[messagingAdapter] Error enviando confirmación:`, confError);
                                }
                            }
                        } catch (e) {
                            (globalThis.logger || console).error && (globalThis.logger || console).error(`[messagingAdapter] Error en handler ${tipo}:`, e && e.message);
                        }
                    }
                };
                globalThis.addEventListener('message', adapterListener);
                this._listenerRegistry.set(tipo, adapterListener);

                (globalThis.logger || console).info && (globalThis.logger || console).info(`[messagingAdapter] Handler registrado para ${tipo} en ${iframeId}`);
                return true;
            },

            enviarMensajeCentral: async function(mensaje) {
                if (globalThis.parent && globalThis.parent !== globalThis.window) {
                    globalThis.parent.postMessage(mensaje, globalThis.location.origin);
                    return { exito: true, metodo: 'postMessage' };
                }
                return { exito: false, error: 'No hay padre disponible' };
            }
        };
        (globalThis.logger || console).info && (globalThis.logger || console).info('[HIJO] messagingAdapter creado para comunicación con padre');

        globalThis.addEventListener('pagehide', function() {
            if (globalThis.messagingAdapter && globalThis.messagingAdapter._listenerRegistry) {
                for (const listener of globalThis.messagingAdapter._listenerRegistry.values()) {
                    globalThis.removeEventListener('message', listener);
                }
                globalThis.messagingAdapter._listenerRegistry.clear();
            }
        }, { once: true });
    }

    // Wrapper seguro para evitar doble registro de controladores en hijos
    if (globalThis.window !== undefined && globalThis.registrarControladorSeguro === undefined) {
        globalThis.__CONTROLADOR_REGISTRADOS = globalThis.__CONTROLADOR_REGISTRADOS || new Set();
        globalThis.registrarControladorSeguro = async function(tipo, handler, opciones) {
            try {
                (globalThis.logger || console).info && (globalThis.logger || console).info(`[HIJO] registrarControladorSeguro called: ${tipo}`);
                if (!tipo || typeof handler !== 'function') {
                    (globalThis.logger || console).warn && (globalThis.logger || console).warn(`[HIJO] registrarControladorSeguro parámetros inválidos: tipo=${tipo}`);
                    return;
                }
                if (globalThis.__CONTROLADOR_REGISTRADOS.has(tipo)) {
                    (globalThis.logger || console).warn && (globalThis.logger || console).warn(`[HIJO] Controlador ya registrado, omitiendo: ${tipo}`);
                    return;
                }
                globalThis.__CONTROLADOR_REGISTRADOS.add(tipo);

                // ALSO keep a local map of handlers so we can respond to direct postMessage calls
                globalThis.__local_controladores = globalThis.__local_controladores || new Map();
                try { globalThis.__local_controladores.set(tipo, handler); } catch(_){ } // NOSONAR

                // Prefer central registration via messagingAdapter/state-manager when available
                try {
                    const iframeId = (globalThis.name || (globalThis.CONFIG_HIJO !== undefined && globalThis.CONFIG_HIJO.IFRAME_ID) || 'hijo');
                    const controladorId = `${iframeId}:${tipo}`;
                    if (globalThis.messagingAdapter && typeof globalThis.messagingAdapter.registrarControladorCentral === 'function') {
                        try {
                            const centralRes = await globalThis.messagingAdapter.registrarControladorCentral(controladorId, handler, { tipoMensaje: tipo });
                            if (centralRes === true) {
                                (globalThis.logger || console).info && (globalThis.logger || console).info(`[HIJO] registrarControlador registered centrally: ${controladorId} -> ${tipo}`);
                                return true;
                            }
                        } catch (e) {
                            (globalThis.logger || console).warn && (globalThis.logger || console).warn(`[HIJO] Central registrar failed for ${tipo}: ${e && e.message}`);
                        }
                    }
                    if (typeof registrarControlador === 'function') {
                        try {
                            const res = await registrarControlador(tipo, handler);
                            (globalThis.logger || console).info && (globalThis.logger || console).info(`[HIJO] registrarControlador delegated for ${tipo}`);
                            return res;
                        } catch (err) {
                            (globalThis.logger || console).warn && (globalThis.logger || console).warn(`[HIJO] registrarControlador failed for ${tipo}: ${err && err.message}`);
                            // fall through to queue
                        }
                    }
                } catch (e) {
                    (globalThis.logger || console).warn && (globalThis.logger || console).warn(`[HIJO] registrarControladorSeguro central attempt error for ${tipo}: ${e && e.message}`);
                }
                // Encolar localmente para migración cuando el padre lo solicite
                (globalThis.logger || console).info && (globalThis.logger || console).info(`[HIJO] Handler queued for migration: ${tipo} (local queue)`);
                return;
            } catch (e) {
                (globalThis.logger || console).error(`[HIJO] Error registrando controlador seguro ${tipo}:`, e && e.message);
            }
        };
    }

    // Helper: safeRegistrar delegates to registrarControladorSeguro when available
    if (globalThis.window !== undefined && globalThis.safeRegistrar === undefined) {
        globalThis.safeRegistrar = async function(tipo, handler, opciones) {
            try {
                if (!tipo || typeof handler !== 'function') return;
                if (globalThis.__CONTROLADOR_REGISTRADOS && globalThis.__CONTROLADOR_REGISTRADOS.has(tipo)) return;
                if (typeof globalThis.registrarControladorSeguro === 'function') return globalThis.registrarControladorSeguro(tipo, handler, opciones);
                if (typeof registrarControlador === 'function') return registrarControlador(tipo, handler);

    const RETO_CACHE_MAX = 2;

    function _guardarRetoEnCache(retoData) {
        if (!retoData || !retoData.id) return;
        const cache = globalThis.__vv_retoCache;
        cache.delete(retoData.id); // reinsertar al final si ya existía (marca como reciente)

        while (cache.size > RETO_CACHE_MAX) {

        }
    }

    /* Función: fuegosArtificiales()
       Muestra una animación de fuegos artificiales en la pantalla.
    */
    function fuegosArtificiales() {
        if (!fuegosDiv) {
            return;
        }
        fuegosDiv.innerHTML = ""; // Limpiar fuegos anteriores
        fuegosDiv.style.display = "block"; // Mostrar el contenedor de fuegos

        const NUM_CHISPAS_POR_FUEGO = 30;
        const NUM_EXPLOSIONES = 15;

        for (let e = 0; e < NUM_EXPLOSIONES; e++) {
            const delayExplosion = (DURACION_TOTAL_MS / NUM_EXPLOSIONES) * e;

            setTimeout(() => {
                const containerWidth = fuegosDiv.offsetWidth || globalThis.innerWidth;
                const containerHeight = fuegosDiv.offsetHeight || globalThis.innerHeight;

                const startX = Math.random() * containerWidth;
                const startY = Math.random() * containerHeight;

                for (let i = 0; i < NUM_CHISPAS_POR_FUEGO; i++) {
                    let chispa = document.createElement("div");
                    chispa.style.position = "absolute";
                    chispa.style.borderRadius = "50%";
                    chispa.style.width = "12px";
                    chispa.style.height = "12px";
                    chispa.style.background = `hsl(${Math.random() * 360}, 100%, 70%)`;
                    chispa.style.opacity = "1";
                    chispa.style.left = `${startX}px`;
                    chispa.style.top = `${startY}px`;
                    chispa.style.zIndex = "10";

                    fuegosDiv.appendChild(chispa);

                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 80 + 40;
                    const endX = startX + distance * Math.cos(angle);
                    const endY = startY + distance * Math.sin(angle);

                    const chispaDuration = DURACION_TOTAL_MS / NUM_EXPLOSIONES * 1.5;

                    chispa.getBoundingClientRect(); // Forzar reflow para asegurar que la transición se aplique
                    chispa.style.transition = `all ${chispaDuration}ms ease-out`;
                    chispa.style.left = `${endX}px`;
                    chispa.style.top = `${endY}px`;
                    chispa.style.opacity = "0";
                    chispa.style.transform = "scale(0.5)";

                    setTimeout(() => {
                        if (chispa.parentNode) {
                            chispa.remove();
                        }
                    }, chispaDuration + 50);
                }
            }, delayExplosion);
        }
        setTimeout(() => {
            fuegosDiv.style.display = "none";
        }, DURACION_TOTAL_MS + 100);
    }

        /* Función: verificar()
           Comprueba si la respuesta del usuario para el reto actual es correcta.
        */
        async function verificar() {
            const reto = retoActual;
            if (!reto) return;

            btnEnviar.disabled = true; // Desactivar el botón Enviar
            divRespuestaCorrecta.style.display = "none";
            divRespuestaCorrecta.textContent = "";
            retoDiv.classList.remove("correct", "incorrect");
            fuegosDiv.innerHTML = "";
            fuegosDiv.style.display = "none";

            let esCorrecto = false;

            // Ejecutar validación personalizada primero
            let respuestaUsuario = null;
            try {
                // Obtener la respuesta del usuario según el tipo de reto
                if (reto.tipo === "opcion") {
                    const seleccion = document.querySelector('input[name="op"]:checked');
                    respuestaUsuario = seleccion ? seleccion.value : null;
                } else if (reto.tipo === "opcion-multiple") {
                    respuestaUsuario = Array.from(document.querySelectorAll('input[name="op"]:checked')).map(i => i.value);
                } else if (reto.tipo === "texto") {
                    // Para retos de texto, la respuesta se obtiene del input correspondiente
                    const inputTexto = document.querySelector('input[type="text"], textarea');
                    respuestaUsuario = inputTexto ? inputTexto.value : null;
                }

                // Llamar a la validación personalizada (soporta async)
                let validacionPersonalizada = true;
                if (typeof globalThis.ejecutarValidacion === 'function') {
                    validacionPersonalizada = await globalThis.ejecutarValidacion(reto, respuestaUsuario);
                }
                if (validacionPersonalizada === false) {
                    logger.warn(`[hijo4] Validación personalizada falló para reto ${reto?.id || 'desconocido'}`);
                    throw new Error("Validación personalizada falló");
                }
            } catch (error) {
                logger.error(`[hijo4] Error en globalThis.ejecutarValidacion para reto ${reto?.id || 'desconocido'}:`, error.message);
                // Si la validación personalizada falla, mostrar error y permitir reintentar
                alert("Error en la validación: " + error.message);
                btnEnviar.disabled = false;
                return;
            }

            if (reto.tipo === "opcion") {
                const seleccion = document.querySelector('input[name="op"]:checked');
                if (!seleccion) {
                    alert("Por favor, seleccione una opción.");
                    btnEnviar.disabled = false;
                    return;
                }
                esCorrecto = reto.correctas.includes(seleccion.value);
            } else if (reto.tipo === "opcion-multiple") {
                const checks = Array.from(document.querySelectorAll('input[name="op"]:checked')).map(i => i.value);
                if (checks.length === 0) {
                    alert("Por favor, seleccione al menos una opción.");
                    btnEnviar.disabled = false;
                    return;
                }
                esCorrecto = reto.correctas.every(c => checks.includes(c)) && checks.every(s => reto.correctas.includes(s));
            } else if (reto.tipo === "texto") {
                // Se establece como correcto por defecto para retos de texto libre.
                esCorrecto = true;
            }

            if (esCorrecto) {
                retoDiv.classList.add("correct");
                fuegosArtificiales(); // Llama a la animación

                    btnEnviar.style.backgroundColor = "#28a745";
                    btnEnviar.style.display = "inline-block";

                logger.info(`[hijo4] Reto completado: ${reto.id}. Progreso: ${estadoRetos.progreso.completados}/${estadoRetos.progreso.total}`);

                try {

                        logger.info(`[FLUJO-RETO] [HIJO4] ⚠️ Enviado sin confirmación (función no disponible) para reto ${reto.id}`);
                    }
                } catch (e) {
                    logger.error(`[FLUJO-RETO] [HIJO4] ❌ Error enviando/confirmando reto completado:`, e);
                    // No bloqueamos el flujo local, el usuario ya ganó visualmente
                }
            } else {
                retoDiv.classList.add("incorrect");

                btnEnviar.textContent = "👎";

                btnEnviar.disabled = true;

                    btnEnviar.disabled = false;

        /* Event Listener: globalThis.message
           Escucha mensajes provenientes del iframe del puzzle para coordinar el avance.

        globalThis.addEventListener("message", async (event) => {
            if (event.origin !== globalThis.location.origin) return;
            // Filtrar: solo mensajes del iframe del puzzle activo (referenciado por su id, no por posición)
            const puzzleEl = document.getElementById('puzzleIframe');
            if (!puzzleEl || event.source !== puzzleEl.contentWindow) {
                return;
            }

            // Soporte para mensajes tipados (nuevo formato objeto) y legacy (string)
            const tipoPuzzle = event.data?.tipo;
            const esCompletado = tipoPuzzle === TIPOS_MENSAJE.PUZZLE.COMPLETADO || event.data === TIPOS_MENSAJE.PUZZLE.LEGACY_COMPLETADO;
            const esTimeout    = tipoPuzzle === TIPOS_MENSAJE.PUZZLE.TIMEOUT   || event.data === TIPOS_MENSAJE.PUZZLE.LEGACY_TIMEOUT;

            if (esCompletado) {
                retoDiv.classList.add("correct");
                retoDiv.classList.remove("incorrect");
                fuegosArtificiales();
                // Enviar mensaje de completado para puzzles
                await enviarMensaje({
                    tipo: TIPOS_MENSAJE.RETO.COMPLETADO,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    destino: resolverIdPadre(),
                    datos: {
                        retoId: retoActual.id,
                        completado: true
                    }
                });
                // Mostrar botón continuar dentro del puzzle
                const btnPuzzleContinuar = document.getElementById('btn-puzzle-continuar');
                if (btnPuzzleContinuar) btnPuzzleContinuar.style.display = 'flex';
            }
            else if (esTimeout) {
                retoDiv.classList.add("incorrect");
                retoDiv.classList.remove("correct");
                vibrar();
                await enviarMensaje({
                    tipo: TIPOS_MENSAJE.RETO.COMPLETADO,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    destino: resolverIdPadre(),
                    datos: { retoId: retoActual.id, completado: true }
                });
                const btnPuzzleContinuar = document.getElementById('btn-puzzle-continuar');
                if (btnPuzzleContinuar) btnPuzzleContinuar.style.display = 'flex';
            }
            else if (event.data === "advance-to-next") {
                divRespuestaCorrecta.style.display = "none";
                indiceReto++;
                const retosArray = obtenerRetos();
                if (indiceReto >= retosArray.length) {
                    const _lang = globalThis.__vv_idiomaActual || 'es';
                    alert(MSG_RETOS_COMPLETOS[_lang] || MSG_RETOS_COMPLETOS.es);
                    indiceReto = 0;
                }
                const siguiente = retosArray[indiceReto];
                if (siguiente) {
                    await mostrarReto(siguiente.id);
                } else {
                    logger.warn('[hijo4] No hay siguiente reto para índice', indiceReto);
                }
            }
        });

        /* Función: normalizarModo(modo)
           Acepta string u objeto y devuelve una cadena segura para usos en clases/dataset
        */
        function normalizarModo(modo) {
            try {
                if (typeof modo === 'string') {
                    modo = modo.trim();
                } else if (modo && typeof modo === 'object') {
                    modo = modo.actual || modo.modo || modo.nombre || Object.values(modo).find(v => typeof v === 'string') || '';
                } else if (modo === null || modo === undefined) {
                    modo = '';
                } else {
                    modo = String(modo);
                }
                modo = String(modo || '').trim().toLowerCase();
                modo = modo.replace(/[^a-z0-9_-]/g, '-').replace(/^-+|-+$/g, '');
                return modo;
            } catch (_e) { // NOSONAR
                return '';
            }
        }

        /* Función: actualizarInterfazModo(modo)
           Actualiza la interfaz según el modo (aventura/casa)
        */
        function actualizarInterfazModo(modo) {
            const modoSeguro = normalizarModo(modo);
            logger.info(`[RETOS] Actualizando interfaz para modo:`, { original: modo, normalizado: modoSeguro });
            const body = document.body;

            // Actualizar estado local
            estado.modo = estado.modo || {};
            estado.modo.actual = modoSeguro || modo;

            // Actualizar clases CSS
            body.classList.remove('modo-casa', 'modo-aventura');
            if (modoSeguro) body.classList.add(`modo-${modoSeguro}`);

            // Ajustes específicos según el modo
            const retoContainer = document.getElementById('reto-container');
            if (retoContainer) {
                if (modoSeguro) retoContainer.dataset.modo = modoSeguro;

                // Ajustar estilos según el modo
                if (modoSeguro === 'casa') {
                    retoContainer.style.borderColor = '#3498db'; // Azul para modo casa
                } else if (modoSeguro) {
                    retoContainer.style.borderColor = '#e67e22'; // Naranja para modo aventura u otros
                }
            }

            // Si hay un reto abierto, actualizar su visualización
            if (estado.retoActualId) {
                logger.info(`[RETOS] Se está mostrando el reto ${estado.retoActualId} en modo ${modoSeguro || modo}`);
            }
        }

        // Inicializar mensajería y controladores
        try {
            // Ocultar la UI hasta que el padre confirme que los controladores están listos
            let _uiConfirmado = false;
            const _originalDisplay = (document.body && document.body.style && document.body.style.display) || '';
            try { if (document.body) document.body.style.display = 'none'; } catch (_e) { /* ignore */ } // NOSONAR
            function mostrarUI() {
                if (!_uiConfirmado) { return; }
                try { if (document.body) { document.body.style.display = _originalDisplay || 'flex'; logger.info(`[hijo4] UI visible tras PADRE_CONFIRMA_HIJO_LISTO — body.display=${document.body.style.display}`); } } catch (_e) {} // NOSONAR
            }

            // Sistema de reintentos activos para HIJO_LISTO (solución permanente C2)
            let _reintentosHijoListo = 0;
            const MAX_REINTENTOS_HIJO_LISTO = 30; // 30 segundos máximo
            const INTERVALO_REINTENTO = 1000; // 1 segundo
            let _intervaloReintento = null;

            // No necesitamos inicializarMensajeria aquí, los fallbacks esperan automáticamente

            // NOTA: HIJO_PREPARADO se envía MÁS ABAJO, DESPUÉS de registrar todos los controladores críticos.
            // Esto garantiza que el padre no envíe PADRE_DATOS antes de que los controladores estén listos.
            logger.debug('[hijo4] HIJO_PREPARADO aplazado hasta post-inicialización de controladores');

            logger.info(`Hijo ${CONFIG_HIJO.IFRAME_ID} registrado el controlador PADRE_DATOS`);
            // Controlador para inicialización del padre
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.PADRE_DATOS, async (mensaje) => {
                logger.info(`[hijo4] PADRE_DATOS recibido desde ${mensaje.origen}`);
                logger.info(`Hijo ${CONFIG_HIJO.IFRAME_ID} recibió PADRE_DATOS`);

                // ✅ PROCESAR DATOS INICIALES DEL PADRE
                if (mensaje.datos) {
                    const { modo, paradas, paradaActual } = mensaje.datos;

                    if (modo) {
                        logger.info(`[hijo4] Procesando modo inicial del padre: ${modo}`);
                        actualizarInterfazModo(modo);
                    }

                    if (paradas) {
                        logger.debug(`[hijo4] Paradas recibidas: ${paradas.length}`);
                    }

                    if (paradaActual) {
                        logger.debug(`[hijo4] Parada actual: ${paradaActual}`);
                    }
                }

                // Enviar HIJO_LISTO para completar handshake con sistema de reintentos
                if (!estado.hijoListoEnviado) {
                    async function enviarHijoListoConReintento() {
                        try {
                            await enviarMensaje({
                                destino: resolverIdPadre(),
                                tipo: TIPOS_MENSAJE.SISTEMA.HIJO_LISTO,
                                origen: CONFIG_HIJO.IFRAME_ID,
                                datos: {
                                    componenteId: CONFIG_HIJO.COMPONENTE_ID,
                                    iframeId: CONFIG_HIJO.IFRAME_ID,
                                    timestamp: Date.now()
                                }
                            });
                            _reintentosHijoListo++;
                            logger.info(`[hijo4] HIJO_LISTO enviado al padre (reintento ${_reintentosHijoListo}/${MAX_REINTENTOS_HIJO_LISTO})`);

                            if (_reintentosHijoListo < MAX_REINTENTOS_HIJO_LISTO) {
                                _intervaloReintento = setTimeout(enviarHijoListoConReintento, INTERVALO_REINTENTO);
                            } else {
                                // Fallback: mostrar UI después de 30 segundos sin confirmación
                                logger.warn('[hijo4] Máximo de reintentos alcanzado, mostrando UI como fallback');
                                _uiConfirmado = true;
                                mostrarUI();
                            }
                        } catch (error) {
                            logger.error('[hijo4] Error enviando HIJO_LISTO:', error);
                        }
                    }
                    estado.hijoListoEnviado = true;
                    enviarHijoListoConReintento();
                }
            });

            // Controlador para confirmación del padre
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.PADRE_CONFIRMA_HIJO_LISTO, async (mensaje) => {
                logger.info('[hijo4] PADRE_CONFIRMA_HIJO_LISTO recibido:', mensaje);
                logger.info(`[hijo4] PADRE_CONFIRMA_HIJO_LISTO recibido desde ${mensaje.origen}`);

                // Limpiar intervalo de reintento si existe
                if (_intervaloReintento) {
                    clearTimeout(_intervaloReintento);
                    _intervaloReintento = null;
                    logger.info(`[hijo4] Intervalo de reintento limpiado tras recibir PADRE_CONFIRMA_HIJO_LISTO`);
                }

                // Aplicar modo pendiente si estaba encolado
                try {
                    if (estado.pendingCambioModo && estado.pendingCambioModo.modo) {
                        const modoPendiente = estado.pendingCambioModo.modo;
                        logger.info(`[hijo4] Aplicando modo pendiente: ${modoPendiente}`);
                        actualizarInterfazModo(modoPendiente);
                        await enviarMensaje({
                            destino: mensaje.origen,
                            tipo: TIPOS_MENSAJE.SISTEMA.CONFIRMACION,
                            origen: CONFIG_HIJO.IFRAME_ID,
                            datos: { tipo: 'inicializacion', modo: modoPendiente }
                        });
                        delete estado.pendingCambioModo;
                    }
                } catch (err) {
                    logger.error('[hijo4] Error aplicando modo pendiente:', err);
                }

                // 🔥 NUEVO: Procesar modo inicial si viene en datos
                const { modoInicial } = mensaje.datos || {};
                if (modoInicial) {
                    logger.info(`[hijo4] Modo inicial recibido: ${modoInicial}`);
                    actualizarInterfazModo(modoInicial);
                    logger.debug(`[hijo4] Interfaz actualizada según modo inicial`);
                }

                // Mostrar UI ahora que el padre confirmó
                try { _uiConfirmado = true; mostrarUI(); } catch (_e) { /* ignore */ } // NOSONAR
                try { await enviarMensaje({ destino: resolverIdPadre(), tipo: TIPOS_MENSAJE.SISTEMA.CONFIRMACION, origen: CONFIG_HIJO.IFRAME_ID, datos: { tipo: 'UI_VISIBLE', timestamp: Date.now() } }); } catch (_e) { /* ignore */ } // NOSONAR

            });

            // Controlador para mostrar reto específico
            registrarControladorSeguro(TIPOS_MENSAJE.RETO.MOSTRAR, async (mensaje) => {
                try {
                    if (!mensaje?.datos) {
                        logger.warn('[hijo4] RETO.MOSTRAR recibido sin datos, ignorando');
                        return;
                    }
                    const { retoId, retosArray } = mensaje.datos;
                    logger.info(`[hijo4][DEBUG] RETO.MOSTRAR handler — retoId="${retoId}", retosArray recibido=${retosArray?.length || 0}, caché local=${globalThis.__vv_retoCache?.size || 0}`);
                    logger.info(`[hijo4] RETO.MOSTRAR recibido para reto: ${retoId}`);

                    // FIX: Forzar body visible al recibir RETO.MOSTRAR
                    // Si PADRE_CONFIRMA_HIJO_LISTO no llego, body puede estar display:none
                    try {
                        document.body.style.display = _originalDisplay || 'flex';
                        document.body.style.visibility = 'visible';
                        document.body.style.opacity = '1';
                    } catch(_e) { /* ignore */ } // NOSONAR

                    // Protección pasiva por parada: el padre envía el reto en línea; se añade
                    // a la caché acotada (no se sobrescribe todo el histórico como antes).
                    if (retosArray && Array.isArray(retosArray) && retosArray.length > 0) {
                        retosArray.forEach(r => globalThis._guardarRetoEnCache(r));
                        logger.info(`[hijo4] ✅ ${retosArray.length} reto(s) añadidos a la caché`);
                    } else {
                        logger.warn(`[hijo4] RETO.MOSTRAR sin retosArray para ${retoId} — se intentará resolver desde caché local`);
                    }

                    await mostrarReto(retoId);
                    estado.retoActualId = retoId;
                    // Fase 2: confirmar al padre que el reto ha sido mostrado
                    try {
                        await enviarMensaje({ tipo: TIPOS_MENSAJE.RETO.MOSTRADO, origen: CONFIG_HIJO.IFRAME_ID, destino: resolverIdPadre(), datos: { retoId } });
                        logger.info(`[hijo4] RETO.MOSTRADO enviado al padre para reto: ${retoId}`);
                    } catch (sendErr) {
                        logger.warn(`[hijo4] Error enviando RETO.MOSTRADO:`, sendErr?.message || sendErr);
                    }
                } catch (e) {
                    logger.error(`[hijo4] Error procesando RETO.MOSTRAR:`, e?.message || e);
                }
            });

            // Controlador para cambio de modo - Protocolo bidireccional
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO, async (mensaje) => {
                const logPrefix = `[hijo4][CAMBIO_MODO]`;

                try {
                    // Validar carga secuencial
                    if (!mensaje.datos?.secuenciaCompleta) {
                        logger.warn(`${logPrefix} Mensaje recibido antes de secuencia completa`);
                        estado.pendingCambioModo = mensaje.datos || { modo: null };
                        await enviarMensaje({
                            tipo: TIPOS_MENSAJE.SISTEMA.NACK,
                            origen: CONFIG_HIJO.IFRAME_ID,
                            destino: mensaje.origen,
                            datos: {
                                error: 'Secuencia no completa',
                                esperarPermiso: true,
                                tipoOriginal: mensaje.tipo,
                                modoSolicitado: mensaje.datos?.modo
                            }
                        });
                        return;
                    }

                    // Extraer y validar datos
                    const { modo } = mensaje.datos || {};
                    if (!modo || !['casa', 'aventura'].includes(modo)) {
                        logger.error(`${logPrefix} Modo inválido: ${modo}`);
                        await enviarMensaje({
                            tipo: TIPOS_MENSAJE.SISTEMA.NACK,
                            origen: CONFIG_HIJO.IFRAME_ID,
                            destino: mensaje.origen,
                            datos: { error: 'Modo inválido', modoRecibido: modo }
                        });
                        return;
                    }

                    // Enviar ENTENDIDO
                    logger.info(`${logPrefix} Cambio de modo a "${modo}" entendido`);

                    // Validación explícita antes de enviar
                    const destinoEntendido = mensaje.origen;
                    const tipoEntendido = TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_ENTENDIDO;
                    const origenEntendido = CONFIG_HIJO?.IFRAME_ID;

                    // DEBUG: Console.log directo para diagnóstico (bypass suppress-warnings)
                    if (!destinoEntendido || !tipoEntendido || !origenEntendido) {
                        const debugInfo = {
                            destino: destinoEntendido,
                            tipo: tipoEntendido,
                            origen: origenEntendido,
                            TIPOS_MENSAJE_exists: globalThis.TIPOS_MENSAJE !== undefined,
                            TIPOS_MENSAJE_SISTEMA_exists: globalThis.TIPOS_MENSAJE?.SISTEMA !== undefined,
                            CONFIG_HIJO_exists: globalThis.CONFIG_HIJO !== undefined,
                            mensaje_origen: mensaje?.origen
                        };
                        logger.error('[hijo4][CAMBIO_MODO] 🔴 DEBUG CAMPOS UNDEFINED:', JSON.stringify(debugInfo, null, 2));
                        logger.error(`${logPrefix} ❌ Campos undefined antes de enviar ENTENDIDO:`, debugInfo);
                        throw new Error('Campos undefined en CAMBIO_MODO_ENTENDIDO');
                    }

                    await enviarMensaje({
                        destino: destinoEntendido,
                        tipo: tipoEntendido,
                        origen: origenEntendido,
                        datos: {
                            modo,
                            timestamp: Date.now(),
                            mensajeId: mensaje.datos?.mensajeId || mensaje.id
                        }
                    });

                    // Procesar cambio
                    logger.info(`${logPrefix} Procesando cambio a modo: ${modo}`);
                    if (retoActual !== null || estado.retoActualId !== null) {
                        logger.warn(`${logPrefix} CAMBIO_MODO recibido con reto activo (${estado.retoActualId}) — omitiendo limpieza`);
                    } else {
                        estado.retoActualId = null;
                        retoActual = null;
                        if (retoDiv) {
                            retoDiv.innerHTML = "";
                            retoDiv.classList.remove("correct", "incorrect");
                        }
                        ocultarControles();
                        logger.debug(`${logPrefix} Estado de retos reseteado`);
                    }
                    actualizarInterfazModo(modo);

                    // Enviar EFECTUADO
                    logger.info(`${logPrefix} Cambio de modo a "${modo}" efectuado`);
                    await enviarMensaje({
                        destino: mensaje.origen,
                        tipo: TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_EFECTUADO,
                        origen: CONFIG_HIJO?.IFRAME_ID || 'hijo4',
                        datos: {
                            modo,
                            exito: true,
                            timestamp: Date.now(),
                            mensajeId: mensaje.datos?.mensajeId || mensaje.id
                        }
                    });
                } catch (error) {
                    logger.error(`${logPrefix} Error:`, error);
                    try {
                        await enviarMensaje({
                            tipo: TIPOS_MENSAJE.SISTEMA.ERROR,
                            origen: CONFIG_HIJO.IFRAME_ID,
                            destino: mensaje.origen || 'padre',
                            datos: { error: error.message, tipo: 'CAMBIO_MODO_FALLIDO' }
                        });
                    } catch (e) {
                        logger.error(`${logPrefix} Error notificando fallo:`, e);
                    }
                    await enviarMensaje({
                        tipo: TIPOS_MENSAJE.SISTEMA.NACK,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        destino: mensaje.origen,
                        datos: { error: error.message }
                    });
                }
            });

            // Controlador: SISTEMA.CAMBIO_MODO_APLICADO
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_APLICADO, async (mensaje) => {
                const logPrefix = `[hijo4][CAMBIO_MODO_APLICADO]`;
                try {
                    const { modo } = mensaje.datos || {};
                    logger.success(`${logPrefix} ✅ Cambio de modo a "${modo}" aplicado globalmente`);
                } catch (error) {
                    logger.error(`${logPrefix} Error:`, error);
                }
            });



            // Controlador para ocultar el reto
            registrarControladorSeguro(TIPOS_MENSAJE.RETO.OCULTAR, async (_mensaje) => {
                logger.info(`[hijo4] RETO.OCULTAR recibido - ocultando reto`);

                // Limpiar estado local del reto
                estado.retoActualId = null;
                retoActual = null;

                // Limpiar interfaz de reto
                if (retoDiv) {
                    retoDiv.innerHTML = "";
                    retoDiv.classList.remove("correct", "incorrect");
                }

                // Ocultar todos los botones
                ocultarControles();

                // Limpiar fuegos artificiales
                if (fuegosDiv) {
                    fuegosDiv.innerHTML = "";
                    fuegosDiv.style.display = "none";
                }

                if (estado.modo?.actual === 'casa') {
                    const wrapper = document.getElementById('botonRetos-wrapper');
                    if (wrapper) wrapper.style.display = '';
                }
                logger.info(`[hijo4] Estado y interfaz limpiados tras RETO.OCULTAR`);
            });

            // Controlador para habilitar retos en modo AVENTURA (después de audio 1 vez)
            registrarControladorSeguro(TIPOS_MENSAJE.RETO.HABILITAR, async (mensaje) => {
                const logPrefix = `[hijo4][RETO.HABILITAR]`;
                logger.info(`${logPrefix} recibido de ${mensaje?.origen}`, mensaje?.datos);

                try {
                    const { paradaId, razon } = mensaje?.datos || {};

                    if (razon === 'audio_escuchado_1vez' || razon === 'sin_audio') {
                        logger.info(`${logPrefix} Habilitando retos (razon: ${razon}) para parada ${paradaId}`);
                        const wrapper = document.getElementById('botonRetos-wrapper');
                        if (wrapper) wrapper.style.display = '';
                        // Habilitar botón de retos
                        if (botonRetos) {
                            botonRetos.disabled = false;
                            botonRetos.classList.remove('deshabilitado');
                            logger.info(`${logPrefix} Botón retos habilitado`);
                        }
                    }
                } catch (error) {
                    logger.error(`${logPrefix} Error procesando RETO.HABILITAR:`, error);
                }
            });

            // Controlador para estado de retos en modo CASA
            registrarControladorSeguro(TIPOS_MENSAJE.RETO.ESTADO_CASA, async (mensaje) => {
                const logPrefix = `[hijo4][RETO.ESTADO_CASA]`;
                logger.info(`${logPrefix} recibido de ${mensaje?.origen}`, mensaje?.datos);

                try {
                    const { habilitado } = mensaje?.datos || {};

                    const wrapperCasa = document.getElementById('botonRetos-wrapper');
                    if (habilitado) {
                        logger.info(`${logPrefix} Habilitando retos (modo CASA)`);
                        if (wrapperCasa) wrapperCasa.style.display = '';
                        if (botonRetos) {
                            botonRetos.disabled = false;
                            botonRetos.classList.remove('deshabilitado');
                        }
                    } else {
                        logger.info(`${logPrefix} Ocultando retos (modo CASA — tramo o parada sin reto)`);
                        if (wrapperCasa) wrapperCasa.style.display = 'none';
                        if (botonRetos) {
                            botonRetos.disabled = true;
                            botonRetos.classList.add('deshabilitado');
                        }
                    }
                } catch (error) {
                    logger.error(`${logPrefix} Error procesando RETO.ESTADO_CASA:`, error);
                }
            });

            // Controlador para habilitar controles
            registrarControladorSeguro(TIPOS_MENSAJE.CONTROL.HABILITAR, async (_mensaje) => {
                logger.debug(`[hijo4] CONTROL.HABILITAR recibido`);
                // Implementar lógica para habilitar controles si es necesario
            });

            // Controlador para deshabilitar controles
            registrarControladorSeguro(TIPOS_MENSAJE.CONTROL.DESHABILITAR, async (_mensaje) => {
                logger.debug(`[hijo4] CONTROL.DESHABILITAR recibido`);
                // Implementar lógica para deshabilitar controles si es necesario
            });

            // Controlador para heartbeat
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT, async (mensaje) => {
                await enviarMensaje({
                    destino: mensaje.origen,
                    tipo: TIPOS_MENSAJE.SISTEMA.HEARTBEAT_RESPONSE,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    datos: { timestamp: Date.now() }
                });
            });

            // Controlador: SISTEMA.HEARTBEAT.START
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT_START, async (_mensaje) => {
                try {
                    globalThis.__HEARTBEAT_ACTIVO = true;
                    logger.debug(`[hijo4][HEARTBEAT_START] Activado heartbeat local`);
                    return { started: true };
                } catch (error) {
                    logger.error(`[hijo4][HEARTBEAT_START] Error:`, error);
                    return { started: false, error: error && error.message };
                }
            });

            // Controlador: NAVEGACION.CAMBIO_PARADA
            registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.CAMBIO_PARADA, async (mensaje) => {
                try {
                    const datos = mensaje.datos || {};
                    const padreId = datos.padreId || datos.padreid || null;
                    const paradaId = datos.paradaId || datos.parada_id || null;
                    logger.info(`[hijo4][NAVEGACION.CAMBIO_PARADA] recibido: padreId=${padreId}, paradaId=${paradaId}, retoId=${datos.retoId}`);
                    // update local state such as current challenge if necessary
                    if (paradaId) {
                        // No-op: placeholder for actual reto prefetch logic
                        estado.retoActualId = mensaje.datos?.retoId || null;
                        estado.padreIdActual = padreId || null;
                        estado.paradaIdActual = paradaId;
                    }
                    // Send confirmation back to parent
                    await enviarMensaje({
                        destino: mensaje.origen || resolverIdPadre(),
                        tipo: TIPOS_MENSAJE.NAVEGACION.CAMBIO_PARADA_CONFIRMADO,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        datos: { paradaId: paradaId || null, parada_id: paradaId || null, padreId: padreId || null, padreid: padreId || null, timestamp: Date.now() }
                    });
                } catch (e) {
                    logger.warn('[hijo4] Error manejando CAMBIO_PARADA', e);
                }
            });

            // Controlador: SISTEMA.HEARTBEAT.PAUSE
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT_PAUSE, async (_mensaje) => {
                try {
                    globalThis.__HEARTBEAT_ACTIVO = false;
                    logger.debug(`[hijo4][HEARTBEAT_PAUSE] Pausado heartbeat local`);
                    return { paused: true };
                } catch (error) {
                    logger.error(`[hijo4][HEARTBEAT_PAUSE] Error:`, error);
                    return { paused: false, error: error && error.message };
                }
            });

            // Controlador para ACK
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.ACK, async (mensaje) => {
                logger.debug(`[hijo4] ACK recibido:`, mensaje.datos);
                // Procesar confirmaciones del padre
            });

            // CONTROLADOR: SISTEMA.NOTIFICACION - manejar PENDING_CANCELADO
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.NOTIFICACION, async (mensaje) => {
                const logPrefix = `[hijo4][NOTIFICACION][${mensaje?.origen || 'desconocido'}]`;
                try {
                    const evento = mensaje.datos?.evento;
                    if (!evento) return;
                    if (evento === 'PENDING_CANCELADO') {
                        const padreId = mensaje.datos?.padreId || mensaje.datos?.padreid || null;
                        const motivo = mensaje.datos?.motivo || 'sin_motivo';
                        logger.info(`${logPrefix} PENDING_CANCELADO recibido para ${padreId}: ${motivo}`);
                        if (padreId && padreId === estado.padreIdActual) {
                            // Hide or reset reto UI
                            try {
                                estado.retoActualId = null;
                                estado.paradaPendiente = false;
                                // Hide controls
                                ocultarControles();
                                // Notify parent that the child processed the notification
                                await enviarMensaje({ tipo: TIPOS_MENSAJE.SISTEMA.ACK, origen: CONFIG_HIJO.IFRAME_ID, destino: mensaje.origen, datos: { mensaje: 'PENDING_CANCELADO procesado', padreId, motivo } });
                            } catch (error_) { logger.warn(`${logPrefix} Error limpiando UI reto por pending cancelado:`, error_); }
                        }
                    }
                    if (evento === 'PENDING_INICIADO') {
                        const padreId = mensaje.datos?.padreId || mensaje.datos?.padreid || null;
                        const motivo = mensaje.datos?.motivo || 'iniciado';
                        logger.info(`${logPrefix} PENDING_INICIADO para ${padreId}: ${motivo}`);
                        if (padreId && padreId === estado.padreIdActual) {
                            // Hide any active reto UI and prevent further interaction until pending resolves
                            try {
                                estado.retoActualId = null;
                                estado.paradaPendiente = true;
                                ocultarControles();
                                await enviarMensaje({ tipo: TIPOS_MENSAJE.SISTEMA.ACK, origen: CONFIG_HIJO.IFRAME_ID, destino: mensaje.origen, datos: { mensaje: 'PENDING_INICIADO recibid' } });
                            } catch (err) { logger.warn(`${logPrefix} Error procesando PENDING_INICIADO:`, err); }
                        }
                    }
                } catch (err) {
                    logger.warn(`${logPrefix} Error procesando NOTIFICACION:`, err);
                }
            });

            // Fase 3 del patrón bidireccional: padre confirma recepción de RETO.MOSTRADO
            registrarControladorSeguro(TIPOS_MENSAJE.RETO.CONFIRMADO, async (mensaje) => {
                const { retoId } = mensaje.datos || {};
                logger.info(`[hijo4][RETO.CONFIRMADO] Padre confirmó recepción del reto mostrado: ${retoId}`);
            });

            // ============================================================
            // ENVIAR HIJO_PREPARADO AHORA QUE TODOS LOS CONTROLADORES ESTÁN REGISTRADOS
            // ============================================================
            try {
                logger.debug('[hijo4] Todos los controladores registrados; enviando HIJO_PREPARADO ahora');
                await enviarMensaje({
                    destino: resolverIdPadre(),
                    tipo: TIPOS_MENSAJE.SISTEMA.HIJO_PREPARADO,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    datos: {
                        componenteId: CONFIG_HIJO.COMPONENTE_ID,
                        version: '1.0.0',
                        tipo: 'RETO',
                        capacidades: ['retos', 'preguntas', 'validacion'],
                        timestamp: Date.now()
                    }
                });
                logger.debug('[hijo4] HIJO_PREPARADO enviado; esperando PADRE_DATOS');
            } catch (e) {
                logger.warn('[hijo4] Error enviando HIJO_PREPARADO:', e);
            }

            // NOTA: HIJO_LISTO se envía SOLO en el controlador PADRE_DATOS con protección de flag
            // para evitar mensajes duplicados

            estado.inicializado = true;
            logger.info(`[hijo4] Inicialización completada exitosamente`);


        } catch (error) {
            logger.error(`[hijo4] Error en inicialización:`, error);
        }
    }); // Cierre del DOMContentLoaded listener

    </script>
