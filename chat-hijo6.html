<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>
  (function(){
    function escalar(){
      var f = Math.max(14, Math.min(Math.min(globalThis.innerWidth, globalThis.innerHeight) * 0.025, 18));
      document.documentElement.style.fontSize = f + 'px';
      document.documentElement.style.setProperty('--iframe-w', globalThis.innerWidth  + 'px');
      document.documentElement.style.setProperty('--iframe-h', globalThis.innerHeight + 'px');
    }
    escalar();
    globalThis.addEventListener('resize', escalar);
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains; preload">
  <title>Asistente de soporte</title>
  <style>
    :root {
      --gap-inferior:    env(safe-area-inset-bottom, 0px);
      --color-fondo:     #c8e6f7;
      --color-header:    #1a6ea8;
      --color-tema:      #ff8c00;
      --color-pregunta:  #1a6ea8;
      --color-resp-bg:   #fff;
      --radio:           0.75rem;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: clamp(14px, 3.5vmin, 18px);
      background: transparent;
      color: #222;
    }

    #contenedor {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--color-fondo);
    }

    /* ── Header ── */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: var(--color-header);
      color: #fff;
      flex-shrink: 0;
    }
    #header h1 {
      font-size: clamp(15px, 4vmin, 20px);
      font-weight: bold;
      letter-spacing: 0.02em;
    }
    #btn-cerrar {
      background: #F28500;
      border: 0.3125rem solid #50C878;
      border-radius: 50%;
      width: 3.25rem;
      height: 3.25rem;
      font-size: 1.5rem;
      font-weight: bold;
      color: #0F0616;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      flex-shrink: 0;
    }
    .icono-x-cerrar {
      display: inline-block;
      transform: scaleY(1.4);
      text-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      -webkit-text-stroke: 1px #0F0616;
    }
    #btn-cerrar:hover { background: #ff6600; }

    /* ── Área FAQ ── */
    #faq {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem 0.75rem calc(0.75rem + var(--gap-inferior));
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* ── Tema (nivel 1) ── */
    .tema-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.7rem 1rem;
      background: var(--color-tema);
      color: #fff;
      border: none;
      border-radius: var(--radio);
      font-size: clamp(14px, 3.5vmin, 17px);
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      text-align: left;
      line-height: 1.3;
      transition: opacity 0.15s;
    }
    .tema-btn:active { opacity: 0.82; }
    .tema-flecha {
      flex-shrink: 0;
      font-size: 0.8em;
      transition: transform 0.25s ease;
    }
    .tema-btn[aria-expanded="true"] .tema-flecha { transform: rotate(90deg); }

    /* ── Lista de preguntas ── */
    .preguntas-lista {
      display: none;
      flex-direction: column;
      gap: 0.3rem;
      padding: 0.3rem 0 0.1rem 0.6rem;
    }
    .preguntas-lista.visible { display: flex; }

    /* ── Pregunta (nivel 2) ── */
    .pregunta-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.55rem 0.85rem;
      background: var(--color-pregunta);
      color: #fff;
      border: none;
      border-radius: calc(var(--radio) * 0.7);
      font-size: clamp(13px, 3.2vmin, 16px);
      cursor: pointer;
      touch-action: manipulation;
      text-align: left;
      line-height: 1.35;
      transition: opacity 0.15s;
    }
    .pregunta-btn:active { opacity: 0.82; }
    .pregunta-flecha {
      flex-shrink: 0;
      font-size: 0.75em;
      transition: transform 0.25s ease;
    }
    .pregunta-btn[aria-expanded="true"] .pregunta-flecha { transform: rotate(90deg); }

    /* ── Respuesta ── */
    .respuesta-panel {
      display: none;
      background: var(--color-resp-bg);
      border: 1px solid #b0cfe0;
      border-top: none;
      border-radius: 0 0 calc(var(--radio) * 0.7) calc(var(--radio) * 0.7);
      padding: 0.75rem 0.85rem;
    }
    .respuesta-panel.visible { display: block; }

    .respuesta-texto {
      font-size: clamp(13px, 3.2vmin, 16px);
      line-height: 1.55;
      color: #222;
      white-space: pre-line;
    }
    /* Imagen incrustada en línea con el texto, en el punto exacto marcado por
       {{IMG:nombre-fichero}} — ligeramente más grande que el texto, no más. */
    .respuesta-imagen-inline {
      display: inline-block;
      height: 1.7em;
      width: auto;
      vertical-align: middle;
      margin: 0 0.15em;
      border-radius: 0.25rem;
      border: 1px solid #b0cfe0;
    }
    /* Botón-flecha al final de una respuesta con enlace interno (RESPUESTAS_CHAT.*.enlace). */
    .respuesta-enlace-flecha {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.6em;
      height: 1.6em;
      margin-left: 0.4em;
      background: var(--color-tema);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 0.85em;
      line-height: 1;
      cursor: pointer;
      vertical-align: middle;
      touch-action: manipulation;
      flex-shrink: 0;
    }
    .respuesta-enlace-flecha:active { opacity: 0.8; }

    /* ── Modal interno (términos, agradecimientos, vídeo de introducción) ── */
    #chat-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      padding: var(--gap-inferior) 0 var(--gap-inferior) 0;
    }
    #chat-modal-overlay.visible { display: flex; }
    .chat-modal-contenedor {
      position: relative;
      width: 95vw;
      height: 90vh;
      height: 90dvh;
      background: #fff8e7;
      border: 0.3125rem solid #8FE0A8;
      border-radius: 0.9375rem;
      box-shadow: 0 0.9375rem 3.125rem rgba(0, 0, 0, 0.7);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .chat-modal-cerrar {
      position: absolute;
      top: 0;
      right: 0;
      width: 3.25rem;
      height: 3.25rem;
      background: #F28500;
      border: 0.3125rem solid #50C878;
      border-radius: 50%;
      font-size: 1.5rem;
      font-weight: bold;
      color: #0F0616;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .chat-modal-cerrar:hover { background: #d97400; border-color: #3ea862; }
    .chat-modal-contenido {
      flex: 1;
      overflow-y: auto;
      padding: 2.75rem 1.25rem 1.25rem;
      font-size: clamp(13px, 3.2vmin, 16px);
      line-height: 1.55;
      color: #222;
    }
    .chat-modal-contenido.sin-padding { padding: 0; }
    .chat-modal-contenido iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* ── Buzón de sugerencias (fuera del acordeón, siempre visible) ── */
    #buzon-sugerencias {
      flex-shrink: 0;
      background: var(--color-resp-bg);
      border-top: 1px solid #b0cfe0;
      padding: 0.75rem 0.75rem calc(0.75rem + var(--gap-inferior));
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    #buzon-titulo {
      font-size: clamp(13px, 3.2vmin, 15px);
      font-weight: bold;
      color: var(--color-header);
    }
    #buzon-texto {
      width: 100%;
      resize: vertical;
      min-height: 3.2rem;
      max-height: 8rem;
      font-family: inherit;
      font-size: clamp(13px, 3.2vmin, 15px);
      color: #222;
      border: 1px solid #b0cfe0;
      border-radius: calc(var(--radio) * 0.5);
      padding: 0.5rem 0.65rem;
    }
    #buzon-boton {
      align-self: flex-end;
      background: var(--color-tema);
      color: #fff;
      border: none;
      border-radius: calc(var(--radio) * 0.6);
      padding: 0.45rem 1.1rem;
      font-size: clamp(13px, 3.2vmin, 15px);
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: opacity 0.15s;
    }
    #buzon-boton:active { opacity: 0.82; }
    #buzon-boton:disabled { opacity: 0.5; cursor: default; }
    #buzon-gracias {
      display: none;
      font-size: clamp(13px, 3.2vmin, 15px);
      color: #1e7e34;
      font-weight: bold;
    }
    #buzon-gracias.visible { display: block; }
  </style>
</head>
<body>

<div id="contenedor">
  <div id="header">
    <h1 id="titulo-header">Soporte</h1>
    <button id="btn-cerrar" aria-label="Cerrar chat" onclick="return cerrarChatVentana();"><span class="icono-x-cerrar">✗</span></button>
  </div>
  <div id="faq" aria-label="Preguntas frecuentes"></div>
  <div id="buzon-sugerencias">
    <label id="buzon-titulo" for="buzon-texto">¿Alguna sugerencia?</label>
    <textarea id="buzon-texto" placeholder=""></textarea>
    <button id="buzon-boton" type="button">Enviar</button>
    <span id="buzon-gracias" role="status"></span>
  </div>
</div>

<div id="chat-modal-overlay">
  <div class="chat-modal-contenedor">
    <button type="button" class="chat-modal-cerrar" id="chat-modal-cerrar" title="Cerrar"><span class="icono-x-cerrar">✗</span></button>
    <div id="chat-modal-contenido" class="chat-modal-contenido"></div>
  </div>
</div>

<script>
  function obtenerOrigenPadreSeguro() {
    return globalThis.location.origin === 'null' ? '*' : globalThis.location.origin;
  }

  function cerrarChatVentana() {
    // 1) Preferred path: parent exposed close API.
    try {
      if (globalThis.parent && typeof globalThis.parent.cerrarChatSoporte === 'function') {
        globalThis.parent.cerrarChatSoporte();
      }
    } catch (error_) {
      console.debug('[hijo6] cerrarChatSoporte no disponible', error_ && error_.message); // script clásico pre-módulo
    }

    // 2) Direct DOM fallback for same-origin.
    try {
      var iframeChat = globalThis.parent.document.getElementById('hijo6-chat');
      if (iframeChat) {
        iframeChat.style.display = 'none';
        iframeChat.style.visibility = 'hidden';
      }
    } catch (error_) {
      console.debug('[hijo6] No se pudo ocultar iframe por DOM directo', error_ && error_.message); // script clásico pre-módulo
    }

    // 3) Messaging fallback.
    try {
      var tipoCerrar = (globalThis.constants && globalThis.constants.TIPOS_MENSAJE && globalThis.constants.TIPOS_MENSAJE.CHAT && globalThis.constants.TIPOS_MENSAJE.CHAT.CERRAR) || 'CHAT.CERRAR';
      globalThis.parent.postMessage({ tipo: tipoCerrar }, obtenerOrigenPadreSeguro());
    } catch (error_) {
      console.debug('[hijo6] postMessage CHAT.CERRAR falló', error_ && error_.message); // script clásico pre-módulo
    }

    return false;
  }
  globalThis.cerrarChatVentana = cerrarChatVentana;
</script>

<script type="module">
  import { retryUntilAvailable, resolverIdPadre } from './js/utils.js';
  import { TIPOS_MENSAJE } from './js/constants.js';
  import logger from './js/logger.js';
  import {
    TITULOS_CHAT,
    TEXTOS_BUZON_SUGERENCIAS,
    TEMAS_CHAT,
    ORDEN_TEMAS_CHAT,
    TEMAS_AGRUPADOS_CHAT,
    PREGUNTAS_CHAT,
    RESPUESTAS_CHAT,
    IDIOMAS_CHAT,
    CHAT_ABRIR_ENLACE,
  } from './js/traducciones-ui.js';
  import { enviarSugerencia } from './js/feedback-forms.js';

  // ── CONFIG ────────────────────────────────────────────────────────────────
  const CONFIG_HIJO = { IFRAME_ID: 'hijo6-chat', COMPONENTE_ID: 'CHAT' };
  globalThis.CONFIG_HIJO = CONFIG_HIJO;

  // ── Wrappers de mensajería (mismo patrón que el resto de hijos) ───────────
  const enviarMensaje = async (...args) => {
    if (globalThis.parent && globalThis.parent !== globalThis) {
      const msg = args[0];
      try {
        globalThis.parent.postMessage(
          { tipo: msg.tipo, origen: msg.origen || CONFIG_HIJO.IFRAME_ID, destino: msg.destino, datos: msg.datos, timestamp: Date.now() },
          globalThis.location.origin
        );
        return;
      } catch (e) { logger.error('[hijo6] Error enviando mensaje:', e && e.message); throw e; }
    } else {
      return await retryUntilAvailable(
        () => globalThis.mensajeria.enviarMensaje(...args),
        () => globalThis.mensajeria && globalThis.mensajeria.enviarMensaje,
        10, 500, (...a) => logger.error(...a)
      );
    }
  };

  if (globalThis.registrarControladorSeguro === undefined) {
    globalThis.__CONTROLADOR_REGISTRADOS = globalThis.__CONTROLADOR_REGISTRADOS || new Set();
    globalThis.registrarControladorSeguro = async function(tipo, handler) {
      if (!tipo || typeof handler !== 'function') return;
      if (globalThis.__CONTROLADOR_REGISTRADOS.has(tipo)) return;
      globalThis.__CONTROLADOR_REGISTRADOS.add(tipo);
      const listener = (event) => {
        if (event.source === globalThis.parent && event.data && event.data.tipo === tipo) {
          handler(event.data);
        }
      };
      globalThis.addEventListener('message', listener);
    };
  }
  const registrarControladorSeguro = globalThis.registrarControladorSeguro;

  // ── Estado ────────────────────────────────────────────────────────────────
  let idioma      = 'es';
  let estadoPadre = {};
  let hijoListoEnviado = false;
  let inicializado = false;
  let _reintentosHijoListo = 0;
  const MAX_REINTENTOS_HIJO_LISTO = 30; // 30 intentos × 1s = 30 segundos máximo
  const INTERVALO_REINTENTO = 1000; // 1 segundo entre reintentos
  let _intervaloReintento = null;

  const TITULOS = TITULOS_CHAT;

  const tituloEl  = document.getElementById('titulo-header');
  const faqEl     = document.getElementById('faq');
  const btnCerrar = document.getElementById('btn-cerrar');
  const buzonTituloEl  = document.getElementById('buzon-titulo');
  const buzonTextoEl   = document.getElementById('buzon-texto');
  const buzonBotonEl   = document.getElementById('buzon-boton');
  const buzonGraciasEl = document.getElementById('buzon-gracias');
  const modalOverlayEl   = document.getElementById('chat-modal-overlay');
  const modalContenidoEl = document.getElementById('chat-modal-contenido');
  const modalCerrarEl    = document.getElementById('chat-modal-cerrar');

  // ── Construcción del acordeón ─────────────────────────────────────────────
  // Inserta el texto de una respuesta respetando los marcadores {{IMG:fichero}}
  // en el punto exacto donde aparecen, sustituyéndolos por <img> en línea.
  function renderTextoConImagenes(contenedor, texto) {
    contenedor.innerHTML = '';
    const partes = texto.split(/\{\{IMG:([^}]+)\}\}/g);
    partes.forEach((parte, i) => {
      if (i % 2 === 0) {
        if (parte) contenedor.appendChild(document.createTextNode(parte));
      } else {
        const img = document.createElement('img');
        img.src = `imagenes/imagenes-aplicación/${parte}.png`;
        img.alt = '';
        img.className = 'respuesta-imagen-inline';
        contenedor.appendChild(img);
      }
    });
  }

  function construirFAQ() {
    faqEl.innerHTML = '';
    for (const temaKey of ORDEN_TEMAS_CHAT) {
      const etiqueta  = TEMAS_CHAT[temaKey]?.[idioma] || TEMAS_CHAT[temaKey]?.es || temaKey;
      const claves = TEMAS_AGRUPADOS_CHAT[temaKey] || [];
      const preguntasActivas = claves.filter(k => {
        const txt = PREGUNTAS_CHAT[k]?.[idioma] || PREGUNTAS_CHAT[k]?.es || '';
        return txt.trim() !== '';
      });
      const temaBtn = document.createElement('button');
      temaBtn.className = 'tema-btn';
      temaBtn.setAttribute('aria-expanded', 'false');
      temaBtn.innerHTML = `<span>${etiqueta}</span><span class="tema-flecha" aria-hidden="true">▶</span>`;
      const lista = document.createElement('div');
      lista.className = 'preguntas-lista';
      lista.setAttribute('role', 'list');
      for (const clave of preguntasActivas) {
        const textoPregunta = PREGUNTAS_CHAT[clave]?.[idioma] || PREGUNTAS_CHAT[clave]?.es || '';
        const respuesta = RESPUESTAS_CHAT[clave]?.[idioma] || RESPUESTAS_CHAT[clave]?.es || { texto: '', enlace: null };
        const pregBtn = document.createElement('button');
        pregBtn.className = 'pregunta-btn';
        pregBtn.setAttribute('aria-expanded', 'false');
        pregBtn.innerHTML = `<span>${textoPregunta}</span><span class="pregunta-flecha" aria-hidden="true">▶</span>`;
        const panel = document.createElement('div');
        panel.className = 'respuesta-panel';
        const pTexto = document.createElement('p');
        pTexto.className = 'respuesta-texto';
        renderTextoConImagenes(pTexto, respuesta.texto);
        if (respuesta.enlace) {
          const flecha = document.createElement('button');
          flecha.type = 'button';
          flecha.className = 'respuesta-enlace-flecha';
          flecha.setAttribute('aria-label', CHAT_ABRIR_ENLACE[idioma] || CHAT_ABRIR_ENLACE.es);
          flecha.textContent = '➤';
          flecha.addEventListener('click', (evento) => {
            evento.stopPropagation();
            abrirModalEnlace(respuesta.enlace);
          });
          pTexto.appendChild(flecha);
        }
        panel.appendChild(pTexto);
        pregBtn.addEventListener('click', () => {
          const abierta = panel.classList.toggle('visible');
          pregBtn.setAttribute('aria-expanded', String(abierta));
        });
        const item = document.createElement('div');
        item.setAttribute('role', 'listitem');
        item.appendChild(pregBtn);
        item.appendChild(panel);
        lista.appendChild(item);
      }
      temaBtn.addEventListener('click', () => {
        const abierto = lista.classList.toggle('visible');
        temaBtn.setAttribute('aria-expanded', String(abierto));
      });
      const temaItem = document.createElement('div');
      temaItem.setAttribute('role', 'listitem');
      temaItem.appendChild(temaBtn);
      temaItem.appendChild(lista);
      faqEl.appendChild(temaItem);
    }
  }

  // ── Modal interno (términos, agradecimientos, vídeo de introducción) ──────
  // Reutiliza el mismo patrón visual que .media-overlay/.btn-cerrar-overlay
  // de codigo-padre.html (fondo oscuro, caja crema, X naranja/verde arriba a
  // la derecha), pero autocontenido dentro de este iframe — ver GUIA-COMPLETA §26.
  const _cacheModuloEnlace = {};

  async function abrirModalTexto(tipo, importar, propiedad, subPropiedad) {
    if (!_cacheModuloEnlace[tipo]) {
      const modulo = await importar();
      _cacheModuloEnlace[tipo] = modulo[propiedad][subPropiedad];
    }
    const idiomas = _cacheModuloEnlace[tipo];
    modalContenidoEl.className = 'chat-modal-contenido';
    modalContenidoEl.innerHTML = idiomas?.[idioma] || idiomas?.es || '';
    modalOverlayEl.classList.add('visible');
  }

  function abrirModalVideoIntro() {
    modalContenidoEl.className = 'chat-modal-contenido sin-padding';
    modalContenidoEl.innerHTML = '';
    const iframeVideo = document.createElement('iframe');
    iframeVideo.src = 'video-intro.html?lang=' + encodeURIComponent(idioma);
    iframeVideo.title = 'Video intro';
    modalContenidoEl.appendChild(iframeVideo);
    modalOverlayEl.classList.add('visible');
  }

  function abrirModalEnlace(enlace) {
    if (enlace === 'terminos') {
      void abrirModalTexto('terminos', () => import('./js/terminos-aventuras.js'), 'TERMINOS_AVENTURAS', 'terminos_idiomas');
    } else if (enlace === 'agradecimientos') {
      void abrirModalTexto('agradecimientos', () => import('./js/agradecimientos-aventuras.js'), 'AGRADECIMIENTOS_AVENTURAS', 'agradecimientos_idiomas');
    } else if (enlace === 'video-intro') {
      abrirModalVideoIntro();
    }
  }

  function cerrarModal() {
    modalOverlayEl.classList.remove('visible');
    modalContenidoEl.innerHTML = ''; // detiene el vídeo si estaba reproduciéndose
  }
  modalCerrarEl.addEventListener('click', cerrarModal);

  // El vídeo de introducción anidado notifica su fin exactamente igual que en
  // En-busca-del-tesoro.html — aquí solo se usa para cerrar el modal.
  globalThis.addEventListener('message', (evento) => {
    const origenOk = evento.origin === globalThis.location.origin || evento.origin === 'null';
    if (!origenOk) return;
    if (evento.data?.tipo === 'SELECCION.VIDEO_INTRO_TERMINADO') cerrarModal();
  });

  function actualizarIdioma(nuevoIdioma) {
    idioma = IDIOMAS_CHAT.includes(nuevoIdioma) ? nuevoIdioma : 'es';
    tituloEl.textContent = TITULOS[idioma] || TITULOS.es;
    document.documentElement.lang = idioma;
    construirFAQ();
    actualizarTextosBuzon();
  }

  // ── Buzón de sugerencias ─────────────────────────────────────────────────
  function actualizarTextosBuzon() {
    const t = TEXTOS_BUZON_SUGERENCIAS[idioma] || TEXTOS_BUZON_SUGERENCIAS.es;
    buzonTituloEl.textContent = t.titulo;
    buzonTextoEl.placeholder  = t.placeholder;
    buzonBotonEl.textContent  = t.boton;
    buzonGraciasEl.textContent = t.gracias;
  }
  actualizarTextosBuzon();

  buzonBotonEl.addEventListener('click', async () => {
    const mensaje = buzonTextoEl.value.trim();
    if (!mensaje) return;
    buzonBotonEl.disabled = true;
    await enviarSugerencia(mensaje, {
      idioma,
      aventura: estadoPadre.aventura,
      parada: estadoPadre.paradaActualNombre,
    });
    buzonTextoEl.value = '';
    buzonGraciasEl.classList.add('visible');
    setTimeout(() => { buzonGraciasEl.classList.remove('visible'); buzonBotonEl.disabled = false; }, 3000);
  });

  // ── Eventos UI ────────────────────────────────────────────────────────────
  btnCerrar.addEventListener('click', () => { cerrarChatVentana(); });

  // ── Controladores de mensajería ───────────────────────────────────────────
  registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.PADRE_DATOS, async (mensaje) => {
    logger.info('[hijo6][PADRE_DATOS] Datos del padre recibidos');
    if (mensaje.datos) {
      estadoPadre = { ...estadoPadre, ...mensaje.datos };
      if (mensaje.datos.idioma) actualizarIdioma(mensaje.datos.idioma);
      else construirFAQ();
    }
    if (!hijoListoEnviado) {
      hijoListoEnviado = true;
      inicializado = true;
      async function enviarHijoListoConReintento() {
        try {
          await enviarMensaje({
            destino: resolverIdPadre(),
            tipo: TIPOS_MENSAJE.SISTEMA.HIJO_LISTO,
            origen: CONFIG_HIJO.IFRAME_ID,
            datos: { componenteId: CONFIG_HIJO.COMPONENTE_ID, iframeId: CONFIG_HIJO.IFRAME_ID, timestamp: Date.now() }
          });
          _reintentosHijoListo++;
          logger.info(`[hijo6] HIJO_LISTO enviado al padre (reintento ${_reintentosHijoListo}/${MAX_REINTENTOS_HIJO_LISTO})`);
          if (_reintentosHijoListo < MAX_REINTENTOS_HIJO_LISTO) {
            _intervaloReintento = setTimeout(enviarHijoListoConReintento, INTERVALO_REINTENTO);
          } else {
            logger.warn('[hijo6] Máximo de reintentos alcanzado');
          }
        } catch (e) { logger.error('[hijo6] Error enviando HIJO_LISTO:', e && e.message); }
      }
      enviarHijoListoConReintento();
    }
  });

  registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.PADRE_CONFIRMA_HIJO_LISTO, async (_mensaje) => {
    logger.debug('[hijo6] PADRE_CONFIRMA_HIJO_LISTO recibido');
    if (_intervaloReintento) { clearTimeout(_intervaloReintento); _intervaloReintento = null; logger.debug('[hijo6] Reintento HIJO_LISTO cancelado tras confirmación del padre'); }
  });

  registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT, async (mensaje) => {
    await enviarMensaje({
      destino: mensaje.origen,
      tipo: TIPOS_MENSAJE.SISTEMA.HEARTBEAT_RESPONSE,
      origen: CONFIG_HIJO.IFRAME_ID,
      datos: { timestamp: Date.now(), estado: inicializado ? 'activo' : 'inicializando' }
    });
  });

  registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT_START, async () => {
    logger.debug('[hijo6] HEARTBEAT_START recibido');
  });

  registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT_PAUSE, async () => {
    logger.debug('[hijo6] HEARTBEAT_PAUSE recibido');
  });

  registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO, async (mensaje) => {
    const modo = mensaje?.datos?.modo;
    logger.debug(`[hijo6] CAMBIO_MODO recibido: ${modo}`);
    await enviarMensaje({
      destino: mensaje.origen,
      tipo: TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_ENTENDIDO,
      origen: CONFIG_HIJO.IFRAME_ID,
      datos: { modo, timestamp: Date.now(), mensajeId: mensaje.datos?.mensajeId || mensaje.id }
    });
    await enviarMensaje({
      destino: mensaje.origen,
      tipo: TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_EFECTUADO,
      origen: CONFIG_HIJO.IFRAME_ID,
      datos: { modo, exito: true, timestamp: Date.now(), mensajeId: mensaje.datos?.mensajeId || mensaje.id }
    });
  });

  registrarControladorSeguro(TIPOS_MENSAJE.CHAT.ESTADO_PADRE, async (mensaje) => {
    logger.debug('[hijo6] CHAT.ESTADO_PADRE recibido — actualizando estado');
    if (mensaje.datos) {
      estadoPadre = { ...estadoPadre, ...mensaje.datos };
      if (mensaje.datos.idioma) actualizarIdioma(mensaje.datos.idioma);
    }
  });

  // ── HIJO_PREPARADO — después de registrar todos los controladores ─────────
  try {
    await enviarMensaje({
      destino: resolverIdPadre(),
      tipo: TIPOS_MENSAJE.SISTEMA.HIJO_PREPARADO,
      origen: CONFIG_HIJO.IFRAME_ID,
      datos: { componenteId: CONFIG_HIJO.COMPONENTE_ID, version: '1.0.0', tipo: 'CHAT', capacidades: ['chat', 'faq'], timestamp: Date.now() }
    });
    logger.debug('[hijo6] HIJO_PREPARADO enviado; esperando PADRE_DATOS');
  } catch (e) { logger.warn('[hijo6] Error enviando HIJO_PREPARADO:', e && e.message); }

  // Construcción inicial
  construirFAQ();
</script>
