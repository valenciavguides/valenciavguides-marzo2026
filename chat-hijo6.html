<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>
  (function(){
    function escalar(){
      var f = Math.max(14, Math.min(Math.min(globalThis.innerWidth, globalThis.innerHeight) * 0.025, 18));
      document.documentElement.style.fontSize = f + 'px';
      document.documentElement.style.setProperty('--iframe-w', globalThis.innerWidth  + 'px');
      document.documentElement.style.setProperty('--iframe-h', globalThis.innerHeight + 'px');
    }
    escalar();
    globalThis.addEventListener('resize', escalar);
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains; preload">
  <title>Asistente de soporte</title>
  <style>
    :root {
      --gap-inferior:    env(safe-area-inset-bottom, 0px);
      --color-fondo:     #c8e6f7;
      --color-header:    #1a6ea8;
      --color-tema:      #ff8c00;
      --color-pregunta:  #1a6ea8;
      --color-resp-bg:   #fff;
      --radio:           0.75rem;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: clamp(14px, 3.5vmin, 18px);
      background: transparent;
      color: #222;
    }

    #contenedor {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--color-fondo);
    }

    /* ── Header ── */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: var(--color-header);
      color: #fff;
      flex-shrink: 0;
    }
    #header h1 {
      font-size: clamp(15px, 4vmin, 20px);
      font-weight: bold;
      letter-spacing: 0.02em;
    }
    #btn-cerrar {
      background: #F28500;
      border: 0.3125rem solid #50C878;
      border-radius: 50%;
      width: 3.25rem;
      height: 3.25rem;
      font-size: 1.5rem;
      font-weight: bold;
      color: #0F0616;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      flex-shrink: 0;
    }
    .icono-x-cerrar {
      display: inline-block;
      transform: scaleY(1.4);
      text-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      -webkit-text-stroke: 1px #0F0616;
    }
    #btn-cerrar:hover { background: #ff6600; }

    /* ── Área FAQ ── */
    #faq {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem 0.75rem calc(0.75rem + var(--gap-inferior));
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* ── Tema (nivel 1) ── */
    .tema-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.7rem 1rem;
      background: var(--color-tema);
      color: #fff;
      border: none;
      border-radius: var(--radio);
      font-size: clamp(14px, 3.5vmin, 17px);
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      text-align: left;
      line-height: 1.3;
      transition: opacity 0.15s;
    }
    .tema-btn:active { opacity: 0.82; }
    .tema-flecha {
      flex-shrink: 0;
      font-size: 0.8em;
      transition: transform 0.25s ease;
    }
    .tema-btn[aria-expanded="true"] .tema-flecha { transform: rotate(90deg); }

    /* ── Lista de preguntas ── */
    .preguntas-lista {
      display: none;
      flex-direction: column;
      gap: 0.3rem;
      padding: 0.3rem 0 0.1rem 0.6rem;
    }
    .preguntas-lista.visible { display: flex; }

    /* ── Pregunta (nivel 2) ── */
    .pregunta-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.55rem 0.85rem;
      background: var(--color-pregunta);
      color: #fff;
      border: none;
      border-radius: calc(var(--radio) * 0.7);
      font-size: clamp(13px, 3.2vmin, 16px);
      cursor: pointer;
      touch-action: manipulation;
      text-align: left;
      line-height: 1.35;
      transition: opacity 0.15s;
    }
    .pregunta-btn:active { opacity: 0.82; }
    .pregunta-flecha {
      flex-shrink: 0;
      font-size: 0.75em;
      transition: transform 0.25s ease;
    }
    .pregunta-btn[aria-expanded="true"] .pregunta-flecha { transform: rotate(90deg); }

    /* ── Respuesta ── */
    .respuesta-panel {
      display: none;
      background: var(--color-resp-bg);
      border: 1px solid #b0cfe0;
      border-top: none;
      border-radius: 0 0 calc(var(--radio) * 0.7) calc(var(--radio) * 0.7);
      padding: 0.75rem 0.85rem;
    }
    .respuesta-panel.visible { display: block; }

    .respuesta-texto {
      font-size: clamp(13px, 3.2vmin, 16px);
      line-height: 1.55;
      color: #222;
      white-space: pre-line;
    }
    /* Imagen incrustada en línea con el texto, en el punto exacto marcado por
       {{IMG:nombre-fichero}} — ligeramente más grande que el texto, no más. */
    .respuesta-imagen-inline {
      display: inline-block;
      height: 1.7em;
      width: auto;
      vertical-align: middle;
      margin: 0 0.15em;
      border-radius: 0.25rem;
      border: 1px solid #b0cfe0;
    }
    /* Botón-flecha al final de una respuesta con enlace interno (RESPUESTAS_CHAT.*.enlace). */
    .respuesta-enlace-flecha {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.6em;
      height: 1.6em;
      margin-left: 0.4em;
      background: var(--color-tema);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 0.85em;
      line-height: 1;
      cursor: pointer;
      vertical-align: middle;
      touch-action: manipulation;
      flex-shrink: 0;
    }
    .respuesta-enlace-flecha:active { opacity: 0.8; }

    /* ── Modal interno (términos, agradecimientos, vídeo de introducción) ── */
    #chat-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      padding: var(--gap-inferior) 0 var(--gap-inferior) 0;
    }
    #chat-modal-overlay.visible { display: flex; }
    .chat-modal-contenedor {
      position: relative;
      width: 95vw;
      height: 90vh;
      height: 90dvh;
      background: #fff8e7;
      border: 0.3125rem solid #8FE0A8;
      border-radius: 0.9375rem;
      box-shadow: 0 0.9375rem 3.125rem rgba(0, 0, 0, 0.7);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .chat-modal-cerrar {
      position: absolute;
      top: 0;
      right: 0;
      width: 3.25rem;
      height: 3.25rem;
      background: #F28500;
      border: 0.3125rem solid #50C878;
      border-radius: 50%;
      font-size: 1.5rem;
      font-weight: bold;
      color: #0F0616;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .chat-modal-cerrar:hover { background: #d97400; border-color: #3ea862; }
    .chat-modal-contenido {
      flex: 1;
      overflow-y: auto;
      padding: 2.75rem 1.25rem 1.25rem;
      font-size: clamp(13px, 3.2vmin, 16px);
      line-height: 1.55;
      color: #222;
    }
    .chat-modal-contenido.sin-padding { padding: 0; }
    .chat-modal-contenido iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* ── Buzón de sugerencias (fuera del acordeón, siempre visible) ── */
    #buzon-sugerencias {
      flex-shrink: 0;
      background: var(--color-resp-bg);
      border-top: 1px solid #b0cfe0;
      padding: 0.75rem 0.75rem calc(0.75rem + var(--gap-inferior));
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    #buzon-titulo {
      font-size: clamp(13px, 3.2vmin, 15px);
      font-weight: bold;
      color: var(--color-header);
    }
    #buzon-texto {
      width: 100%;
      resize: vertical;
      min-height: 3.2rem;
      max-height: 8rem;
      font-family: inherit;
      font-size: clamp(13px, 3.2vmin, 15px);
      color: #222;
      border: 1px solid #b0cfe0;
      border-radius: calc(var(--radio) * 0.5);
      padding: 0.5rem 0.65rem;
    }
    #buzon-boton {
      align-self: flex-end;
      background: var(--color-tema);
      color: #fff;
      border: none;
      border-radius: calc(var(--radio) * 0.6);
      padding: 0.45rem 1.1rem;
      font-size: clamp(13px, 3.2vmin, 15px);
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: opacity 0.15s;
    }
    #buzon-boton:active { opacity: 0.82; }

    /* Botón para pedir un rescate, al final de la respuesta sobre quedarse atascado.
       Mismo lenguaje visual que el botón del buzón —única forma de botón de texto que ya
       existe aquí— pero a todo el ancho del panel: es una acción con consecuencias, no un
       enlace, y conviene que se distinga de un momento a otro dentro del mismo texto. */
    .boton-rescate {
      display: block;
      width: 100%;
      margin-top: 0.7rem;
      background: var(--color-tema);
      color: #fff;
      border: none;
      border-radius: calc(var(--radio) * 0.6);
      padding: 0.55rem 1rem;
      font-size: clamp(13px, 3.2vmin, 15px);
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: opacity 0.15s;
    }
    .boton-rescate:active { opacity: 0.82; }
    .boton-rescate[disabled] { opacity: 0.55; cursor: default; }
    #buzon-boton:disabled { opacity: 0.5; cursor: default; }
    #buzon-gracias {
      display: none;
      font-size: clamp(13px, 3.2vmin, 15px);
      color: #1e7e34;
      font-weight: bold;
    }
    #buzon-gracias.visible { display: block; }
  </style>
</head>
<body>

<div id="contenedor">
  <div id="header">
    <h1 id="titulo-header">Soporte</h1>
    <!-- Sin `onclick` aquí: este mismo botón ya lleva un `addEventListener('click')` más
         abajo, así que cada pulsación disparaba el cierre DOS veces y mandaba dos avisos
         al padre. Un botón, un manejador. -->
    <button id="btn-cerrar" aria-label="Cerrar chat"><span class="icono-x-cerrar">✗</span></button>
  </div>
  <div id="faq" aria-label="Preguntas frecuentes"></div>
  <div id="buzon-sugerencias">
    <label id="buzon-titulo" for="buzon-texto">¿Alguna sugerencia?</label>
    <textarea id="buzon-texto" placeholder=""></textarea>
    <button id="buzon-boton" type="button">Enviar</button>
    <span id="buzon-gracias" role="status"></span>
  </div>
</div>

<div id="chat-modal-overlay">
  <div class="chat-modal-contenedor">
    <button type="button" class="chat-modal-cerrar" id="chat-modal-cerrar" title="Cerrar"><span class="icono-x-cerrar">✗</span></button>
    <div id="chat-modal-contenido" class="chat-modal-contenido"></div>
  </div>
</div>

<script type="module">
  // Cerrar el asistente: UN aviso al padre, y se acabo.
  //
  // Aqui habia tres bloques seguidos, comentados como "preferido" y dos "fallback", pero sin
  // `return` ni `else` entre ellos: los tres corrian SIEMPRE. Llamaba a `cerrarChatSoporte()`
  // del padre, le escondia el iframe metiendo mano en `parent.document`, y ademas mandaba
  // CHAT.CERRAR. O sea que el padre cerraba el chat dos veces y alguien se lo ocultaba por
  // fuera. Opcion A lo prohibe de raiz: ningun frame toca el DOM ni las funciones de otro.
  //
  // Quien cierra es el padre, al recibir el aviso. Si el aviso no sale, se dice.
  import { enviarMensaje } from './js/mensajeria.js';
  import { TIPOS_MENSAJE } from './js/constants.js';

  globalThis.cerrarChatVentana = function cerrarChatVentana() {
    void enviarMensaje({ tipo: TIPOS_MENSAJE.CHAT.CERRAR, destino: 'padre' });
    return false;
  };
</script>

<script type="module">
  import * as bus from './js/mensajeria.js';
  // Importado por su efecto: al cargarse instala la captura de `error` y `unhandledrejection`
  // de este frame. El bus ya lo arrastra, pero de ahí no se deduce leyendo este fichero.
  import './js/utils.js';
  import { ajustarTimeoutPorConexion } from './js/utils.js';
  import { TIPOS_MENSAJE } from './js/constants.js';
  import logger from './js/logger.js';
  // Publica el logger en el globalThis de ESTE iframe. Cada iframe tiene el suyo, y el
  // `globalThis.logger = ...` de codigo-padre.html solo alcanza al del padre: sin esta
  // linea, los `(globalThis.logger || console).x` de este fichero caian al console crudo
  // y se saltaban el nivel de log (ver GUIA-COMPLETA.md §26.3).
  globalThis.logger = logger;
  import {
    TITULOS_CHAT,
    TEXTOS_BUZON_SUGERENCIAS,
    TEMAS_CHAT,
    ORDEN_TEMAS_CHAT,
    TEMAS_AGRUPADOS_CHAT,
    PREGUNTAS_CHAT,
    RESPUESTAS_CHAT,
    IDIOMAS_CHAT,
    CHAT_ABRIR_ENLACE,
    TRADUCCIONES_RESCATE_BOTON_PEDIR,
  } from './js/traducciones-ui.js';
  import { enviarSugerencia } from './js/feedback-forms.js';

  // ── CONFIG ────────────────────────────────────────────────────────────────
  const CONFIG_HIJO = { IFRAME_ID: 'hijo6-chat', COMPONENTE_ID: 'CHAT' };
  globalThis.CONFIG_HIJO = CONFIG_HIJO;

  // ==================== MENSAJERÍA ====================
  // Este frame habla por el mismo bus que el padre y que todos los demás: un solo camino, con
  // las mismas garantías en los dos sentidos (orden por tipo, acuse, descarte de fuentes no
  // autorizadas).
  //
  // NO se oculta al arrancar, a diferencia de hijo1 a hijo5. No es un olvido: el chat no está
  // ahí desde el principio, lo crea el padre cuando el usuario pulsa su botón. Ocultarlo hasta
  // recibir la confirmación retrasaría la única cosa que el usuario acaba de pedir.

  // El MISMO id con el que el padre registra este iframe (`abrirChat()` en codigo-padre.html).
  await bus.inicializarMensajeria({ id: 'hijo6-chat' });

  const { enviarMensaje, enviarMensajeConConfirmacion } = bus;
  /**
   * Pide un rescate al padre y devuelve su respuesta, o `null` si no llegó ninguna.
   *
   * Aquí NO se decide nada ni se muestra nada: el padre comprueba si puede concederse y
   * es él quien enseña las pantallas —la confirmación, el precio, el resultado— porque
   * sus carteles se dibujan por encima de este iframe.
   *
   * Se envía con acuse a propósito. Un envío sin respuesta dejaría al usuario pulsando un
   * botón que no hace nada visible ni le explica por qué, que es justo lo que este
   * mecanismo viene a evitar.
   */
  async function pedirRescate() {
    try {
      const respuesta = await enviarMensajeConConfirmacion({
        tipo: TIPOS_MENSAJE.CHAT.RESCATE_SOLICITADO,
        // El plazo va explicito: el bus usa 5000 fijos si no se le pasa, y este envio lo
        // calculaba con `ajustarTimeoutPorConexion`. Sin esta linea, una conexion lenta
        // perderia el margen que el rescate necesita (§16.2 del estudio).
        timeout: ajustarTimeoutPorConexion(5000),
        destino: 'padre',
        datos: {},
      });
      logger.info('[hijo6] Respuesta del padre a la petición de rescate:', respuesta);
      return respuesta ?? null;
    } catch (error_) {
      // Sin respuesta en plazo: el usuario se ha quedado sin saber nada. Queda registrado
      // en vez de desaparecer — un botón mudo es peor que no tener botón.
      logger.warn('[hijo6] La petición de rescate no obtuvo respuesta:', error_ && error_.message);
      return null;
    }
  }

  // El bus rechaza por sí mismo, y en voz alta, un segundo handler para el mismo tipo, así que
  // sobra la capa de deduplicación que había aquí. Y confirma él: el registrador propio de
  // hijo6 tenía su propia regla de acuse, distinta de la de los otros cinco.
  const registrarControladorSeguro = bus.registrarControlador;

  // ── Estado ────────────────────────────────────────────────────────────────
  let idioma      = 'es';
  let estadoPadre = {};
  let hijoListoEnviado = false;
  let inicializado = false;
  let _reintentosHijoListo = 0;
  const MAX_REINTENTOS_HIJO_LISTO = 30; // 30 intentos × 1s = 30 segundos máximo
  const INTERVALO_REINTENTO = 1000; // 1 segundo entre reintentos
  let _intervaloReintento = null;

  const TITULOS = TITULOS_CHAT;

  const tituloEl  = document.getElementById('titulo-header');
  const faqEl     = document.getElementById('faq');
  const btnCerrar = document.getElementById('btn-cerrar');
  const buzonTituloEl  = document.getElementById('buzon-titulo');
  const buzonTextoEl   = document.getElementById('buzon-texto');
  const buzonBotonEl   = document.getElementById('buzon-boton');
  const buzonGraciasEl = document.getElementById('buzon-gracias');
  const modalOverlayEl   = document.getElementById('chat-modal-overlay');
  const modalContenidoEl = document.getElementById('chat-modal-contenido');
  const modalCerrarEl    = document.getElementById('chat-modal-cerrar');

  // ── Construcción del acordeón ─────────────────────────────────────────────
  // Inserta el texto de una respuesta respetando los marcadores {{IMG:fichero}}
  // en el punto exacto donde aparecen, sustituyéndolos por <img> en línea.
  function renderTextoConImagenes(contenedor, texto) {
    contenedor.innerHTML = '';
    const partes = texto.split(/\{\{IMG:([^}]+)\}\}/g);
    partes.forEach((parte, i) => {
      if (i % 2 === 0) {
        if (parte) contenedor.appendChild(document.createTextNode(parte));
      } else {
        const img = document.createElement('img');
        img.src = `imagenes/imagenes-aplicación/${parte}.png`;
        img.alt = '';
        img.className = 'respuesta-imagen-inline';
        contenedor.appendChild(img);
      }
    });
  }

  function construirFAQ() {
    faqEl.innerHTML = '';
    // Estado del rescate según el padre, refrescado cada vez que se abre el asistente
    // (construirEstadoChat corre tanto en el saludo PADRE_DATOS como en cada abrirChat).
    // Es el dato que decide si la pregunta del atasco se pinta, y con qué número.
    const rescate = estadoPadre.rescate || null;
    for (const temaKey of ORDEN_TEMAS_CHAT) {
      const etiqueta  = TEMAS_CHAT[temaKey]?.[idioma] || TEMAS_CHAT[temaKey]?.es || temaKey;
      const claves = TEMAS_AGRUPADOS_CHAT[temaKey] || [];
      const preguntasActivas = claves.filter(k => {
        const txt = PREGUNTAS_CHAT[k]?.[idioma] || PREGUNTAS_CHAT[k]?.es || '';
        return txt.trim() !== '';
      });
      const temaBtn = document.createElement('button');
      temaBtn.className = 'tema-btn';
      temaBtn.setAttribute('aria-expanded', 'false');
      temaBtn.innerHTML = `<span>${etiqueta}</span><span class="tema-flecha" aria-hidden="true">▶</span>`;
      const lista = document.createElement('div');
      lista.className = 'preguntas-lista';
      lista.setAttribute('role', 'list');
      for (const clave of preguntasActivas) {
        // Sin el estado del padre, la pregunta del atasco no se pinta: su texto dice
        // "dispone de {total} rescates" y ese hueco solo lo puede rellenar el padre. Antes
        // que enseñar la llave en crudo, se retira la pregunta entera — y se avisa, porque
        // que falte significa que algo se ha roto antes.
        if (clave === 'UBIC_ATASCADO_TRAMO' && !rescate) {
          logger.error('[hijo6] El padre no ha mandado el estado del rescate: la pregunta del atasco no se muestra');
          continue;
        }
        const textoPregunta = PREGUNTAS_CHAT[clave]?.[idioma] || PREGUNTAS_CHAT[clave]?.es || '';
        const respuesta = RESPUESTAS_CHAT[clave]?.[idioma] || RESPUESTAS_CHAT[clave]?.es || { texto: '', enlace: null };
        const pregBtn = document.createElement('button');
        pregBtn.className = 'pregunta-btn';
        pregBtn.setAttribute('aria-expanded', 'false');
        pregBtn.innerHTML = `<span>${textoPregunta}</span><span class="pregunta-flecha" aria-hidden="true">▶</span>`;
        const panel = document.createElement('div');
        panel.className = 'respuesta-panel';
        const pTexto = document.createElement('p');
        pTexto.className = 'respuesta-texto';
        const textoRespuesta = (clave === 'UBIC_ATASCADO_TRAMO')
          ? String(respuesta.texto ?? '').split('{total}').join(String(rescate.total))
          : respuesta.texto;
        renderTextoConImagenes(pTexto, textoRespuesta);
        if (respuesta.enlace) {
          const flecha = document.createElement('button');
          flecha.type = 'button';
          flecha.className = 'respuesta-enlace-flecha';
          flecha.setAttribute('aria-label', CHAT_ABRIR_ENLACE[idioma] || CHAT_ABRIR_ENLACE.es);
          flecha.textContent = '➤';
          flecha.addEventListener('click', (evento) => {
            evento.stopPropagation();
            abrirModalEnlace(respuesta.enlace);
          });
          pTexto.appendChild(flecha);
        }
        panel.appendChild(pTexto);

        // La pregunta de quedarse atascado lleva el botón que PIDE el rescate. Es una
        // petición, no una confirmación: el precio se lo explicará el padre en su cartel,
        // y el gasto solo ocurre si el usuario dice que sí allí.
        //
        // El botón SOLO se pinta si sirve de algo. Se esconde cuando un rescate no tiene
        // sentido aquí —fuera de la aventura, en el punto de partida, o en un elemento cuya
        // llegada ya está confirmada— porque un botón que no hace nada es peor que no tener
        // botón.
        //
        // Con los rescates AGOTADOS sí se pinta, y no es una excepción caprichosa: saber que
        // se han acabado es información real, y es lo único que hace llegar al usuario el
        // cartel que se lo explica. Escondiéndolo también ahí, ese cartel no lo vería nadie.
        const rescateOfrecible = rescate.puede || rescate.motivo === 'agotados';
        if (clave === 'UBIC_ATASCADO_TRAMO' && rescateOfrecible) {
          const btnRescate = document.createElement('button');
          btnRescate.type = 'button';
          btnRescate.className = 'boton-rescate';
          btnRescate.textContent = TRADUCCIONES_RESCATE_BOTON_PEDIR[idioma] || TRADUCCIONES_RESCATE_BOTON_PEDIR.es;
          btnRescate.addEventListener('click', async (evento) => {
            evento.stopPropagation();
            if (btnRescate.disabled) return;
            btnRescate.disabled = true;            // sin esto, dos toques = dos peticiones
            try {
              await pedirRescate();
            } finally {
              btnRescate.disabled = false;
            }
          });
          panel.appendChild(btnRescate);
        }
        pregBtn.addEventListener('click', () => {
          const abierta = panel.classList.toggle('visible');
          pregBtn.setAttribute('aria-expanded', String(abierta));
        });
        const item = document.createElement('div');
        item.setAttribute('role', 'listitem');
        item.appendChild(pregBtn);
        item.appendChild(panel);
        lista.appendChild(item);
      }
      temaBtn.addEventListener('click', () => {
        const abierto = lista.classList.toggle('visible');
        temaBtn.setAttribute('aria-expanded', String(abierto));
      });
      const temaItem = document.createElement('div');
      temaItem.setAttribute('role', 'listitem');
      temaItem.appendChild(temaBtn);
      temaItem.appendChild(lista);
      faqEl.appendChild(temaItem);
    }
  }

  // ── Modal interno (términos, agradecimientos, vídeo de introducción) ──────
  // Reutiliza el mismo patrón visual que .media-overlay/.btn-cerrar-overlay
  // de codigo-padre.html (fondo oscuro, caja crema, X naranja/verde arriba a
  // la derecha), pero autocontenido dentro de este iframe — ver GUIA-COMPLETA §26.
  const _cacheModuloEnlace = {};

  async function abrirModalTexto(tipo, importar, propiedad, subPropiedad) {
    if (!_cacheModuloEnlace[tipo]) {
      const modulo = await importar();
      _cacheModuloEnlace[tipo] = modulo[propiedad][subPropiedad];
    }
    const idiomas = _cacheModuloEnlace[tipo];
    modalContenidoEl.className = 'chat-modal-contenido';
    modalContenidoEl.innerHTML = idiomas?.[idioma] || idiomas?.es || '';
    modalOverlayEl.classList.add('visible');
  }

  function abrirModalVideoIntro() {
    modalContenidoEl.className = 'chat-modal-contenido sin-padding';
    modalContenidoEl.innerHTML = '';
    const iframeVideo = document.createElement('iframe');
    // Registrar ANTES del `src`: el bus solo acepta mensajes de un iframe registrado.
    // El modal se crea y se destruye cada vez, asi que se da de baja al cerrarlo.
    globalThis.mensajeria.registrarIframe('video-intro', iframeVideo);
    iframeVideo.src = 'video-intro.html?lang=' + encodeURIComponent(idioma) + '&replay=1';
    iframeVideo.title = 'Video intro';
    modalContenidoEl.appendChild(iframeVideo);
    modalOverlayEl.classList.add('visible');
  }

  function abrirModalEnlace(enlace) {
    if (enlace === 'terminos') {
      void abrirModalTexto('terminos', () => import('./js/terminos-aventuras.js'), 'TERMINOS_AVENTURAS', 'terminos_idiomas');
    } else if (enlace === 'agradecimientos') {
      void abrirModalTexto('agradecimientos', () => import('./js/agradecimientos-aventuras.js'), 'AGRADECIMIENTOS_AVENTURAS', 'agradecimientos_idiomas');
    } else if (enlace === 'video-intro') {
      abrirModalVideoIntro();
    }
  }

  function cerrarModal() {
    modalOverlayEl.classList.remove('visible');
    // De baja antes de vaciar: el iframe del vídeo se va con el HTML, y un registro que
    // apunta a un elemento que ya no existe se queda ahí para siempre.
    globalThis.mensajeria.desregistrarIframe('video-intro');
    modalContenidoEl.innerHTML = ''; // detiene el vídeo si estaba reproduciéndose
  }
  modalCerrarEl.addEventListener('click', cerrarModal);

  // El vídeo de introducción anidado avisa de su fin exactamente igual que en
  // En-busca-del-tesoro.html — aquí solo se usa para cerrar el modal.
  //
  // Va por el bus, que solo acepta mensajes de un iframe que este frame haya registrado. La
  // escucha cruda que había aquí aceptaba ese aviso de CUALQUIER frame del dominio: bastaba
  // con mandarlo para cerrarle el modal al usuario.
  registrarControladorSeguro(TIPOS_MENSAJE.SELECCION.VIDEO_INTRO_TERMINADO, async () => {
    cerrarModal();
    return true;
  });

  function actualizarIdioma(nuevoIdioma) {
    idioma = IDIOMAS_CHAT.includes(nuevoIdioma) ? nuevoIdioma : 'es';
    tituloEl.textContent = TITULOS[idioma] || TITULOS.es;
    document.documentElement.lang = idioma;
    construirFAQ();
    actualizarTextosBuzon();
  }

  // ── Buzón de sugerencias ─────────────────────────────────────────────────
  function actualizarTextosBuzon() {
    const t = TEXTOS_BUZON_SUGERENCIAS[idioma] || TEXTOS_BUZON_SUGERENCIAS.es;
    buzonTituloEl.textContent = t.titulo;
    buzonTextoEl.placeholder  = t.placeholder;
    buzonBotonEl.textContent  = t.boton;
    buzonGraciasEl.textContent = t.gracias;
  }
  actualizarTextosBuzon();

  buzonBotonEl.addEventListener('click', async () => {
    const mensaje = buzonTextoEl.value.trim();
    if (!mensaje) return;
    buzonBotonEl.disabled = true;
    await enviarSugerencia(mensaje, {
      idioma,
      aventura: estadoPadre.aventura,
      parada: estadoPadre.paradaActualNombre,
    });
    buzonTextoEl.value = '';
    buzonGraciasEl.classList.add('visible');
    setTimeout(() => { buzonGraciasEl.classList.remove('visible'); buzonBotonEl.disabled = false; }, 3000);
  });

  // ── Eventos UI ────────────────────────────────────────────────────────────
  btnCerrar.addEventListener('click', () => { cerrarChatVentana(); });

  // ── Controladores de mensajería ───────────────────────────────────────────
  registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.PADRE_DATOS, async (mensaje) => {
    logger.info('[hijo6][PADRE_DATOS] Datos del padre recibidos');
    if (mensaje.datos) {
      estadoPadre = { ...estadoPadre, ...mensaje.datos };
      if (mensaje.datos.idioma) actualizarIdioma(mensaje.datos.idioma);
      else construirFAQ();
    }
    if (!hijoListoEnviado) {
      hijoListoEnviado = true;
      inicializado = true;
      async function enviarHijoListoConReintento() {
        try {
          await enviarMensaje({
            destino: 'padre',
            tipo: TIPOS_MENSAJE.SISTEMA.HIJO_LISTO,
            datos: { componenteId: CONFIG_HIJO.COMPONENTE_ID, iframeId: CONFIG_HIJO.IFRAME_ID, timestamp: Date.now() }
          });
          logger.info(`[hijo6] HIJO_LISTO enviado al padre (intento ${_reintentosHijoListo + 1}/${MAX_REINTENTOS_HIJO_LISTO})`);
        } catch (e) {
          logger.error('[hijo6] Error enviando HIJO_LISTO:', e && e.message);
        } finally {
          // En finally, no en el try: un fallo puntual de enviarMensaje() no debe matar
          // el resto de la secuencia de reintentos (bug real encontrado en auditoría
          // 2026-08-18 — antes, una excepción aquí paraba el bucle para siempre en
          // silencio, sin programar el siguiente intento).
          _reintentosHijoListo++;
          if (_reintentosHijoListo < MAX_REINTENTOS_HIJO_LISTO) {
            _intervaloReintento = setTimeout(enviarHijoListoConReintento, INTERVALO_REINTENTO);
          } else {
            logger.warn('[hijo6] Máximo de reintentos alcanzado');
          }
        }
      }
      enviarHijoListoConReintento();
    }
  });

  registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.PADRE_CONFIRMA_HIJO_LISTO, async (_mensaje) => {
    logger.debug('[hijo6] PADRE_CONFIRMA_HIJO_LISTO recibido');
    if (_intervaloReintento) { clearTimeout(_intervaloReintento); _intervaloReintento = null; logger.debug('[hijo6] Reintento HIJO_LISTO cancelado tras confirmación del padre'); }
  });

  registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT, async (_mensaje) => {
    await enviarMensaje({
      destino: 'padre',
      tipo: TIPOS_MENSAJE.SISTEMA.HEARTBEAT_RESPONSE,
      datos: { timestamp: Date.now(), estado: inicializado ? 'activo' : 'inicializando' }
    });
  });

  registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT_START, async () => {
    logger.debug('[hijo6] HEARTBEAT_START recibido');
  });

  registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT_PAUSE, async () => {
    logger.debug('[hijo6] HEARTBEAT_PAUSE recibido');
  });

  registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO, async (mensaje) => {
    const modo = mensaje?.datos?.modo;
    logger.debug(`[hijo6] CAMBIO_MODO recibido: ${modo}`);
    await enviarMensaje({
      destino: 'padre',
      tipo: TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_ENTENDIDO,
      datos: { modo, timestamp: Date.now(), mensajeId: mensaje.datos?.mensajeId || mensaje.id }
    });
    await enviarMensaje({
      destino: 'padre',
      tipo: TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_EFECTUADO,
      datos: { modo, exito: true, timestamp: Date.now(), mensajeId: mensaje.datos?.mensajeId || mensaje.id }
    });
  });

  registrarControladorSeguro(TIPOS_MENSAJE.CHAT.ESTADO_PADRE, async (mensaje) => {
    logger.debug('[hijo6] CHAT.ESTADO_PADRE recibido — actualizando estado');
    if (mensaje.datos) {
      estadoPadre = { ...estadoPadre, ...mensaje.datos };
      // El `else` es la red de seguridad, y aquí importa más que en PADRE_DATOS: este
      // mensaje llega en CADA apertura del asistente y es el que trae el estado del rescate
      // — si el botón se pinta y con qué número. Quien reconstruye el FAQ es
      // actualizarIdioma(), así que sin idioma no se reconstruiría nada y el botón se
      // quedaría con el estado de la apertura anterior: visible cuando no debe, o escondido
      // cuando hace falta, y en silencio.
      //
      // Hoy no puede pasar (construirEstadoChat() siempre manda idioma, con 'es' como último
      // recurso), pero PADRE_DATOS ya tenía esta rama y este handler no: dos caminos casi
      // iguales con distinta garantía es justo la forma del fallo que dejó el chat en
      // español durante semanas.
      if (mensaje.datos.idioma) actualizarIdioma(mensaje.datos.idioma);
      else construirFAQ();
    }
  });

  // ── HIJO_PREPARADO — después de registrar todos los controladores ─────────
  try {
    await enviarMensaje({
      destino: 'padre',
      tipo: TIPOS_MENSAJE.SISTEMA.HIJO_PREPARADO,
      datos: { componenteId: CONFIG_HIJO.COMPONENTE_ID, version: '1.0.0', tipo: 'CHAT', capacidades: ['chat', 'faq'], timestamp: Date.now() }
    });
    logger.debug('[hijo6] HIJO_PREPARADO enviado; esperando PADRE_DATOS');
  } catch (e) { logger.warn('[hijo6] Error enviando HIJO_PREPARADO:', e && e.message); }

  // Construcción inicial
  construirFAQ();
</script>

</body>
