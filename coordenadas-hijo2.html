    (function(){
        function escalar(){
            var w, h;
            w = globalThis.innerWidth; h = globalThis.innerHeight;
            var f = Math.max(16, Math.min(Math.min(w, h) * 0.025, 18));
            document.documentElement.style.fontSize = f + "px";
            // Dimensiones reales del iframe (fiables en móvil, no afectadas por bugs vw/vh)
            document.documentElement.style.setProperty('--iframe-w', globalThis.innerWidth + 'px');
            document.documentElement.style.setProperty('--iframe-h', globalThis.innerHeight + 'px');
        }
        escalar();
        globalThis.addEventListener("resize", escalar);
    })();
    </script>

// ==================== INICIALIZACIÓN DE MENSAJERÍA ====================

import { obtenerMapaVintage } from './js/mapa-vintage-aventuras.js';
import { ajustarTimeoutPorConexion } from './js/utils.js';

// Fallbacks que esperan a que globalThis.mensajeria esté disponible
const enviarMensaje = async (...args) => {
    // En hijos, usar postMessage directamente al padre
    if (globalThis.parent && globalThis.parent !== globalThis) {
        const mensaje = args[0];
        try {
            globalThis.parent.postMessage({
                tipo: mensaje.tipo,
                origen: mensaje.origen || CONFIG_HIJO.IFRAME_ID,
                destino: mensaje.destino,
                datos: mensaje.datos,
                timestamp: Date.now()
            }, globalThis.location.origin);
            return;
        } catch (e) {
            logger.error('[hijo2] Error enviando mensaje via postMessage:', e);
            throw e;
        }
    } else {
        // Fallback al método anterior si no estamos en iframe
        return await retryUntilAvailable(
            () => globalThis.mensajeria.enviarMensaje(...args),
            () => globalThis.mensajeria && globalThis.mensajeria.enviarMensaje,
            10, 500, (...a) => (globalThis.logger || console).error(...a)
        );
    }
};

const registrarControlador = async (tipo, callback) => {
    // En hijos, los controladores se registran localmente para mensajes del padre
    if (globalThis.parent && globalThis.parent !== globalThis) {
        // Registrar listener para mensajes del padre
        const listener = (event) => {
            if (event.source === globalThis.parent && event.data && event.data.tipo === tipo) {
                callback(event.data);
            }
        };
        globalThis.addEventListener('message', listener);
        return () => globalThis.removeEventListener('message', listener);
    } else {
        // Fallback al método anterior
        return await retryUntilAvailable(
            () => globalThis.mensajeria.registrarControlador(tipo, callback),
            () => globalThis.mensajeria && globalThis.mensajeria.registrarControlador,
            10, 500, (...a) => (globalThis.logger || console).error(...a)
        );
    }
};

const enviarMensajeConConfirmacion = async (...args) => {
    // Similar a enviarMensaje pero esperando confirmación
    if (globalThis.parent && globalThis.parent !== globalThis) {
        const mensaje = args[0];
        return new Promise((resolve, reject) => {
            const idMensaje = 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2);
            const timeout = setTimeout(() => reject(new Error('Timeout esperando confirmación')),
                ajustarTimeoutPorConexion(5000));

            const confirmListener = (event) => {
                if (event.source === globalThis.parent && event.data && event.data.tipo === 'SISTEMA.CONFIRMACION' && event.data.idOriginal === idMensaje) {
                    clearTimeout(timeout);
                    globalThis.removeEventListener('message', confirmListener);
                    resolve();
                }
            };

            globalThis.addEventListener('message', confirmListener);

            try {
                globalThis.parent.postMessage({
                    tipo: mensaje.tipo,
                    origen: mensaje.origen || CONFIG_HIJO.IFRAME_ID,
                    destino: mensaje.destino,
                    datos: mensaje.datos,
                    timestamp: Date.now(),
                    id: idMensaje,
                    requiereConfirmacion: true
                }, globalThis.location.origin);
            } catch (e) {
                clearTimeout(timeout);
                globalThis.removeEventListener('message', confirmListener);
                reject(e);
            }
        });
    } else {
        return await retryUntilAvailable(
            () => globalThis.mensajeria.enviarMensajeConConfirmacion(...args),
            () => globalThis.mensajeria && globalThis.mensajeria.enviarMensajeConConfirmacion,
            10, 500, (...a) => (globalThis.logger || console).error(...a)
        );
    }
};

// ==================== MESSAGING ADAPTER PARA COMUNICACIÓN CON PADRE ====================
// Este adapter permite a los hijos registrar controladores centralmente en el state-manager del padre
if (globalThis !== undefined && globalThis.messagingAdapter === undefined) {
    globalThis.messagingAdapter = {
        _listenerRegistry: new Map(),

        /**
         * Registra un controlador en el state-manager centralizado del padre
         * @param {string} controladorId - ID único del controlador
         * @param {Function} handler - Función manejadora
         * @param {Object} opciones - Opciones incluyendo tipoMensaje
         * @returns {Promise<boolean>} - True si se registró, false si ya existía
         */
        registrarControladorCentral: async function(controladorId, handler, opciones = {}) {
            const iframeId = globalThis.name || (CONFIG_HIJO !== undefined && CONFIG_HIJO.IFRAME_ID) || 'hijo';
            const tipo = opciones.tipoMensaje || controladorId;

            // Evitar doble registro del mismo tipo
            if (this._listenerRegistry.has(tipo)) {
                (globalThis.logger || console).warn && (globalThis.logger || console).warn(`[messagingAdapter] Listener ya registrado para ${tipo}, omitiendo`);
                return false;
            }

            // Registrar listener local para este tipo de mensaje
            const adapterListener = async function(event) {
                if (event.source === globalThis.parent && event.data && event.data.tipo === tipo) {
                    try {
                        // Ejecutar handler y capturar resultado (soporta async)
                        const resultado = await Promise.resolve(handler(event.data));

                        // Enviar confirmación automática si el mensaje lo requiere
                        if (event.data.requiereConfirmacion && event.data.id) {
                            globalThis.parent.postMessage({
                                tipo: 'SISTEMA.CONFIRMACION',
                                idOriginal: event.data.id,
                                datos: resultado,
                                timestamp: Date.now(),
                                origen: iframeId
                            }, globalThis.location.origin);
                        }
                    } catch (e) {
                        (globalThis.logger || console).error && (globalThis.logger || console).error(`[messagingAdapter] Error en handler ${tipo}:`, e && e.message);

                        // Enviar confirmación de error si el mensaje lo requiere
                        if (event.data.requiereConfirmacion && event.data.id) {
                            globalThis.parent.postMessage({
                                tipo: 'SISTEMA.CONFIRMACION',
                                idOriginal: event.data.id,
                                datos: { error: e && e.message },
                                timestamp: Date.now(),
                                origen: iframeId
                            }, globalThis.location.origin);
                        }
                    }
                }
            };
            globalThis.addEventListener('message', adapterListener);
            this._listenerRegistry.set(tipo, adapterListener);

            (globalThis.logger || console).info && (globalThis.logger || console).info(`[messagingAdapter] Handler registrado para ${tipo} en ${iframeId}`);
            return true;
        },

        /**
         * Envía mensaje al padre para que lo procese centralmente
         */
        enviarMensajeCentral: async function(mensaje) {
            if (globalThis.parent && globalThis.parent !== globalThis) {
                globalThis.parent.postMessage(mensaje, globalThis.location.origin);
                return { exito: true, metodo: 'postMessage' };
            }
            return { exito: false, error: 'No hay padre disponible' };
        }
    };
    (globalThis.logger || console).info && (globalThis.logger || console).info('[HIJO] messagingAdapter creado para comunicación con padre');

    // Limpiar todos los listeners al abandonar el iframe
    globalThis.addEventListener('pagehide', function() {
        if (globalThis.messagingAdapter && globalThis.messagingAdapter._listenerRegistry) {
            for (const listener of globalThis.messagingAdapter._listenerRegistry.values()) {
                globalThis.removeEventListener('message', listener);
            }
            globalThis.messagingAdapter._listenerRegistry.clear();
        }
    }, { once: true });
}

// Wrapper seguro para evitar doble registro de controladores en hijos
if (globalThis !== undefined && globalThis.registrarControladorSeguro === undefined) {
    globalThis.__CONTROLADOR_REGISTRADOS = globalThis.__CONTROLADOR_REGISTRADOS || new Set();

    async function _intentarRegistroCentral(tipo, handler) {
        const iframeId = (globalThis.name || (CONFIG_HIJO !== undefined && CONFIG_HIJO.IFRAME_ID) || 'hijo');
        const controladorId = `${iframeId}:${tipo}`;
        if (globalThis.messagingAdapter && typeof globalThis.messagingAdapter.registrarControladorCentral === 'function') {
            try {
                const centralRes = await globalThis.messagingAdapter.registrarControladorCentral(controladorId, handler, { tipoMensaje: tipo });
                if (centralRes === true) {
                    (globalThis.logger || console).info && (globalThis.logger || console).info(`[HIJO] registrarControlador registered centrally: ${controladorId} -> ${tipo}`);
                    return true;
                }
            } catch (e) {
                (globalThis.logger || console).warn && (globalThis.logger || console).warn(`[HIJO] Central registrar failed for ${tipo}: ${e && e.message}`);
            }
        }
        return false;
    }

    async function _intentarRegistroMensajeria(tipo, handler, _opciones) {
        if (typeof registrarControlador === 'function') {
            try {
                const res = await registrarControlador(tipo, handler);
                (globalThis.logger || console).info && (globalThis.logger || console).info(`[HIJO] registrarControlador delegated for ${tipo}`);
                return res;
            } catch (error) {
                (globalThis.logger || console).error && (globalThis.logger || console).error(`[HIJO] Error registrando controlador ${tipo}:`, error);
            }
        }
        return undefined;
    }

    globalThis.registrarControladorSeguro = async function(tipo, handler, opciones) {
        try {
            (globalThis.logger || console).info && (globalThis.logger || console).info(`[HIJO] registrarControladorSeguro called: ${tipo}`);
            if (!tipo || typeof handler !== 'function') {
                (globalThis.logger || console).warn && (globalThis.logger || console).warn(`[HIJO] registrarControladorSeguro parámetros inválidos: tipo=${tipo}`);
                return;
            }
            if (globalThis.__CONTROLADOR_REGISTRADOS.has(tipo)) {
                (globalThis.logger || console).warn && (globalThis.logger || console).warn(`[HIJO] Controlador ya registrado, omitiendo: ${tipo}`);
                return;
            }
            globalThis.__CONTROLADOR_REGISTRADOS.add(tipo);

            try {
                if (await _intentarRegistroCentral(tipo, handler)) return true;
                const res = await _intentarRegistroMensajeria(tipo, handler, opciones);
                if (res !== undefined) return res;
            } catch (e) {
                (globalThis.logger || console).warn && (globalThis.logger || console).warn(`[HIJO] Error in registration attempts for ${tipo}: ${e && e.message}`);
            }

            (globalThis.logger || console).info && (globalThis.logger || console).info(`[HIJO] Handler queued for migration: ${tipo} (local queue)`);
            return;
        } catch (e) {
            (globalThis.logger || console).error(`[HIJO] Error registrando controlador seguro ${tipo}:`, e && e.message);
        }
    }

    // Helper: safeRegistrar delegates to registrarControladorSeguro when available
    if (globalThis !== undefined && globalThis.safeRegistrar === undefined) {
        globalThis.safeRegistrar = async function(tipo, handler, opciones) {
            try {
                if (!tipo || typeof handler !== 'function') return;
                if (globalThis.__CONTROLADOR_REGISTRADOS && globalThis.__CONTROLADOR_REGISTRADOS.has(tipo)) return;
                if (typeof globalThis.registrarControladorSeguro === 'function') return globalThis.registrarControladorSeguro(tipo, handler, opciones);
                if (typeof registrarControlador === 'function') return registrarControlador(tipo, handler);
            } catch (e) { (globalThis.logger || console).warn && (globalThis.logger || console).warn('[HIJO] safeRegistrar error', e && e.message); }
        };
    }
}

    tiempoFueraRequerido: 5 * 60 * 1000, // 5 minutos en milisegundos — solo aplica a la franja 21-50m

// Asignar referencias DOM al estado

// Función para actualizar estado visual

    // Estado visual deshabilitado

// Función para marcar botón como activo
function setBotonActivo(botonId) {
    Object.values(elementosDOM).forEach(btn => btn?.classList.remove('activo'));
    if (elementosDOM[botonId]) {
        elementosDOM[botonId].classList.add('activo');
    }
}

// Función para desactivar un botón
function desactivarBoton(boton) {
    if (!boton) return;
    boton.disabled = true;
    boton.classList.add('disabled');
    boton.setAttribute('aria-disabled', 'true');
    boton.setAttribute('title', 'Función no disponible en este momento');
}

// Función para activar un botón
function activarBoton(boton, titulo = '') {
    if (!boton) return;
    boton.disabled = false;
    boton.classList.remove('disabled');
    boton.setAttribute('aria-disabled', 'false');
    if (titulo) {
        boton.setAttribute('title', titulo);
    }
}

// Las pantallas de fuera de rango (foto-fuera-rango / foto_lejos_ubicación / fotogpserror)
// y su cuenta atrás viven en el padre a pantalla completa — este iframe solo calcula
// la distancia y decide sus propios botones; ver GUIA-COMPLETA §30.

// Actualizar los estados de todos los botones según reglas específicas
// ARQUITECTURA TOLERANCIA GPS:
// - PARADAS: rangos fijos (GPS 5-20m, Ubicación >10.50m)
// - TRAMOS: tolerancia DINÁMICA calculada en funciones-mapa.js
//   * GPS habilitado: 5m hasta toleranciaGPS (puede ser 150m+ en tramos largos)
//   * VIDEO habilitado: 5m hasta toleranciaGPS (para ver video completo del tramo)
//   * Razón: Usuario necesita seguir polyline completa con waypoints del tramo

function _actualizarBotonVideo(elementosDOM, retoActivo, tipoParadaActual, idParadaActual) {
    if (!elementosDOM.btnVideo) return;
    const esTramo = tipoParadaActual === 'tramo' || (idParadaActual && idParadaActual.startsWith('TR-'));
    if (retoActivo) {
        desactivarBoton(elementosDOM.btnVideo);
        logger.debug('🎥 Botón video DESACTIVADO: reto activo');
    } else if (esTramo) {
        activarBoton(elementosDOM.btnVideo);
        logger.debug(`🎥 Botón video ACTIVADO: tramo seleccionado (${idParadaActual})`);
    } else {
        desactivarBoton(elementosDOM.btnVideo);
        logger.debug('🎥 Botón video DESACTIVADO: no es tramo');
    }
}

function _actualizarBotonGps(elementosDOM, modo, retoActivo, tipoParadaActual, idParadaActual, distanciaAlDestino, toleranciaGPS) {
    if (!elementosDOM.btnAvanzar) return;
    if (estadoComponente.btnAvanzarDeshabilitadoExternamente) {
        desactivarBoton(elementosDOM.btnAvanzar);
        return;
    }
    const esTramo = tipoParadaActual === 'tramo' || (idParadaActual && idParadaActual.startsWith('TR-'));
    if (modo === 'casa') {
        desactivarBoton(elementosDOM.btnAvanzar);
        logger.debug('🛰️ Botón GPS DESACTIVADO: modo casa (forzado)');
        return;
    }
    if (retoActivo) {
        desactivarBoton(elementosDOM.btnAvanzar);
        logger.debug('🛰️ Botón GPS DESACTIVADO: reto activo');
        return;
    }
    if (modo === 'aventura') {
        _actualizarGpsEnModoAventura(elementosDOM.btnAvanzar, esTramo, idParadaActual, distanciaAlDestino, toleranciaGPS);
    }
}

function _actualizarGpsEnModoAventura(btnAvanzar, esTramo, idParadaActual, distanciaAlDestino, toleranciaGPS) {
    const rangoMinimo = esTramo ? 5 : 0;
    const rangoMaximo = esTramo ? toleranciaGPS : 20;
    const distanciaEnRango = distanciaAlDestino !== null &&
                           distanciaAlDestino >= rangoMinimo &&
                           distanciaAlDestino <= rangoMaximo;
    if (distanciaEnRango) {
        activarBoton(btnAvanzar);
        logger.debug(`🛰️ Botón GPS ACTIVADO (${esTramo ? 'TRAMO' : 'PARADA'}): distancia ${distanciaAlDestino.toFixed(1)}m en rango ${rangoMinimo}-${rangoMaximo}m`);
    } else {
        desactivarBoton(btnAvanzar);
        logger.debug(`🛰️ Botón GPS DESACTIVADO: distancia ${distanciaAlDestino?.toFixed(1) || 'desconocida'}m fuera de rango ${rangoMinimo}-${rangoMaximo}m`);
        // GPS.RESTRINGIDO (con la distancia real, para las pantallas del padre) lo envía
        // verificarDistanciaYActualizarBotones() en cada posición, no esta función — así
        // sigue enviándose aunque btn-ubicacion ya esté habilitado y este bloque deje de
        // ejecutarse (actualizarEstadoBotones() corta antes de llegar aquí en ese caso).
    }
}

function _actualizarBotonUbicacion(elementosDOM, modo, retoActivo) {
    if (!elementosDOM.btnUbicacion) return;
    if (modo === 'casa') {
        desactivarBoton(elementosDOM.btnUbicacion);
        logger.debug('🧭 Botón ubicación DESACTIVADO: modo casa (forzado)');
    } else if (modo === 'aventura') {
        if (retoActivo) {
            desactivarBoton(elementosDOM.btnUbicacion);
            logger.debug('🧭 Botón ubicación DESACTIVADO: reto activo');
        }
        // En caso contrario, no tocar: verificarDistanciaYActualizarBotones() manda.
    } else {
        desactivarBoton(elementosDOM.btnUbicacion);
        logger.debug(`🧭 Botón ubicación DESACTIVADO: fuera de condiciones`);
    }
}

function _desactivarBotonesRangoExcedido(elementosDOM) {
    if (elementosDOM.btnVideo) desactivarBoton(elementosDOM.btnVideo);
    if (elementosDOM.btnAvanzar) desactivarBoton(elementosDOM.btnAvanzar);
    if (elementosDOM.btnMapaCompleto) desactivarBoton(elementosDOM.btnMapaCompleto);
    if (elementosDOM.btnMapaJpg) desactivarBoton(elementosDOM.btnMapaJpg);
    if (elementosDOM.btnUbicacion) activarBoton(elementosDOM.btnUbicacion);
    logger.debug('⚠️ Fuera de rango real: solo btn-ubicacion habilitado, resto deshabilitado');
}

function actualizarEstadoBotones() {
    const {
        modo,
        distanciaAlDestino,
        tipoParadaActual,
        idParadaActual,
        toleranciaGPS,
        elementosDOM,
        controlesHabilitados,
        retoActivo
    } = estadoComponente;

    if (tipoParadaActual === 'tramo' && toleranciaGPS !== 50) {
        logger.debug(`[hijo2] 📏 Usando tolerancia GPS dinámica: ${toleranciaGPS}m para ${idParadaActual}`);
    }

    if (!controlesHabilitados) {
        Object.values(elementosDOM).forEach(boton => desactivarBoton(boton));
        return;
    }

    if (estadoComponente.fueraDeRangoActivo) {
        _desactivarBotonesRangoExcedido(elementosDOM);
        return;
    }

    _actualizarBotonVideo(elementosDOM, retoActivo, tipoParadaActual, idParadaActual);

    if (elementosDOM.btnImagen) {
        if (retoActivo) {
            desactivarBoton(elementosDOM.btnImagen);
            logger.debug('📷 Botón imagen DESACTIVADO: reto activo');
        } else {
            activarBoton(elementosDOM.btnImagen);
            logger.debug('📷 Botón imagen ACTIVADO: sin reto');
        }
    }

    _actualizarBotonGps(elementosDOM, modo, retoActivo, tipoParadaActual, idParadaActual, distanciaAlDestino, toleranciaGPS);
    _actualizarBotonUbicacion(elementosDOM, modo, retoActivo);

    if (elementosDOM.btnMapaCompleto) activarBoton(elementosDOM.btnMapaCompleto);
    if (elementosDOM.btnMapaJpg) activarBoton(elementosDOM.btnMapaJpg);
}

/**
 * ID real de la parada de inicio ("Torres de Serranos") de la aventura activa.
 * Se usa como destino por defecto cuando todavía no hay ninguna parada/tramo
 * activo (estadoComponente.idParadaActual vacío). El ID lleva siempre el
 * prefijo de la aventura (p.ej. "Av1-P-0", "Av34km-P-0") — nunca el literal
 * "P-0" a secas, que no coincide con ningún id real en ninguna aventura.
 * Se busca en el array ya cargado localmente, así que sirve para cualquier
 * aventura sin necesitar saber su prefijo de antemano.
 */
function _idParadaInicio() {
    const paradas = globalThis.__vv_coordenadasAventura || [];
    return paradas.find(p => p.tipo === 'inicio')?.id || null;
}

function _procesarDentroDeRango(btn, logPrefix) {
    btn.disabled = true;
    btn.style.backgroundColor = '#f44336';
    btn.style.opacity = '0.6';
    if (estadoComponente.timestampSalioDeRango !== null) {
        logger.info(`${logPrefix} ✅ Usuario volvió DENTRO de rango`);
        estadoComponente.timestampSalioDeRango = null;
        estadoComponente._notificacionFueraRangoEnviada = false;
        enviarMensaje({
            tipo: TIPOS_MENSAJE.NAVEGACION.GPS.DENTRO_DE_RANGO,
            origen: CONFIG_HIJO.IFRAME_ID,
            destino: resolverIdPadre(),
            datos: { timestamp: Date.now() }
        }).catch(e => logger.debug(`${logPrefix} Error notificando dentro de rango:`, e.message));
    }
    if (estadoComponente.fueraDeRangoActivo) {
        estadoComponente.fueraDeRangoActivo = false;
        logger.info(`${logPrefix} ✅ Fuera de rango DESACTIVADO: usuario volvió a ruta`);
        actualizarEstadoBotones();
    }
}

function _procesarFueraDeRangoConfirmado(btn, logPrefix, franja) {
    btn.disabled = false;
    btn.style.backgroundColor = '#4CAF50';
    btn.style.opacity = '1';
    if (!estadoComponente.fueraDeRangoActivo) {
        estadoComponente.fueraDeRangoActivo = true;
        actualizarEstadoBotones();
        logger.info(`${logPrefix} ✅ Fuera de rango ACTIVADO (franja: ${franja}): GPS/video/mapas/avanzar deshabilitados`);
    }
    if (!estadoComponente._notificacionFueraRangoEnviada) {
        estadoComponente._notificacionFueraRangoEnviada = true;
        logger.info(`${logPrefix} ✅ btn-ubicacion HABILITADO (franja: ${franja})`);
        enviarMensaje({
            tipo: TIPOS_MENSAJE.NAVEGACION.USUARIO_FUERA_RANGO,
            origen: CONFIG_HIJO.IFRAME_ID,
            destino: resolverIdPadre(),
            datos: { distancia: estadoComponente.distanciaAlDestino, franja, elementoMasCercano: estadoComponente.idParadaActual || null, timestamp: Date.now() }
        }).catch(e => logger.debug(`${logPrefix} Error notificando usuario fuera de rango:`, e.message));
        // La polyline NO se envía sola aquí — solo al pulsar btn-ubicacion (ver su listener
        // de click): así el GPS tiene tiempo de asentarse mientras el usuario reacciona.
    }
}

/**
 * Verifica si el usuario está dentro/fuera del rango real de la parada/tramo actual
 * (20m parada / toleranciaGPS tramo — el mismo umbral que btn-avanzar) y actualiza
 * el botón de ubicación. Fuera de ese rango, informa al padre de la distancia real
 * en cada posición (GPS.RESTRINGIDO) para que decida qué pantalla de aviso mostrar
 * (§30 de la guía) — la franja 21-50m además espera 5 minutos antes de habilitar
 * ubicación; las franjas 51-2000m y >2000m lo hacen al instante.
 * Solo se ejecuta en modo aventura.
 */
function verificarDistanciaYActualizarBotones() {
    const logPrefix = '[hijo2][verificarDistanciaYActualizarBotones]';
    const { distanciaAlDestino, idParadaActual, tipoParadaActual, toleranciaGPS } = estadoComponente;
    if (distanciaAlDestino === undefined || distanciaAlDestino === null) {
        logger.warn(`${logPrefix} No hay distancia a parada actual disponible`);
        return;
    }

    const esTramo = tipoParadaActual === 'tramo' || (idParadaActual && idParadaActual.startsWith('TR-'));
    const rangoMaximo = esTramo ? toleranciaGPS : 20; // mismo umbral real que usa btn-avanzar
    const dentroDeRango = distanciaAlDestino <= rangoMaximo;
    const ahora = Date.now();
    const btn = elementosDOM.btnUbicacion;
    if (!btn) {
        logger.warn(`${logPrefix} Botón de ubicación no encontrado`);
        return;
    }

    if (dentroDeRango) {
        _procesarDentroDeRango(btn, logPrefix);
        return;
    }

    if (estadoComponente.timestampSalioDeRango === null) {
        estadoComponente.timestampSalioDeRango = ahora;
        logger.info(`${logPrefix} ⚠️ Usuario SALIÓ de rango real (${rangoMaximo}m) de ${idParadaActual}`);
    }

    // Informar al padre de la distancia real en cada posición fuera de rango — mantiene
    // el número visible en pantalla actualizado y decide qué pantalla mostrar (§30).
    if (idParadaActual) {
        enviarMensaje({
            tipo: TIPOS_MENSAJE.NAVEGACION.GPS.RESTRINGIDO,
            origen: CONFIG_HIJO.IFRAME_ID,
            destino: resolverIdPadre(),
            datos: { idParada: idParadaActual, distancia: distanciaAlDestino, rangoMaximo, timestampSalioDeRango: estadoComponente.timestampSalioDeRango }
        }).catch(e => logger.debug(`${logPrefix} Error notificando GPS restringido:`, e.message));
    }

    let franja;
    if (distanciaAlDestino > 2000) franja = 'muylejos';
    else if (distanciaAlDestino > 50) franja = 'lejos';
    else franja = 'fuera';

    if (franja !== 'fuera') {
        // 51-2000m y >2000m: habilitación inmediata, sin cuenta atrás
        _procesarFueraDeRangoConfirmado(btn, logPrefix, franja);
        return;
    }

    const tiempoFuera = ahora - estadoComponente.timestampSalioDeRango;
    if (tiempoFuera >= estadoComponente.tiempoFueraRequerido) {
        _procesarFueraDeRangoConfirmado(btn, logPrefix, franja);
    } else {
        btn.disabled = true;
        btn.style.backgroundColor = '#f44336';
        btn.style.opacity = '0.6';
        const segundosRestantes = Math.ceil(Math.max(0, estadoComponente.tiempoFueraRequerido - tiempoFuera) / 1000);
        logger.debug(`${logPrefix} ⏳ ${idParadaActual}: a ${distanciaAlDestino}m, esperando: ${segundosRestantes}s restantes`);
    }
}

// Inicializar estado de botones al cargar
function _buscarTextoParada(idParadaActual) {
    try {
        const textos = globalThis.__vv_textosAventura;
        if (textos && Array.isArray(textos) && textos.length > 0) {
            const paradaNorm = idParadaActual.replaceAll('-', '');
            const textoParada = textos.find(t => t && t.id && t.id.replaceAll('-', '').includes(paradaNorm)) || null;
            if (textoParada) logger.info(`[hijo2] Texto encontrado para ${idParadaActual}: "${textoParada.title}"`);
            return textoParada;
        }
    } catch (textoErr) {
        logger.warn(`[hijo2] Error buscando texto para parada:`, textoErr);
    }
    return null;
}

async function _reproducirVideoParada(idParadaActual) {
    if (!idParadaActual) {
        logger.warn(`[hijo2] No hay parada seleccionada - abriendo ventana de video vacía`);
        await enviarMensaje({ tipo: TIPOS_MENSAJE.UI.ACCION_USUARIO, origen: CONFIG_HIJO.IFRAME_ID, destino: resolverIdPadre(), datos: { accion: 'reproducir-video', sinContenido: true, mensajeError: 'No hay parada/tramo seleccionado' } });
        actualizarEstado('Ventana video abierta (sin parada)', 'warn');
        return;
    }
    const datosDisponibles = obtenerCoordenadasParadas();
    const parada = datosDisponibles.find(p => p.id === idParadaActual || p.parada_id === idParadaActual);
    if (!parada) {
        logger.warn(`[hijo2] No se encontró parada/tramo ${idParadaActual} - abriendo ventana de video vacía`);
        logger.debug(`[hijo2][DEBUG] IDs disponibles:`, datosDisponibles?.map(p => ({ id: p.id, parada_id: p.parada_id })));
        await enviarMensaje({ tipo: TIPOS_MENSAJE.UI.ACCION_USUARIO, origen: CONFIG_HIJO.IFRAME_ID, destino: resolverIdPadre(), datos: { accion: 'reproducir-video', sinContenido: true, mensajeError: 'No hay video disponible para esta parada/tramo' } });
        actualizarEstado('Ventana video abierta (sin datos)', 'warn');
        return;
    }
    logger.debug(`[hijo2][DEBUG_VIDEO] Parada encontrada:`, { id: parada.id, nombre: parada.nombre, tieneVideo: !!parada.video, urlVideo: parada.video, tieneImagen: !!parada.imagen });
    const urlVideo = parada.video;
    const hayVideo = urlVideo && urlVideo.trim() !== '';
    if (!hayVideo) logger.warn(`[hijo2] No hay video para parada/tramo ${idParadaActual} - abriendo ventana con mensaje`);
    await enviarMensaje({
        tipo: TIPOS_MENSAJE.UI.ACCION_USUARIO,
        origen: CONFIG_HIJO.IFRAME_ID,
        destino: resolverIdPadre(),
        datos: { accion: 'reproducir-video', paradaActual: idParadaActual, urlVideo: hayVideo ? urlVideo : null, nombre: parada.nombre || parada.title, sinContenido: !hayVideo, mensajeError: hayVideo ? null : 'No hay video disponible para esta parada/tramo' }
    });
    actualizarEstado(hayVideo ? 'Reproduciendo video' : 'Ventana de video abierta (sin contenido)', hayVideo ? 'success' : 'warn');
    logger.info(`[hijo2] Ventana video solicitada para parada/tramo ${idParadaActual}:`, { hayVideo, urlVideo });
}

// ── Spin behavior (AVENTURA) ──
// Botones glow-activo giran cada 5 s hasta ser pulsados; se reinicia en cada CAMBIO_PARADA.
// Definido a nivel de módulo para que _resetSpinsAventura sea accesible desde los controladores
// de mensajes registrados fuera del bloque DOMContentLoaded.
const _spinState = new Map(); // id → { intervalId, pressed }

function _iniciarSpinBtn(btn) {
    if (!btn) return;
    _detenerSpinBtn(btn);
    const state = { intervalId: null, pressed: false };
    state.intervalId = setInterval(() => {
        if (state.pressed || btn.disabled) return;
        btn.classList.remove('spinning');
        void btn.offsetWidth; // forzar reflow para reiniciar animación
        btn.classList.add('spinning');
        btn.addEventListener('animationend', () => btn.classList.remove('spinning'), { once: true });
    }, 5000);
    _spinState.set(btn.id, state);
    btn.addEventListener('click', () => {
        state.pressed = true;
        clearInterval(state.intervalId);
        _spinState.delete(btn.id);
    }, { once: true });
}

function _detenerSpinBtn(btn) {
    if (!btn) return;
    const s = _spinState.get(btn.id);
    if (s) { clearInterval(s.intervalId); _spinState.delete(btn.id); }
    btn.classList.remove('spinning');
}

function _resetSpinsAventura() {
    [
        elementosDOM.btnVideo, elementosDOM.btnAvanzar, elementosDOM.btnUbicacion,
        elementosDOM.btnImagen
    ].forEach(btn => _iniciarSpinBtn(btn));
}

// Mapa vintage y mapa completo: habilitados no molestan a la vista con el spin
// periódico — solo giran cuando el usuario los pulsa de verdad (mismo patrón que
// #mas-opciones en extrainfo-hijo1.html: gira en cada click, no solo el primero).
// No basta con animationend: el mismo click también dispara setBotonActivo(), que
// añade/quita la clase .activo en TODOS los botones — eso cambia qué regla CSS de
// animación coincide con el elemento (glow-suave depende de :not(.activo)) y hace
// que Chromium cancele el spin en curso sin disparar animationend nunca. El
// setTimeout es la red de seguridad real; animationend solo adelanta la limpieza
// si por lo que sea sí llega a dispararse.
function _spinAlPulsar(btn) {
    if (!btn || btn.dataset.spinAlPulsarInit === 'true') return;
    btn.dataset.spinAlPulsarInit = 'true';
    let spinTimeoutId = null;
    const quitarSpin = () => { btn.classList.remove('spinning'); clearTimeout(spinTimeoutId); spinTimeoutId = null; };
    btn.addEventListener('animationend', quitarSpin);
    btn.addEventListener('click', () => {
        btn.classList.remove('spinning');
        void btn.offsetWidth; // forzar reflow para reiniciar animación
        btn.classList.add('spinning');
        clearTimeout(spinTimeoutId);
        spinTimeoutId = setTimeout(quitarSpin, 950); // duración de spin-btn (0.9s) + margen
    });
}

document.addEventListener('DOMContentLoaded', async () => {
    actualizarEstadoBotones();

    _resetSpinsAventura();
    _spinAlPulsar(elementosDOM.btnMapaCompleto);
    _spinAlPulsar(elementosDOM.btnMapaJpg);

    // Event listeners para los botones
    elementosDOM.btnAvanzar?.addEventListener('click', async () => {
    try {
        estadoComponente.gpsActivo = !estadoComponente.gpsActivo;
        setBotonActivo(estadoComponente.gpsActivo ? 'btnAvanzar' : null);

        await enviarMensajeConConfirmacion({
        tipo: TIPOS_MENSAJE.NAVEGACION.GPS.ACTIVAR,
        origen: CONFIG_HIJO.IFRAME_ID,
        destino: resolverIdPadre(),
        datos: {
            activar: estadoComponente.gpsActivo,
            idParada: estadoComponente.idParadaActual,
            distancia: estadoComponente.distanciaAlDestino
        }
        });

        actualizarEstado(estadoComponente.gpsActivo ? 'GPS activado' : 'GPS desactivado', 'success');
        logger.info(`[hijo2] GPS ${estadoComponente.gpsActivo ? 'activado' : 'desactivado'}`);
    } catch (error) {
        logger.error(`[hijo2] Error al activar GPS:`, error);
        actualizarEstado('Error GPS', 'error');
    }
});

elementosDOM.btnImagen?.addEventListener('click', async () => {
    try {
        setBotonActivo('btnImagen');
        logger.info(`[hijo2][BOTON_IMAGEN] Botón pulsado, verificando estado:`, {
            idParadaActual: estadoComponente.idParadaActual,
            tipoParada: estadoComponente.tipoParadaActual,
            modo: estadoComponente.modo,
            datosRecibidos: estadoComponente.datosRecibidos
        });
        logger.info(`[hijo2][BOTON_IMAGEN] ID actual confirmado: "${estadoComponente.idParadaActual}" (tipo: ${typeof estadoComponente.idParadaActual})`);

        if (!estadoComponente.idParadaActual) {
            logger.warn(`[hijo2] No hay parada seleccionada - abriendo ventana de imagen vacía`);
            await enviarMensaje({ tipo: TIPOS_MENSAJE.UI.ACCION_USUARIO, origen: CONFIG_HIJO.IFRAME_ID, destino: resolverIdPadre(), datos: { accion: 'mostrar-imagen', sinContenido: true, mensajeError: 'No hay parada seleccionada' } });
            actualizarEstado('Ventana imagen abierta (sin parada)', 'warn');
            return;
        }

        let datosDisponibles = obtenerCoordenadasParadas();
        if (datosDisponibles.length === 0 && estadoComponente.idParadaActual) {
            // Coordenadas aún no propagadas — esperar hasta 2 s
            let intentos = 0;
            while (datosDisponibles.length === 0 && intentos < 20) {
                await new Promise(r => setTimeout(r, 100));
                datosDisponibles = obtenerCoordenadasParadas();
                intentos++;
            }
            if (datosDisponibles.length === 0) logger.warn('[hijo2][BOTON_IMAGEN] Coordenadas no disponibles tras espera');
        }
        const parada = datosDisponibles.find(p => p.id === estadoComponente.idParadaActual || p.parada_id === estadoComponente.idParadaActual);

        if (!parada) {
            logger.warn(`[hijo2] No se encontró parada ${estadoComponente.idParadaActual} - abriendo ventana de imagen vacía`);
            logger.debug(`[hijo2][DEBUG] IDs disponibles:`, datosDisponibles?.map(p => ({ id: p.id, parada_id: p.parada_id })));
            await enviarMensaje({ tipo: TIPOS_MENSAJE.UI.ACCION_USUARIO, origen: CONFIG_HIJO.IFRAME_ID, destino: resolverIdPadre(), datos: { accion: 'mostrar-imagen', sinContenido: true, mensajeError: 'No hay imagen disponible para esta parada' } });
            actualizarEstado('Ventana imagen abierta (sin datos)', 'warn');
            return;
        }

        logger.debug(`[hijo2][DEBUG_IMAGEN] Parada encontrada:`, { id: parada.id, nombre: parada.nombre, tieneImagen: !!parada.imagen, urlImagen: parada.imagen, tieneVideo: !!parada.video });

        const todasImagenes = [parada.imagen, parada.imagen2, parada.imagen3, parada.imagen4]
            .filter(url => url && typeof url === 'string' && url.trim() !== '');
        const urlImagen = todasImagenes.length > 0 ? todasImagenes[0] : null;
        const hayImagen = todasImagenes.length > 0;
        const tipoEntrada = (parada.id && parada.id.startsWith('TR')) || estadoComponente.tipoParadaActual === 'tramo' ? 'tramo' : 'parada';
        const mapaNumero = parada.mapa_numero == null ? null : parada.mapa_numero;

        if (!hayImagen) logger.warn(`[hijo2] No hay imagen para parada ${estadoComponente.idParadaActual} - abriendo ventana con mensaje`);

        const textoParada = _buscarTextoParada(estadoComponente.idParadaActual);

        await enviarMensaje({
            tipo: TIPOS_MENSAJE.UI.ACCION_USUARIO,
            origen: CONFIG_HIJO.IFRAME_ID,
            destino: resolverIdPadre(),
            datos: {
                accion: 'mostrar-imagen',
                paradaActual: estadoComponente.idParadaActual,
                urlImagen: hayImagen ? urlImagen : null,
                nombre: parada.nombre || parada.title,
                sinContenido: !hayImagen,
                mensajeError: hayImagen ? null : 'No hay imagen disponible para esta parada/tramo',
                textoParada,
                imagenes: todasImagenes,
                tipo: tipoEntrada,
                mapa_numero: mapaNumero
            }
        });

        const mensaje = hayImagen ? 'Mostrando imagen' : 'Ventana de imagen abierta (sin contenido)';
        actualizarEstado(mensaje, hayImagen ? 'success' : 'warn');
        logger.info(`[hijo2] Ventana imagen solicitada para parada ${estadoComponente.idParadaActual}:`, { hayImagen, urlImagen, totalImagenes: todasImagenes.length, tipo: tipoEntrada, mapa_numero: mapaNumero });
    } catch (error) {
        logger.error(`[hijo2] Error al mostrar imagen:`, error);
        actualizarEstado('Error imagen', 'error');
    }
});
