<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>
    /* Escalado proporcional PURO: sincronizar con viewport del padre SIN LÍMITES */
    (function(){
        function escalar(){
            var w, h;
            w = globalThis.innerWidth; h = globalThis.innerHeight;
            var f = Math.max(16, Math.min(Math.min(w, h) * 0.025, 18));
            document.documentElement.style.fontSize = f + "px";
            // Dimensiones reales del iframe (fiables en móvil, no afectadas por bugs vw/vh)
            document.documentElement.style.setProperty('--iframe-w', globalThis.innerWidth + 'px');
        }
        escalar();
        globalThis.addEventListener("resize", escalar);
    })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"> <!-- NOSONAR -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains; preload">
    <title>coordenadas-hijo2</title>
    <script src="js/almacenamiento.js"></script>
    <script src="js/proteccion.js"></script>
    <script src="js/suppress-warnings.js"></script>
    <style>
        /* Escalado proporcional puro: 2.5% del menor lado del viewport */
        html {
            font-size: clamp(16px, 5vmin, 18px);
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Fuente global Verdana */
        * { font-family: Verdana, sans-serif !important; }

        :root {
            --btn-size: calc(var(--iframe-w, 100vw) - 2px);
            --icon-size: 1.3em;
            --trapecio-width: 100%; /* Ocupar todo el ancho del iframe */
            --trapecio-bg: transparent;
        }

        /* Encapsular estilos */
        .hijo2-container body, .hijo2-container html {
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
            font-family: Arial, sans-serif;
            overflow: hidden !important;
            max-height: 100% !important;
            max-width: 100% !important;
        }

        body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: transparent !important;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* Contenedor principal con bordes redondeados */
        .container {
            width: var(--trapecio-width);
            height: 100% !important;
            max-height: 100% !important;
            background: var(--trapecio-bg);
            border-radius: 0.75rem 0 0 0.75rem; /* Bordes izquierdos redondeados (lado mapa) */
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* botones pegados al borde derecho */
            justify-content: flex-end;
            gap: 6px;
            z-index: 1200;
            padding: 3px 2px 3px 0;
            box-sizing: border-box;
            border: none;
            margin: 0;
            position: relative;
        }

        .boton {
            width: var(--btn-size);
            height: var(--btn-size);
            flex-shrink: 0;
            position: relative;
            border-radius: 50%;
            border: none;
            /* Verde medio #00BB77 por defecto — botones de orientación (mapa completo,
               mapa vintage) que no cambian de estado con la frecuencia de los otros 4. */
            background: linear-gradient(#00BB77, #00BB77);
            color: white;
            font-size: var(--icon-size);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Verde vivo #00FF00 — los 4 botones que más cambian de estado según el progreso
           real del usuario (dron/vídeo, imagen, ubicación, avanzar). :not(.disabled) evita
           competir con .boton.disabled más abajo — sin él, un ID siempre gana a una clase
           por especificidad, disabled o no. */
        #btn-video:not(.disabled),
        #btn-imagen:not(.disabled),
        #btn-avanzar:not(.disabled),
        #btn-ubicacion:not(.disabled) {
            background: linear-gradient(#00FF00, #00FF00);
        }

        .boton.activo {
            background: linear-gradient(135deg, #007bff, #0056b3);
            transform: scale(1.05);
            box-shadow: none;
        }

        @media (hover: hover) {
            .boton:hover {
                transform: scale(1.05);
                box-shadow: none;
            }
        }

        .boton:active {
            transform: scale(0.93);
            box-shadow: none;
        }

        .boton.disabled {
            background: linear-gradient(#ED2100, #ED2100);
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none;
        }

        .boton.disabled:hover {
            transform: none;
            box-shadow: none;
        }

        /* ── Glow animations (AVENTURA) ── */
        /* Sin "inset": el <img> del botón cubre el 103% de su área (ver .boton img más
           abajo) y un box-shadow inset se pinta por debajo de ese <img> opaco — invisible
           siempre, sin importar el color (reporte de uso real 2026-08-10). Un glow hacia
           fuera sí queda libre, porque nada cubre el borde exterior del círculo. */
        /* El fondo (background) también pulsa verde→cian→verde, sincronizado con el halo —
           visible a través de las zonas semitransparentes de cada icono, igual que ya
           pasa hoy con verde/rojo habilitado/deshabilitado. linear-gradient de un único
           color (no background-color) por el mismo motivo que el resto de la app: un
           bypass inline nunca puede taparlo, background-image siempre pinta encima. */
        @keyframes glow-suave {
            0%, 100% { box-shadow: 0 0 8px 2px rgba(0,240,255,0.25); background: linear-gradient(#00FF00, #00FF00); }
            50%       { box-shadow: 0 0 18px 4px rgba(0,240,255,0.65); background: linear-gradient(#00F0FF, #00F0FF); }
        }
        @keyframes glow-activo {
            0%, 100% { box-shadow: 0 0 10px 2px rgba(0,240,255,0.35); background: linear-gradient(#00FF00, #00FF00); }
            50%       { box-shadow: 0 0 26px 5px rgba(0,240,255,0.85); background: linear-gradient(#00F0FF, #00F0FF); }
        }
        @keyframes spin-btn {
            0%   { transform: rotate(0deg);    box-shadow: 0 0 10px 2px rgba(0,240,255,0.35); background: linear-gradient(#00FF00, #00FF00); }
            50%  { box-shadow: 0 0 30px 6px rgba(0,240,255,0.9); background: linear-gradient(#00F0FF, #00F0FF); }
            60%  { transform: rotate(1080deg); }
            85%  { transform: rotate(1350deg); }
            100% { transform: rotate(1440deg); box-shadow: 0 0 10px 2px rgba(0,240,255,0.35); background: linear-gradient(#00FF00, #00FF00); }
        }

        /* Glow suave: siempre activo cuando habilitado. Mapa completo/vintage sin
           animación — el usuario no lo pidió para esos dos, quedaba oculto por el bug del
           inset y solo se ha notado ahora que el halo es visible de verdad. */
        #btn-imagen:not(.activo) {
            animation: glow-suave 3s ease-in-out infinite;
        }
        /* Glow prominente: botones que requieren atención del usuario.
           :not(.disabled) — no :not([disabled]) — para usar la MISMA señal que
           .boton.disabled (arriba) y #btn-video:not(.disabled) (verde vivo, más
           arriba): un botón desactivado solo por clase (sin la propiedad/atributo
           disabled) debe dejar de brillar igual que uno desactivado por completo.
           Antes de este fix, el glow (que anima background hasta un cian #00F0FF a
           mitad de ciclo) seguía corriendo mientras solo faltara el atributo, y esa
           animación gana al background estático de .boton.disabled — hallazgo de
           la auditoría 2026-08-15, ver docs/GUIA-COMPLETA.md §4.8. */
        #btn-video:not(.disabled):not(.activo),
        #btn-avanzar:not(.disabled):not(.activo),
        #btn-ubicacion:not(.disabled):not(.activo) {
            animation: glow-activo 3s ease-in-out infinite;
        }
        /* Spin: anula el glow mientras dura el giro */
        .spinning {
            animation: spin-btn 0.9s cubic-bezier(0.2,0.8,0.4,1) forwards !important;
        }

    </style>
    <style>
        /* Botón: imagen interna */
        .boton img {
            position: absolute;
            top: -1.5%;
            left: -1.5%;
            width: 103%;
            height: 103%;
            min-width: 103%;
            min-height: 103%;
            max-width: none;
            max-height: none;
            margin: 0;
            padding: 0;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            display: block;
            pointer-events: none; /* evitar que la img bloquee clicks */
        }


        /* El overlay de fuera de rango y su cuenta atrás viven en el padre a pantalla completa
           (#foto-fuera-rango-overlay), no en este iframe — ver GUIA-COMPLETA §31. */
    </style>
</head>
<body class="hijo2-container">
    <!-- Contenedor columna vertical con 6 botones -->
    <div class="container">
        <button id="btn-mapa-completo" class="boton" title="Mostrar Mapa Completo">
            <img src="imagenes/imagenes-aplicación/H2-fotomapa-moderno.png" alt="Mapa moderno">
        </button>
        <button id="btn-mapa-jpg" class="boton" title="Mostrar Mapa JPG">
            <img src="imagenes/imagenes-aplicación/H2-fotomapa-vintage.png" alt="Mapa vintage">
        </button>
        <button id="btn-video" class="boton" title="Reproducir Video">
            <img src="imagenes/imagenes-aplicación/H2-fotodron.png" alt="Video">
        </button>
        <button id="btn-imagen" class="boton" title="Mostrar Imagen">
            <img src="imagenes/imagenes-aplicación/H2-fotoproximo-monumento.png" alt="Parada">
        </button>
        <button id="btn-avanzar" class="boton" title="Avanzar">
            <img src="imagenes/imagenes-aplicación/fotoruta-A-B.png" alt="Avanzar">
        </button>
        <button id="btn-ubicacion" class="boton" title="Centrar en Ubicación">
            <img src="imagenes/imagenes-aplicación/H2-fotodistancia.png" alt="Ubicación">
        </button>
    </div>

    <script type="module">
        import * as bus from './js/mensajeria.js';
        // Importado por su efecto: al cargarse instala la captura de `error` y
        // `unhandledrejection` de este frame. El bus ya lo arrastra, pero de ahí no se
        // deduce leyendo este fichero.
        import './js/utils.js';
        import { esIdDeTramo } from './js/utils.js';

        // Este frame no guarda datos de la aventura, ni coordenadas ni textos: sabe en qué
        // elemento está (el id y el tipo, de NAVEGACION.CAMBIO_PARADA) y a qué distancia (de
        // NAVEGACION.ACTUALIZAR_ESTADO). Sus botones solo piden, y lo que enseñan lo resuelve el
        // padre con sus propios datos (docs/estudio-caminos.md, K-130).

// ==================== INICIALIZACIÓN DE MENSAJERÍA ====================

import { ajustarTimeoutPorConexion, ocultarInterfazHastaConfirmar } from './js/utils.js';

// ==================== MENSAJERÍA ====================
// Este frame habla por el mismo bus que el padre y que todos los demás: un solo camino, con
// las mismas garantías en los dos sentidos (orden por tipo, acuse, descarte de fuentes no
// autorizadas). Mandar con `parent.postMessage` a pelo desde aquí se salta todas ellas.

// Ocultar la interfaz AQUI, antes del primer `await` de este modulo, y no mas abajo.
//
// Un modulo con await de nivel superior deja saltar el `load` del iframe mientras espera:
// si el ocultado va despues del await del bus, la interfaz queda visible todo ese tiempo.
// MEDIDO al migrar hijo1 al bus: el ocultado paso de ocurrir antes de `load` a ocurrir
// despues (iphone12). Vale para CUALQUIER hijo que se pase al bus: el ocultado va antes.
//
// ocultarInterfazHastaConfirmar guarda el display propio del body, y mostrarInterfaz() se lo devuelve.
const mostrarInterfaz = ocultarInterfazHastaConfirmar('block');

// El MISMO id con el que el padre registra este iframe (los cargadores
// de codigo-padre.html). Si no coinciden, el padre le escribe a un sitio y este frame se
// presenta como otro, y ninguno de los dos se entera.
await bus.inicializarMensajeria({ id: 'hijo2' });

const { enviarMensaje, enviarMensajeConConfirmacion } = bus;

// El bus rechaza por sí mismo, y en voz alta, un segundo handler para el mismo tipo, así que
// sobra la capa de deduplicación que había aquí. `safeRegistrar` era un cuarto nombre para lo
// mismo, definido en seis hijos y usado solo aquí, en dos sitios: se queda uno.
const registrarControladorSeguro = bus.registrarControlador;

// NOTA: Bloque IIFE "RESPALDO" para PADRE_PIDE_MANEJADORES eliminado (obsoleto).
// El sistema actual usa state-manager centralizado sin necesidad de migración manual.

import { TIPOS_MENSAJE } from './js/constants.js';
import logger from './js/logger.js';
// Publica el logger en el globalThis de ESTE iframe. Cada iframe tiene el suyo, y el
// `globalThis.logger = ...` de codigo-padre.html solo alcanza al del padre: sin esta
// linea, los `(globalThis.logger || console).x` de este fichero caian al console crudo
// y se saltaban el nivel de log (ver GUIA-COMPLETA.md §26.3).
globalThis.logger = logger;
import { CONFIG } from './js/config.js';

const CONFIG_HIJO = {
    IFRAME_ID: 'hijo2',
    COMPONENTE_ID: 'COORDENADAS',
    DEBUG: true
};

// ═══════════════════════════════════════════════════════════════════════════
// 🔧 UTILIDADES - AJUSTE DINÁMICO DE TIMEOUTS
// ═══════════════════════════════════════════════════════════════════════════


// Estado del componente
const estadoComponente = {
    modo: 'casa',
    gpsActivo: false,
    distanciaAlDestino: null,
    tipoParadaActual: null, // 'parada' o 'tramo'
    idParadaActual: null,  // 'P-X' o 'TR-X'
    toleranciaGPS: 50, // Valor de arranque, solo vigente hasta el primer ACTUALIZAR_ESTADO.
    // «Avanzar» lo decide el padre, en un solo sitio (_decidirAvanzar en codigo-padre.html): el
    // modo, un reto abierto, el bloqueo de 5 km, el fuera de rango con la gracia agotada y el
    // elemento completado. Aquí solo se obedece: CONTROL.HABILITAR lo enciende y
    // CONTROL.DESHABILITAR lo apaga. Un elemento nuevo o un cambio de modo lo dejan apagado hasta
    // que el padre diga otra cosa. Este frame no lo enciende por cercanía: con sus propios
    // umbrales, se encendía en un tramo antes de la llegada (docs/estudio-caminos.md, K-86).
    avanzarHabilitadoPorPadre: false,
    inicializado: false, // Estado de inicialización del componente
    elementosDOM: {}, // Referencias a botones
    retoActivo: false, // Flag para saber si hay un reto en progreso
    ubicacionActiva: false, // Flag para saber si ubicación está activa
    posicionActualUsuario: null, // {lat, lng} Posición GPS recibida del padre
    timestampSalioDeRango: null, // Timestamp cuando salió del rango real (rangoMaximo: 15m parada / toleranciaGPS tramo)
    ayudaFueraDeRangoActiva: false, // Flag: true en cuanto se detecta fuera de rango real — habilita ubicación/mapas AL INSTANTE, sin esperar la gracia (ver _habilitarAyudaFueraDeRango)
    fueraDeRangoActivo: false, // Flag: true cuando la GRACIA de la franja ya expiró — vídeo deshabilitado y padre notificado, que apaga «avanzar» (ver _procesarFueraDeRangoConfirmado)
    _notificacionFueraRangoEnviada: false, // Evita reenviar NAVEGACION.USUARIO_FUERA_RANGO en cada tick mientras la restricción sigue activa
    _notificacionSenalNoFiableEnviada: false, // Evita reenviar NAVEGACION.GPS.PRECISION_INSUFICIENTE en cada tick de mala precisión
    _ventanaLlegada: { id: null, lecturas: [] }, // Las últimas lecturas dentro o fuera del radio de llegada, del elemento `id` (ver _confirmarPorVentana)
    _ventanaRango: { id: null, lecturas: [] }, // Lo mismo para volver dentro de rango: pide la misma confirmación que la llegada (K-185)
    _llegadaConfirmadaEn: null, // id de la parada cuya llegada ya se confirmó: solo desde ahí alejarse tiene la gracia de su franja (K-185)
    hijoListoEnviado: false  // Flag para evitar envío duplicado de HIJO_LISTO
};

// Tiempo de gracia antes de restringir vídeo/avanzar/audio/reto por franja de distancia
// (ver verificarDistanciaYActualizarBotones) — "fuera" y "desviado" dan margen a un desvío
// real (recado rápido, rodeo por obras); "lejos"/"perdido" no tienen gracia, a esa distancia
// ya no es un desvío de la ruta sino un probable abandono o error. La ayuda (btn-ubicacion/
// mapas) NUNCA espera esta gracia — se habilita al instante en cualquier franja, ver
// docs/GUIA-COMPLETA.md §31.4.
const _GRACIA_FUERA_DE_RANGO_MS = {
    fuera: 7 * 60 * 1000,      // 7 min — 15m(parada)/toleranciaGPS(tramo) a 50m
    desviado: 15 * 60 * 1000,  // 15 min — 50m a 150m
    lejos: 0,                  // 150m a 2000m — instantáneo
    perdido: 0                 // >2000m — instantáneo
};

// Referencias DOM
const elementosDOM = {
    btnAvanzar: document.getElementById('btn-avanzar'),
    btnImagen: document.getElementById('btn-imagen'),
    btnVideo: document.getElementById('btn-video'),
    btnUbicacion: document.getElementById('btn-ubicacion'),
    btnMapaCompleto: document.getElementById('btn-mapa-completo'),
    btnMapaJpg: document.getElementById('btn-mapa-jpg')
};

// Asignar referencias DOM al estado
estadoComponente.elementosDOM = elementosDOM;

// Función para marcar botón como activo
function setBotonActivo(botonId) {
    Object.values(elementosDOM).forEach(btn => btn?.classList.remove('activo'));
    if (elementosDOM[botonId]) {
        elementosDOM[botonId].classList.add('activo');
    }
}

// Función para desactivar un botón
function desactivarBoton(boton) {
    if (!boton) return;
    boton.disabled = true;
    boton.classList.add('disabled');
    boton.setAttribute('aria-disabled', 'true');
    boton.setAttribute('title', 'Función no disponible en este momento');
}

// Función para activar un botón
function activarBoton(boton, titulo = '') {
    if (!boton) return;
    boton.disabled = false;
    boton.classList.remove('disabled');
    boton.setAttribute('aria-disabled', 'false');
    if (titulo) {
        boton.setAttribute('title', titulo);
    }
}

// Las pantallas de fuera de rango (foto-fuera-rango / foto_lejos_ubicación / fotogpserror)
// y su cuenta atrás viven en el padre a pantalla completa — este iframe solo calcula
// la distancia y decide sus propios botones; ver GUIA-COMPLETA §31.

// Actualizar los estados de todos los botones según reglas específicas
// - «Avanzar»: lo que diga el padre (avanzarHabilitadoPorPadre); aquí no se mide nada para él.
// - Fuera de rango (verificarDistanciaYActualizarBotones): 15 m en paradas; en tramos, la
//   tolerancia DINÁMICA calculada en funciones-mapa.js (puede pasar de 150 m en tramos largos),
//   porque el usuario sigue la polyline completa, con sus waypoints.

function _actualizarBotonVideo(elementosDOM, retoActivo, tipoParadaActual, idParadaActual) {
    if (!elementosDOM.btnVideo) return;
    const esTramo = tipoParadaActual === 'tramo' || esIdDeTramo(idParadaActual);
    if (retoActivo) {
        desactivarBoton(elementosDOM.btnVideo);
        logger.debug('🎥 Botón video DESACTIVADO: reto activo');
    } else if (esTramo) {
        activarBoton(elementosDOM.btnVideo);
        logger.debug(`🎥 Botón video ACTIVADO: tramo seleccionado (${idParadaActual})`);
    } else {
        desactivarBoton(elementosDOM.btnVideo);
        logger.debug('🎥 Botón video DESACTIVADO: no es tramo');
    }
}

function _actualizarBotonGps(elementosDOM) {
    if (!elementosDOM.btnAvanzar) return;
    if (estadoComponente.avanzarHabilitadoPorPadre) {
        activarBoton(elementosDOM.btnAvanzar);
        logger.debug('🛰️ Botón avanzar ACTIVADO: lo ha encendido el padre');
    } else {
        desactivarBoton(elementosDOM.btnAvanzar);
        logger.debug('🛰️ Botón avanzar DESACTIVADO: el padre no lo ha encendido');
    }
}

function _actualizarBotonUbicacion(elementosDOM, modo, retoActivo) {
    if (!elementosDOM.btnUbicacion) return;
    if (modo === 'casa') {
        desactivarBoton(elementosDOM.btnUbicacion);
        logger.debug('🧭 Botón ubicación DESACTIVADO: modo casa (forzado)');
    } else if (modo === 'aventura') {
        if (retoActivo) {
            desactivarBoton(elementosDOM.btnUbicacion);
            logger.debug('🧭 Botón ubicación DESACTIVADO: reto activo');
        }
        // En caso contrario, no tocar: verificarDistanciaYActualizarBotones() manda.
    } else {
        desactivarBoton(elementosDOM.btnUbicacion);
        logger.debug(`🧭 Botón ubicación DESACTIVADO: fuera de condiciones`);
    }
}

// Habilita ubicación/mapas al instante, nada más detectarse fuera de rango real —
// independiente de la gracia (ver _GRACIA_FUERA_DE_RANGO_MS): pedir ayuda no tiene
// coste, así que no espera a que la franja termine de dar margen. Llamada desde
// verificarDistanciaYActualizarBotones() en cada posición fuera de rango.
function _habilitarAyudaFueraDeRango(logPrefix) {
    if (!estadoComponente.ayudaFueraDeRangoActiva) {
        estadoComponente.ayudaFueraDeRangoActiva = true;
        logger.info(`${logPrefix} ✅ Ayuda habilitada al instante: ubicación disponible (gracia en curso)`);
        actualizarEstadoBotones();
    }
}

function _desactivarBotonesRangoExcedido(elementosDOM) {
    if (elementosDOM.btnVideo) desactivarBoton(elementosDOM.btnVideo);
    // «Avanzar» no se toca aquí: lo apaga el padre al recibir USUARIO_FUERA_RANGO.
    // Los mapas (completo y vintage) ayudan a un usuario perdido a orientarse — el mismo
    // motivo por el que btn-ubicacion se mantiene activo, no un motivo distinto — así que
    // se habilitan junto a él en vez de bloquearse con el vídeo.
    if (elementosDOM.btnMapaCompleto) activarBoton(elementosDOM.btnMapaCompleto);
    if (elementosDOM.btnMapaJpg) activarBoton(elementosDOM.btnMapaJpg);
    if (elementosDOM.btnUbicacion) activarBoton(elementosDOM.btnUbicacion);
    logger.debug('⚠️ Fuera de rango real: ubicación y mapas habilitados, vídeo deshabilitado');
}

function actualizarEstadoBotones() {
    const {
        modo,
        tipoParadaActual,
        idParadaActual,
        toleranciaGPS,
        elementosDOM,
        retoActivo
    } = estadoComponente;

    // El 50 es el valor de arranque de estadoComponente (arriba), no un umbral: esto solo
    // evita registrar la traza mientras todavía no ha llegado ningún ACTUALIZAR_ESTADO.
    if (tipoParadaActual === 'tramo' && toleranciaGPS !== 50) {
        logger.debug(`[hijo2] 📏 Usando tolerancia GPS dinámica: ${toleranciaGPS}m para ${idParadaActual}`);
    }

    // «Avanzar», antes que nada: no depende de nada de este frame, tampoco del fuera de rango.
    _actualizarBotonGps(elementosDOM);

    if (estadoComponente.fueraDeRangoActivo) {
        _desactivarBotonesRangoExcedido(elementosDOM);
        return;
    }

    _actualizarBotonVideo(elementosDOM, retoActivo, tipoParadaActual, idParadaActual);

    if (elementosDOM.btnImagen) {
        if (retoActivo) {
            desactivarBoton(elementosDOM.btnImagen);
            logger.debug('📷 Botón imagen DESACTIVADO: reto activo');
        } else {
            activarBoton(elementosDOM.btnImagen);
            logger.debug('📷 Botón imagen ACTIVADO: sin reto');
        }
    }

    // Ayuda (ubicación) al instante en cuanto se detecta fuera de rango real, aunque la
    // gracia de esa franja todavía no haya expirado (fueraDeRangoActivo sigue false) —
    // pedir el mapa no tiene coste, no hay motivo para esperar. Gana a
    // _actualizarBotonUbicacion salvo que haya un reto activo o estemos en CASA, que
    // siguen teniendo prioridad (mismo criterio que ya tenía este botón antes de la gracia).
    if (estadoComponente.avanzarHabilitadoPorPadre) {
        // Con «avanzar» encendido el elemento ya está completado —por el rescate o andando— y
        // hijo2 sigue teniendo como actual el que el usuario va a dejar atrás. Tras un rescate,
        // la ubicación le dibujaría la ruta de vuelta a la valla de la que acaba de salir, que es
        // lo contrario de ayudarle; tras completarlo andando, quien ya ha completado el punto no
        // necesita que le guíen hasta donde está parado, necesita pulsar avanzar. En cuanto
        // pulsa, el elemento cambia y el botón vuelve a su vida normal.
        desactivarBoton(elementosDOM.btnUbicacion);
    } else if (!retoActivo && modo === 'aventura' && estadoComponente.ayudaFueraDeRangoActiva) {
        activarBoton(elementosDOM.btnUbicacion);
    } else {
        _actualizarBotonUbicacion(elementosDOM, modo, retoActivo);
    }

    if (elementosDOM.btnMapaCompleto) activarBoton(elementosDOM.btnMapaCompleto);
    if (elementosDOM.btnMapaJpg) activarBoton(elementosDOM.btnMapaJpg);
}

// ============================================================
// FUNCIONES HELPER PARA VALIDACIÓN GPS
// ============================================================

function _procesarDentroDeRango(btn, logPrefix) {
    // desactivarBoton() (no un color puesto a mano) porque el fondo base de .boton es
    // un degradado CSS (background, no background-color) — un background-color inline
    // queda tapado por él y el botón se ve verde aunque disabled=true lo bloquee de
    // verdad. La clase .disabled sí gana porque redefine el mismo shorthand `background`.
    desactivarBoton(btn);
    if (estadoComponente.timestampSalioDeRango !== null) {
        logger.info(`${logPrefix} ✅ Usuario volvió DENTRO de rango`);
        estadoComponente.timestampSalioDeRango = null;
        estadoComponente._notificacionFueraRangoEnviada = false;
        enviarMensaje({
            tipo: TIPOS_MENSAJE.NAVEGACION.GPS.DENTRO_DE_RANGO,
            destino: 'padre',
            datos: { timestamp: Date.now() }
        }).catch(e => logger.debug(`${logPrefix} Error notificando dentro de rango:`, e.message));
    }
    let cambioBotones = false;
    if (estadoComponente.ayudaFueraDeRangoActiva) {
        estadoComponente.ayudaFueraDeRangoActiva = false;
        cambioBotones = true;
    }
    if (estadoComponente.fueraDeRangoActivo) {
        estadoComponente.fueraDeRangoActivo = false;
        logger.info(`${logPrefix} ✅ Fuera de rango DESACTIVADO: usuario volvió a ruta`);
        cambioBotones = true;
    }
    if (cambioBotones) actualizarEstadoBotones();
}

// Aplica la RESTRICCIÓN (aquí, el vídeo deshabilitado; el padre, al recibir
// USUARIO_FUERA_RANGO, apaga su audio, el retosBtn de hijo3 y «avanzar») una vez agotada la
// gracia de la franja — la ayuda (ubicación/mapas) ya se habilitó al instante en
// _habilitarAyudaFueraDeRango, antes de llegar aquí.
function _procesarFueraDeRangoConfirmado(logPrefix, franja, distanciaParaRango) {
    if (!estadoComponente.fueraDeRangoActivo) {
        estadoComponente.fueraDeRangoActivo = true;
        actualizarEstadoBotones();
        logger.info(`${logPrefix} ✅ Fuera de rango ACTIVADO (franja: ${franja}, gracia agotada): vídeo deshabilitado; «avanzar» lo apaga el padre`);
    }
    if (!estadoComponente._notificacionFueraRangoEnviada) {
        estadoComponente._notificacionFueraRangoEnviada = true;
        enviarMensaje({
            tipo: TIPOS_MENSAJE.NAVEGACION.USUARIO_FUERA_RANGO,
            destino: 'padre',
            datos: { distancia: distanciaParaRango ?? estadoComponente.distanciaAlDestino, franja, elementoMasCercano: estadoComponente.idParadaActual || null, timestamp: Date.now() }
        }).catch(e => logger.debug(`${logPrefix} Error notificando usuario fuera de rango:`, e.message));
        // La polyline NO se envía sola aquí — solo al pulsar btn-ubicacion (ver su listener
        // de click): así el GPS tiene tiempo de asentarse mientras el usuario reacciona.
    }
}

/**
 * Verifica si el usuario está dentro/fuera del rango real de la parada/tramo actual
 * (15m parada / toleranciaGPS tramo) y actualiza
 * el botón de ubicación. Fuera de ese rango, informa al padre de la distancia real
 * en cada posición (GPS.RESTRINGIDO) para que decida qué pantalla de aviso mostrar
 * (§30 de la guía) — las 4 franjas (fuera/desviado/lejos/perdido) habilitan ubicación
 * al instante: es el usuario quien decide cuándo pulsarla, no un umbral de tiempo
 * calculado por la app. Lo que SÍ espera un tiempo de gracia (7 min "fuera", 15 min
 * "desviado"; instantáneo en "lejos"/"perdido") es la RESTRICCIÓN de vídeo/avanzar/
 * audio/reto — ver _GRACIA_FUERA_DE_RANGO_MS.
 * Solo se ejecuta en modo aventura.
 */
function verificarDistanciaYActualizarBotones() {
    const logPrefix = '[hijo2][verificarDistanciaYActualizarBotones]';
    const { distanciaAlDestino, distanciaAlCamino, idParadaActual, tipoParadaActual, toleranciaGPS } = estadoComponente;
    if (distanciaAlDestino === undefined || distanciaAlDestino === null) {
        logger.warn(`${logPrefix} No hay distancia a parada actual disponible`);
        return;
    }

    const esTramo = tipoParadaActual === 'tramo' || esIdDeTramo(idParadaActual);
    // El aviso de "fuera de rango" mide desviación del CAMINO, no cercanía al destino —
    // en un tramo, comparar contra el punto de fin marcaba "fuera de rango" nada más
    // empezar a caminar (el propio punto de inicio ya puede estar a varias decenas de
    // metros en línea recta del final). distanciaAlCamino (funciones-mapa.js, proyección
    // sobre inicio->waypoints->fin) es ~0 en el punto de partida y crece solo si el
    // usuario de verdad se aleja de la ruta. En paradas no hay "camino" que seguir —
    // ahí distanciaAlCamino llega igual a distanciaAlDestino (mismo valor, ver
    // procesarPosicionGPSParaAventura), así que el fallback es solo por si el mensaje
    // aún no lo incluye. La llegada real (_detectarLlegadaTramo/_detectarLlegadaParada)
    // sigue midiendo contra distanciaAlDestino — llegar exige estar cerca del final, no
    // solo del camino.
    const distanciaParaRango = (esTramo && typeof distanciaAlCamino === 'number') ? distanciaAlCamino : distanciaAlDestino;
    const rangoMaximo = esTramo ? toleranciaGPS : 15; // 15 m en paradas; en tramos, la tolerancia del tramo
    const dentroDeRango = distanciaParaRango <= rangoMaximo;
    const ahora = Date.now();
    const btn = elementosDOM.btnUbicacion;
    if (!btn) {
        logger.warn(`${logPrefix} Botón de ubicación no encontrado`);
        return;
    }

    // Volver dentro de rango pide la misma confirmación que la llegada: dos de las cuatro
    // últimas lecturas. Con una sola, una lectura ruidosa estando a 30 m encendía el audio
    // (docs/estudio-caminos.md, K-185). Quien no ha salido no necesita confirmar nada.
    const confirmaDentro = _confirmarPorVentana(estadoComponente._ventanaRango, dentroDeRango, idParadaActual);
    if (dentroDeRango) {
        if (estadoComponente.timestampSalioDeRango === null || confirmaDentro) _procesarDentroDeRango(btn, logPrefix);
        return;
    }

    if (estadoComponente.timestampSalioDeRango === null) {
        estadoComponente.timestampSalioDeRango = ahora;
        logger.info(`${logPrefix} ⚠️ Usuario SALIÓ de rango real (${rangoMaximo}m) de ${idParadaActual}`);
    }

    // Informar al padre de la distancia real en cada posición fuera de rango — mantiene
    // el número visible en pantalla actualizado y decide qué pantalla mostrar (§30).
    if (idParadaActual) {
        enviarMensaje({
            tipo: TIPOS_MENSAJE.NAVEGACION.GPS.RESTRINGIDO,
            destino: 'padre',
            datos: { idParada: idParadaActual, distancia: distanciaParaRango, rangoMaximo, timestampSalioDeRango: estadoComponente.timestampSalioDeRango }
        }).catch(e => logger.debug(`${logPrefix} Error notificando GPS restringido:`, e.message));
    }

    let franja;
    if (distanciaParaRango > 2000) franja = 'perdido';
    else if (distanciaParaRango > 150) franja = 'lejos';
    else if (distanciaParaRango > 50) franja = 'desviado';
    else franja = 'fuera';

    // La ayuda (ubicación/mapas) se habilita al instante, en cualquier franja.
    _habilitarAyudaFueraDeRango(logPrefix);

    // La restricción (vídeo/avanzar/audio/reto) espera la gracia de la franja —
    // 0 en lejos/perdido, así que ahí sigue siendo instantánea como antes. En una parada
    // (y en el inicio), la gracia es para quien ya llegó y se aleja un rato, p. ej. a una
    // tienda a 20 m: antes de la llegada confirmada no hay gracia, y el audio no se
    // enciende hasta llegar (K-185). En un tramo se va andando hacia la llegada, y la
    // gracia, que es para desvíos como unas obras, corre durante el camino.
    const esperaLaLlegada = !esTramo && estadoComponente._llegadaConfirmadaEn !== idParadaActual;
    const gracia = esperaLaLlegada ? 0 : (_GRACIA_FUERA_DE_RANGO_MS[franja] ?? 0);
    const tiempoFuera = ahora - estadoComponente.timestampSalioDeRango;
    if (tiempoFuera >= gracia) {
        _procesarFueraDeRangoConfirmado(logPrefix, franja, distanciaParaRango);
    } else {
        const segundosRestantes = Math.ceil((gracia - tiempoFuera) / 1000);
        logger.debug(`${logPrefix} ⏳ ${idParadaActual}: en gracia (franja ${franja}), ${segundosRestantes}s restantes antes de restringir vídeo/avanzar`);
    }
}

// ── Spin behavior (AVENTURA) ──
// Botones glow-activo giran cada 3 s hasta ser pulsados; se reinicia en cada CAMBIO_PARADA.
// Definido a nivel de módulo para que _resetSpinsAventura sea accesible desde los controladores
// de mensajes registrados fuera del bloque DOMContentLoaded.
const _spinState = new Map(); // id → { intervalId, pressed }

function _iniciarSpinBtn(btn) {
    if (!btn) return;
    _detenerSpinBtn(btn);
    const state = { intervalId: null, pressed: false };
    state.intervalId = setInterval(() => {
        if (state.pressed || btn.disabled) return;
        btn.classList.remove('spinning');
        void btn.offsetWidth; // forzar reflow para reiniciar animación
        btn.classList.add('spinning');
        btn.addEventListener('animationend', () => btn.classList.remove('spinning'), { once: true });
    }, 3000);
    _spinState.set(btn.id, state);
    btn.addEventListener('click', () => {
        state.pressed = true;
        clearInterval(state.intervalId);
        _spinState.delete(btn.id);
    }, { once: true });
}

function _detenerSpinBtn(btn) {
    if (!btn) return;
    const s = _spinState.get(btn.id);
    if (s) { clearInterval(s.intervalId); _spinState.delete(btn.id); }
    btn.classList.remove('spinning');
}

function _resetSpinsAventura() {
    [
        elementosDOM.btnVideo, elementosDOM.btnAvanzar, elementosDOM.btnUbicacion,
        elementosDOM.btnImagen
    ].forEach(btn => _iniciarSpinBtn(btn));
}

// Mapa vintage y mapa completo: habilitados no molestan a la vista con el spin
// periódico — solo giran cuando el usuario los pulsa de verdad (mismo patrón que
// #mas-opciones en extrainfo-hijo1.html: gira en cada click, no solo el primero).
// No basta con animationend: el mismo click también dispara setBotonActivo(), que
// añade/quita la clase .activo en TODOS los botones — eso cambia qué regla CSS de
// animación coincide con el elemento (glow-suave depende de :not(.activo)) y hace
// que Chromium cancele el spin en curso sin disparar animationend nunca. El
// setTimeout es la red de seguridad real; animationend solo adelanta la limpieza
// si por lo que sea sí llega a dispararse.
function _spinAlPulsar(btn) {
    if (!btn || btn.dataset.spinAlPulsarInit === 'true') return;
    btn.dataset.spinAlPulsarInit = 'true';
    let spinTimeoutId = null;
    const quitarSpin = () => { btn.classList.remove('spinning'); clearTimeout(spinTimeoutId); spinTimeoutId = null; };
    btn.addEventListener('animationend', quitarSpin);
    btn.addEventListener('click', () => {
        btn.classList.remove('spinning');
        void btn.offsetWidth; // forzar reflow para reiniciar animación
        btn.classList.add('spinning');
        clearTimeout(spinTimeoutId);
        spinTimeoutId = setTimeout(quitarSpin, 950); // duración de spin-btn (0.9s) + margen
    });
}

document.addEventListener('DOMContentLoaded', async () => {
    actualizarEstadoBotones();

    _resetSpinsAventura();
    _spinAlPulsar(elementosDOM.btnMapaCompleto);
    _spinAlPulsar(elementosDOM.btnMapaJpg);

    // Event listeners para los botones
    elementosDOM.btnAvanzar?.addEventListener('click', async () => {
    try {
        estadoComponente.gpsActivo = !estadoComponente.gpsActivo;
        setBotonActivo(estadoComponente.gpsActivo ? 'btnAvanzar' : null);

        // El plazo va explicito: el bus usa 5000 fijos si no se le pasa, y este envio lo
        // calculaba con `ajustarTimeoutPorConexion`. Sin esta linea, una conexion lenta
        // perderia el margen — y aqui el usuario ya ha visto el boton cambiar de estado
        // antes del envio, asi que un plazo agotado le deja la interfaz mintiendo (§16.2).
        await enviarMensajeConConfirmacion({
        tipo: TIPOS_MENSAJE.NAVEGACION.GPS.ACTIVAR,
        destino: 'padre',
        timeout: ajustarTimeoutPorConexion(5000),
        datos: {
            activar: estadoComponente.gpsActivo,
            idParada: estadoComponente.idParadaActual,
            distancia: estadoComponente.distanciaAlDestino
        }
        });

        logger.info(`[hijo2] GPS ${estadoComponente.gpsActivo ? 'activado' : 'desactivado'}`);
    } catch (error) {
        logger.error(`[hijo2] Error al activar GPS:`, error);
    }
});

// ==================== CONTROLADORES DE MENSAJES ====================

// ACTUALIZAR_POSICION eliminado - tipo de mensaje obsoleto (legacy code)
// Ahora se usa ACTUALIZAR_ESTADO que incluye distancia y otros datos

function _aplicarDatosEstado(datos, logPrefix) {
    const { distanciaAlDestino, distanciaAlCamino, idParada, tipoParada, toleranciaGPS, retoActivo, ubicacionActiva, lat, lng } = datos;
    if (distanciaAlDestino !== undefined) estadoComponente.distanciaAlDestino = distanciaAlDestino;
    // distanciaAlCamino: distancia al punto más cercano del camino (inicio->waypoints->fin
    // en tramos), no al destino final — solo la usa verificarDistanciaYActualizarBotones()
    // para decidir "fuera de rango". La llegada real en tramos exige además
    // recorridoSuficiente (distancia real recorrida ≥ 40% del camino, calculada en
    // funciones-mapa.js) — distanciaAlCamino no sirve para esto: nunca puede ser mayor que
    // distanciaAlDestino, porque el propio destino es parte del camino que mide.
    if (distanciaAlCamino !== undefined) estadoComponente.distanciaAlCamino = distanciaAlCamino;
    if (idParada !== undefined) estadoComponente.idParadaActual = idParada;
    if (tipoParada !== undefined) estadoComponente.tipoParadaActual = tipoParada;
    if (toleranciaGPS !== undefined) {
        estadoComponente.toleranciaGPS = toleranciaGPS;
        logger.debug(`${logPrefix} 📏 Tolerancia GPS actualizada: ${toleranciaGPS}m (${tipoParada})`);
    }
    if (retoActivo !== undefined) {
        estadoComponente.retoActivo = retoActivo;
        logger.info(`${logPrefix} 🎯 Estado de reto actualizado: ${retoActivo ? 'ACTIVO' : 'INACTIVO'}`);
    }
    if (ubicacionActiva !== undefined) {
        estadoComponente.ubicacionActiva = ubicacionActiva;
        logger.info(`${logPrefix} 🧭 Estado de ubicación actualizado: ${ubicacionActiva ? 'ACTIVA' : 'INACTIVA'}`);
    }
    if (lat !== undefined && lng !== undefined) {
        estadoComponente.posicionActualUsuario = { lat, lng };
    }
}

// Exige 2 de las últimas 4 lecturas GPS dentro de radio para el mismo elemento antes de
// dar por confirmada la llegada, y lo mismo para volver dentro de rango (K-185: con una
// sola lectura, el ruido encendía el audio a 30 m) — aun con la precisión declarada dentro de
// CONFIG.GPS.PRECISION_MINIMA (las peores ni llegan aquí: ver el handler de ACTUALIZAR_ESTADO), una única lectura ruidosa podría caer
// dentro del radio por casualidad aunque el usuario siga lejos de verdad, de ahí que una
// sola lectura nunca baste. Ventana deslizante (no "2 SEGUIDAS" a secas): con GPS real en
// calles estrechas del centro histórico, la distancia puede oscilar alrededor del radio
// de 20m lectura a lectura — exigir 2 estrictamente consecutivas podía no cumplirse nunca
// mientras ese patrón persistiera, aunque el usuario llevara un buen rato físicamente en
// el sitio (reproducido con datos reales de Av1-P-1: 20 lecturas alternando 15m/25m nunca
// confirmaban la llegada con el diseño anterior). 2 de 4 conserva la misma protección
// contra una lectura suelta sin depender de que el azar alinee dos lecturas consecutivas.
const _VENTANA_LLEGADA = 4;
const _CONFIRMACION_LLEGADA = 2;
function _confirmarPorVentana(ventana, dentro, idParada) {
    if (ventana.id !== idParada) {
        ventana.id = idParada;
        ventana.lecturas = [];
    }
    ventana.lecturas.push(dentro);
    if (ventana.lecturas.length > _VENTANA_LLEGADA) ventana.lecturas.shift();
    return ventana.lecturas.filter(Boolean).length >= _CONFIRMACION_LLEGADA;
}

async function _detectarLlegadaTramo(distanciaAlDestino, radioLlegada, recorridoSuficiente, idParada, logPrefix) {
    // radioLlegada son 15 m, los mismos que una parada y los mismos que el círculo naranja
    // que el usuario ve alrededor de su flecha. NO es toleranciaGPS: ese valor (≥35 m en
    // tramos) está dimensionado contra el ruido del GPS y lo siguen usando los botones y el
    // aviso de fuera de rango, pero declarar una llegada con él ponía al usuario al otro
    // lado de la manzana. Los dos números llegan juntos en ACTUALIZAR_ESTADO.
    //
    // recorridoSuficiente (calculada en funciones-mapa.js, ≥40% de la longitud real del
    // camino recorrida) exige haber cubierto terreno real, no solo estar cerca del destino
    // en línea recta — evita completar un tramo atravesando un obstáculo entre inicio y fin
    // sin haber caminado la ruta ni un rodeo equivalente. Si el dato no llega (undefined,
    // versión antigua del mensaje), no bloquea — solo distanciaAlDestino decide.
    const dentroDeRadio = distanciaAlDestino <= radioLlegada && recorridoSuficiente !== false;
    const confirmada = _confirmarPorVentana(estadoComponente._ventanaLlegada, dentroDeRadio, idParada);
    if (dentroDeRadio && confirmada) {
        if (!estadoComponente._llegadaNotificada || estadoComponente._llegadaNotificada !== idParada) {
            estadoComponente._llegadaNotificada = idParada;
            logger.info(`${logPrefix} 🎯 Llegada detectada a tramo ${idParada} (${distanciaAlDestino.toFixed(1)}m ≤ ${radioLlegada}m)`);
            await enviarMensaje({
                tipo: TIPOS_MENSAJE.NAVEGACION.LLEGADA_DETECTADA,
                destino: 'padre',
                datos: { paradaId: idParada, parada_id: idParada, distancia: distanciaAlDestino, tipoParada: 'tramo', timestamp: Date.now() }
            }).catch(e => logger.warn(`${logPrefix} Error notificando llegada a tramo:`, e.message));
        }
    } else if (!dentroDeRadio && estadoComponente._llegadaNotificada === idParada && distanciaAlDestino > radioLlegada * 1.5) {
        logger.debug(`${logPrefix} 🔄 Usuario salió del rango de ${idParada}, reseteando flag de llegada`);
        estadoComponente._llegadaNotificada = null;
    }
}

async function _detectarLlegadaParada(distanciaAlDestino, idParada, logPrefix) {
    const RADIO_PARADA = 15;
    const dentroDeRadio = distanciaAlDestino <= RADIO_PARADA;
    const confirmada = _confirmarPorVentana(estadoComponente._ventanaLlegada, dentroDeRadio, idParada);
    if (dentroDeRadio && confirmada) {
        estadoComponente._llegadaConfirmadaEn = idParada;
        if (!estadoComponente._llegadaNotificada || estadoComponente._llegadaNotificada !== idParada) {
            estadoComponente._llegadaNotificada = idParada;
            logger.info(`${logPrefix} 🎯 Llegada detectada a parada ${idParada} (${distanciaAlDestino.toFixed(1)}m ≤ ${RADIO_PARADA}m)`);
            await enviarMensaje({
                tipo: TIPOS_MENSAJE.NAVEGACION.LLEGADA_DETECTADA,
                destino: 'padre',
                datos: { paradaId: idParada, parada_id: idParada, distancia: distanciaAlDestino, tipoParada: 'parada', timestamp: Date.now() }
            }).catch(e => logger.warn(`${logPrefix} Error notificando llegada a parada:`, e.message));
        }
    } else if (!dentroDeRadio && estadoComponente._llegadaNotificada === idParada && distanciaAlDestino > RADIO_PARADA * 1.5) {
        estadoComponente._llegadaNotificada = null;
    }
}

// 📡 Controlador para actualización de estado GPS (enviado por funciones-mapa.js)
// Precisión GPS insuficiente: con un círculo de error mayor que CONFIG.GPS.PRECISION_MINIMA
// no se puede confiar en NINGUNA conclusión de distancia — ni llegada, ni franja de fuera
// de rango — la posición real podría estar en cualquier punto dentro de ese círculo.
function _notificarSenalNoFiable(accuracy, logPrefix) {
    if (!estadoComponente._notificacionSenalNoFiableEnviada) {
        estadoComponente._notificacionSenalNoFiableEnviada = true;
        logger.warn(`${logPrefix} ⚠️ Precisión GPS insuficiente (±${accuracy}m > ${CONFIG.GPS.PRECISION_MINIMA}m) — ninguna conclusión de distancia es fiable`);
        enviarMensaje({
            tipo: TIPOS_MENSAJE.NAVEGACION.GPS.PRECISION_INSUFICIENTE,
            destino: 'padre',
            datos: { accuracy, umbral: CONFIG.GPS.PRECISION_MINIMA, timestamp: Date.now() }
        }).catch(e => logger.debug(`${logPrefix} Error notificando precisión insuficiente:`, e.message));
    }
}

function _notificarSenalRecuperada(logPrefix) {
    estadoComponente._notificacionSenalNoFiableEnviada = false;
    logger.info(`${logPrefix} ✅ Precisión GPS recuperada`);
    enviarMensaje({
        tipo: TIPOS_MENSAJE.NAVEGACION.GPS.PRECISION_RECUPERADA,
        destino: 'padre',
        datos: { timestamp: Date.now() }
    }).catch(e => logger.debug(`${logPrefix} Error notificando precisión recuperada:`, e.message));
}

registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.ACTUALIZAR_ESTADO, async (mensaje) => {
    const logPrefix = '[hijo2][ACTUALIZAR_ESTADO]';
    try {
        const datos = mensaje.datos;
        const { distanciaAlDestino, idParada, tipoParada, toleranciaGPS, radioLlegada, accuracy, recorridoSuficiente } = datos;
        _aplicarDatosEstado(datos, logPrefix);

        // Se comprueba ANTES de la detección de llegada y de
        // verificarDistanciaYActualizarBotones(), no solo dentro de esta última, para que
        // una lectura de mala precisión no pueda disparar una llegada falsa aunque la
        // distancia calculada parezca corta (ver JSDoc de _notificarSenalNoFiable arriba).
        if (estadoComponente.modo === 'aventura' && typeof accuracy === 'number' && accuracy > CONFIG.GPS.PRECISION_MINIMA) {
            _notificarSenalNoFiable(accuracy, logPrefix);
            return;
        }
        if (estadoComponente._notificacionSenalNoFiableEnviada) {
            _notificarSenalRecuperada(logPrefix);
        }

        // Solo en AVENTURA: en CASA el usuario "ve" paradas libremente con hijo5 (reutiliza
        // este mismo CAMBIO_PARADA/ACTUALIZAR_ESTADO), así que idParada aquí puede ser
        // cualquier parada que esté simplemente mirando, no una que esté visitando de
        // verdad. Sin este guard, si su posición GPS real caía dentro del radio de esa
        // parada mirada, se enviaba LLEGADA_DETECTADA real al padre — que si su propio
        // elementoActual coincidía (coincide, "ver" en CASA también lo actualiza), marcaba
        // pending.llegada=true para una parada nunca visitada de verdad (reporte de uso
        // real 2026-08-10, ver docs/GUIA-COMPLETA.md §24.0/§25.5).
        if (estadoComponente.modo === 'aventura' && typeof distanciaAlDestino === 'number' && idParada) {
            // Se exige radioLlegada, no toleranciaGPS: son dos numeros distintos y este
            // sensor decide LLEGADA. Sin el campo no se declara ninguna — mejor no detectarla
            // que detectarla con el radio equivocado, que es lo que pasaba antes.
            if (tipoParada === 'tramo' && typeof radioLlegada === 'number') {
                await _detectarLlegadaTramo(distanciaAlDestino, radioLlegada, recorridoSuficiente, idParada, logPrefix);
            } else if (tipoParada !== 'tramo') {
                await _detectarLlegadaParada(distanciaAlDestino, idParada, logPrefix);
            }
        }

        actualizarEstadoBotones();
        if (estadoComponente.modo === 'aventura' && estadoComponente.distanciaAlDestino !== null && estadoComponente.distanciaAlDestino !== undefined) {
            verificarDistanciaYActualizarBotones();
        }
        logger.debug(`${logPrefix} 📍 Estado actualizado: distancia=${distanciaAlDestino}m, tolerancia=${toleranciaGPS}m, parada=${idParada}, tipo=${tipoParada}, reto=${estadoComponente.retoActivo}, ubicacion=${estadoComponente.ubicacionActiva}`);
    } catch (error) {
        logger.error(`${logPrefix} Error procesando actualización de estado:`, error);
    }
});

/**
 * Controlador: CONTROL.HABILITAR
 * Descripción: Habilita botones cuando el padre lo solicita (ej: después de cerrar un reto)
 */
registrarControladorSeguro(TIPOS_MENSAJE.CONTROL.HABILITAR, async (mensaje) => {
    const logPrefix = '[hijo2][CONTROL.HABILITAR]';

    try {
        const { motivo, control, razon } = mensaje.datos || {};
        logger.info(`${logPrefix} Recibido - control: ${control}, motivo: ${motivo}, razon: ${razon}`);

        if (control === 'btnAvanzar') {
            // Lo decide el padre (ver avanzarHabilitadoPorPadre): la `razon` solo viaja para la traza.
            estadoComponente.avanzarHabilitadoPorPadre = true;
            actualizarEstadoBotones();
            return;
        }

        // Actualizar estado interno
        if (motivo === 'reto_cerrado') {
            estadoComponente.retoActivo = false;
        }

        // Resetear botón activo al cerrar cualquier vista
        setBotonActivo(null);

        // Recalcular estados de todos los botones según reglas GPS
        actualizarEstadoBotones();

        logger.debug(`${logPrefix} Botones actualizados según reglas GPS`);
    } catch (error) {
        logger.error(`${logPrefix} Error habilitando controles:`, error);
    }
});

/**
 * Controlador: CONTROL.DESHABILITAR
 * Descripción: Deshabilita botones cuando el padre lo solicita (ej: al abrir un reto)
 */
registrarControladorSeguro(TIPOS_MENSAJE.CONTROL.DESHABILITAR, async (mensaje) => {
    const logPrefix = '[hijo2][CONTROL.DESHABILITAR]';

    try {
        const { motivo, control, razon } = mensaje.datos || {};
        logger.info(`${logPrefix} Recibido - control: ${control}, motivo: ${motivo}, razon: ${razon}`);

        if (control === 'btnAvanzar') {
            estadoComponente.avanzarHabilitadoPorPadre = false;
            actualizarEstadoBotones();
            return;
        }

        // Recalcular estados de todos los botones
        actualizarEstadoBotones();

        logger.debug(`${logPrefix} Botones deshabilitados`);
    } catch (error) {
        logger.error(`${logPrefix} Error deshabilitando controles:`, error);
    }
});

// ==================== CONTROLADORES ====================

try {
    // Ocultar la UI hasta que el padre confirme que los controladores están listos
    let _uiConfirmado = false;
    // La serie de HIJO_LISTO en marcha (bus.enviarHijoListoConReintento): PADRE_CONFIRMA_HIJO_LISTO la para.
    let _hijoListo = null;
    // Ya oculto al principio del modulo, antes de los awaits: ver alli el porque.
    function mostrarUI() {
        if (!_uiConfirmado) {
            logger.warn('[hijo2] mostrarUI ignorado: esperando PADRE_CONFIRMA_HIJO_LISTO');
            return;
        }
        try {
            mostrarInterfaz();
            logger.info('[hijo2] UI visible tras PADRE_CONFIRMA_HIJO_LISTO');
        } catch (e) {
            logger.warn('[hijo2] Error mostrando UI:', e && e.message);
        }
    }

    // No necesitamos inicializarMensajeria aquí, los fallbacks esperan automáticamente

    // NOTA: HIJO_PREPARADO se envía MÁS ABAJO, DESPUÉS de registrar todos los controladores críticos.
    // Esto garantiza que el padre no envíe PADRE_DATOS antes de que los controladores estén listos.
    // Ver: "// Enviar HIJO_PREPARADO para indicar que estamos listos para recibir datos del padre"

    // ==================== CONTROLADORES DE ARRANQUE Y DE MODO ====================

    logger.info(`Hijo ${CONFIG_HIJO.IFRAME_ID} registrado el controlador PADRE_DATOS`);
    // ============================================================
    // CONTROLADOR 1: SISTEMA.PADRE_DATOS
    // ============================================================

    function _procesarDatosPadre(datos, logPrefix) {
        // PADRE_DATOS trae como mucho { modo, timestamp }: el padre no manda más claves en este mensaje.
        const { modo } = datos;
        if (modo) {
            const modoSeguro = (modo === 'casa' || modo === 'aventura') ? modo : '';
            logger.info(`${logPrefix} Procesando modo inicial del padre:`, { original: modo, normalizado: modoSeguro });
            estadoComponente.modo = modoSeguro || modo;
            actualizarEstadoBotones();
        }
    }

    registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.PADRE_DATOS, async (mensaje) => {
        const logPrefix = `[hijo2][PADRE_DATOS]`;
        try {
            logger.info(`${logPrefix} Datos del padre recibidos desde ${mensaje.origen}`);
            logger.info(`Hijo ${CONFIG_HIJO.IFRAME_ID} recibió PADRE_DATOS`);
            if (mensaje.datos) _procesarDatosPadre(mensaje.datos, logPrefix);
        } catch (error) {
            logger.error(`${logPrefix} Error procesando PADRE_DATOS:`, error);
        }
        if (!estadoComponente.hijoListoEnviado) {
            estadoComponente.hijoListoEnviado = true;
            estadoComponente.inicializado = true;
            _hijoListo = bus.enviarHijoListoConReintento({ datos: { componenteId: CONFIG_HIJO.COMPONENTE_ID, iframeId: CONFIG_HIJO.IFRAME_ID }, prefijoLog: '[hijo2]', alAgotarse: () => { _uiConfirmado = true; mostrarUI(); } });
        }
    });

    // NOTA: Controlador SISTEMA.PADRE_PIDE_MANEJADORES eliminado (obsoleto).
    // El sistema actual usa state-manager centralizado sin necesidad de migración manual.

    /**
     * Controlador: SISTEMA.PADRE_CONFIRMA_HIJO_LISTO
     * Descripción: Recibe confirmación del padre de que los controladores están listos
     * Origen esperado: padre
     * Respuesta: ninguna
     */
    registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.PADRE_CONFIRMA_HIJO_LISTO, async (mensaje) => {
        const logPrefix = `[hijo2][PADRE_CONFIRMA_HIJO_LISTO][${mensaje?.origen || 'desconocido'}]`;

        try {
            logger.info('[hijo2] PADRE_CONFIRMA_HIJO_LISTO recibido:', mensaje);

            logger.info(`${logPrefix} Confirmación recibida del padre - controladores listos`);
            _hijoListo?.parar();

            // 🔥 NUEVO: Procesar modo inicial si viene en datos
            const { modoInicial } = mensaje.datos || {};
            if (modoInicial) {
                logger.info(`${logPrefix} Modo inicial recibido: ${modoInicial}`);
                estadoComponente.modo = modoInicial;
                actualizarEstadoBotones(); // Actualiza botones según modo
                logger.debug(`${logPrefix} Estado de botones actualizado según modo inicial`);
            }

            // El modo llega por `modoInicial` al conectarse y por CAMBIO_MODO después; aquí no se aparca nada (un solo camino, decisión 11 — ver GUIA-COMPLETA.md §10.11).

            // Mostrar UI ahora que el padre confirmó
            try { _uiConfirmado = true; mostrarUI(); } catch (e) { logger.warn('[hijo2] Error mostrando UI:', e && e.message); }

        } catch (error) {
            logger.error(`${logPrefix} Error procesando confirmación del padre:`, error);
        }
    });

    function _resetarEstadoParaModo(modo, logPrefix) {
        estadoComponente.modo = modo;
        estadoComponente.tipoParadaActual = null;
        // Sin esto, la parada/tramo de la sesión anterior seguía "seleccionada" al cambiar
        // de modo — actualizarEstadoBotones() se ejecuta al final de esta función y
        // habilitaba botones (avanzar incluido) como si el usuario ya hubiera elegido algo
        // en el modo nuevo, sin haber tocado nada todavía (reporte de uso real 2026-08-17).
        estadoComponente.idParadaActual = null;
        estadoComponente.distanciaAlDestino = null;
        estadoComponente.posicionActualUsuario = null;
        estadoComponente.avanzarHabilitadoPorPadre = false;
        estadoComponente.retoActivo = false;
        estadoComponente.ubicacionActiva = false;
        estadoComponente.gpsActivo = false;
        if (estadoComponente.timestampSalioDeRango !== null) {
            logger.info(`${logPrefix} Reseteando timer GPS por cambio de modo`);
            estadoComponente.timestampSalioDeRango = null;
        }
        // Sin esto, un fuera-de-rango (ayuda o restricción) activo antes del cambio de
        // modo se quedaba "pegado" en el estado — la restricción de vídeo/avanzar podía
        // reaplicarse indebidamente al volver a AVENTURA, ya sin ninguna franja real detrás.
        estadoComponente.ayudaFueraDeRangoActiva = false;
        estadoComponente.fueraDeRangoActivo = false;
        // Sin salida de rango pendiente, tampoco hay lecturas que confirmar para volver a él.
        estadoComponente._ventanaRango = { id: null, lecturas: [] };
        estadoComponente._notificacionFueraRangoEnviada = false;
        estadoComponente._notificacionSenalNoFiableEnviada = false;
        const btn = elementosDOM.btnUbicacion;
        if (btn) {
            if (modo === 'casa') {
                desactivarBoton(btn);
                btn.title = 'Ubicación no disponible en modo casa';
                logger.info(`${logPrefix} → Modo CASA: botón rojo deshabilitado`);
            } else {
                logger.info(`${logPrefix} → Modo AVENTURA: botón controlado por distancias`);
                if (estadoComponente.posicionActualUsuario) verificarDistanciaYActualizarBotones();
            }
        }
        logger.debug(`${logPrefix} Estado reseteado para nuevo modo`);
        actualizarEstadoBotones();
    }

    /**
     * Controlador: SISTEMA.CAMBIO_MODO
     * Protocolo bidireccional:
     * 1. Padre → Hijo: CAMBIO_MODO
     * 2. Hijo → Padre: CAMBIO_MODO_ENTENDIDO
     * 3. Hijo procesa cambio
     * 4. Hijo → Padre: CAMBIO_MODO_EFECTUADO
     * 5. Padre → Hijo: CAMBIO_MODO_APLICADO
     */
    registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO, async (mensaje) => {
        const logPrefix = `[hijo2][CAMBIO_MODO]`;

        try {
            // Paso 1: Extraer y validar datos
            const { modo } = mensaje.datos || {};
            if (!modo || !['casa', 'aventura'].includes(modo)) {
                logger.error(`${logPrefix} Modo inválido: ${modo}`);
                await enviarMensaje({
                    tipo: TIPOS_MENSAJE.SISTEMA.NACK,
                    destino: 'padre',
                    datos: { error: 'Modo inválido', modoRecibido: modo }
                });
                return;
            }

            // Paso 2: Enviar ENTENDIDO
            logger.info(`${logPrefix} Cambio de modo a "${modo}" entendido`);

            // Validación explícita antes de enviar
            const destinoEntendido = 'padre';
            const tipoEntendido = TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_ENTENDIDO;
            // El `origen` no se escribe aquí: lo pone el bus con el nombre que este frame le dio en inicializarMensajería (GUIA-COMPLETA.md §26.8).

            // DEBUG: Console.log directo para diagnóstico (bypass suppress-warnings)
            if (!tipoEntendido) {
                const debugInfo = {
                    destino: destinoEntendido,
                    tipo: tipoEntendido,
                    TIPOS_MENSAJE_exists: TIPOS_MENSAJE !== undefined,
                    TIPOS_MENSAJE_SISTEMA_exists: TIPOS_MENSAJE?.SISTEMA !== undefined,
                    CONFIG_HIJO_exists: CONFIG_HIJO !== undefined,
                    mensaje_origen: mensaje?.origen
                };
                logger.error('[hijo2][CAMBIO_MODO] 🔴 DEBUG CAMPOS UNDEFINED:', JSON.stringify(debugInfo, null, 2));
                logger.error(`${logPrefix} ❌ Campos undefined antes de enviar ENTENDIDO:`, debugInfo);
                throw new Error('Campos undefined en CAMBIO_MODO_ENTENDIDO');
            }

            await enviarMensaje({
                destino: destinoEntendido,
                tipo: tipoEntendido,
                datos: {
                    modo,
                    timestamp: Date.now(),
                    mensajeId: mensaje.datos?.mensajeId || mensaje.id
                }
            });

            // Paso 3: Procesar cambio
            logger.info(`${logPrefix} Procesando cambio a modo: ${modo}`);
            _resetarEstadoParaModo(modo, logPrefix);

            // Paso 4: Enviar EFECTUADO
            logger.info(`${logPrefix} Cambio de modo a "${modo}" efectuado`);
            await enviarMensaje({
                destino: 'padre',
                tipo: TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_EFECTUADO,
                datos: {
                    modo,
                    exito: true,
                    timestamp: Date.now(),
                    mensajeId: mensaje.datos?.mensajeId || mensaje.id
                }
            });

        } catch (error) {
            logger.error(`${logPrefix} Error:`, error);
            try {
                await enviarMensaje({
                    tipo: TIPOS_MENSAJE.SISTEMA.ERROR,
                    destino: 'padre',
                    datos: { error: error.message, tipo: 'CAMBIO_MODO_FALLIDO' }
                });
            } catch (e) {
                logger.error(`${logPrefix} Error notificando fallo:`, e);
            }
        }
    });

    /**
     * Controlador: SISTEMA.CAMBIO_MODO_APLICADO
     * Confirmación final del padre de que el cambio fue aplicado globalmente
     */
    registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_APLICADO, async (mensaje) => {
        const logPrefix = `[hijo2][CAMBIO_MODO_APLICADO]`;
        try {
            const { modo } = mensaje.datos || {};
            logger.success(`${logPrefix} ✅ Cambio de modo a "${modo}" aplicado globalmente`);
        } catch (error) {
            logger.error(`${logPrefix} Error:`, error);
        }
    });

    /**
     * Controlador: SISTEMA.HEARTBEAT
     * Descripción: Responde al latido del bus del padre para verificar que el componente está activo
     * Origen esperado: padre (js/mensajeria.js)
     * Respuesta: SISTEMA.HEARTBEAT_RESPONSE
     *
     * Datos recibidos: { timestamp: number }
     * Datos enviados: { timestamp: number, estado: string, gpsActivo: boolean, paradaActual: any }
     *
     * Nota: Incluye información del estado interno para diagnóstico
     */
    registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT, async (mensaje) => {
        const logPrefix = `[hijo2][HEARTBEAT][${mensaje?.origen || 'desconocido'}]`;

        try {
            // Responder inmediatamente con estado actual
            await enviarMensaje({
                destino: 'padre',
                tipo: TIPOS_MENSAJE.SISTEMA.HEARTBEAT_RESPONSE,
                datos: {
                    timestamp: Date.now(),
                    estado: estadoComponente.inicializado ? 'activo' : 'inicializando',
                    gpsActivo: estadoComponente.gpsActivo,
                    paradaActual: estadoComponente.idParadaActual
                }
            });

        } catch (error) {
            logger.error(`${logPrefix} Error respondiendo heartbeat:`, error);
        }
    });


    // ============================================================
    // HANDLERS GPS
    // ============================================================
    registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.GPS.ESTADO_ACTUALIZADO, async (mensaje) => {
        const logPrefix = '[hijo2][GPS.ESTADO_ACTUALIZADO]';
        try {
            const datos = mensaje?.datos || {};
            logger.debug(`${logPrefix} Estado GPS recibido:`, datos);

            // BUG CORREGIDO: localStorage.getItem('modoActual') nunca se escribía → siempre 'casa'
            const modoActual = (estadoComponente && estadoComponente.modo) || 'casa';
            const btn = elementosDOM.btnUbicacion;

            if (!btn) {
                logger.warn(`${logPrefix} Botón ubicación no encontrado`);
                return { exito: true };
            }

            // MODO CASA: Siempre rojo deshabilitado (ignorar estado GPS)
            if (modoActual === 'casa') {
                desactivarBoton(btn);
                btn.title = 'Ubicación no disponible en modo casa';
                logger.debug(`${logPrefix} Modo casa: botón forzado a rojo deshabilitado`);
                return { exito: true };
            }

            // MODO AVENTURA: Depende de verificación de distancias
            // No modificar aquí - la lógica la maneja verificarDistanciaYActualizarBotones()
            logger.debug(`${logPrefix} Modo aventura: estado controlado por distancias`);

            return { exito: true };
        } catch (e) {
            logger.error(`${logPrefix} Error en handler:`, e);
            return { exito: false, error: e.message };
        }
    });

    registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.GPS.ERROR, async (mensaje) => {
        try {
            const datos = mensaje?.datos || {};
            const { codigo } = datos;
            const errorMensaje = datos.mensaje || datos.message || null;
            const contexto = datos.contexto || datos.context || 'desconocido';
            const codeMap = { 1: 'PERMISSION_DENIED', 2: 'POSITION_UNAVAILABLE', 3: 'TIMEOUT' };
            const codeDesc = codeMap[codigo] || 'UNKNOWN_CODE';
            let details;
            try { details = JSON.stringify({ codigo, codeDesc, mensaje: errorMensaje, contexto }, null, 2); } catch (error_) { details = `codigo=${codigo} mensaje=${String(errorMensaje)} contexto=${String(contexto)}`; logger.debug('[hijo2][GPS.ERROR] Error serializando detalles:', error_?.message); }
            logger.error(`[hijo2][GPS.ERROR] Error GPS recibido: ${details}`);
            return { exito: true };
        } catch (e) {
            logger.error('[hijo2][GPS.ERROR] Error en handler no-op:', e);
            return { exito: false, error: e.message };
        }
    });

    // ============================================================
    // CONTROLADOR CAMBIO_PARADA: actualizar estado local y botones
    // ============================================================
    registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.CAMBIO_PARADA, async (mensaje) => {
        try {
            const datos = mensaje?.datos || {};
            const parada_id = datos.parada_id || datos.paradaId || null;
            const tipoRecibido = datos.tipo ||
                (esIdDeTramo(parada_id) ? 'tramo' : 'parada');

            if (parada_id) estadoComponente.idParadaActual = parada_id;
            estadoComponente.tipoParadaActual = tipoRecibido;
            estadoComponente.distanciaAlDestino = null;
            estadoComponente._llegadaNotificada = null;
            // Elemento nuevo: «avanzar» apagado hasta que el padre diga cómo queda (se lo dice al activarlo).
            estadoComponente.avanzarHabilitadoPorPadre = false;

            logger.debug(`[hijo2][CAMBIO_PARADA] parada=${parada_id} tipo=${tipoRecibido}`);

            // Resetear botón activo al cambiar de parada
            setBotonActivo(null);

            // Refrescar estado de botones con el nuevo tipo
            actualizarEstadoBotones();

            // Reiniciar spin de botones glow-activo
            _resetSpinsAventura();
        } catch (e) {
            logger.error('[hijo2][CAMBIO_PARADA] Error:', e);
        }
    });

    // Notificar al padre que hijo2 está listo
    logger.debug('[hijo2] Controladores críticos registrados; enviando HIJO_PREPARADO ahora');

    // Enviar HIJO_PREPARADO para indicar que estamos listos para recibir datos del padre
    try {
        await enviarMensaje({
            destino: 'padre',
            tipo: TIPOS_MENSAJE.SISTEMA.HIJO_PREPARADO,
            datos: {
                componenteId: CONFIG_HIJO.COMPONENTE_ID,
                tipo: 'COORDENADAS',
                capacidades: ['navegacion', 'coordenadas'],
                timestamp: Date.now()
            }
        });
        logger.debug('[hijo2] HIJO_PREPARADO enviado, esperando PADRE_DATOS');
    } catch (e) {
        logger.warn('[hijo2] Error enviando HIJO_PREPARADO:', e && e.message ? e.message : e);
    }

// Removed stray closing catch block after initialization. The initialization try/catch above is sufficient.

// Implementar pagehide para limpiar recursos
globalThis.addEventListener('pagehide', () => {
    logger.info(`[hijo2] Limpiando recursos en pagehide`);
    estadoComponente.inicializado = false;
});

    function _esPadreIdActual(padreId) {
        return padreId && (padreId === estadoComponente.idParadaActual || padreId === (`padre-${estadoComponente.idParadaActual}`));
    }

    function _manejarPendingIniciado(datos, logPrefix) {
        const padreId = datos?.padreId || datos?.padreid || null;
        const ttlMs = datos?.ttlMs || null;
        logger.info(`${logPrefix} PENDING_INICIADO para ${padreId} ttl=${ttlMs}`);
        if (_esPadreIdActual(padreId)) {
            if (elementosDOM.btnUbicacion) desactivarBoton(elementosDOM.btnUbicacion);
        }
    }

    // CONTROLADOR: SISTEMA.NOTIFICACION - manejar PENDING_INICIADO
    registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.NOTIFICACION, async (mensaje) => {
        const logPrefix = `[hijo2][NOTIFICACION][${mensaje?.origen || 'desconocido'}]`;
        try {
            const evento = mensaje.datos?.evento;
            if (!evento) return;
            if (evento === 'PENDING_INICIADO') _manejarPendingIniciado(mensaje.datos, logPrefix);
        } catch (err) {
            logger.warn(`${logPrefix} Error procesando NOTIFICACION:`, err);
        }
    });

    // Un solo camino (paso 8.10 de la lavadora): el padre manda SISTEMA.ERROR a este mismo
    // hijo cuando NAVEGACION.GPS.ACTIVAR falla (_hdl_NAVEGACION_GPS_ACTIVAR en
    // codigo-padre.html) — sin handler aquí, el aviso se perdía sin ningún rastro. Mismo
    // patrón mínimo que ya usa boton-casa-hijo5.html: solo registrar el fallo en el log.
    registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.ERROR, async (mensaje) => {
        const logPrefix = `[hijo2][SISTEMA.ERROR][${mensaje?.origen || 'desconocido'}]`;
        try {
            const { error, contexto } = mensaje.datos || {};
            logger.error(`${logPrefix} Error recibido: ${error || 'sin detalle'}${contexto ? ` (contexto: ${contexto})` : ''}`);
        } catch (err) {
            logger.error(`${logPrefix} Error procesando SISTEMA.ERROR:`, err);
        }
    });
} catch (error) {
    logger.error('[hijo2] Error durante la inicialización:', error);
}
    </script>
</body>
