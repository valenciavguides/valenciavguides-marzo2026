<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
  <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains; preload" />
  <title>Mapa completo de aventura</title>

  <style>
    :root {
      --gap-inferior: env(safe-area-inset-bottom, 0px);
    }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100vh;
    }

    /* Marcador pill de monumento */
    .monumento-marker {
      background: #fff;
      border: 2px solid #8B6914;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: clamp(0.7rem, 2.5vmin, 1rem);
      font-weight: bold;
      color: #8B6914;
      white-space: nowrap;
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* Overlay popup de monumento */
    #monumento-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding-bottom: var(--gap-inferior);
      box-sizing: border-box;
    }
    #monumento-overlay.visible {
      display: flex;
    }
    #monumento-card {
      background: #fff;
      border-radius: 12px;
      max-width: 95vw;
      width: 95vw;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      position: relative;
    }
    #monumento-card img {
      width: 100%;
      max-height: min(80vw, 60vh);
      object-fit: cover;
      display: block;
    }
    #monumento-card .sin-imagen {
      width: 100%;
      height: 140px;
      background: #f0ebe0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }
    #monumento-card .info {
      padding: 0.9rem 1rem 1rem;
    }
    #monumento-card .info .numero {
      font-size: 0.75rem;
      color: #8B6914;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }
    #monumento-card .info .nombre {
      font-size: clamp(1rem, 3.5vmin, 1.3rem);
      font-weight: bold;
      color: #222;
    }
    #monumento-cerrar {
      position: absolute;
      top: 0;
      right: 0;
      background: #F28500;
      color: #0F0616;
      border: 0.3125rem solid #50C878;
      border-radius: 50%;
      width: 3.25rem;
      height: 3.25rem;
      font-size: 3.4375rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      touch-action: manipulation;
      z-index: 10000;
    }
    .icono-x-cerrar {
      display: inline-block;
      transform: scaleY(1.4);
      text-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      -webkit-text-stroke: 1px #0F0616;
    }
    #monumento-cerrar:hover {
      background: #ff6600;
      border-color: #cc0000;
      transform: scale(1.1);
    }
  </style>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

  <div id="map"></div>

  <!-- Overlay popup monumento -->
  <div id="monumento-overlay">
    <div id="monumento-card">
      <button id="monumento-cerrar" title="Cerrar"><span class="icono-x-cerrar">✗</span></button>
      <div id="monumento-imagen-wrap"></div>
      <div class="info">
        <div class="numero" id="monumento-numero"></div>
        <div class="nombre" id="monumento-nombre"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script type="module">
    import { DATOS_AVENTURAS } from './js/coordenadas-aventuras.js';

    // ── Aventura desde URL ──────────────────────────────────────────────────
    const params   = new URLSearchParams(globalThis.location.search);
    const aventura = params.get('aventura') || 'Aventura1';

    const datos = DATOS_AVENTURAS[aventura];
    if (!datos || !datos['coordenadas-hijo2.html']) {
      document.getElementById('map').innerHTML =
        `<p style="padding:2rem;font-size:1.5rem;">Aventura "${aventura}" no encontrada.</p>`;
      throw new Error(`Aventura "${aventura}" no existe en DATOS_AVENTURAS`);
    }

    const coordenadas = datos['coordenadas-hijo2.html'].coordenadas;

    // ── Construir polyline ──────────────────────────────────────────────────
    const rutaPuntos = [];
    coordenadas.forEach(entry => {
      if (entry.tipo === 'parada' || entry.tipo === 'inicio') {
        rutaPuntos.push([entry.coordenadas.lat, entry.coordenadas.lng]);
      } else if (entry.tipo === 'tramo') {
        rutaPuntos.push([entry.inicio.lat, entry.inicio.lng]);
        entry.waypoints.forEach(wp => rutaPuntos.push([wp.lat, wp.lng]));
        rutaPuntos.push([entry.fin.lat, entry.fin.lng]);
      }
    });

    // ── Payload para solicitar-ruta ─────────────────────────────────────────
    const rutaCompleta = [];
    coordenadas.forEach(entry => {
      if (entry.tipo === 'parada' || entry.tipo === 'inicio') {
        rutaCompleta.push({ tipo: 'parada', nombre: entry.nombre, lat: entry.coordenadas.lat, lng: entry.coordenadas.lng });
      } else if (entry.tipo === 'tramo') {
        rutaCompleta.push({ tipo: 'waypoint', lat: entry.inicio.lat, lng: entry.inicio.lng });
        entry.waypoints.forEach(wp => rutaCompleta.push({ tipo: 'waypoint', lat: wp.lat, lng: wp.lng }));
        rutaCompleta.push({ tipo: 'waypoint', lat: entry.fin.lat, lng: entry.fin.lng });
      }
    });

    // ── Inicializar mapa ────────────────────────────────────────────────────
    const map = L.map('map', { center: [39.476, -0.375], zoom: 15, maxZoom: 21 });

    // Bounds al scope del módulo para que mapa-visible pueda llamar fitBounds
    let _bounds = null;

    // ── Polyline ────────────────────────────────────────────────────────────
    if (rutaPuntos.length > 0) {
      const polyline = L.polyline(rutaPuntos, { color: '#2255cc', weight: 5, opacity: 0.85 }).addTo(map);
      _bounds = polyline.getBounds();
    }

    // ── Marcadores de referencia desde coordenadas-aventuras.js ────────────
    coordenadas.filter(c => c.tipo === 'referencia').forEach(ref => {
      if (!ref.coordenadas || ref.coordenadas.lat == null) return;
      const icono = L.divIcon({
        html: `<div class="monumento-marker">🏛️ ${ref.mapa_numero}</div>`,
        className: '', iconSize: null, iconAnchor: [0, 0]
      });
      L.marker([ref.coordenadas.lat, ref.coordenadas.lng], {
        icon: icono,
        title: ref.nombre || `Monumento ${ref.mapa_numero}`,
        zIndexOffset: 400
      }).addTo(map).on('click', () => mostrarMonumento(ref));
    });

    // ── Centrar vista: invalidateSize + fitBounds ───────────────────────────
    // Reutilizado también desde el handler mapa-visible para corregir
    // cualquier problema de dimensiones al abrirse el overlay.
    function _reajustarVista() {
      map.invalidateSize();
      if (_bounds) map.fitBounds(_bounds, { padding: [24, 24] });
    }

    _reajustarVista();

    // ── Tiles DESPUÉS de fijar la vista ────────────────────────────────────
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // ── Popup de monumento ──────────────────────────────────────────────────
    const overlay   = document.getElementById('monumento-overlay');
    const imgWrap   = document.getElementById('monumento-imagen-wrap');
    const numEl     = document.getElementById('monumento-numero');
    const btnCerrar = document.getElementById('monumento-cerrar');

    function mostrarMonumento(ref) {
      const numStr = ref.mapa_numero != null ? `Nº ${ref.mapa_numero} · ` : '';
      numEl.textContent = `${numStr}${ref.nombre || ''}`;
      document.getElementById('monumento-nombre').style.display = 'none';
      imgWrap.innerHTML = ref.imagen
        ? `<img src="${ref.imagen}" alt="${ref.nombre || ''}">`
        : `<div class="sin-imagen">🏛️</div>`;
      overlay.classList.add('visible');
    }

    function cerrarOverlay() { overlay.classList.remove('visible'); }
    btnCerrar.addEventListener('click', cerrarOverlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) cerrarOverlay(); });

    // ── Resize ─────────────────────────────────────────────────────────────
    globalThis.addEventListener('resize', () => map.invalidateSize());

    // ── Comunicación con el padre ───────────────────────────────────────────
    globalThis.addEventListener('message', event => {
      if (event.origin !== globalThis.location.origin) return;

      if (event.data?.tipo === 'solicitar-ruta') {
        globalThis.parent.postMessage({
          tipo: 'ruta-completa',
          paradas:   rutaCompleta.filter(p => p.tipo === 'parada'),
          waypoints: rutaCompleta.filter(p => p.tipo === 'waypoint'),
          ruta:      rutaCompleta
        }, globalThis.location.origin);
      }

      if (event.data?.tipo === 'mapa-visible') {
        _reajustarVista();
        setTimeout(_reajustarVista, 300);
      }
    });
  </script>
</body>
</html>
