<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
  <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains; preload" />
  <title>Mapa completo de aventura</title>
  <link rel="stylesheet" href="css/boton-cerrar.css">

  <style>
    :root {
      --gap-inferior: env(safe-area-inset-bottom, 0px);
    }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100vh;
    }

    /* Marcador pill de monumento */
    .monumento-marker {
      background: #fff;
      border: 2px solid #8B6914;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: clamp(0.7rem, 2.5vmin, 1rem);
      font-weight: bold;
      color: #8B6914;
      white-space: nowrap;
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* Overlay popup de monumento */
    #monumento-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding-bottom: var(--gap-inferior);
      box-sizing: border-box;
    }
    #monumento-overlay.visible {
      display: flex;
    }
    #monumento-card {
      background: #fff;
      border-radius: 12px;
      max-width: 95vw;
      width: 95vw;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      position: relative;
    }
    #monumento-card img {
      width: 100%;
      max-height: min(80vw, 60vh);
      object-fit: cover;
      display: block;
    }
    #monumento-card .sin-imagen {
      width: 100%;
      height: 140px;
      background: #f0ebe0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }
    #monumento-card .info {
      padding: 0.9rem 1rem 1rem;
    }
    #monumento-card .info .numero {
      font-size: 0.75rem;
      color: #8B6914;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }
    #monumento-card .info .nombre {
      font-size: clamp(1rem, 3.5vmin, 1.3rem);
      font-weight: bold;
      color: #222;
    }
  </style>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

  <div id="map"></div>

  <!-- Overlay popup monumento -->
  <div id="monumento-overlay">
    <div id="monumento-card">
      <button type="button" id="monumento-cerrar" class="btn-cerrar-overlay" title="Cerrar"><span class="icono-x-cerrar">✗</span></button>
      <div id="monumento-imagen-wrap"></div>
      <div class="info">
        <div class="numero" id="monumento-numero"></div>
        <div class="nombre" id="monumento-nombre"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script type="module">
    /*
     * DATOS POR MENSAJE, NUNCA POR IMPORT.
     *
     * Esta pagina importaba `DATOS_AVENTURAS` de coordenadas-aventuras.js, con dos
     * consecuencias: era el unico camino de datos que se saltaba a data-loader.js
     * (§22.12), y abriendo la URL a pelo mostraba la ruta COMPLETA de la aventura
     * —88 paradas con nombre y coordenadas— sin codigo de compra ni GPS. Medido.
     *
     * Ahora sigue el mismo patron que hijo1/hijo3/hijo4/hijo5/hijo6: el hijo no
     * importa datos, los pide a su padre. Sin padre no hay datos y el mapa sale
     * vacio — no porque se le prohiba, sino porque no tiene nada que pintar. No
     * hace falta ningun guard, ni por tanto una puerta trasera para los tests.
     *
     * Cuando los datos vengan del backend, esta pagina no se entera: el padre los
     * pedira con token y le mandara lo mismo.
     */
    import * as bus from './js/mensajeria.js';
    import { TIPOS_MENSAJE } from './js/constants.js';
    import logger from './js/logger.js';
    import { capaQueSeCierraConAtras } from './js/capa-con-atras.js';

    // Publica el logger en el globalThis de ESTA ventana. Cada iframe tiene el suyo, y el
    // `globalThis.logger = ...` de codigo-padre.html solo alcanza al del padre: sin esta
    // linea, los `(globalThis.logger || console).x` de los modulos compartidos que este frame
    // arrastra (constants.js, utils.js) caen al console crudo y se saltan el nivel de log
    // (ver GUIA-COMPLETA.md §26.3).
    globalThis.logger = logger;

    // Este frame habla por el mismo bus que el padre y que los seis hijos. Es hijo directo
    // del padre —el overlay cuelga de él—, asi que le basta el papel de hijo: ni registra
    // iframes ni tiene nietos.
    //
    // Sin padre no se inicializa: el bus avisaria una vez y todo envio devolveria false. El
    // mensaje de "abrelo desde la aventura" se pinta abajo, que es lo que el usuario necesita.
    const tienePadre = globalThis.parent && globalThis.parent !== globalThis;
    if (tienePadre) await bus.inicializarMensajeria({ id: 'mapa-completo' });

    const map = L.map('map', { center: [39.476, -0.375], zoom: 15, maxZoom: 21 });
    let _bounds = null;

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    function _reajustarVista() {
      map.invalidateSize();
      if (_bounds) map.fitBounds(_bounds, { padding: [24, 24] });
    }

    // ── Popup de monumento ────────────────────────────────────────────────
    const overlay   = document.getElementById('monumento-overlay');
    const imgWrap   = document.getElementById('monumento-imagen-wrap');
    const numEl     = document.getElementById('monumento-numero');
    const btnCerrar = document.getElementById('monumento-cerrar');

    function mostrarMonumento(ref) {
      const numStr = ref.mapa_numero != null ? `Nº ${ref.mapa_numero} · ` : '';
      numEl.textContent = `${numStr}${ref.nombre || ''}`;
      document.getElementById('monumento-nombre').style.display = 'none';
      imgWrap.innerHTML = ref.imagen
        ? `<img src="${ref.imagen}" alt="${ref.nombre || ''}">`
        : `<div class="sin-imagen">🏛️</div>`;
      overlay.classList.add('visible');
      avisarFicha?.(true);
    }

    function cerrarOverlay() {
      overlay.classList.remove('visible');
      avisarFicha?.(false);
    }
    btnCerrar.addEventListener('click', cerrarOverlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) cerrarOverlay(); });
    // El botón atrás del dispositivo cierra la ficha con cerrarOverlay(), lo mismo que su ✕ (js/capa-con-atras.js).
    // Sin padre no hay a quién avisar ni quién lo pida: la ficha se abre desde un marcador, y los marcadores salen de
    // los datos que manda el padre.
    const avisarFicha = tienePadre ? capaQueSeCierraConAtras(cerrarOverlay) : null;

    globalThis.addEventListener('resize', () => map.invalidateSize());

    // ── Pintado: se ejecuta cuando llegan las coordenadas del padre ───────
    let _pintado = false;
    function pintarRuta(coordenadas) {
      if (_pintado || !Array.isArray(coordenadas) || coordenadas.length === 0) return;
      _pintado = true;

      const rutaPuntos = [];
      coordenadas.forEach(entry => {
        if (entry.tipo === 'parada' || entry.tipo === 'inicio') {
          rutaPuntos.push([entry.coordenadas.lat, entry.coordenadas.lng]);
        } else if (entry.tipo === 'tramo') {
          rutaPuntos.push([entry.inicio.lat, entry.inicio.lng]);
          entry.waypoints.forEach(wp => rutaPuntos.push([wp.lat, wp.lng]));
          rutaPuntos.push([entry.fin.lat, entry.fin.lng]);
        }
      });

      coordenadas.forEach(entry => {
        if (entry.tipo === 'parada' || entry.tipo === 'inicio') {
        } else if (entry.tipo === 'tramo') {
        }
      });

      if (rutaPuntos.length > 0) {
        const polyline = L.polyline(rutaPuntos, { color: '#2255cc', weight: 5, opacity: 0.85 }).addTo(map);
        _bounds = polyline.getBounds();
      }

      coordenadas.filter(c => c.tipo === 'referencia').forEach(ref => {
        if (!ref.coordenadas || ref.coordenadas.lat == null) return;
        const icono = L.divIcon({
          html: `<div class="monumento-marker">🏛️ ${ref.mapa_numero}</div>`,
          className: '', iconSize: null, iconAnchor: [0, 0]
        });
        L.marker([ref.coordenadas.lat, ref.coordenadas.lng], {
          icon: icono,
          title: ref.nombre || `Monumento ${ref.mapa_numero}`,
          zIndexOffset: 400
        }).addTo(map).on('click', () => mostrarMonumento(ref));
      });

      _reajustarVista();
    }

    // ── Comunicación con el padre ─────────────────────────────────────────
    //
    // Aqui habia una escucha cruda que ademas atendia 'solicitar-ruta' devolviendo la ruta
    // entera al padre. Ese tipo no lo enviaba nadie, en ningun fichero del proyecto: era un
    // camino muerto que mantenia viva `rutaCompleta` solo para alimentarlo.
    if (tienePadre) {
      bus.registrarControlador(TIPOS_MENSAJE.MAPA_COMPLETO.DATOS, (mensaje) => {
        pintarRuta(mensaje.datos?.coordenadas);
        return { pintadas: mensaje.datos?.coordenadas?.length ?? 0 };
      });

      // El overlay acaba de hacerse visible: hasta ahora el contenedor no tenia tamaño y
      // medir era inutil. El segundo intento cubre la animacion de apertura.
      bus.registrarControlador(TIPOS_MENSAJE.MAPA_COMPLETO.VISIBLE, () => {
        _reajustarVista();
        setTimeout(_reajustarVista, 300);
        return true;
      });

      // Pedir los datos, sin decir de que aventura: la decide el padre, la que eligio el usuario
      // (docs/estudio-caminos.md, K-107). Sin padre no hay a quien pedirselos: el mapa queda vacio.
      void bus.enviarMensaje({
        tipo: TIPOS_MENSAJE.MAPA_COMPLETO.SOLICITAR_DATOS,
        destino: 'padre',
        datos: {},
      });
    } else {
      document.getElementById('map').innerHTML =
        `<p style="padding:2rem;font-size:1.25rem;text-align:center;">Este mapa forma parte de la aventura y necesita abrirse desde ella.</p>`;
    }
  </script>
</body>
</html>
