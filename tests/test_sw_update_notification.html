<!DOCTYPE html>
<html>
<head>
    <title>Test SW Update Banner</title>
    <style>
        body { font-family: Verdana, sans-serif; padding: 16px; }
        .pass { color: green; }
        .fail { color: red; }
    </style>
</head>
<body>
    <h1>Test: SW Update Notification Banner</h1>
    <div id="results"></div>

    <script src="test-reporter-utility.js"></script>
    <script>
        // Simula el entorno del padre cargando solo el bloque SW relevante
        // de codigo-padre.html, pero mockeando navigator.serviceWorker.

        function check(label, condition) {
            const el = document.createElement('div');
            el.className = condition ? 'pass' : 'fail';
            el.textContent = (condition ? '✅ ' : '❌ ') + label;
            document.getElementById('results').appendChild(el);
        }

        // Mock de TRADUCCIONES_SW_UPDATE (en producción viene de traducciones-ui.js vía globalThis)
        globalThis.TRADUCCIONES_SW_UPDATE = {
            es: { label: '🔄 Nueva versión disponible', boton: 'Actualizar' },
            en: { label: '🔄 New version available',    boton: 'Update' },
            fr: { label: '🔄 Nouvelle version disponible', boton: 'Mettre à jour' },
            it: { label: '🔄 Nuova versione disponibile',   boton: 'Aggiorna' },
            nl: { label: '🔄 Nieuwe versie beschikbaar',    boton: 'Bijwerken' },
            de: { label: '🔄 Neue Version verfügbar',       boton: 'Aktualisieren' },
            ja: { label: '🔄 新しいバージョンが利用可能です', boton: '更新' },
            zh: { label: '🔄 新版本可用',                   boton: '更新' },
            pl: { label: '🔄 Nowa wersja dostępna',         boton: 'Zaktualizuj' },
            pt: { label: '🔄 Nova versão disponível',       boton: 'Atualizar' },
            ru: { label: '🔄 Доступна новая версия',        boton: 'Обновить' },
            uk: { label: '🔄 Доступна нова версія',         boton: 'Оновити' },
        };

        function runTest() {
            let passed = 0, failed = 0;

            // ── Helpers ──────────────────────────────────────────────────────
            function cleanupBanner() {
                const el = document.getElementById('sw-update-banner');
                if (el) el.remove();
            }

            // Copia exacta de _mostrarBannerSW de codigo-padre.html (sin navegación real —
            // el clic solo marca reloadRef.called, no toca localStorage['vv_sw_update_pendiente']
            // porque el botón real ya no lo limpia antes de navegar, ver T4)
            function _makeMostrarBannerSW(reloadRef) {
                let _swBannerMostrado = false;
                function _mostrarBannerSW(version) {
                    const _existente = document.getElementById('sw-update-banner');
                    if (_existente) {
                        const _span = _existente.querySelector('span');
                        if (_span && version) {
                            const _base = _span.textContent.replace(/\s*\([^)]*\)\s*$/, '');
                            _span.textContent = _base + ' (' + version + ')';
                        }
                        return;
                    }
                    _swBannerMostrado = true;
                    const _lang = globalThis.idiomaSeleccionado
                        || (() => { try { return localStorage.getItem('vv_idioma'); } catch (_) { return null; } })()
                        || 'es';
                    const _t = (globalThis.TRADUCCIONES_SW_UPDATE || {})[_lang]
                        || { label: '🔄 Nueva versión disponible', boton: 'Actualizar' };
                    const banner = document.createElement('div');
                    banner.id = 'sw-update-banner';
                    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:1100000;background:#1a1a2e;color:white;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;font-family:Verdana,sans-serif;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,0.4);';
                    const label = document.createElement('span');
                    label.textContent = _t.label + (version ? ' (' + version + ')' : '');
                    const btn = document.createElement('button');
                    btn.textContent = _t.boton;
                    btn.style.cssText = 'background:#ff8c00;color:white;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:bold;';
                    btn.addEventListener('click', () => { reloadRef.called = true; });
                    banner.appendChild(label);
                    banner.appendChild(btn);
                    document.body.appendChild(banner);
                }
                return { mostrar: _mostrarBannerSW, getMostrado: () => _swBannerMostrado };
            }

            // Mirror del criterio de codigo-padre.html (una instancia = una carga de
            // página), sin navigator.serviceWorker ni fetch reales: los eventos se
            // inyectan a mano en el mismo orden en que los dispara el navegador.
            // Reproduce _evaluarVersiones y los tres caminos que desembocan en ella.
            function _crearMecanismoSW({ previousController = true } = {}) {
                const PEND = 'vv_sw_update_pendiente';
                let _swBannerMostrado = false;
                let _paginaObsoleta = false;
                let _versionDeCarga = null;
                let _versionDesplegada = null;
                let _reciclando = false;

                function marcar(v) { try { localStorage.setItem(PEND, v || 'desconocida'); } catch (_e) { /* ignore */ } }
                function limpiar() { try { localStorage.removeItem(PEND); } catch (_e) { /* ignore */ } }
                function retirar() {
                    document.getElementById('sw-update-banner')?.remove();
                    _swBannerMostrado = false;
                }
                function mostrar(version) {
                    marcar(version);
                    const ex = document.getElementById('sw-update-banner');
                    if (ex) {
                        const s = ex.querySelector('span');
                        if (s && version) s.textContent = s.textContent.replace(/\s*\([^)]*\)\s*$/, '') + ' (' + version + ')';
                        return;
                    }
                    _swBannerMostrado = true;
                    const b = document.createElement('div');
                    b.id = 'sw-update-banner';
                    const s = document.createElement('span');
                    s.textContent = '🔄 Nueva versión disponible' + (version ? ' (' + version + ')' : '');
                    b.appendChild(s);
                    document.body.appendChild(b);
                }
                function evaluar() {
                    if (_reciclando) return; // la app se está borrando: nada que anunciar
                    if (_paginaObsoleta) { mostrar(_versionDesplegada); return; }
                    if (!_versionDesplegada) return;
                    if (!_versionDeCarga) return;
                    if (_versionDeCarga === _versionDesplegada) { limpiar(); retirar(); return; }
                    mostrar(_versionDesplegada);
                }

                return {
                    // Arranque: repinta el banner si una sesión anterior lo dejó pendiente
                    arrancar() {
                        let p = null;
                        try { p = localStorage.getItem(PEND); } catch (_e) { /* ignore */ }
                        if (p) mostrar(p === 'desconocida' ? null : p);
                    },
                    controllerchange() {
                        if (!previousController) return;
                        _paginaObsoleta = true;
                        if (_swBannerMostrado) return;
                        evaluar();
                    },
                    swActivado(v) {
                        if (!previousController) return;
                        _paginaObsoleta = true;
                        if (v) _versionDesplegada = v;
                        if (_swBannerMostrado) return;
                        evaluar();
                    },
                    swVersion(v) { if (!_versionDeCarga && v) { _versionDeCarga = v; evaluar(); } },
                    versionRemota(v) { _versionDesplegada = v; evaluar(); },
                    empezarReciclaje() { _reciclando = true; },
                    hayBanner: () => !!document.getElementById('sw-update-banner'),
                    pendiente: () => { try { return localStorage.getItem(PEND); } catch (_e) { return null; } },
                };
            }

            // ── SUITE A: comportamiento básico ───────────────────────────────
            const reloadA = { called: false };
            const suiteA = _makeMostrarBannerSW(reloadA);
            cleanupBanner();
            globalThis.idiomaSeleccionado = null; // sin idioma → fallback 'es'

            suiteA.mostrar('v-test-1');
            const banner1 = document.getElementById('sw-update-banner');

            // T1
            const t1 = !!banner1;
            check('_mostrarBannerSW() crea #sw-update-banner en el DOM', t1);
            if (t1) passed++; else failed++;

            // T2
            const t2 = banner1 && banner1.querySelector('span')?.textContent.includes('v-test-1');
            check('El banner muestra la versión recibida', t2);
            if (t2) passed++; else failed++;

            // T3
            const t3 = !!banner1?.querySelector('button');
            check('El banner tiene botón de actualizar', t3);
            if (t3) passed++; else failed++;

            // T4 — el botón navega (cache-busting) SIN limpiar el aviso pendiente antes;
            // se limpia solo cuando la activación siguiente confirma la versión (T14/T15).
            try { localStorage.setItem('vv_sw_update_pendiente', 'v-test-1'); } catch (_e) { /* ignore */ }
            banner1?.querySelector('button')?.click();
            const t4 = reloadA.called && localStorage.getItem('vv_sw_update_pendiente') === 'v-test-1';
            check('El botón navega y no limpia el aviso pendiente antes de recargar', t4);
            if (t4) passed++; else failed++;
            try { localStorage.removeItem('vv_sw_update_pendiente'); } catch (_e) { /* ignore */ }

            // T5
            suiteA.mostrar('v-test-2');
            const bannerCount = document.querySelectorAll('#sw-update-banner').length;
            const t5 = bannerCount === 1;
            check('Llamar _mostrarBannerSW dos veces no duplica el banner (count=' + bannerCount + ')', t5);
            if (t5) passed++; else failed++;

            // T6
            const t6 = suiteA.getMostrado() === true;
            check('_swBannerMostrado=true después de mostrar el banner', t6);
            if (t6) passed++; else failed++;

            // T7
            const zIndex = banner1 ? parseInt(banner1.style.zIndex || '0') : 0;
            const t7 = zIndex > 1000010;
            check('Banner z-index (' + zIndex + ') > media-overlay z-index (1000010)', t7);
            if (t7) passed++; else failed++;

            // T8
            const t8 = typeof globalThis._swReloadPendiente === 'undefined';
            check('globalThis._swReloadPendiente no existe (eliminado)', t8);
            if (t8) passed++; else failed++;

            // T9
            const t9 = typeof globalThis._intentarAplicarReloadSW === 'undefined';
            check('globalThis._intentarAplicarReloadSW no existe (eliminado)', t9);
            if (t9) passed++; else failed++;

            // T10: sin versión, sin paréntesis
            cleanupBanner();
            const suiteA2 = _makeMostrarBannerSW({ called: false });
            suiteA2.mostrar(null);
            const banner3 = document.getElementById('sw-update-banner');
            const t10 = banner3 && !banner3.querySelector('span')?.textContent.includes('(')
                                 && banner3.querySelector('span')?.textContent.includes('versión');
            check('_mostrarBannerSW(null) muestra texto sin versión entre paréntesis', t10);
            if (t10) passed++; else failed++;

            // ── SUITE B: traducciones ────────────────────────────────────────
            cleanupBanner();

            // T11: idioma inglés → texto y botón en inglés
            globalThis.idiomaSeleccionado = 'en';
            const suiteB = _makeMostrarBannerSW({ called: false });
            suiteB.mostrar(null);
            const bannerEN = document.getElementById('sw-update-banner');
            const t11 = bannerEN?.querySelector('span')?.textContent.includes('New version')
                     && bannerEN?.querySelector('button')?.textContent === 'Update';
            check('Idioma "en": label en inglés y botón "Update"', t11);
            if (t11) passed++; else failed++;
            cleanupBanner();

            // T12: idioma desconocido → fallback español
            globalThis.idiomaSeleccionado = 'xx';
            const suiteC = _makeMostrarBannerSW({ called: false });
            suiteC.mostrar(null);
            const bannerXX = document.getElementById('sw-update-banner');
            const t12 = bannerXX?.querySelector('span')?.textContent.includes('Nueva versión')
                     && bannerXX?.querySelector('button')?.textContent === 'Actualizar';
            check('Idioma desconocido "xx": fallback a español', t12);
            if (t12) passed++; else failed++;
            cleanupBanner();

            // T13: idioma alemán → botón "Aktualisieren"
            globalThis.idiomaSeleccionado = 'de';
            const suiteD = _makeMostrarBannerSW({ called: false });
            suiteD.mostrar(null);
            const bannerDE = document.getElementById('sw-update-banner');
            const t13 = bannerDE?.querySelector('button')?.textContent === 'Aktualisieren';
            check('Idioma "de": botón "Aktualisieren"', t13);
            if (t13) passed++; else failed++;
            cleanupBanner();

            // ── SUITE E: secuencia real de actualización, página a página ─────
            // Reproduce el ciclo completo con los eventos en el orden real del
            // navegador. T15 es la regresión del banner que se quedaba pegado
            // para siempre: con el criterio anterior (comparar la versión activada
            // contra el pendiente) fallaba, porque controllerchange llega antes que
            // SW_ACTIVADO y deja el pendiente en 'desconocida', valor que ninguna
            // versión concreta puede igualar nunca.
            cleanupBanner();
            try { localStorage.removeItem('vv_sw_update_pendiente'); } catch (_e) { /* ignore */ }

            // T14: se activa un SW nuevo bajo la página → banner y aviso pendiente
            const pagina1 = _crearMecanismoSW();
            pagina1.controllerchange();   // el navegador dispara este primero…
            pagina1.swActivado('v-2');    // …y el mensaje del SW justo después
            const t14 = pagina1.hayBanner() && pagina1.pendiente() === 'desconocida';
            check('Update real (controllerchange → SW_ACTIVADO): avisa y deja el aviso pendiente', t14);
            if (t14) passed++; else failed++;
            cleanupBanner();

            // T15 (REGRESIÓN): tras recargar, la página nueva YA es la desplegada →
            // el aviso se limpia y el banner desaparece. Sin esto, el banner reaparecía
            // en cada arranque para siempre por mucho que el cliente lo pulsara.
            const pagina2 = _crearMecanismoSW();
            pagina2.arrancar();           // repinta el banner por el flag pendiente
            pagina2.swVersion('v-2');     // el SW dice con qué versión se cargó
            pagina2.versionRemota('v-2'); // version.json dice qué hay desplegado
            const t15 = !pagina2.hayBanner() && pagina2.pendiente() === null;
            check('REGRESIÓN — tras recargar en la versión desplegada: limpia el aviso y retira el banner', t15);
            if (t15) passed++; else failed++;
            cleanupBanner();

            // T16: si la recarga NO trajo la versión nueva, el aviso se mantiene y se
            // re-anuncia con la versión desplegada (segunda oportunidad de pulsar)
            try { localStorage.setItem('vv_sw_update_pendiente', 'desconocida'); } catch (_e) { /* ignore */ }
            const pagina3 = _crearMecanismoSW();
            pagina3.arrancar();
            pagina3.swVersion('v-1');     // sigue corriendo la vieja
            pagina3.versionRemota('v-2');
            const t16 = pagina3.hayBanner() && pagina3.pendiente() === 'v-2';
            check('Recarga que no aplicó la nueva versión: mantiene el aviso y re-anuncia la desplegada', t16);
            if (t16) passed++; else failed++;
            cleanupBanner();
            try { localStorage.removeItem('vv_sw_update_pendiente'); } catch (_e) { /* ignore */ }

            // T17: página ya al día y sin nada pendiente → nunca aparece banner
            const pagina4 = _crearMecanismoSW();
            pagina4.swVersion('v-2');
            pagina4.versionRemota('v-2');
            const t17 = !pagina4.hayBanner() && pagina4.pendiente() === null;
            check('Página al día y sin aviso pendiente: no aparece banner', t17);
            if (t17) passed++; else failed++;
            cleanupBanner();

            // T18: una página obsoleta no se "des-obsoleta" aunque las versiones
            // coincidan — el SW nuevo tendrá la versión desplegada, pero el código que
            // el usuario está viendo se cargó antes y sigue siendo el viejo.
            const pagina5 = _crearMecanismoSW();
            pagina5.controllerchange();
            pagina5.swVersion('v-2');
            pagina5.versionRemota('v-2');
            const t18 = pagina5.hayBanner() && pagina5.pendiente() !== null;
            check('Página obsoleta por activación: sigue avisando aunque las versiones coincidan', t18);
            if (t18) passed++; else failed++;
            cleanupBanner();
            try { localStorage.removeItem('vv_sw_update_pendiente'); } catch (_e) { /* ignore */ }

            // T19: si el SW no contesta (versión de carga desconocida) no se decide
            // nada: el aviso pendiente NO se limpia por suposición.
            try { localStorage.setItem('vv_sw_update_pendiente', 'v-9'); } catch (_e) { /* ignore */ }
            const pagina6 = _crearMecanismoSW();
            pagina6.arrancar();
            pagina6.versionRemota('v-9'); // sin swVersion: no hay base fiable
            const t19 = pagina6.hayBanner() && pagina6.pendiente() === 'v-9';
            check('Sin respuesta del SW: no se limpia el aviso por suposición', t19);
            if (t19) passed++; else failed++;
            cleanupBanner();
            try { localStorage.removeItem('vv_sw_update_pendiente'); } catch (_e) { /* ignore */ }

            // T20: durante el reciclaje digital (limpiarDatosAventura) el mecanismo se
            // calla. Desregistrar el SW dispara controllerchange, que sin esto sacaría el
            // banner al cliente justo al terminar su aventura y reescribiría la clave en
            // el localStorage recién vaciado.
            const pagina7 = _crearMecanismoSW();
            pagina7.empezarReciclaje();
            pagina7.controllerchange();   // lo que provoca el desregistro del SW
            pagina7.versionRemota('v-3'); // y un probe en vuelo que llega después
            const t20 = !pagina7.hayBanner() && pagina7.pendiente() === null;
            check('Durante el reciclaje digital: ni banner ni escritura en localStorage', t20);
            if (t20) passed++; else failed++;
            cleanupBanner();
            try { localStorage.removeItem('vv_sw_update_pendiente'); } catch (_e) { /* ignore */ }

            // Restaurar
            globalThis.idiomaSeleccionado = null;

            globalThis.TestReporter.report({
                name: 'PWA: SW Update Banner',
                passed,
                failed
            });
        }

        globalThis.runTest = runTest;
    </script>
</body>
</html>
