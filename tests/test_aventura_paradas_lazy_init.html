<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test: AVENTURA_PARADAS Lazy-Init</title>
    <style>
        body { font-family: monospace; padding: 10px; background: #1a1a2e; color: #eee; }
        .test-result { padding: 6px 10px; margin: 4px 0; border-radius: 4px; }
        .success { background: #1b5e20; color: #a5d6a7; }
        .error { background: #b71c1c; color: #ef9a9a; }
        .info { background: #0d47a1; color: #90caf9; }
        h2 { color: #ffd54f; }
    </style>
</head>
<body>
    <h2>Test: AVENTURA_PARADAS Lazy-Init</h2>
    <p>Verifica el lazy-init de globalThis.AVENTURA_PARADAS desde globalThis.__vv_DATOS_AVENTURAS cuando AVENTURA_PARADAS está vacío.</p>
    <div id="results"></div>
    <script src="test-reporter-utility.js"></script>
    <script>
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = 'test-result ' + type;
            div.textContent = message;
            document.getElementById('results').appendChild(div);
        }

        // ── Real coordenadas data matching coordenadas-aventuras.js (Aventura1 subset) ──
        const REAL_COORDENADAS = [
            { id: 'Av1-P-0', tipo: 'inicio', nombre: 'Torres de Serranos (start)', coordenadas: { lat: 39.47876, lng: -0.37626 } },
            { id: 'Av1-TR-1', tipo: 'tramo', nombre: 'Torres de Serranos → Plaza de la crida', inicio: { lat: 39.47876, lng: -0.37626 }, fin: { lat: 39.47959, lng: -0.37583 } },
            { id: 'Av1-P-1', tipo: 'parada', nombre: 'Plaza de la crida', coordenadas: { lat: 39.47959, lng: -0.37583 } },
            { id: 'Av1-TR-2', tipo: 'tramo', nombre: 'Plaza de la crída → Calle Muro de Santa Ana', inicio: { lat: 39.47959, lng: -0.37583 }, fin: { lat: 39.47866, lng: -0.37470 } },
            { id: 'Av1-P-2', tipo: 'parada', nombre: 'Calle Muro de Santa Ana', coordenadas: { lat: 39.47866, lng: -0.37470 } }
        ];

        // ── Replicate lazy-init logic from funciones-mapa.js manejarCambiarParada (lines 2031-2037) ──
        function lazyInitAventuraParadas(aventura) {
            if (!globalThis.AVENTURA_PARADAS?.length && globalThis.__vv_DATOS_AVENTURAS && aventura) {
                const lazyCoords = globalThis.__vv_DATOS_AVENTURAS?.[aventura]?.['coordenadas-hijo2.html']?.coordenadas;
                if (lazyCoords?.length) {
                    globalThis.AVENTURA_PARADAS = lazyCoords;
                    return true; // lazy-init performed
                }
            }
            return false; // not needed or failed
        }

        // ── Exact search logic from funciones-mapa.js ──
        function buscarEnAventuraParadas(paradas, idToMatch) {
            if (!paradas || !idToMatch) return undefined;
            const idSinPrefijo = idToMatch.startsWith('padre-') ? idToMatch.substring(6) : idToMatch;
            return paradas.find(p =>
                p.padreid === idToMatch ||
                p.parada_id === idToMatch ||
                p.tramo_id === idToMatch ||
                p.id === idToMatch ||
                p.parada_id === idSinPrefijo ||
                p.tramo_id === idSinPrefijo ||
                p.id === idSinPrefijo
            );
        }

        globalThis.runTest = function() {
            addResult('── 1. Precondición: AVENTURA_PARADAS vacío pero __vv_DATOS_AVENTURAS disponible ──', 'info');

            // Setup: clear AVENTURA_PARADAS, set __vv_DATOS_AVENTURAS
            globalThis.AVENTURA_PARADAS = undefined;
            globalThis.aventuraSeleccionada = 'Aventura1';
            globalThis.__vv_DATOS_AVENTURAS = {
                Aventura1: {
                    'coordenadas-hijo2.html': {
                        coordenadas: REAL_COORDENADAS
                    }
                }
            };

            // Test 1: AVENTURA_PARADAS starts empty
            if (!globalThis.AVENTURA_PARADAS?.length) {
                addResult('✅ Precondición: AVENTURA_PARADAS está vacío/undefined', 'success');
            } else {
                addResult('❌ Precondición fallida: AVENTURA_PARADAS ya tenía datos', 'error');
            }

            // Test 2: __vv_DATOS_AVENTURAS tiene los datos
            const coordsDisponibles = globalThis.__vv_DATOS_AVENTURAS?.['Aventura1']?.['coordenadas-hijo2.html']?.coordenadas;
            if (coordsDisponibles && coordsDisponibles.length === REAL_COORDENADAS.length) {
                addResult('✅ Precondición: __vv_DATOS_AVENTURAS disponible con ' + coordsDisponibles.length + ' coordenadas', 'success');
            } else {
                addResult('❌ Precondición fallida: __vv_DATOS_AVENTURAS no tiene datos esperados', 'error');
            }

            addResult('── 2. Lazy-init detecta AVENTURA_PARADAS vacío y lo puebla ──', 'info');

            // Test 3: lazy-init performs the population
            const initPerformed = lazyInitAventuraParadas(globalThis.aventuraSeleccionada);
            if (initPerformed) {
                addResult('✅ lazy-init ejecutado (retornó true)', 'success');
            } else {
                addResult('❌ lazy-init no se ejecutó (retornó false)', 'error');
            }

            // Test 4: AVENTURA_PARADAS now has the data
            if (globalThis.AVENTURA_PARADAS?.length === REAL_COORDENADAS.length) {
                addResult('✅ AVENTURA_PARADAS poblado con ' + globalThis.AVENTURA_PARADAS.length + ' elementos', 'success');
            } else {
                addResult('❌ AVENTURA_PARADAS.length incorrecto: ' + (globalThis.AVENTURA_PARADAS?.length ?? 'undefined'), 'error');
            }

            addResult('── 3. Lazy-init no se repite si AVENTURA_PARADAS ya tiene datos ──', 'info');

            // Test 5: lazy-init is idempotent — won't re-run when already populated
            const initPerformed2 = lazyInitAventuraParadas(globalThis.aventuraSeleccionada);
            if (!initPerformed2) {
                addResult('✅ lazy-init idempotente: no re-ejecuta cuando ya hay datos', 'success');
            } else {
                addResult('❌ lazy-init re-ejecutó innecesariamente', 'error');
            }

            addResult('── 4. Búsqueda p.id === idSinPrefijo tras lazy-init ──', 'info');

            // Test 6: After lazy-init, search for "padre-Av1-TR-2" via p.id === idSinPrefijo
            const result = buscarEnAventuraParadas(globalThis.AVENTURA_PARADAS, 'padre-Av1-TR-2');
            if (result && result.id === 'Av1-TR-2' && result.tipo === 'tramo') {
                addResult('✅ Búsqueda "padre-Av1-TR-2" → p.id="Av1-TR-2" (tipo=tramo) encontrado', 'success');
            } else {
                addResult('❌ Búsqueda "padre-Av1-TR-2" falló tras lazy-init: ' + JSON.stringify(result), 'error');
            }

            // Test 7: Search for "padre-Av1-P-0" after lazy-init
            const result2 = buscarEnAventuraParadas(globalThis.AVENTURA_PARADAS, 'padre-Av1-P-0');
            if (result2 && result2.id === 'Av1-P-0' && result2.tipo === 'inicio') {
                addResult('✅ Búsqueda "padre-Av1-P-0" → p.id="Av1-P-0" (tipo=inicio) encontrado', 'success');
            } else {
                addResult('❌ Búsqueda "padre-Av1-P-0" falló: ' + JSON.stringify(result2), 'error');
            }

            // Test 8: Search for direct "Av1-P-1" (no padre- prefix)
            const result3 = buscarEnAventuraParadas(globalThis.AVENTURA_PARADAS, 'Av1-P-1');
            if (result3 && result3.id === 'Av1-P-1') {
                addResult('✅ Búsqueda directa "Av1-P-1" → encontrado (p.id match directo)', 'success');
            } else {
                addResult('❌ Búsqueda directa "Av1-P-1" falló', 'error');
            }

            addResult('── 5. Lazy-init no actúa sin aventuraSeleccionada ──', 'info');

            // Test 9: Without aventuraSeleccionada, lazy-init should not populate
            globalThis.AVENTURA_PARADAS = undefined;
            const initNoAventura = lazyInitAventuraParadas(null);
            if (!initNoAventura && !globalThis.AVENTURA_PARADAS?.length) {
                addResult('✅ Sin aventuraSeleccionada=null, lazy-init no actúa', 'success');
            } else {
                addResult('❌ lazy-init actuó sin aventuraSeleccionada', 'error');
            }

            // Test 10: Without __vv_DATOS_AVENTURAS, lazy-init should not crash
            globalThis.AVENTURA_PARADAS = undefined;
            const savedData = globalThis.__vv_DATOS_AVENTURAS;
            globalThis.__vv_DATOS_AVENTURAS = undefined;
            let noThrow = true;
            try {
                lazyInitAventuraParadas('Aventura1');
            } catch (e) {
                noThrow = false;
            }
            globalThis.__vv_DATOS_AVENTURAS = savedData;
            if (noThrow) {
                addResult('✅ Sin __vv_DATOS_AVENTURAS, lazy-init no lanza excepción', 'success');
            } else {
                addResult('❌ lazy-init lanzó excepción cuando __vv_DATOS_AVENTURAS era undefined', 'error');
            }

            globalThis.TestReporter.report({
                name: 'IDs: AVENTURA_PARADAS Lazy-Init',
                resultsContainer: document.getElementById('results')
            });
        };

        globalThis.runTest();
    </script>
</body>
</html>
