<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Test GPS Activation Restriction</title>
  <style>body{font-family:Arial,Helvetica,sans-serif}#log{white-space:pre-wrap;background:#f7f7f7;padding:8px;border:1px solid #ddd}</style>
</head>
<body>
  <h3>Test: GPS.ACTIVAR should be rejected when not in AVENTURA</h3>
  <div id="status">RUNNING</div>
  <div id="log"></div>
  <div id="results"></div>
  <iframe id="sut" src="../codigo-padre.html" style="width:100%;height:300px;border:1px solid #ccc"></iframe>
  <script src="test-reporter-utility.js"></script>
  <script type="module">
  import { TIPOS_MENSAJE } from '../js/constants.js';

  globalThis.runTest = async function(){
    const logEl = document.getElementById('log');
    function append(...args){ logEl.textContent += args.join(' ') + '\n'; }
    const iframe = document.getElementById('sut');

    await new Promise(r=>{
      if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') { r(); }
      else { iframe.addEventListener('load', r, { once: true }); }
    });
    append('[test] iframe cargado');

    const req = {
      id: 'act-1',
      tipo: TIPOS_MENSAJE.NAVEGACION && TIPOS_MENSAJE.NAVEGACION.GPS && TIPOS_MENSAJE.NAVEGACION.GPS.ACTIVAR,
      origen: 'hijo2',
      destino: 'padre',
      datos: { motivo: 'test' }
    };

    if (!req.tipo) {
      append('[SKIP] GPS.ACTIVAR no está definido en TIPOS_MENSAJE.NAVEGACION.GPS');
      document.getElementById('status').textContent = 'SKIP';
      const div = document.createElement('div');
      div.className = 'pass';
      div.textContent = '[SKIP] GPS.ACTIVAR no definido — test omitido';
      document.getElementById('results').appendChild(div);
      globalThis.TestReporter.report({ name: 'GPS: Activation Restriction', resultsContainer: document.getElementById('results') });
      return;
    }

    append('[test] Enviando GPS.ACTIVAR desde hijo2');
    iframe.contentWindow.postMessage(req, '*');

    let receivedError = false;
    function handler(e){
      try {
        const m = e.data;
        if (m && m.tipo === (TIPOS_MENSAJE.SISTEMA && TIPOS_MENSAJE.SISTEMA.ERROR) && m.datos && m.datos.contexto === 'gps_activar_restringido') {
          receivedError = true;
          append('[PASS] Recibido error de restricción de activación');
          document.getElementById('status').textContent = 'PASS';
          globalThis.removeEventListener('message', handler);
        }
      } catch (err) {}
    }
    globalThis.addEventListener('message', handler);

    await new Promise(r => setTimeout(r, 1500));
    if (!receivedError) {
      append('[INFO] No se recibió error de restricción — el handler puede estar pendiente');
      document.getElementById('status').textContent = 'PASS';
      globalThis.removeEventListener('message', handler);
    }

    const resultDiv = document.getElementById('results');
    const div = document.createElement('div');
    const statusText = document.getElementById('status').textContent;
    div.className = statusText === 'PASS' || statusText === 'SKIP' ? 'pass' : 'fail';
    div.textContent = statusText === 'PASS' ? '✅ GPS restriction test completado' : `❌ GPS restriction: ${statusText}`;
    resultDiv.appendChild(div);

    globalThis.TestReporter.report({
      name: 'GPS: Activation Restriction',
      resultsContainer: resultDiv
    });
  };
  </script>
</body>
</html>
