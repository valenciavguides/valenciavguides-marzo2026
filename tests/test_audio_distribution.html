<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Distribución Audio</title>
    <script src="../js/suppress-warnings.js"></script>
    <script src="../js/logger.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/constants.js"></script>
    <script src="../js/mensajeria.js"></script>
    <script src="../js/validacion.js"></script>
    <script src="test-reporter-utility.js"></script>
</head>
<body>
    <h1>Test Distribución de Datos de Audio</h1>
    <div id="results"></div>

    <script>
        const resultsDiv = document.getElementById('results');

        globalThis.runTest = async function() {
            let passed = 0, failed = 0;
            function ok(msg) { passed++; resultsDiv.innerHTML += `<p>✅ ${msg}</p>`; }
            function fail(msg) { failed++; resultsDiv.innerHTML += `<p>❌ ${msg}</p>`; }

            try {
                resultsDiv.innerHTML = '';

                // 1. Cargar módulo de audios
                const { AUDIOS_AVENTURAS } = await import('../js/audios-aventuras.js');
                if (AUDIOS_AVENTURAS && AUDIOS_AVENTURAS.Aventura1 && AUDIOS_AVENTURAS.Aventura1.es) {
                    ok(`Módulo audios-aventuras.js cargado (${AUDIOS_AVENTURAS.Aventura1.es.length} audios Av1/es)`);
                } else {
                    fail('AUDIOS_AVENTURAS.Aventura1.es no encontrado');
                }

                // 2. Crear iframe de audio-hijo3
                const audioIframe = document.createElement('iframe');
                audioIframe.src = '../audio-hijo3.html';
                audioIframe.style.cssText = 'width:400px;height:200px;border:1px solid #ccc';
                document.body.appendChild(audioIframe);

                await new Promise(resolve => {
                    if (audioIframe.contentDocument && audioIframe.contentDocument.readyState === 'complete') { resolve(); }
                    else { audioIframe.addEventListener('load', resolve, { once: true }); }
                });
                ok('Iframe audio-hijo3.html cargado');

                // 3. Enviar CARGAR_AUDIOS al iframe
                const { TIPOS_MENSAJE } = await import('../js/constants.js');
                const audios = AUDIOS_AVENTURAS?.Aventura1?.es || [];
                audioIframe.contentWindow.postMessage({
                    tipo: TIPOS_MENSAJE.DATOS.CARGAR_AUDIOS,
                    origen: 'padre',
                    destino: 'hijo3',
                    datos: { aventura: 'Aventura1', idioma: 'es', audios, total: audios.length }
                }, '*');
                ok(`Mensaje CARGAR_AUDIOS enviado (${audios.length} audios)`);

            } catch (error) {
                fail(`Error: ${error.message}`);
                console.error('Error en test:', error);
            }

            globalThis.TestReporter.report({ name: 'Verification: Audio Distribution', passed, failed });
        };
    </script>
</body>
</html>
