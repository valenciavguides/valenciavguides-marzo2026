<!DOCTYPE html>
<html>
<head>
    <title>Test Básico Iframe</title>
    <script src="test-reporter-utility.js"></script>
</head>
<body>
    <h1>Test Básico de Iframe</h1>
    <div id="results"></div>
    <div id="iframe-container"></div>

    <script>
        globalThis.runTest = function() {
            // Llamar directamente al callback del master-test sin pasar por TestReporter
            var target = window.parent !== window ? window.parent : null;
            if (target && typeof target.reportTestResult === 'function') {
                target.reportTestResult({ name: 'Basic: iframe Basico', passed: 1, failed: 0 });
            } else if (target && target.globalThis && typeof target.globalThis.reportTestResult === 'function') {
                target.globalThis.reportTestResult({ name: 'Basic: iframe Basico', passed: 1, failed: 0 });
            } else {
                // Fallback: TestReporter por si acaso
                globalThis.TestReporter.report({ name: 'Basic: iframe Basico', passed: 1, failed: 0 });
            }
        };
    </script>
</body>
</html>
