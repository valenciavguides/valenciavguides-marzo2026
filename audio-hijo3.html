<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>
    /* Escalado proporcional PURO: sincronizar con viewport del padre SIN LÍMITES */
    (function(){
        function escalar(){
            var w, h;
            w = globalThis.innerWidth; h = globalThis.innerHeight;
            var f = Math.max(16, Math.min(Math.min(w, h) * 0.025, 18));
            document.documentElement.style.fontSize = f + "px";
        }
        escalar();
        globalThis.addEventListener("resize", escalar);
    })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains; preload">
    <title>audio-hijo3</title>
    <script src="js/proteccion.js"></script>
    <script src="js/suppress-warnings.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        /* Escalado proporcional puro: 2.5% del menor lado del viewport */
        html { font-size: clamp(16px, 5vmin, 18px); }

        /* Fuente global Verdana */
        * { font-family: Verdana, sans-serif !important; }

        :root {
            --btn-size: calc(50vh - 4px);
            --icon-size: 1.5em;
            --progress-thick: 2rem;
            --trapecio-width: 100%; /* Ocupar todo el ancho del iframe */
            --trapecio-height: 8.4375rem;
            --trapecio-bg: transparent;
            --trapecio-shadow: 0 0.125rem 0.75rem rgba(0,0,0,0.13);
            --trapecio-radius: 0.75rem;
            --progress-color: #0077cc;
            --progress-bg: #e0e0e0;
            --timer-font-size: 1.1em;
            --timer-color: #333;
        }

        /* Encapsular estilos */
        .hijo3-container body, .hijo3-container html {
            height: 100%;
            margin: 0;
            padding: 0;
            background: transparent !important;
        }

        body {
            font-family: "Book Antiqua", "Palatino Linotype", Palatino, Georgia, serif;
            margin: 0;
            padding: 0;
            background: transparent !important;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center; /* Centrar verticalmente para que el contenedor ocupe el espacio */
            height: 100%;
            width: 100%;
        }

        .audio-player-controls {
            width: 100%;
            height: 100%;
            background: transparent;
            border-radius: 0.75rem 0.75rem 0 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            gap: 6px;
            z-index: 9999;
            padding: 2px 0px 2px 1px;
            box-sizing: border-box;
            border: none;
            margin: 0;
            position: relative;
            opacity: 1 !important;
            visibility: visible !important;
            background-color: transparent !important;
        }

        /* Arriba: barra de progreso, recortada por la derecha en un ancho de botón */
        .progress-top-row {
            width: 99%;
            height: calc(50vh - 7px);
            display: flex;
            align-items: center;
            flex-shrink: 0;
            padding: 0;
        }

        /* Abajo: título izquierda + botones derecha */
        .bottom-row {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            min-height: 0;
        }

        /* Izquierda de la fila inferior: nombre de la pista */
        .content-left {
            flex: 1;
            min-width: 0;
            margin-right: 1%;
            height: calc(50vh - 7px);
            display: flex;
            align-items: center;
            padding: 0 4px;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #f0f0f0;
            border-radius: calc((50vh - 7px) / 2);
            border: 0.0625rem solid #ddd;
            box-shadow: inset 0 0.0625rem 0.1875rem rgba(0,0,0,0.1);
        }

        /* Título con efecto marquee si no cabe */
        .titulo-parada {
            height: 100%;
            font-size: calc((50vh - 10px) * 0.55);  /* fila inferior ≈ 50vh, letra reducida */
            font-weight: bold;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            width: 100%;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            padding-left: 1px;
            padding-right: 1px;
        }

        .titulo-parada span {
            display: inline-block;
            padding-right: 2rem;
        }

        .titulo-parada.marquee span {
            animation: marquee-scroll 10s linear infinite;
        }

        @keyframes marquee-scroll {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Derecha de la fila inferior: botones */
        .buttons-right {
            display: flex;
            flex-direction: row;
            align-items: center;
            align-self: center;
            gap: 6px;
            margin-left: auto;
            margin-right: 9px;
            flex-shrink: 0;
        }

        #retosBtn {
            width: var(--btn-size);
            height: var(--btn-size);
            position: relative;
            border-radius: 50%;
            border: none;
            background: linear-gradient(180deg, #1e7e34 0%, #166528 50%, #0d4c1d 100%);
            color: white;
            font-size: var(--icon-size);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        #retosBtn .icon-puzzle {
            color: white;
            font-weight: bold;
            filter: drop-shadow(0 0.0625rem 0.125rem rgba(0,0,0,0.1));
        }

        #retosBtn:disabled {
            background: linear-gradient(to right, #B22222, #8B1A1A);
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none;
        }

        @media (hover: hover) {
            #retosBtn:hover:not(:disabled) {
                transform: scale(1.05);
                box-shadow: none;
            }
        }

        #retosBtn:active:not(:disabled) {
            transform: scale(0.93);
            box-shadow: none;
        }

        /* ── Glow + spin para retosBtn (AVENTURA) ── */
        @keyframes glow-activo-retos {
            0%, 100% { box-shadow: inset 0 0 10px rgba(255,255,255,0.2); }
            50%       { box-shadow: inset 0 0 26px rgba(255,255,255,0.55); }
        }
        @keyframes spin-btn-retos {
            0%   { transform: rotate(0deg); }
            60%  { transform: rotate(1080deg); }
            85%  { transform: rotate(1350deg); }
            100% { transform: rotate(1440deg); }
        }
        #retosBtn:not(:disabled):not(.activo) {
            animation: glow-activo-retos 3s ease-in-out infinite;
        }
        #retosBtn.spinning {
            animation: spin-btn-retos 0.9s cubic-bezier(0.2,0.8,0.4,1) forwards !important;
        }

        /* Imagen dentro del botón retos: cubrir todo el botón */
        #retosBtn img {
            position: absolute;
            top: -1.5%;
            left: -1.5%;
            width: 103%;
            height: 103%;
            min-width: 103%;
            min-height: 103%;
            max-width: none;
            max-height: none;
            margin: 0;
            padding: 0;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            display: block;
            pointer-events: none;
        }

        .progress-container {
            flex: 1;
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
            border-radius: calc((50vh - 7px) / 2);
            cursor: pointer;
            position: relative;
            margin: 0;
            min-width: 0;
            overflow: visible;
            display: flex;
            align-items: center;
            border: 0.0625rem solid #ddd;
            box-shadow: inset 0 0.0625rem 0.1875rem rgba(0,0,0,0.1);
        }

        .time-overlay {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 2;
            font-size: calc((50vh - 7px) / 4);
            font-weight: bold;
            color: #333;
            gap: 0.2em;
        }

        #progressBar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #28a745, #1e7e34);
            border-radius: calc(var(--progress-thick) / 2);
            transition: width 0.1s linear;
            position: relative;
            padding-left: 1px;
            padding-right: 1px;
            box-sizing: border-box;
        }

        .progress-container::after {
            content: '';
            position: absolute;
            left: max(0px, calc(var(--bar-w, 0) * 100% - 1.25rem));
            top: 50%;
            transform: translateY(-50%);
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            background: #007bff;
            border: 0.1875rem solid white;
            box-shadow: 0 0 0 0.0625rem rgba(0,0,0,0.1);
            display: block;
            opacity: 1;
            pointer-events: none;
            z-index: 3;
            transition: left 0.1s linear, opacity 0.2s ease;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: var(--timer-font-size);
            color: var(--timer-color);
            margin: 0;
            font-weight: 500;
        }

        .time-display span {
            font-variant-numeric: tabular-nums;
        }

        /* Estilos para los botones del hijo3 */
        #hijo3 .boton {
            transition: background 0.3s ease, color 0.3s ease;
            background: none; /* Se asegura que no haya colores adicionales */
        }

        /* Botón habilitado: degradado verde */
        #hijo3 .boton.habilitado {
            background: linear-gradient(to right, #1e7e34, #155c27);
            color: white;
        }

        /* Botón deshabilitado: degradado rojo */
        #hijo3 .boton.deshabilitado {
            background: linear-gradient(to right, #B22222, #8B1A1A);
            color: white;
        }

        /* Estilos para el modo casa (controles completamente visibles y habilitados) */
        body.modo-casa .audio-player-controls {
            display: flex;
            opacity: 1;
        }

        /* Estilos de modo casa eliminados - los botones siguen el estado habilitado/deshabilitado estándar */

        /* Estilos para el modo aventura (controles normales) */
        body.modo-aventura .audio-player-controls {
            display: flex;
            opacity: 1;
        }
    </style>
</head>
<body class="modo-aventura hijo3-container">
    <!-- CACHÉ DE AUDIOS - NO ELIMINAR NI MODIFICAR SIN REVISIÓN: __vv_audioCache mapea audioId a los datos del audio (file, title). Cualquier cambio debe coordinarse con el padre. -->
    <script type="module">
        // Protección pasiva por parada: no se precarga la aventura completa. El padre
        // envía el audio de cada parada en línea dentro de AUDIO.REPRODUCIR_REQUEST
        // (campo audioData). Se retienen como máximo los 2 últimos ids distintos
        // recibidos (parada actual + 1 anterior); al llegar un tercero se descarta el
        // más antiguo. Ver docs/GUIA-COMPLETA.md §16.
        const AUDIO_CACHE_MAX = 2;
        globalThis.__vv_audioCache = globalThis.__vv_audioCache || new Map();

        function _guardarAudioEnCache(audioId, audioData) {
            if (!audioId || !audioData) return;
            const cache = globalThis.__vv_audioCache;
            cache.delete(audioId); // reinsertar al final si ya existía (marca como reciente)
            cache.set(audioId, audioData);
            while (cache.size > AUDIO_CACHE_MAX) {
                const masAntiguo = cache.keys().next().value;
                cache.delete(masAntiguo);
            }
        }
        globalThis._guardarAudioEnCache = _guardarAudioEnCache;

        // Función getter: array derivado de la caché acotada (mismo contrato que antes,
        // .find(a => a.id === audioId), para no tocar los call-sites existentes)
        function obtenerAudioFiles() {
            return Array.from(globalThis.__vv_audioCache.values());
        }

        // Exponer función globalmente
        globalThis.obtenerAudioFiles = obtenerAudioFiles;

        /* ═══════════════════════════════════════════════════════════════════════════════
         * ██ BACKUP: Array de audios original - COMENTADO PARA USAR DATOS CENTRALIZADOS
         * ██ Descomentar solo si falla el flujo centralizado y necesitamos fallback
         * ═══════════════════════════════════════════════════════════════════════════════

        // Array de audios correspondientes a las paradas y tramos del recorrido
        // Usando P- para paradas y TR- para tramos, coincidiendo con los IDs del hijo 2
        /*
        const audioFiles_BACKUP = [
        ═══════════════════════════════════════════════════════════════════════════════ */

        // ✅ Exponer función getter globalmente (sustituye la exposición directa del array)
        // La línea original era: try { globalThis.__vv_audioFiles = audioFiles; } catch (e) { /* ignore */ }
        // Ahora los audios llegan desde el padre via AUDIO.REPRODUCIR_REQUEST (campo audioData), resuelto por parada
    </script>

    <div class="audio-player-controls">
        <!-- Arriba: barra de progreso (ancho completo) -->
        <div class="progress-top-row">
            <div class="progress-container" id="progressContainer" aria-label="Barra de progreso de audio">
                <div id="progressBar"></div>
                <div class="time-overlay">
                    <span id="currentTime">00:00</span>
                    <span>/</span>
                    <span id="duration">00:00</span>

        <!-- Abajo: nombre de pista (izquierda) + botones (derecha) -->
        <div class="bottom-row">

                <div id="titulo-parada" class="titulo-parada">
                    <span id="titulo-parada-text"></span>
                </div>
            </div>
            <div class="buttons-right">
                <button id="retosBtn" aria-label="Retos" disabled>
                    <img src="imagenes/imagenes-aplicación/H4-fotoretos.png" alt="Retos">
                </button>

    </div>

    <audio id="audioPlayer" preload="metadata" controlsList="nodownload">
        Tu navegador no soporta el elemento de audio.

    <script type="module">
    import { retryUntilAvailable, resolverIdsParada, resolverIdPadre } from './js/utils.js';
    import { TIPOS_MENSAJE } from './js/constants.js';
    import logger from './js/logger.js';

    // NOTA: Bloque IIFE "RESPALDO" para PADRE_PIDE_MANEJADORES eliminado (obsoleto).
    // El sistema actual usa state-manager centralizado sin necesidad de migración manual.

    // Fallbacks que esperan a que globalThis.mensajeria esté disponible
    const enviarMensaje = async (...args) => {
        // En hijos, usar postMessage directamente al padre
        if (globalThis.parent && globalThis.parent !== globalThis) {
            const mensaje = args[0];
            try {
                const payload = {
                    tipo: mensaje.tipo,
                    origen: mensaje.origen || 'hijo3',
                    destino: mensaje.destino,
                    datos: mensaje.datos,
                    timestamp: Date.now()
                };
                if (mensaje.idOriginal !== undefined) payload.idOriginal = mensaje.idOriginal;
                if (mensaje.id !== undefined) payload.id = mensaje.id;
                globalThis.parent.postMessage(payload, globalThis.location.origin);
                return;
            } catch (e) {
                logger.error('[hijo3] Error enviando mensaje via postMessage:', e);
                throw e;
            }
        } else {
            // Fallback al método anterior si no estamos en iframe
            return await retryUntilAvailable(
                () => globalThis.mensajeria.enviarMensaje(...args),
                () => globalThis.mensajeria && globalThis.mensajeria.enviarMensaje,
                10, 500, (...a) => (globalThis.logger || console).error(...a)
            );
        }
    };

    const registrarControlador = async (tipo, callback, _opciones = {}) => {
        // En hijos, los controladores se registran localmente para mensajes del padre
        if (globalThis.parent && globalThis.parent !== globalThis) {
            // Registrar listener para mensajes del padre
            const listener = (event) => {
                if (event.source === globalThis.parent && event.data && event.data.tipo === tipo) {
                    callback(event.data);
                }
            };
            globalThis.addEventListener('message', listener);
            return () => globalThis.removeEventListener('message', listener);
        } else {
            // Fallback al método anterior
            return await retryUntilAvailable(
                () => globalThis.mensajeria.registrarControlador(tipo, callback),
                () => globalThis.mensajeria && globalThis.mensajeria.registrarControlador,
                10, 500, (...a) => (globalThis.logger || console).error(...a)
            );
        }
    };


    async function _enviarAutoConfirmacion(event, iframeId, resultado) {
        if (!event.data.requiereConfirmacion || !event.data.id || resultado === undefined) return;
        try {
            const tipoConf = (globalThis.TIPOS_MENSAJE !== undefined && globalThis.TIPOS_MENSAJE.SISTEMA && globalThis.TIPOS_MENSAJE.SISTEMA.CONFIRMACION) || 'SISTEMA.CONFIRMACION';
            const confirmacion = { tipo: tipoConf, idOriginal: event.data.id, origen: iframeId, destino: event.data.origen || 'padre', timestamp: Date.now(), datos: resultado };
            if (globalThis.parent && globalThis.parent !== globalThis) {
                globalThis.parent.postMessage(confirmacion, globalThis.location.origin);
                (globalThis.logger || console).info && (globalThis.logger || console).info(`[messagingAdapter] Auto-confirmación enviada para ${event.data.id}`);
            }
        } catch (confError) {
            (globalThis.logger || console).error && (globalThis.logger || console).error(`[messagingAdapter] Error enviando confirmación:`, confError);
        }
    }

    // ==================== MESSAGING ADAPTER PARA COMUNICACIÓN CON PADRE ====================
    // Este adapter permite a los hijos registrar controladores centralmente en el state-manager del padre
    if (globalThis.messagingAdapter === undefined) {
        globalThis.messagingAdapter = {
            _listenerRegistry: new Map(),

            registrarControladorCentral: async function(controladorId, handler, opciones = {}) {
                const iframeId = globalThis.name || (globalThis.CONFIG_HIJO !== undefined && globalThis.CONFIG_HIJO.IFRAME_ID) || 'hijo';
                const tipo = opciones.tipoMensaje || controladorId;

                // Evitar doble registro del mismo tipo
                if (this._listenerRegistry.has(tipo)) {
                    (globalThis.logger || console).warn && (globalThis.logger || console).warn(`[messagingAdapter] Listener ya registrado para ${tipo}, omitiendo`);
                    return false;
                }

                const adapterListener = async function(event) {
                    if (event.source === globalThis.parent && event.data && event.data.tipo === tipo) {
                        try {
                            const resultado = await handler(event.data);
                            await _enviarAutoConfirmacion(event, iframeId, resultado);
                        } catch (e) {
                            (globalThis.logger || console).error && (globalThis.logger || console).error(`[messagingAdapter] Error en handler ${tipo}:`, e && e.message);
                        }
                    }
                };
                globalThis.addEventListener('message', adapterListener);
                this._listenerRegistry.set(tipo, adapterListener);

                (globalThis.logger || console).info && (globalThis.logger || console).info(`[messagingAdapter] Handler registrado para ${tipo} en ${iframeId}`);
                return true;
            },

            enviarMensajeCentral: async function(mensaje) {
                if (globalThis.parent && globalThis.parent !== globalThis) {
                    globalThis.parent.postMessage(mensaje, globalThis.location.origin);
                    return { exito: true, metodo: 'postMessage' };
                }
                return { exito: false, error: 'No hay padre disponible' };
            }
        };
        (globalThis.logger || console).info && (globalThis.logger || console).info('[HIJO] messagingAdapter creado para comunicación con padre');

        globalThis.addEventListener('pagehide', function() {
            if (globalThis.messagingAdapter && globalThis.messagingAdapter._listenerRegistry) {
                for (const listener of globalThis.messagingAdapter._listenerRegistry.values()) {
                    globalThis.removeEventListener('message', listener);
                }
                globalThis.messagingAdapter._listenerRegistry.clear();
            }
        }, { once: true });
    }

    async function _intentarRegistroCentralAudio(tipo, handler, opciones, iframeId) {
        const controladorId = `${iframeId}:${tipo}`;
        if (globalThis.messagingAdapter && typeof globalThis.messagingAdapter.registrarControladorCentral === 'function') {
            try {
                const centralRes = await globalThis.messagingAdapter.registrarControladorCentral(controladorId, handler, { tipoMensaje: tipo });
                if (centralRes === true) {
                    (globalThis.logger || console).info && (globalThis.logger || console).info(`[HIJO] registrarControlador registered centrally: ${controladorId} -> ${tipo}`);
                    return true;
                }
            } catch (e) {
                (globalThis.logger || console).warn && (globalThis.logger || console).warn(`[HIJO] Central registrar failed for ${tipo}: ${e && e.message}`);
            }
        }
        if (typeof registrarControlador === 'function') {
            try {
                const res = await registrarControlador(tipo, handler);
                (globalThis.logger || console).info && (globalThis.logger || console).info(`[HIJO] registrarControlador delegated for ${tipo}`);
                return res;
            } catch (err) {
                (globalThis.logger || console).warn && (globalThis.logger || console).warn(`[HIJO] registrarControlador failed for ${tipo}: ${err && err.message}`);
            }
        }
        return null;
    }

    // Wrapper seguro para evitar doble registro de controladores en hijos
    if (globalThis.registrarControladorSeguro === undefined) {
        globalThis.__CONTROLADOR_REGISTRADOS = globalThis.__CONTROLADOR_REGISTRADOS || new Set();
        globalThis.registrarControladorSeguro = async function(tipo, handler, opciones) {
            try {
                (globalThis.logger || console).info && (globalThis.logger || console).info(`[HIJO] registrarControladorSeguro called: ${tipo}`);
                if (!tipo || typeof handler !== 'function') {
                    // NOTA: string con encoding UTF-8 corrupto ('parámetros inválidos' = 'parámetros inválidos'). Solo alcanzable si se llama registrarControladorSeguro con tipo null o handler no-función — no ocurre en paths de producción.
                    (globalThis.logger || console).warn && (globalThis.logger || console).warn(`[HIJO] registrarControladorSeguro parámetros inválidos: tipo=${tipo}`);
                    return;
                }
                if (globalThis.__CONTROLADOR_REGISTRADOS.has(tipo)) {
                    (globalThis.logger || console).warn && (globalThis.logger || console).warn(`[HIJO] Controlador ya registrado, omitiendo: ${tipo}`);
                    return;
                }
                globalThis.__CONTROLADOR_REGISTRADOS.add(tipo);
                // Prefer central registration via messagingAdapter/state-manager when available
                try {
                    const iframeId = (globalThis.name || (globalThis.CONFIG_HIJO !== undefined && globalThis.CONFIG_HIJO.IFRAME_ID) || 'hijo');
                    const resultado = await _intentarRegistroCentralAudio(tipo, handler, opciones, iframeId);
                    if (resultado !== null) return resultado;
                } catch (e) {
                    (globalThis.logger || console).warn && (globalThis.logger || console).warn(`[HIJO] registrarControladorSeguro central attempt error for ${tipo}: ${e && e.message}`);
                }
                // Handler remains tracked locally in `globalThis.__CONTROLADOR_REGISTRADOS`
                (globalThis.logger || console).info && (globalThis.logger || console).info(`[HIJO] Handler queued for migration: ${tipo} (local queue)`);
                return;
            } catch (e) {
                (globalThis.logger || console).error(`[HIJO] Error registrando controlador seguro ${tipo}:`, e && e.message);
            }
        };
    }

    // Helper: safeRegistrar delegates to registrarControladorSeguro when available
    if (globalThis.safeRegistrar === undefined) {
        globalThis.safeRegistrar = async function(tipo, handler, opciones) {
            try {
                if (!tipo || typeof handler !== 'function') return;
                if (globalThis.__CONTROLADOR_REGISTRADOS && globalThis.__CONTROLADOR_REGISTRADOS.has(tipo)) return;
                if (typeof globalThis.registrarControladorSeguro === 'function') return globalThis.registrarControladorSeguro(tipo, handler, opciones);
                if (typeof registrarControlador === 'function') return registrarControlador(tipo, handler, opciones);
            } catch (e) { (globalThis.logger || console).warn && (globalThis.logger || console).warn('[HIJO] safeRegistrar error', e && e.message); }
        };
    }

    const CONFIG_HIJO = {
        IFRAME_ID: 'hijo3',
        COMPONENTE_ID: 'AUDIO',
        DEBUG: true
    };

    // Exportar CONFIG_HIJO para compatibilidad con mensajeria.js y para que el padre lo consulte
    if (typeof module !== 'undefined' && module.exports) {
        module.exports = CONFIG_HIJO;
    } else {
        globalThis.CONFIG_HIJO = CONFIG_HIJO;
    }

    let currentAudioId = null;

    // ═══════════════════════════════════════════════════════════════════════════
    // 🔧 UTILIDADES - AJUSTE DINÁMICO DE TIMEOUTS
    // ═══════════════════════════════════════════════════════════════════════════

    // Estado del componente (homologado con otros hijos)
    const estado = {
        inicializado: false,
        modo: { actual: 'aventura' },
        pendingCambioModo: null,
        hijoListoEnviado: false  // Flag para evitar envío duplicado de HIJO_LISTO
    };

    // Funciones de reproductor (fusionadas y adaptadas)
    function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // Prepara el audio en el reproductor y opcionalmente lo reproduce.
    // autoplay: boolean (por defecto false) — si es true intentará iniciar reproducción inmediatamente.
    async function cargarYReproducirAudio(audioId, autoplay = false) {
        // ✅ Usar función centralizada que prioriza datos del padre
        const files = obtenerAudioFiles();
        if (!files || !Array.isArray(files) || files.length === 0) {
            logger.error(`Audio array no disponible o vacío. Imposible preparar ${audioId}. ¿Se cargaron los audios desde el padre?`);
            return { exito: false, error: 'audioFiles_missing' };
        }
        const audioData = files.find(audio => audio.id === audioId || audio.id === `audio-${audioId}`);
        if (!audioData) {
            logger.warn(`[hijo3] Audio ${audioId} no está en caché local — solicitando al padre`);
            try {
                await enviarMensaje({
                    tipo: TIPOS_MENSAJE.DATOS.SOLICITAR_AUDIOS,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    destino: resolverIdPadre(),
                    datos: { audioId, motivo: 'cache_miss', timestamp: Date.now() }
                });
            } catch (err) {
                logger.error('[hijo3] Error solicitando audio faltante al padre:', err);
            }
            return { exito: false, error: 'audio_not_found_requesting' };
        }

        // Guard: si el archivo de audio no está configurado aún (file vacío), devolver
        // error controlado en lugar de asignar src vacío y disparar MEDIA_ELEMENT_ERROR
        if (!audioData.file) {
            logger.warn(`[hijo3] Audio ${audioId} no tiene archivo configurado (pendiente de producción)`);
            return { exito: false, error: 'audio_file_not_configured' };
        }

        // Preparar la fuente siempre (permite que el usuario pulse Play más tarde)
        audioPlayer.src = audioData.file;
        currentAudioId = audioId;
        // La barra de progreso es un <div> propio, no el control nativo del <audio> - solo
        // se actualiza via el listener de 'timeupdate', que no dispara hasta que empieza la
        // reproduccion real. Con autoplay:false (siempre, en este flujo) eso no pasa hasta
        // que el usuario pulsa play, asi que sin este reset la barra se quedaba mostrando el
        // porcentaje del audio anterior mientras tanto - especialmente notorio al llegar a
        // una parada nueva tras completar un tramo, donde el audio se pide pero no se
        // reproduce solo.
        _resetearProgresoVisual();

        // Actualizar título de la parada con efecto marquee si no cabe
        const tituloEl = document.getElementById('titulo-parada');
        const tituloSpan = document.getElementById('titulo-parada-text');
        if (tituloEl && tituloSpan && audioData.title) {
            tituloSpan.textContent = audioData.title;
            tituloEl.classList.remove('marquee');
            // Activar marquee si el texto es más ancho que el contenedor
            requestAnimationFrame(() => {
                if (tituloSpan.scrollWidth > tituloEl.clientWidth) {
                    // Duplicar texto para efecto continuo
                    tituloSpan.textContent = audioData.title + '\u00A0\u00A0\u00A0\u00A0\u00A0' + audioData.title;
                    tituloEl.classList.add('marquee');
                }
            });
        }

        if (autoplay) {
            try {
                await audioPlayer.play();
                return { exito: true, reproducido: true };
            } catch (playError) {
                // Es posible que el intento de autoplay sea bloqueado por la política del navegador.
                logger.warn(`[hijo3] Intento de autoplay bloqueado o fallido para ${audioId}:`, playError && playError.message ? playError.message : playError);
                return { exito: true, reproducido: false, autoplayBlocked: true };
            }
        }

        // Si no se debe reproducir automáticamente, indicamos que la carga fue correcta
        return { exito: true, reproducido: false };
    }

    // Nivel de modulo (no dentro de actualizarInterfazModo) para que cargarYReproducirAudio
    // y los listeners de audioPlayer, ambos tambien de nivel de modulo, puedan llamarla.
    // progressBar/progressContainer/currentTimeElement se resuelven en el cuerpo de la
    // funcion, no al definirla, asi que da igual que progressContainer se declare mas abajo.
    function _resetearProgresoVisual() {
        if (progressBar) progressBar.style.width = '0%';
        if (progressContainer) { progressContainer.setAttribute('aria-valuenow', 0); progressContainer.style.setProperty('--bar-w', 0); }
        if (currentTimeElement) currentTimeElement.textContent = '00:00';
    }

    // Elementos DOM
    const audioPlayer = document.getElementById('audioPlayer');
    const progressBar = document.getElementById('progressBar');
    const currentTimeElement = document.getElementById('currentTime');
    const durationElement = document.getElementById('duration');
    const retosBtn = document.getElementById('retosBtn');

    // ── Spin behavior para retosBtn (AVENTURA) ──
    let _retosBtnSpinInterval = null;
    let _retosBtnSpinPressed = false;

    function _iniciarSpinRetosBtn() {
        if (_retosBtnSpinInterval) clearInterval(_retosBtnSpinInterval);
        _retosBtnSpinPressed = false;
        _retosBtnSpinInterval = setInterval(() => {
            if (_retosBtnSpinPressed || retosBtn.disabled) return;
            retosBtn.classList.remove('spinning');
            void retosBtn.offsetWidth;
            retosBtn.classList.add('spinning');
            retosBtn.addEventListener('animationend', () => retosBtn.classList.remove('spinning'), { once: true });
        }, 5000);
    }

    function _resetSpinRetosBtn() {
        _iniciarSpinRetosBtn();
    }

    // Event listener para botón de Retos
    retosBtn.addEventListener('click', async () => {
        try {
            _retosBtnSpinPressed = true;
            if (_retosBtnSpinInterval) { clearInterval(_retosBtnSpinInterval); _retosBtnSpinInterval = null; }
            retosBtn.classList.add('activo');
            logger.info(`[hijo3] Botón de retos clickeado, solicitando reto al padre`);

            // Enviar solicitud al padre para mostrar un reto
            await enviarMensaje({
                tipo: TIPOS_MENSAJE.RETO.SOLICITAR_RETO,
                origen: CONFIG_HIJO.IFRAME_ID,
                destino: resolverIdPadre(),
                datos: {
                    contexto: 'manual',
                    audioId: currentAudioId
                }
            });

            logger.debug(`[hijo3] Solicitud de reto enviada exitosamente`);
        } catch (error) {
            logger.error(`[hijo3] Error al solicitar reto:`, error);
        }
    });

    // Event listener para barra de progreso (seek)
    const progressContainer = document.getElementById('progressContainer');
    // Allow vertical page scrolling while enabling horizontal drag on the bar
    // `pan-y` lets vertical scrolling but allows us to intercept horizontal gestures.
    progressContainer.style.touchAction = 'pan-y';
    // Internal state for dragging/seeking
    let isSeeking = false;
    let activePointerId = null;
    let initialX = 0;
    let initialY = 0;
    let lockedToSeeking = null; // null = undecided, true = seeking (horizontal), false = allow vertical scroll
    let wasPlayingDuringSeek = false;

    function updateProgressFromClientX(clientX) {
        try {
            const rect = progressContainer.getBoundingClientRect();
            const clickX = clientX - rect.left;
            const percent = clickX / rect.width;
            const validPercent = Math.max(0, Math.min(1, percent));
            // Update progress bar UI
            if (Number.isFinite(audioPlayer.duration) && audioPlayer.duration > 0) {
                progressBar.style.width = `${validPercent * 100}%`;
                // Update accessible attribute
                progressContainer.setAttribute('aria-valuenow', Math.round(validPercent * 100));
            } else {
                // If duration not available, just update visual width temporarily
                progressBar.style.width = `${validPercent * 100}%`;
            }
            progressContainer.style.setProperty('--bar-w', validPercent);
            return validPercent;
        } catch (error) {
            logger.error('[hijo3] updateProgressFromClientX error', error);
            return 0;
        }
    }

    progressContainer.addEventListener('click', (e) => {
        try {
            // Calcular posición del click relativa a la barra
            const percent = updateProgressFromClientX(e.clientX);

            // Validar rango (0-100%)
            const validPercent = Math.max(0, Math.min(1, percent));

            // Validar que el audio esté cargado y duration sea finito
            if (!audioPlayer || !Number.isFinite(audioPlayer.duration) || audioPlayer.duration === 0) {
                logger.warn(`[hijo3] Audio no cargado o duration inválido, ignorando seek`);
                return;
            }

            // Saltar a la posición clickeada
            audioPlayer.currentTime = validPercent * audioPlayer.duration;

            logger.debug(`[hijo3] Seek en barra de progreso: ${(validPercent * 100).toFixed(1)}%`);
        } catch (error) {
            logger.error(`[hijo3] Error al hacer seek en barra de progreso:`, error);
        }
    });

    // Pointer/touch drag handlers for seamless mobile and desktop seeking
    progressContainer.addEventListener('pointerdown', (e) => {
        try {
            if (e.pointerType === 'mouse' && e.button !== 0) return; // only left button
            isSeeking = true;
            lockedToSeeking = null;
            initialX = e.clientX;
            initialY = e.clientY;
            activePointerId = e.pointerId;
            // We defer pausing until the user moves horizontally and we lock the gesture to seeking.
            activePointerId = e.pointerId;
            // Do not set pointer capture yet to allow normal vertical scrolling unless we lock to seeking.
            // updateProgressFromClientX(e.clientX); // only set on lock
        } catch (err) {
            logger.error('[hijo3] pointerdown error', err);
        }
    });

    function _lockToSeeking(e) {
        lockedToSeeking = true;
        try { progressContainer.setPointerCapture(activePointerId); } catch { logger.debug('[hijo3] setPointerCapture no disponible'); }
        wasPlayingDuringSeek = !audioPlayer.paused && !audioPlayer.ended;
        if (wasPlayingDuringSeek) audioPlayer.pause();
        e.preventDefault();
        updateProgressFromClientX(e.clientX);
    }

    progressContainer.addEventListener('pointermove', (e) => {
        try {
            if (!isSeeking || e.pointerId !== activePointerId) return;
            if (lockedToSeeking === false) return; // vertical scroll in progress
            if (lockedToSeeking === true) { e.preventDefault(); updateProgressFromClientX(e.clientX); return; }

            // lockedToSeeking === null: determine gesture direction
            const dx = Math.abs(e.clientX - initialX);
            const dy = Math.abs(e.clientY - initialY);
            const H_LOCK_THRESHOLD = 10;
            if (dx > H_LOCK_THRESHOLD && dx > dy * 1.5) {
                _lockToSeeking(e);
            } else if (dy > H_LOCK_THRESHOLD && dy > dx * 1.5) {
                lockedToSeeking = false;
                try { progressContainer.releasePointerCapture(activePointerId); } catch { logger.debug('[hijo3] releasePointerCapture no disponible'); }
                isSeeking = false;
            }
            // else: not enough movement to decide yet
        } catch (err) {
            logger.error('[hijo3] pointermove error', err);
        }
    });

    function finalizeSeek(clientX) {
        try {
            const percent = updateProgressFromClientX(clientX);
            if (Number.isFinite(audioPlayer.duration) && audioPlayer.duration > 0) {
                audioPlayer.currentTime = percent * audioPlayer.duration;
            }
            // resume playback if it was playing before seek
            if (wasPlayingDuringSeek) {
                audioPlayer.play().catch(err => logger.warn('[hijo3] Unable to resume playback after seek', err));
            }
        } catch (err) {
            logger.error('[hijo3] finalizeSeek error', err);
        }
    }

    progressContainer.addEventListener('pointerup', (e) => {
        try {
            if (!isSeeking || e.pointerId !== activePointerId) return;
            if (lockedToSeeking === true) {
                finalizeSeek(e.clientX);
            }
            // Clean up
            isSeeking = false;
            lockedToSeeking = null;
            try { progressContainer.releasePointerCapture(e.pointerId); } catch (error_) { logger.debug('[hijo3] pointerup releasePointerCapture omitido', error_ && error_.message); }
            activePointerId = null;
        } catch (err) {
            logger.error('[hijo3] pointerup error', err);
        }
    });

    progressContainer.addEventListener('pointercancel', (e) => {
        try {
            if (!isSeeking || e.pointerId !== activePointerId) return;
            if (lockedToSeeking === true) finalizeSeek(e.clientX);
            isSeeking = false;
            lockedToSeeking = null;
            try { progressContainer.releasePointerCapture(e.pointerId); } catch (error_) { logger.debug('[hijo3] pointercancel releasePointerCapture omitido', error_ && error_.message); }
            activePointerId = null;
        } catch (err) {
            logger.error('[hijo3] pointercancel error', err);
        }
    });

    // Fallback for older browsers: touch events (if pointer events unsupported)
    progressContainer.addEventListener('touchstart', (e) => {
        try {
            const touch = e.touches[0];
            isSeeking = true;
            lockedToSeeking = null;
            initialX = touch.clientX;
            initialY = touch.clientY;
            // don't update yet until the user moves horizontally enough
            e.preventDefault();
        } catch (err) { logger.error('[hijo3] touchstart error', err); }
    }, { passive: false });
    progressContainer.addEventListener('touchmove', (e) => {
        try {
            if (!isSeeking) return;
            const touch = e.touches[0];
            const dx = Math.abs(touch.clientX - initialX);
            const dy = Math.abs(touch.clientY - initialY);
            const H_LOCK_THRESHOLD = 10;
            if (lockedToSeeking === null) {
                if (dx > H_LOCK_THRESHOLD && dx > dy * 1.5) {
                    lockedToSeeking = true;
                    wasPlayingDuringSeek = !audioPlayer.paused && !audioPlayer.ended;
                    if (wasPlayingDuringSeek) audioPlayer.pause();
                    e.preventDefault();
                    updateProgressFromClientX(touch.clientX);
                } else if (dy > H_LOCK_THRESHOLD && dy > dx * 1.5) {
                    lockedToSeeking = false;
                    isSeeking = false;
                    // allow scrolling
                }
            } else if (lockedToSeeking === true) {
                e.preventDefault();
                updateProgressFromClientX(touch.clientX);
            } else {
                // locked to vertical scrolling - ignore
            }
        } catch (err) { logger.error('[hijo3] touchmove error', err); }
    }, { passive: false });
    progressContainer.addEventListener('touchend', (e) => {
        try {
            if (!isSeeking) return;
            // touchend has no touches, use changedTouches
            const touch = e.changedTouches[0];
            if (lockedToSeeking === true) finalizeSeek(touch.clientX);
            isSeeking = false;
            lockedToSeeking = null;
        } catch (err) { logger.error('[hijo3] touchend error', err); }
    });

    // Keyboard support: seek with left/right arrow while progress container is focused
    progressContainer.addEventListener('keydown', (e) => {
        try {
            const step = 5; // 5 seconds per keypress
            if (!audioPlayer || !Number.isFinite(audioPlayer.duration)) return;
            if (e.key === 'ArrowLeft') {
                audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - step);
                e.preventDefault();
            } else if (e.key === 'ArrowRight') {
                audioPlayer.currentTime = Math.min(audioPlayer.duration, audioPlayer.currentTime + step);
                e.preventDefault();
            }
        } catch (err) {
            logger.error('[hijo3] keydown error on progressContainer', err);
        }
    });

    // Event listeners para audio (adaptados para notificar al padre con enviarMensaje)
    audioPlayer.addEventListener('timeupdate', () => {
        // Validar que duration sea finito antes de calcular porcentaje
        if (Number.isFinite(audioPlayer.duration) && audioPlayer.duration > 0) {
            const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progressBar.style.width = `${percent}%`;
            progressContainer.style.setProperty('--bar-w', percent / 100);
            progressContainer.setAttribute('aria-valuenow', Math.round(percent));
            currentTimeElement.textContent = formatTime(audioPlayer.currentTime);
        }
    });

    audioPlayer.addEventListener('loadedmetadata', () => {
        durationElement.textContent = formatTime(audioPlayer.duration);
    });

    audioPlayer.addEventListener('play', async () => {
        if (currentAudioId) {
            await enviarMensaje({
                tipo: TIPOS_MENSAJE.AUDIO.ESTADO_ACTUALIZADO,
                origen: CONFIG_HIJO.IFRAME_ID,
                destino: resolverIdPadre(),
                datos: { audioId: currentAudioId, estado: 'reproduciendo' }
            });
        }
    });

    audioPlayer.addEventListener('pause', async () => {
        if (currentAudioId) {
            await enviarMensaje({
                tipo: TIPOS_MENSAJE.AUDIO.ESTADO_ACTUALIZADO,
                origen: CONFIG_HIJO.IFRAME_ID, // Se agrega el valor correcto
                datos: { audioId: currentAudioId, estado: 'pausado' }
            });
        }
    });

    audioPlayer.addEventListener('ended', async () => {
        // La parada/tramo activo no cambia solo porque termine el audio — eso lo decide
        // el padre (avanzar, o el tramo se completa solo) y llega como un nuevo
        // AUDIO.REPRODUCIR_REQUEST aparte. Pero visualmente la barra no debe quedarse
        // clavada al 100% mientras tanto: se resetea aquí para que, si el usuario
        // reproduce esta misma pista otra vez antes de avanzar, empiece desde 0 — igual
        // que al cargar una pista nueva (cargarYReproducirAudio → _resetearProgresoVisual).
        _resetearProgresoVisual();
        if (currentAudioId) {
            await enviarMensaje({
                tipo: TIPOS_MENSAJE.AUDIO.FIN_REPRODUCCION,
                origen: CONFIG_HIJO.IFRAME_ID,
                destino: resolverIdPadre(),
                datos: { audioId: currentAudioId, estado: 'finalizado' }
            });
        }
    });

    audioPlayer.addEventListener('error', async () => {
        // Enviar AUDIO.ERROR al padre en caso de fallo
        await enviarMensaje({
            tipo: TIPOS_MENSAJE.AUDIO.ERROR,
            origen: CONFIG_HIJO.IFRAME_ID,
            destino: resolverIdPadre(),
            datos: { audioId: currentAudioId, error: audioPlayer.error?.message || 'Error desconocido' }
        });
    });

    // Normaliza un valor de modo (acepta string u objeto) y devuelve
    // una cadena segura para usar en clases CSS y dataset.
    function normalizarModo(modo) {
        try {
            if (typeof modo === 'string') {
                modo = modo.trim();
            } else if (modo && typeof modo === 'object') {
                modo = modo.actual || modo.modo || modo.nombre || Object.values(modo).find(v => typeof v === 'string') || '';
            } else if (modo == null) {
                modo = '';
            } else {
                modo = String(modo);
            }
            modo = String(modo || '').trim().toLowerCase();
            // Dejar sólo caracteres seguros para clases: a-z0-9_- (reemplazar otros con guión)
            modo = modo.replace(/[^a-z0-9_-]/g, '-').replace(/^-+|-+$/g, '');
            return modo;
        } catch (error_) {
            logger.debug('[hijo3] normalizarModo devolvio fallback vacio', error_ && error_.message);
            return '';
        }
    }

    // Función para actualizar la interfaz según el modo
    function actualizarInterfazModo(modo) {
        const modoSeguro = normalizarModo(modo);
        logger.info(`[AUDIO] Actualizando interfaz para modo:`, { original: modo, normalizado: modoSeguro });
        const body = document.body;

        // Actualizar clases CSS (sólo si hay un modo válido)
        body.classList.remove('modo-casa', 'modo-aventura');
        if (modoSeguro) body.classList.add(`modo-${modoSeguro}`);

        logger.info(`[hijo3] Interfaz actualizada para modo: ${modoSeguro}`);
    }

    // Inicialización y controladores (adaptados a mensajería actual)
    try {
        // Ocultar la UI hasta que el padre confirme que los controladores están listos
        let _uiConfirmado = false;
        const _originalDisplay = (document.body && document.body.style && document.body.style.display) || '';
        try { if (document.body) document.body.style.display = 'none'; } catch (e) { logger.debug('[hijo3] no se pudo ocultar UI inicial', e && e.message); }
        function mostrarUI() {
            if (!_uiConfirmado) { logger.warn('[hijo3] mostrarUI ignorado: esperando PADRE_CONFIRMA_HIJO_LISTO'); return; }
            try {
                if (document.body) {
                    document.body.style.display = _originalDisplay || 'block';
                }
                logger.info('[hijo3] UI visible tras PADRE_CONFIRMA_HIJO_LISTO');
            } catch (e) {
                logger.debug('[hijo3] no se pudo mostrar UI', e && e.message);
            }
        }

        // Sistema de reintentos activos para HIJO_LISTO (solución permanente C2)
        let _reintentosHijoListo = 0;
        const MAX_REINTENTOS_HIJO_LISTO = 30; // 30 segundos máximo
        const INTERVALO_REINTENTO = 1000; // 1 segundo
        let _intervaloReintento = null;

        // No necesitamos inicializarMensajeria aquí, los fallbacks esperan automáticamente

        // NOTA: HIJO_PREPARADO se envía MÁS ABAJO, DESPUÉS de registrar todos los controladores críticos.
        // Esto garantiza que el padre no envíe PADRE_DATOS antes de que los controladores estén listos.

        // ============================================================
        // CONTROLADOR 1: SISTEMA.PADRE_DATOS
        // ============================================================
        logger.info(`Hijo ${CONFIG_HIJO.IFRAME_ID} registrado el controlador PADRE_DATOS`);
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.PADRE_DATOS, async (mensaje) => {
            const logPrefix = `[hijo3][PADRE_DATOS]`;

            try {
                if (!mensaje || !mensaje.origen) {
                    logger.error(`${logPrefix} Mensaje sin origen válido`, mensaje);
                    return;
                }

                logger.info(`${logPrefix} Datos del padre recibidos desde ${mensaje.origen}`);
                logger.info(`Hijo ${CONFIG_HIJO.IFRAME_ID} recibió PADRE_DATOS`);

                // ✅ PROCESAR DATOS INICIALES DEL PADRE
                if (mensaje.datos) {
                    const { modo, paradas, paradaActual } = mensaje.datos;

                    if (modo) {
                        logger.info(`${logPrefix} Procesando modo inicial del padre: ${modo}`);
                        actualizarInterfazModo(modo);
                    }

                    if (paradas) {
                        logger.debug(`${logPrefix} Paradas recibidas: ${paradas.length}`);
                        // Procesar paradas si necesario
                    }

                    if (paradaActual) {
                        logger.debug(`${logPrefix} Parada actual: ${paradaActual}`);
                        // Procesar parada actual si necesario
                    }
                }

            } catch (error) {
                logger.error(`${logPrefix} Error procesando PADRE_DATOS:`, error);
            }

            // Enviar HIJO_LISTO para completar handshake con sistema de reintentos
            if (!estado.hijoListoEnviado) {
                async function enviarHijoListoConReintento() {
                    try {
                        await enviarMensaje({
                            destino: resolverIdPadre(),
                            tipo: TIPOS_MENSAJE.SISTEMA.HIJO_LISTO,
                            origen: CONFIG_HIJO.IFRAME_ID,
                            datos: {
                                componenteId: CONFIG_HIJO.COMPONENTE_ID,
                                iframeId: CONFIG_HIJO.IFRAME_ID,
                                timestamp: Date.now()
                            }
                        });
                        _reintentosHijoListo++;
                        logger.info(`[hijo3] HIJO_LISTO enviado al padre (reintento ${_reintentosHijoListo}/${MAX_REINTENTOS_HIJO_LISTO})`);

                        if (_reintentosHijoListo < MAX_REINTENTOS_HIJO_LISTO) {
                            _intervaloReintento = setTimeout(enviarHijoListoConReintento, INTERVALO_REINTENTO);
                        } else {
                            // Fallback: mostrar UI después de 30 segundos sin confirmación
                            logger.warn('[hijo3] Máximo de reintentos alcanzado, mostrando UI como fallback');
                            _uiConfirmado = true;
                            mostrarUI();
                        }
                    } catch (error) {
                        logger.error('[hijo3] Error enviando HIJO_LISTO:', error);
                    }
                }
                estado.hijoListoEnviado = true;
                enviarHijoListoConReintento();
            }
        });

        /**
         * Controlador: SISTEMA.PADRE_CONFIRMA_HIJO_LISTO
         * Descripción: Recibe confirmación del padre de que los controladores están listos
         * Origen esperado: padre
         * Respuesta: Ninguna (preparado para futuras solicitudes de datos)
         */
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.PADRE_CONFIRMA_HIJO_LISTO, async (mensaje) => {
            const logPrefix = `[hijo3][PADRE_CONFIRMA_HIJO_LISTO][${mensaje?.origen || 'desconocido'}]`;

            try {
                logger.info('[hijo3] PADRE_CONFIRMA_HIJO_LISTO recibido:', mensaje);
                if (!mensaje?.origen) {
                    logger.error(`${logPrefix} Mensaje sin origen válido`, mensaje);
                    return;
                }

                logger.info(`${logPrefix} Confirmación recibida del padre - controladores listos`);

                // Limpiar intervalo de reintento si existe
                if (_intervaloReintento) {
                    clearTimeout(_intervaloReintento);
                    _intervaloReintento = null;
                    logger.info(`[hijo3] Intervalo de reintento limpiado tras recibir PADRE_CONFIRMA_HIJO_LISTO`);
                }

                // Aplicar cambio de modo encolado si existía
                try {
                    if (estado && estado.pendingCambioModo && estado.pendingCambioModo.modo) {
                        const modoPendiente = estado.pendingCambioModo.modo;
                        logger.info(`${logPrefix} Aplicando modo pendiente: ${modoPendiente}`);
                        actualizarInterfazModo(modoPendiente);
                        await enviarMensaje({
                            destino: mensaje.origen,
                            tipo: TIPOS_MENSAJE.SISTEMA.CONFIRMACION,
                            origen: CONFIG_HIJO.IFRAME_ID,
                            datos: { tipo: 'inicializacion', modo: modoPendiente }
                        });
                        if (estado) delete estado.pendingCambioModo;
                    }
                    // Mostrar UI ahora que el padre confirmó
                    try {
                        _uiConfirmado = true;
                        mostrarUI();
                    } catch (e) {
                        logger.debug(`${logPrefix} No se pudo forzar mostrarUI`, e && e.message);
                    }
                    try {
                        enviarMensaje({ destino: resolverIdPadre(), tipo: TIPOS_MENSAJE.SISTEMA.CONFIRMACION, origen: CONFIG_HIJO.IFRAME_ID, datos: { tipo: 'UI_VISIBLE', timestamp: Date.now() } }).catch((err) => logger.debug(`${logPrefix} Confirmacion UI_VISIBLE no enviada`, err && err.message));
                    } catch (e) {
                        logger.debug(`${logPrefix} Error armando confirmacion UI_VISIBLE`, e && e.message);
                    }
                } catch (err) {
                    logger.error(`${logPrefix} Error aplicando modo pendiente:`, err);
                }

                // 🔥 NUEVO: Procesar modo inicial si viene en datos
                const { modoInicial } = mensaje.datos || {};
                if (modoInicial) {
                    logger.info(`${logPrefix} Modo inicial recibido: ${modoInicial}`);
                    actualizarInterfazModo(modoInicial);
                    logger.debug(`${logPrefix} Interfaz actualizada según modo inicial`);
                }

                // Preparado para futuras solicitudes de datos adicionales del padre
                logger.debug(`${logPrefix} Componente listo para recibir datos adicionales si es necesario`);


            } catch (error) {
                logger.error(`${logPrefix} Error procesando confirmación del padre:`, error);
            }
        });

        // Controlador para reproducir audio (REQUEST del padre)
        registrarControladorSeguro(TIPOS_MENSAJE.AUDIO.REPRODUCIR_REQUEST, async (mensaje) => {
            try {
                logger.debug(`[hijo3] REPRODUCIR_REQUEST recibido:`, mensaje.datos);
                const { audioId, autoplay = false } = mensaje.datos || {};

                const { audioData } = mensaje.datos || {};
                if (audioData) {
                    globalThis._guardarAudioEnCache(audioId, audioData);
                } else {
                    logger.warn(`[hijo3] REPRODUCIR_REQUEST sin audioData para ${audioId} — se intentará resolver desde caché local`);
                }

                if (!audioId) {
                    throw new Error('audioId no proporcionado');
                }

                const resultado = await cargarYReproducirAudio(audioId, !!autoplay);

                // Enviar RESPONSE confirmando (indicar si la reproducción realmente comenzó)
                await enviarMensaje({
                    tipo: TIPOS_MENSAJE.AUDIO.REPRODUCIR_RESPONSE,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    destino: mensaje.origen,
                    datos: {
                        audioId,
                        exito: resultado.exito === true,
                        mensajeOriginal: mensaje.id,
                        ...(resultado ? { reproducido: !!resultado.reproducido, autoplayBlocked: !!resultado.autoplayBlocked } : {})
                    }
                });
            } catch (error) {
                logger.error(`[hijo3] Error procesando REPRODUCIR_REQUEST:`, error);
                await enviarMensaje({
                    tipo: TIPOS_MENSAJE.AUDIO.REPRODUCIR_RESPONSE,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    destino: mensaje.origen,
                    datos: {
                        exito: false,
                        error: error.message,
                        mensajeOriginal: mensaje.id
                    }
                });
            }
        });

        /**
         * Controlador: SISTEMA.CAMBIO_MODO
         * Descripción: Actualiza la interfaz según el modo (casa/aventura)
         */
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO, async (mensaje) => {
            const logPrefix = `[hijo3][CAMBIO_MODO]`;

            try {
                // Validar carga secuencial
                if (!mensaje.datos?.secuenciaCompleta) {
                    logger.warn(`${logPrefix} Mensaje recibido antes de secuencia completa`);
                    if (estado) estado.pendingCambioModo = mensaje.datos || { modo: null };
                    await enviarMensaje({
                        tipo: TIPOS_MENSAJE.SISTEMA.NACK,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        destino: mensaje.origen,
                        datos: {
                            error: 'Secuencia no completa',
                            esperarPermiso: true,
                            tipoOriginal: mensaje.tipo,
                            modoSolicitado: mensaje.datos?.modo
                        }
                    });
                    return;
                }

                // Extraer y validar datos
                const { modo } = mensaje.datos || {};
                if (!modo || !['casa', 'aventura'].includes(modo)) {
                    logger.error(`${logPrefix} Modo inválido: ${modo}`);
                    await enviarMensaje({
                        tipo: TIPOS_MENSAJE.SISTEMA.NACK,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        destino: mensaje.origen,
                        datos: { error: 'Modo inválido', modoRecibido: modo }
                    });
                    return;
                }

                // Enviar ENTENDIDO
                logger.info(`${logPrefix} Cambio de modo a "${modo}" entendido`);

                // Validación explícita antes de enviar
                const destinoEntendido = mensaje.origen;
                const tipoEntendido = TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_ENTENDIDO;
                const origenEntendido = CONFIG_HIJO?.IFRAME_ID;

                // DEBUG: Console.log directo para diagnóstico (bypass suppress-warnings)
                if (!destinoEntendido || !tipoEntendido || !origenEntendido) {
                    const debugInfo = {
                        destino: destinoEntendido,
                        tipo: tipoEntendido,
                        origen: origenEntendido,
                        TIPOS_MENSAJE_exists: globalThis.TIPOS_MENSAJE !== undefined,
                        TIPOS_MENSAJE_SISTEMA_exists: globalThis.TIPOS_MENSAJE?.SISTEMA !== undefined,
                        CONFIG_HIJO_exists: globalThis.CONFIG_HIJO !== undefined,
                        mensaje_origen: mensaje?.origen
                    };
                    logger.error('[hijo3][CAMBIO_MODO] 🔴 DEBUG CAMPOS UNDEFINED:', JSON.stringify(debugInfo, null, 2));
                    logger.error(`${logPrefix} ❌ Campos undefined antes de enviar ENTENDIDO:`, debugInfo);
                    throw new Error('Campos undefined en CAMBIO_MODO_ENTENDIDO');
                }

                await enviarMensaje({
                    destino: destinoEntendido,
                    tipo: tipoEntendido,
                    origen: origenEntendido,
                    datos: {
                        modo,
                        timestamp: Date.now(),
                        mensajeId: mensaje.datos?.mensajeId || mensaje.id
                    }
                });

                // Procesar cambio
                logger.info(`${logPrefix} Procesando cambio a modo: ${modo}`);
                const audioPlayer = document.getElementById('audioPlayer');
                if (audioPlayer && !audioPlayer.paused) {
                    audioPlayer.pause();
                    audioPlayer.currentTime = 0;
                }
                currentAudioId = null;
                // Fix: updateProgressBar no existe, usar DOM directo
                const progressBar = document.getElementById('progressBar');
                const progressContainer = document.getElementById('progressContainer');
                if (progressBar) progressBar.style.width = '0%';
                if (progressContainer) { progressContainer.setAttribute('aria-valuenow', 0); progressContainer.style.setProperty('--bar-w', 0); }
                logger.debug(`${logPrefix} Estado de audio reseteado`);
                estado.modo = estado.modo || {};
                estado.modo.actual = modo;
                actualizarInterfazModo(modo);

                // Enviar EFECTUADO
                logger.info(`${logPrefix} Cambio de modo a "${modo}" efectuado`);
                await enviarMensaje({
                    destino: mensaje.origen,
                    tipo: TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_EFECTUADO,
                    origen: CONFIG_HIJO?.IFRAME_ID || 'hijo3',
                    datos: {
                        modo,
                        exito: true,
                        timestamp: Date.now(),
                        mensajeId: mensaje.datos?.mensajeId || mensaje.id
                    }
                });

            } catch (error) {
                logger.error(`${logPrefix} Error:`, error);
                try {
                    await enviarMensaje({
                        tipo: TIPOS_MENSAJE.SISTEMA.ERROR,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        destino: mensaje.origen || 'padre',
                        datos: { error: error.message, tipo: 'CAMBIO_MODO_FALLIDO' }
                    });
                } catch (e) {
                    logger.error(`${logPrefix} Error notificando fallo:`, e);
                }
            }
        });

        // Controlador: SISTEMA.CAMBIO_MODO_APLICADO
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_APLICADO, async (mensaje) => {
            const logPrefix = `[hijo3][CAMBIO_MODO_APLICADO]`;
            try {
                const { modo } = mensaje.datos || {};
                logger.success(`${logPrefix} ✅ Cambio de modo a "${modo}" aplicado globalmente`);
            } catch (error) {
                logger.error(`${logPrefix} Error:`, error);
            }
        });

        /**
         * Controlador: CONTROL.HABILITAR
         * Descripción: Habilita controles específicos según el mensaje del padre
         */
        registrarControladorSeguro(TIPOS_MENSAJE.CONTROL.HABILITAR, async (mensaje) => {
            try {
                const { control } = mensaje.datos;
                logger.info(`[hijo3] CONTROL.HABILITAR recibido para: ${control}`);

                // retosBtn se controla en ambos modos (aventura y casa)
                if (control === 'retosBtn') {
                    retosBtn.disabled = false;
                    retosBtn.style.opacity = '1';
                    retosBtn.style.pointerEvents = 'auto';
                    retosBtn.classList.remove('activo');
                    logger.debug(`[hijo3] Botón de retos habilitado`);
                } else if (document.body.classList.contains('modo-aventura')) {
                    // Otros controles solo en modo aventura
                    logger.debug(`[hijo3] CONTROL.HABILITAR aplicado en modo aventura para: ${control}`);
                }
            } catch (error) {
                logger.error(`[hijo3] Error en CONTROL.HABILITAR:`, error);
            }
        });

        /**
         * Controlador: CONTROL.DESHABILITAR
         * Descripción: Deshabilita controles específicos según el mensaje del padre
         */
        registrarControladorSeguro(TIPOS_MENSAJE.CONTROL.DESHABILITAR, async (mensaje) => {
            try {
                const { control } = mensaje.datos;
                logger.info(`[hijo3] CONTROL.DESHABILITAR recibido para: ${control}`);

                // retosBtn se controla en ambos modos (aventura y casa)
                if (control === 'retosBtn') {
                    retosBtn.disabled = true;
                    retosBtn.style.opacity = '0.5';
                    retosBtn.style.pointerEvents = 'none';
                    logger.debug(`[hijo3] Botón de retos deshabilitado`);
                } else if (document.body.classList.contains('modo-aventura')) {
                    // Otros controles solo en modo aventura
                    logger.debug(`[hijo3] CONTROL.DESHABILITAR aplicado en modo aventura para: ${control}`);
                }
            } catch (error) {
                logger.error(`[hijo3] Error en CONTROL.DESHABILITAR:`, error);
            }
        });

        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT, async (mensaje) => {
            await enviarMensaje({
                destino: mensaje.origen,
                tipo: TIPOS_MENSAJE.SISTEMA.HEARTBEAT_RESPONSE,
                origen: CONFIG_HIJO.IFRAME_ID,
                datos: { timestamp: Date.now() }
            });
        });

        // Controlador: SISTEMA.HEARTBEAT.START
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT_START, async (mensaje) => {
            const logPrefix = `[hijo3][HEARTBEAT_START][${mensaje?.origen || 'desconocido'}]`;
            try {
                globalThis.__HEARTBEAT_ACTIVO = true;
                logger.debug(`${logPrefix} Activado heartbeat local`);
                return { started: true };
            } catch (error) {
                logger.error(`${logPrefix} Error procesando HEARTBEAT_START:`, error);
                return { started: false, error: error && error.message };
            }
        });

        // Controlador: SISTEMA.HEARTBEAT.PAUSE
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT_PAUSE, async (mensaje) => {
            const logPrefix = `[hijo3][HEARTBEAT_PAUSE][${mensaje?.origen || 'desconocido'}]`;
            try {
                globalThis.__HEARTBEAT_ACTIVO = false;
                logger.debug(`${logPrefix} Pausado heartbeat local`);
                return { paused: true };
            } catch (error) {
                logger.error(`${logPrefix} Error procesando HEARTBEAT_PAUSE:`, error);
                return { paused: false, error: error && error.message };
            }
        });

        // Controlador: NAVEGACION.CAMBIO_PARADA (acepta cambio y confirma)
        registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.CAMBIO_PARADA, async (mensaje) => {
            const logPrefix = `[hijo3][NAVEGACION.CAMBIO_PARADA][${mensaje?.origen || 'desconocido'}]`;
            try {
                    const resolved = resolverIdsParada(mensaje.datos || {});
                    const padreId = resolved.padreId;
                    const paradaId = resolved.paradaId;
                    logger.info(`${logPrefix} Cambio de parada recibido: ${padreId || paradaId}`);
                // Actualizar estado local para audio si corresponde
                if (paradaId) globalThis.__hijo3_paradaActual = paradaId;
                // Resetear botón retos al cambiar de parada
                if (retosBtn) retosBtn.classList.remove('activo');
                _resetSpinRetosBtn();
                // Enviar confirmación al padre
                try {
                    await enviarMensaje({
                        tipo: TIPOS_MENSAJE.NAVEGACION.CAMBIO_PARADA_CONFIRMADO,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        destino: mensaje.origen || resolverIdPadre(),
                            datos: { paradaId: paradaId || null, parada_id: paradaId || null, padreId: padreId || null, padreid: padreId || null, timestamp: Date.now() }
                    });
                    logger.info(`${logPrefix} Confirmación enviada`);
                } catch (err) { logger.warn(`${logPrefix} No se pudo enviar confirmación:`, err); }
            } catch (error) {
                logger.warn(`${logPrefix} Error procesando CAMBIO_PARADA:`, error);
            }
        });

        async function _manejarSimularClick(elemento, msg, logPrefix) {
            const boton = document.getElementById(elemento);
            if (boton) {
                logger.info(`${logPrefix} ✅ Elemento ${elemento} encontrado, ejecutando click`);
                boton.click();
                await enviarMensaje({ destino: msg.origen, tipo: TIPOS_MENSAJE.SISTEMA.CONFIRMACION, origen: CONFIG_HIJO.IFRAME_ID, datos: { accion: 'click_ejecutado', elemento, exito: true, timestamp: Date.now() } });
            } else {
                logger.warn(`${logPrefix} ⚠️ Elemento ${elemento} no encontrado`);
                await enviarMensaje({ destino: msg.origen, tipo: TIPOS_MENSAJE.SISTEMA.ERROR, origen: CONFIG_HIJO.IFRAME_ID, datos: { codigo: 'ELEMENTO_NO_ENCONTRADO', mensaje: `Elemento ${elemento} no existe`, elemento, timestamp: Date.now() } });
            }
        }

        async function _manejarAudioControl(comando, audioId, msg, logPrefix) {
            logger.info(`${logPrefix} Ejecutando comando de audio: ${comando}`);
            if (comando === 'play') {
                if (!audioPlayer.src && audioId) { await cargarYReproducirAudio(audioId, true); } else { await audioPlayer.play(); }
            } else if (comando === 'pause') {
                audioPlayer.pause();
            } else if (comando === 'stop') {
                audioPlayer.pause(); audioPlayer.currentTime = 0; _resetearProgresoVisual();
            } else if (comando === 'replay') {
                const objetivo = audioId || currentAudioId;
                if (objetivo && (!audioPlayer.src || currentAudioId !== objetivo)) { await cargarYReproducirAudio(objetivo, true); } else { audioPlayer.currentTime = 0; await audioPlayer.play(); }
            } else {
                throw new Error(`Comando de audio no soportado: ${comando}`);
            }
            await enviarMensaje({ destino: msg.origen, tipo: TIPOS_MENSAJE.SISTEMA.CONFIRMACION, origen: CONFIG_HIJO.IFRAME_ID, datos: { accion: 'audio_control', comando, exito: true, timestamp: Date.now() } });
        }

        // Controlador para acciones de UI desde botones horizontales
        registrarControladorSeguro(TIPOS_MENSAJE.UI.ACCION_USUARIO, async (mensaje) => {
            const logPrefix = `[hijo3][UI.ACCION_USUARIO][${mensaje?.origen || 'desconocido'}]`;
            try {
                const { accion, elemento, contexto, comando, audioId } = mensaje?.datos || {};
                if (accion === 'simular_click' && elemento && contexto === 'boton_horizontal') {
                    logger.info(`${logPrefix} Simulando click en ${elemento} desde boton horizontal`);
                    await _manejarSimularClick(elemento, mensaje, logPrefix);
                } else if (accion === 'audio_control') {
                    await _manejarAudioControl(comando, audioId, mensaje, logPrefix);
                } else {
                    logger.warn(`${logPrefix} Acción no reconocida:`, { accion, elemento, contexto });
                }
            } catch (error) {
                logger.error(`${logPrefix} Error procesando acción UI:`, error);
            }
        });

        // Controlador para ACK del sistema
        registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.ACK, async (mensaje) => {
            const logPrefix = `[hijo3][SISTEMA.ACK][${mensaje?.origen || 'desconocido'}]`;

            try {
                logger.debug(`${logPrefix} ACK recibido, respondiendo...`);

                // Responder al ACK
                await enviarMensaje({
                    destino: resolverIdPadre(),
                    tipo: TIPOS_MENSAJE.SISTEMA.ACK,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    datos: {
                        componenteId: CONFIG_HIJO.COMPONENTE_ID,
                        timestamp: Date.now(),
                        estado: 'activo'
                    }
                });

                logger.debug(`${logPrefix} ACK respondido`);

            } catch (error) {
                logger.error(`${logPrefix} Error respondiendo ACK:`, error);
            }
        });

        // ============================================================
        // ENVIAR HIJO_PREPARADO AHORA QUE TODOS LOS CONTROLADORES ESTÁN REGISTRADOS
        // ============================================================
        try {
            logger.debug('[hijo3] Todos los controladores registrados; enviando HIJO_PREPARADO ahora');
            await enviarMensaje({
                destino: resolverIdPadre(),
                tipo: TIPOS_MENSAJE.SISTEMA.HIJO_PREPARADO,
                origen: CONFIG_HIJO.IFRAME_ID,
                datos: {
                    componenteId: CONFIG_HIJO.COMPONENTE_ID,
                    version: '1.0.0',
                    tipo: 'AUDIO',
                    capacidades: ['audio', 'reproduccion', 'controles'],
                    timestamp: Date.now()
                }
            });
            logger.debug('[hijo3] HIJO_PREPARADO enviado; esperando PADRE_DATOS');
        } catch (e) {
            logger.warn('[hijo3] Error enviando HIJO_PREPARADO:', e);
        }

        logger.info(`[hijo3] Inicialización completada exitosamente`);
    } catch (error) {
        logger.error(`[hijo3] Error durante la inicialización:`, error);
    }

    // Implementar pagehide para limpiar recursos
    globalThis.addEventListener('pagehide', () => {
        logger.info(`[hijo3] Limpiando recursos en pagehide`);
    });
    </script>
</body>
</html>
